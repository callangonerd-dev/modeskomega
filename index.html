<style id="jv90-css">
html[data-jv90="1"],html[data-jv90="1"] body,html[data-jv90="1"] body *{
  --jv-accent:var(--jv90-cor)!important;
  --jv-glow:var(--jv90-glow)!important;
  --jv-orb-cor:var(--jv90-cor)!important;
  --jvc-c1:var(--jv90-cor)!important;
  --jvc-c2:var(--jv90-cor2)!important;
  --jvx-accent:var(--jv90-cor)!important;
}
html[data-jv90="1"] #jn-orb,html[data-jv90="1"] #jv-orb{
  border-color:var(--jv90-cor)!important;
  box-shadow:0 0 26px var(--jv90-glow),0 10px 30px rgba(0,0,0,.5)!important;
}
html[data-jv90="1"] #jn-orb.jv81-fala,html[data-jv90="1"] #jv-orb.jv81-fala{
  box-shadow:0 0 calc(10px + var(--jv-out,0)*34px) var(--jv90-cor)!important;
}
html[data-jv90="1"] #jn-win{--jv-accent:var(--jv90-cor)!important;--jv-glow:var(--jv90-glow)!important}
/* núcleos com vermelho fixo passam a seguir a cor escolhida */
html[data-jv90="1"] [data-core="reactor"] .jvc i.r1{border-color:var(--jv90-cor)!important;box-shadow:0 0 20px var(--jv90-glow),0 0 22px var(--jv90-glow) inset!important}
html[data-jv90="1"] [data-core="reactor"] .jvc i.r2{background:conic-gradient(from 0deg,var(--jv90-cor),rgba(0,0,0,.2),var(--jv90-cor))!important}
html[data-jv90="1"] [data-core="reactor"] .jvc i.r3{background:radial-gradient(circle at 45% 40%,#fff,var(--jv90-cor) 60%,transparent)!important;box-shadow:0 0 26px var(--jv90-glow)!important}
/* halo/anel externo do orbe antigo */
html[data-jv90="1"] #jv-orb::after,html[data-jv90="1"] #jn-orb::after{border-color:var(--jv90-cor)!important}
html[data-jv90="1"] #jv-orb{background:radial-gradient(circle at 34% 28%,#fff,var(--jv90-cor2) 24%,var(--jv90-cor) 62%,#04121c 100%)!important}
</style>
<script id="jv90-js">
(function(){
  'use strict';
  var LS='modesk_jarvis_orbcor_v89';
  function ler(){ try{ return localStorage.getItem(LS)||'' }catch(e){ return '' } }
  function rgb(h){ var n=parseInt(String(h).replace('#',''),16); if(isNaN(n))return [25,200,255]; return [(n>>16)&255,(n>>8)&255,n&255] }
  function clarear(h){ var c=rgb(h); return '#'+c.map(function(v){return (Math.round(v+(255-v)*.45)).toString(16).padStart(2,'0')}).join('') }

  var guardados=new WeakSet();
  function limparInline(o){
    try{ ['border-color','box-shadow','background','background-color','background-image']
      .forEach(function(p){ if(o.style.getPropertyValue(p))o.style.removeProperty(p) }) }catch(e){}
  }
  function observar(o){
    try{ new MutationObserver(function(){ if(travado())limparInline(o) })
      .observe(o,{attributes:true,attributeFilter:['style']}) }catch(e){}
  }
  /* impede que os motores antigos reescrevam borda/brilho do orbe a cada 500ms */
  function blindar(o){
    if(!o||guardados.has(o))return; guardados.add(o); observar(o);
    try{
      var sd=o.style, set=sd.setProperty.bind(sd), rem=sd.removeProperty.bind(sd);
      var trava={'border-color':1,'box-shadow':1,'background':1,'background-color':1,'background-image':1};
      sd.setProperty=function(p,v,pr){ if(travado()&&trava[String(p).toLowerCase()])return; return set(p,v,pr) };
      sd.removeProperty=function(p){ return rem(p) };
      ['border-color','box-shadow','background','background-color','background-image'].forEach(function(p){ rem(p) });
    }catch(e){}
  }
  function travado(){ return !!ler() }

  function aplicar(){
    var hex=ler(), s=document.documentElement;
    if(!hex){ s.removeAttribute('data-jv90'); return }
    var c=rgb(hex);
    s.style.setProperty('--jv90-cor',hex);
    s.style.setProperty('--jv90-cor2',clarear(hex));
    s.style.setProperty('--jv90-glow','rgba('+c.join(',')+',.6)');
    if(s.getAttribute('data-jv90')!=='1')s.setAttribute('data-jv90','1');
    document.querySelectorAll('[data-core]').forEach(function(n){ if(n.getAttribute('data-core-tint')!=='1')n.setAttribute('data-core-tint','1') });
    ['jn-orb','jv-orb'].forEach(function(id){ var o=document.getElementById(id); if(o){ blindar(o); limparInline(o) } });
    var s2=document.documentElement.style;
    if(travado()){ if(s2.getPropertyValue('--jv-accent'))s2.removeProperty('--jv-accent');
      if(s2.getPropertyValue('--jv-glow'))s2.removeProperty('--jv-glow');
      if(s2.getPropertyValue('--jvc-c1'))s2.removeProperty('--jvc-c1');
      if(s2.getPropertyValue('--jvc-c2'))s2.removeProperty('--jvc-c2') }
  }

  aplicar();
  (function loop(){ aplicar(); requestAnimationFrame(loop) })();
  document.addEventListener('click',function(){ setTimeout(aplicar,60); setTimeout(aplicar,450) },true);
  window.jvOrb90={aplicar:aplicar};
  console.log('[MODESK v90] cor do orbe travada — sem piscar vermelho');
})();
</script>



<style id="mdk-rail-fix-v5">
/* ---- v5: rail sempre clicavel e busca acima de tudo ---- */
#rail{pointer-events:auto!important;z-index:2147481000!important}
#rail button{pointer-events:auto!important}
#rail button > *,#rail button svg,#rail button svg *{pointer-events:none!important}
.railmenu{z-index:2147481100!important}
.railmenu.open{pointer-events:auto!important}
#lupa{z-index:2147482000!important}
#lupa.open{display:block!important}
#lupa .box{pointer-events:auto}
</style>
<script>
/* ============ v5 · CORRECAO: menu rail clicavel + janela de busca por cima ============ */
(function(){
  'use strict';
  function menuDe(btn){ return btn.parentElement && btn.parentElement.querySelector('.railmenu') }
  function fechaTodos(){ document.querySelectorAll('.railmenu.open').forEach(function(m){ m.classList.remove('open') }) }
  function abreLupa(){
    var l=document.getElementById('lupa');
    if(!l){ if(window.go) window.go('busca'); return }
    l.classList.add('open');
    var i=document.getElementById('lupa-q');
    if(i){ try{ i.focus() }catch(e){} i.dispatchEvent(new Event('input',{bubbles:true})) }
  }
  function fechaLupa(){ var l=document.getElementById('lupa'); if(l) l.classList.remove('open') }
  window.MDKabrirBusca=abreLupa; window.MDKfecharBusca=fechaLupa;

  /* acha o botao do rail mesmo quando o clique cai na borda/moldura */
  function botaoPorPonto(x,y){
    var r=document.getElementById('rail'); if(!r) return null;
    var achado=null, melhor=1e9;
    r.querySelectorAll('button').forEach(function(b){
      var q=b.getBoundingClientRect();
      var dx=Math.max(q.left-x,0,x-q.right), dy=Math.max(q.top-y,0,y-q.bottom);
      var d=dx*dx+dy*dy;
      if(d<=196&&d<melhor){ melhor=d; achado=b }
    });
    return achado;
  }

  function acionar(btn,e){
    var box=menuDe(btn);
    if(box){
      var aberto=box.classList.contains('open');
      fechaTodos();
      if(!aberto){
        try{ btn.parentElement.dispatchEvent(new PointerEvent('pointerenter',{bubbles:false})) }catch(err){}
        box.classList.add('open');
      }
    }
    if(btn.id==='r-lupa'){ setTimeout(abreLupa,0); return }
    /* se o clique nao caiu no proprio botao, dispara a acao dele */
    if(e && e.target!==btn && !(e.target.closest&&e.target.closest('#rail button')===btn) && typeof btn.onclick==='function'){
      try{ btn.onclick(e) }catch(err){}
    }
  }

  document.addEventListener('click', function(e){
    var t=e.target; if(!t||!t.closest) return;
    if(t.closest('#rail')){
      if(t.closest('.mdk-grip')) return;
      var btn=t.closest('#rail button')||botaoPorPonto(e.clientX,e.clientY);
      if(btn){ acionar(btn,e); return }
      return;
    }
    fechaTodos();
    var l=document.getElementById('lupa');
    if(l&&l.classList.contains('open')&&t.id==='lupa') fechaLupa();
  }, true);

  document.addEventListener('keydown', function(e){
    var l=document.getElementById('lupa');
    if(e.key==='Escape'&&l&&l.classList.contains('open')){ fechaLupa(); return }
    if(e.key==='F3'||((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K'))){ e.preventDefault(); abreLupa() }
  }, true);

  console.log('[MODESK v5] rail clicavel + lupa acima dos paineis');
})();
</script>

</body>
