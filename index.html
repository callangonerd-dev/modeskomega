    setTimeout(() => b.remove(), 2400);
  }

  /* ---------------- MENU DOCK ---------------- */
  const DOCKS = ['left', 'right', 'top', 'hide'];
  const DOCK_LBL = { left: 'Menu à esquerda', right: 'Menu à direita', top: 'Menu no topo', hide: 'Menu oculto' };
  function applyDock() {
    document.body.classList.remove('dock-left', 'dock-right', 'dock-top', 'dock-hide');
    document.body.classList.add('dock-' + ui.dock);
    const b = document.getElementById('r-dock');
    if (b) b.title = DOCK_LBL[ui.dock];
    if (ui.deck) requestAnimationFrame(() => { if (ui.layout && ui.layout !== 'free') arrange(ui.layout) });
  }
  function cycleDock() {
    ui.dock = DOCKS[(DOCKS.indexOf(ui.dock) + 1) % DOCKS.length];
    saveUI(); applyDock(); window.toast && toast(DOCK_LBL[ui.dock]);
  }

  /* ---------------- MULTITELAS ---------------- */
  let z = 100;
  const deck = () => document.getElementById('deck');
  function area() {
    const m = document.querySelector('main');
    const r = m ? m.getBoundingClientRect() : { left: 0, top: 0, width: innerWidth, height: innerHeight };
    const pad = 10, bottom = 56;
    return {
      x: Math.max(4, r.left + pad), y: Math.max(4, r.top + pad),
      w: Math.max(240, r.width - pad * 2), h: Math.max(220, innerHeight - Math.max(4, r.top + pad) - bottom)
    };
  }
  function content(k) {
    const f = VIEW()[k] || VIEW().dashboard;
    try { return `<div class="sect">${f()}</div>` } catch (e) { return `<div class="dim">Falha ao montar tela: ${e.message}</div>` }
  }
  function afterMount(k) { if (k === 'arquivos') { try { window.EXP && EXP.dir ? expLer() : fsAutoConectar() } catch (e) { } } }

  function openWin(k, quiet) {
    if (!ui.deck) { ui.deck = true; document.body.classList.add('deck-on'); saveUI(); }
    const ex = document.querySelector(`.win[data-k="${k}"]`);
    if (ex) { ex.classList.remove('min'); focus(ex); if (!quiet) refresh(k); return ex; }
    const a = area(), n = document.querySelectorAll('.win').length;
    const st = (ui.wins[k] && !mobile()) ? ui.wins[k] : null;
    const w = st ? st.w : Math.min(a.w, mobile() ? a.w : Math.max(420, a.w / 2 - 8));
    const h = st ? st.h : Math.min(a.h, 460);
    const x = st ? st.x : a.x + (n % 4) * 28;
    const y = st ? st.y : a.y + (n % 4) * 26;
    const win = el(`<section class="win" data-k="${k}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
      <header class="wh"><b>${TITLES[k] || k}</b>
        <button class="wb floatb" data-a="float" title="Decolar (flutuar) / encaixar colado">⤢</button>
        <button class="wb pinb" data-a="pin" title="Fixar tela (trava posição/tamanho) ou deixar flutuante">📌</button>
        <button class="wb" data-a="min" title="Minimizar">–</button>
        <button class="wb" data-a="max" title="Maximizar / restaurar">▢</button>
        <button class="wb" data-a="close" title="Fechar">✕</button></header>
      <div class="wbody">${content(k)}</div><div class="rz n" data-d="n"></div><div class="rz s" data-d="s"></div><div class="rz w" data-d="w" title="Arraste para mover a parede entre as telas"></div><div class="rz e" data-d="e" title="Arraste para mover a parede entre as telas"></div><div class="rz nw" data-d="nw"></div><div class="rz ne" data-d="ne"></div><div class="rz sw" data-d="sw"></div><div class="rz se" data-d="se"></div></section>`);
    if (st && st.docked) { win.classList.add('docked'); }
    if (st && st.pin) { win.classList.add('pin'); win.querySelector('.pinb').classList.add('on'); win.querySelector('.pinb').title = 'Tela fixada — clique para deixar flutuante' }
    deck().append(win);
    afterMount(k);
    focus(win);
    dragify(win);
    win.querySelectorAll('.wb').forEach(b => b.onclick = (ev) => {
      ev.stopPropagation();
      const act = b.dataset.a;
      if (act === 'float') { toggleFloat(win); return; }
      if (act === 'pin') {
        const pinned = win.classList.toggle('pin');
        b.classList.toggle('on', pinned);
        b.title = pinned ? 'Tela fixada — clique para deixar flutuante' : 'Fixar tela (trava posição/tamanho) ou deixar flutuante';
        if (window.toast) toast(pinned ? '📌 Tela fixada no lugar' : 'Tela flutuante — arraste à vontade');
        persist(); return;
      }
      if (act === 'close') { win.remove(); tasks(); if (!document.querySelector('.win')) { } }
      else if (act === 'min') { win.classList.add('min'); tasks() }
      else maximize(win);
    });
    win.addEventListener('pointerdown', () => focus(win), true);
    tasks();
    if (ui.tiled && !quiet) requestAnimationFrame(() => tileAll());
    return win;
  }
  function focus(win) {
    document.querySelectorAll('.win.focus').forEach(w => w.classList.remove('focus'));
    win.classList.add('focus'); win.style.zIndex = ++z; tasks();
  }
  function maximize(win) {
    const a = area();
    if (win.dataset.max) {
      const p = JSON.parse(win.dataset.max); delete win.dataset.max;
      Object.assign(win.style, p);
    } else {
      win.dataset.max = JSON.stringify({ left: win.style.left, top: win.style.top, width: win.style.width, height: win.style.height });
      Object.assign(win.style, { left: a.x + 'px', top: a.y + 'px', width: a.w + 'px', height: a.h + 'px' });
    }
    persist();
  }
  function persist() {
    document.querySelectorAll('.win').forEach(w => {
      ui.wins[w.dataset.k] = { x: parseFloat(w.style.left), y: parseFloat(w.style.top), w: parseFloat(w.style.width), h: parseFloat(w.style.height), pin: w.classList.contains('pin'), docked: w.classList.contains('docked') };
    });
    ui.open = [...document.querySelectorAll('.win')].map(w => w.dataset.k);
    saveUI();
  }
  /* ---------- ENCAIXE MAGNÉTICO (parede colante, sem sobreposição) ---------- */
  function snapCss() {
    if (document.getElementById('snapcss')) return;
    const s = document.createElement('style'); s.id = 'snapcss';
    s.textContent = `#snapghost{position:fixed;z-index:99998;display:none;pointer-events:none;border-radius:12px;
      border:2px dashed rgba(86,217,255,.85);background:linear-gradient(180deg,rgba(86,217,255,.16),rgba(239,20,39,.10));
      box-shadow:0 0 24px rgba(86,217,255,.35),inset 0 0 40px rgba(86,217,255,.10);transition:left .09s,top .09s,width .09s,height .09s}
    #snapghost.on{display:block}
    #snapghost b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 12px 'Sora',sans-serif;
      color:#dff3ff;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 10px rgba(86,217,255,.6)}
    .snapline{position:fixed;z-index:99997;background:rgba(239,20,39,.85);box-shadow:0 0 10px rgba(239,20,39,.8);pointer-events:none}
    .win.dragging{opacity:.88;filter:drop-shadow(0 18px 34px rgba(0,0,0,.55))}`;
    document.head.append(s);
  }
  function ghost() {
    snapCss();
    let g = document.getElementById('snapghost');
    if (!g) { g = el('<div id="snapghost"><b></b></div>'); document.body.append(g) }
    return g;
  }
  function showGhost(r, label) {
    const g = ghost();
    Object.assign(g.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
    g.querySelector('b').textContent = label || '';
    g.classList.add('on');
  }
  function hideGhost() { const g = document.getElementById('snapghost'); if (g) g.classList.remove('on'); clearLines() }
  function clearLines() { document.querySelectorAll('.snapline').forEach(l => l.remove()) }
  function line(vertical, pos, from, to) {
    snapCss();
    const d = el('<div class="snapline"></div>');
    if (vertical) Object.assign(d.style, { left: pos + 'px', top: from + 'px', width: '2px', height: (to - from) + 'px' });
    else Object.assign(d.style, { top: pos + 'px', left: from + 'px', height: '2px', width: (to - from) + 'px' });
    document.body.append(d);
  }
  const rectOf = (w) => ({ x: parseFloat(w.style.left) || 0, y: parseFloat(w.style.top) || 0, w: w.offsetWidth, h: w.offsetHeight });
  const others = (win) => [...document.querySelectorAll('.win:not(.min)')].filter(w => w !== win);

  /* zona de encaixe na borda da área (estilo Photoshop/Filmora) */
  function zoneAt(px, py, win) {
    const a = area(), g = 0, m = 46;
    if (px < a.x - 40 || px > a.x + a.w + 40 || py < a.y - 40 || py > a.y + a.h + 40) return null;
    const hw = (a.w - g) / 2, hh = (a.h - g) / 2;
    const L = px - a.x < m, R = a.x + a.w - px < m, T = py - a.y < m, B = a.y + a.h - py < m;
    if (T && !L && !R) return { r: { x: a.x, y: a.y, w: a.w, h: a.h }, l: 'Tela cheia' };
    if (L && T) return { r: { x: a.x, y: a.y, w: hw, h: hh }, l: 'Canto sup. esq.' };
    if (R && T) return { r: { x: a.x + hw + g, y: a.y, w: hw, h: hh }, l: 'Canto sup. dir.' };
    if (L && B) return { r: { x: a.x, y: a.y + hh + g, w: hw, h: hh }, l: 'Canto inf. esq.' };
    if (R && B) return { r: { x: a.x + hw + g, y: a.y + hh + g, w: hw, h: hh }, l: 'Canto inf. dir.' };
    if (L) return { r: { x: a.x, y: a.y, w: hw, h: a.h }, l: 'Coluna esquerda' };
    if (R) return { r: { x: a.x + hw + g, y: a.y, w: hw, h: a.h }, l: 'Coluna direita' };
    if (B) return { r: { x: a.x, y: a.y + hh + g, w: a.w, h: hh }, l: 'Metade de baixo' };
    return null;
  }
  /* encaixe colado nas bordas de outra tela (dividindo o espaço, sem sobrepor) */
  function dockAt(px, py, win) {
    const a = area(), g = 0;
    for (const o of others(win)) {
      const r = rectOf(o);
      if (px < r.x || px > r.x + r.w || py < r.y || py > r.y + r.h) continue;
      const fx = (px - r.x) / r.w, fy = (py - r.y) / r.h;
      const edge = Math.min(fx, 1 - fx, fy, 1 - fy);
      if (edge > .3) return null; // centro = trocar/livre
      const hw = (r.w - g) / 2, hh = (r.h - g) / 2;
      if (edge === fx) return { r: { x: r.x, y: r.y, w: hw, h: r.h }, l: 'Colar à esquerda', host: o, hr: { x: r.x + hw + g, y: r.y, w: hw, h: r.h } };
      if (edge === 1 - fx) return { r: { x: r.x + hw + g, y: r.y, w: hw, h: r.h }, l: 'Colar à direita', host: o, hr: { x: r.x, y: r.y, w: hw, h: r.h } };
      if (edge === fy) return { r: { x: r.x, y: r.y, w: r.w, h: hh }, l: 'Colar acima', host: o, hr: { x: r.x, y: r.y + hh + g, w: r.w, h: hh } };
      return { r: { x: r.x, y: r.y + hh + g, w: r.w, h: hh }, l: 'Colar abaixo', host: o, hr: { x: r.x, y: r.y, w: r.w, h: hh } };
    }
    return null;
  }
  function applyRect(w, r) { Object.assign(w.style, { left: Math.round(r.x) + 'px', top: Math.round(r.y) + 'px', width: Math.round(r.w) + 'px', height: Math.round(r.h) + 'px' }); delete w.dataset.max }

  /* ímã: alinha bordas com a área e com as outras telas */
  function magnet(win, x, y, w, h) {
    const a = area(), T = 12, gu = [];
    const xs = [a.x, a.x + a.w], ys = [a.y, a.y + a.h];
    others(win).forEach(o => { const r = rectOf(o); xs.push(r.x, r.x + r.w); ys.push(r.y, r.y + r.h) });
    let bx = null, by = null;
    xs.forEach(v => {
      if (Math.abs(x - v) < T && (bx === null || Math.abs(x - v) < Math.abs(x - bx))) bx = v;
      if (Math.abs(x + w - v) < T) { const c = v - w; if (bx === null || Math.abs(x - c) < Math.abs(x - bx)) bx = c }
    });
    ys.forEach(v => {
      if (Math.abs(y - v) < T && (by === null || Math.abs(y - v) < Math.abs(y - by))) by = v;
      if (Math.abs(y + h - v) < T) { const c = v - h; if (by === null || Math.abs(y - c) < Math.abs(y - by)) by = c }
    });
    if (bx !== null) { x = bx; gu.push([true, x <= a.x + 1 ? x : x, a.y, a.y + a.h]) }
    if (by !== null) { y = by; gu.push([false, y, a.x, a.x + a.w]) }
    clearLines(); gu.forEach(g => line(g[0], g[1], g[2], g[3]));
    return { x, y };
  }

  /* empurra telas para que nada fique sobreposto (parede colante) */
  function unoverlap(win) {
    if (ui.snap === false) return;
    if (win.classList.contains('docked')) return;
    const a = area(), g = 0, r = rectOf(win);
    others(win).forEach(o => {
      if (o.classList.contains('docked') || o.classList.contains('pin')) return;
      const q = rectOf(o);
      const ox = Math.min(r.x + r.w, q.x + q.w) - Math.max(r.x, q.x);
      const oy = Math.min(r.y + r.h, q.y + q.h) - Math.max(r.y, q.y);
      if (ox <= 0 || oy <= 0) return;
      if (ox < oy) { // desloca/encolhe na horizontal
        if (q.x + q.w / 2 < r.x + r.w / 2) { const nx = r.x + r.w + g; if (nx + q.w <= a.x + a.w) applyRect(o, { ...q, x: nx }); else applyRect(o, { x: nx, y: q.y, w: Math.max(240, a.x + a.w - nx), h: q.h }) }
        else { const nx = r.x - g - q.w; if (nx >= a.x) applyRect(o, { ...q, x: nx }); else applyRect(o, { x: a.x, y: q.y, w: Math.max(240, r.x - g - a.x), h: q.h }) }
      } else {
        if (q.y + q.h / 2 < r.y + r.h / 2) { const ny = r.y + r.h + g; if (ny + q.h <= a.y + a.h) applyRect(o, { ...q, y: ny }); else applyRect(o, { x: q.x, y: ny, w: q.w, h: Math.max(150, a.y + a.h - ny) }) }
        else { const ny = r.y - g - q.h; if (ny >= a.y) applyRect(o, { ...q, y: ny }); else applyRect(o, { x: q.x, y: a.y, w: q.w, h: Math.max(150, r.y - g - a.y) }) }
      }
    });
  }

  const MINW = 260, MINH = 150, TOL = 8;

  /* vizinhos colados no lado que está sendo puxado */
  function neighbors(win, dir) {
    const r = rectOf(win), out = [];
    others(win).forEach(o => {
      if (o.classList.contains('pin')) return;
      const q = rectOf(o);
      const vOver = Math.min(r.y + r.h, q.y + q.h) - Math.max(r.y, q.y) > 8;
      const hOver = Math.min(r.x + r.w, q.x + q.w) - Math.max(r.x, q.x) > 8;
      if (dir.includes('e') && vOver && Math.abs(q.x - (r.x + r.w)) <= TOL) out.push({ el: o, side: 'e', b: q });
      if (dir.includes('w') && vOver && Math.abs((q.x + q.w) - r.x) <= TOL) out.push({ el: o, side: 'w', b: q });
      if (dir.includes('s') && hOver && Math.abs(q.y - (r.y + r.h)) <= TOL) out.push({ el: o, side: 's', b: q });
      if (dir.includes('n') && hOver && Math.abs((q.y + q.h) - r.y) <= TOL) out.push({ el: o, side: 'n', b: q });
    });
    return out;
  }

  function toggleFloat(win) {
    const b = win.querySelector('.floatb');
    if (win.classList.contains('docked')) {
      win.classList.remove('docked');
      const r = rectOf(win);
      applyRect(win, { x: r.x + 18, y: r.y + 18, w: Math.max(MINW, r.w - 36), h: Math.max(MINH, r.h - 36) });
      focus(win);
      if (b) { b.classList.remove('on'); b.title = 'Encaixar colado às outras telas' }
      window.toast && toast('Tela decolada — agora flutua livremente');
    } else {
      glue(win);
      win.classList.add('docked');
      if (b) { b.classList.add('on'); b.title = 'Decolar (deixar flutuante)' }
      window.toast && toast('Tela colada — encaixada sem sobrepor');
    }
    persist();
  }

  /* cola a tela na borda mais próxima (outra tela ou área) */
  function glue(win) {
    const a = area(), r = rectOf(win);
    let x = r.x, y = r.y, w = r.w, h = r.h, best = 1e9, cand = null;
    others(win).forEach(o => {
      const q = rectOf(o);
      [['e', Math.abs(r.x - (q.x + q.w)), { x: q.x + q.w, y: q.y, w: Math.max(MINW, a.x + a.w - (q.x + q.w)), h: q.h }],
       ['w', Math.abs((r.x + r.w) - q.x), { x: Math.max(a.x, q.x - r.w), y: q.y, w: Math.min(r.w, q.x - a.x) || MINW, h: q.h }],
       ['s', Math.abs(r.y - (q.y + q.h)), { x: q.x, y: q.y + q.h, w: q.w, h: Math.max(MINH, a.y + a.h - (q.y + q.h)) }],
       ['n', Math.abs((r.y + r.h) - q.y), { x: q.x, y: Math.max(a.y, q.y - r.h), w: q.w, h: Math.min(r.h, q.y - a.y) || MINH }]
      ].forEach(([, d, rect]) => { if (d < best) { best = d; cand = rect } });
    });
    if (cand && best < 220) applyRect(win, cand);
    else applyRect(win, { x: Math.max(a.x, Math.min(x, a.x + a.w - w)), y: Math.max(a.y, Math.min(y, a.y + a.h - h)), w, h });
  }

  function dragify(win) {
    const head = win.querySelector('.wh');
    let mode = null, dir = '', sx = 0, sy = 0, base = {}, target = null, pairs = [];
    const down = (m, d) => (e) => {
      if (e.target.closest('.wb')) return;
      if (win.classList.contains('pin')) { if (window.toast) toast('Tela fixada — desfixe com o 📌 para mover'); return; }
      if (m === 'drag' && win.classList.contains('docked')) {
        if (window.toast) toast('Tela colada — clique em ⤢ para decolar e deixar flutuante');
        focus(win); return;
      }
      mode = m; dir = d || 'se'; sx = e.clientX; sy = e.clientY; target = null;
      base = { x: parseFloat(win.style.left), y: parseFloat(win.style.top), w: win.offsetWidth, h: win.offsetHeight };
      pairs = (m === 'size') ? neighbors(win, dir) : [];
      focus(win); win.setPointerCapture?.(e.pointerId);
      if (m === 'drag') win.classList.add('dragging');
      addEventListener('pointermove', move); addEventListener('pointerup', up, { once: true });
      e.preventDefault();
    };
    const move = (e) => {
      if (!mode) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      const on = ui.snap !== false;
      if (mode === 'drag') {
        let x = base.x + dx, y = base.y + dy;
        target = on ? (zoneAt(e.clientX, e.clientY, win) || dockAt(e.clientX, e.clientY, win)) : null;
        if (target) { showGhost(target.r, target.l); clearLines() }
        else {
          hideGhost();
          if (on) { const p = magnet(win, x, y, base.w, base.h); x = p.x; y = p.y }
        }
        win.style.left = Math.max(2, Math.min(innerWidth - 80, x)) + 'px';
        win.style.top = Math.max(2, Math.min(innerHeight - 60, y)) + 'px';
        return;
      }
      /* ---- redimensionar por qualquer lateral / canto ---- */
      let x = base.x, y = base.y, w = base.w, h = base.h;
      let ddx = dx, ddy = dy;
      pairs.forEach(p => {
        if (p.side === 'e') ddx = Math.min(ddx, p.b.w - MINW);
        if (p.side === 'w') ddx = Math.max(ddx, MINW - p.b.w);
        if (p.side === 's') ddy = Math.min(ddy, p.b.h - MINH);
        if (p.side === 'n') ddy = Math.max(ddy, MINH - p.b.h);
      });
      if (dir.includes('e')) w = Math.max(MINW, base.w + ddx);
      if (dir.includes('s')) h = Math.max(MINH, base.h + ddy);
      if (dir.includes('w')) { const nw = Math.max(MINW, base.w - ddx); x = base.x + (base.w - nw); w = nw }
      if (dir.includes('n')) { const nh = Math.max(MINH, base.h - ddy); y = base.y + (base.h - nh); h = nh }
      if (!pairs.length && ui.snap !== false && !win.classList.contains('docked')) {
        const p = magnet(win, x + w, y + h, 0, 0);
        if (dir.includes('e')) w = Math.max(MINW, p.x - x);
        if (dir.includes('s')) h = Math.max(MINH, p.y - y);
      }
      applyRect(win, { x, y, w, h });
      /* arrasta junto as telas coladas — a parede compartilhada se move */
      pairs.forEach(p => {
        const q = p.b;
        if (p.side === 'e') applyRect(p.el, { x: x + w, y: q.y, w: Math.max(MINW, (q.x + q.w) - (x + w)), h: q.h });
        if (p.side === 'w') applyRect(p.el, { x: q.x, y: q.y, w: Math.max(MINW, x - q.x), h: q.h });
        if (p.side === 's') applyRect(p.el, { x: q.x, y: y + h, w: q.w, h: Math.max(MINH, (q.y + q.h) - (y + h)) });
        if (p.side === 'n') applyRect(p.el, { x: q.x, y: q.y, w: q.w, h: Math.max(MINH, y - q.y) });
      });
    };
    const up = () => {
      const was = mode; mode = null;
      removeEventListener('pointermove', move);
      win.classList.remove('dragging'); hideGhost();
      if (target) {
        applyRect(win, target.r);
        win.classList.add('docked');
        const fb = win.querySelector('.floatb'); if (fb) { fb.classList.add('on'); fb.title = 'Decolar (deixar flutuante)' }
        if (target.host && target.hr) {
          applyRect(target.host, target.hr);
          target.host.classList.add('docked');
          const hb = target.host.querySelector('.floatb'); if (hb) { hb.classList.add('on'); hb.title = 'Decolar (deixar flutuante)' }
        }
        target = null;
      }
      else if (was === 'drag') unoverlap(win);
      ui.layout = 'free'; persist();
    };
    head.addEventListener('pointerdown', down('drag'));
    win.querySelectorAll('.rz').forEach(hd => hd.addEventListener('pointerdown', down('size', hd.dataset.d)));
    head.addEventListener('dblclick', () => maximize(win));
  }

  /* layouts automáticos (estilo Filmora) */
  const LAYOUTS = ['free', 'cols', 'rows', 'grid', 'cascade'];
  function arrange(mode) {
    ui.layout = mode; ui.tiled = (mode !== 'cascade' && mode !== 'free'); saveUI();
    const wins = [...document.querySelectorAll('.win:not(.min)')];
    if (!wins.length) return;
    const a = area(), g = 0, n = wins.length;
    wins.forEach(w => delete w.dataset.max);
    if (mode === 'cascade') {
      wins.forEach((w, i) => Object.assign(w.style, {
        left: a.x + i * 34 + 'px', top: a.y + i * 30 + 'px',
        width: Math.min(a.w - i * 34, Math.max(380, a.w * .66)) + 'px', height: Math.min(a.h - i * 30, a.h * .8) + 'px'
      }));
    } else {
      let cols = n, rows = 1;
      if (mode === 'rows') { cols = 1; rows = n }
      if (mode === 'grid') { cols = Math.ceil(Math.sqrt(n)); rows = Math.ceil(n / cols) }
      if (mobile()) { cols = 1; rows = n }
      const cw = (a.w - g * (cols - 1)) / cols, ch = (a.h - g * (rows - 1)) / rows;
      wins.forEach((w, i) => {
        const c = i % cols, r = Math.floor(i / cols);
        Object.assign(w.style, { left: a.x + c * (cw + g) + 'px', top: a.y + r * (ch + g) + 'px', width: cw + 'px', height: ch + 'px' });
      });
    }
    if (mode !== 'cascade') wins.forEach(w => { w.classList.add('docked'); const b = w.querySelector('.floatb'); if (b) { b.classList.add('on'); b.title = 'Decolar (deixar flutuante)' } });
    else wins.forEach(w => { w.classList.remove('docked'); const b = w.querySelector('.floatb'); if (b) b.classList.remove('on') });
    persist();

  function arrangeGrid(cols, rows) {

    const a = area(), g = 0;
    if (mobile()) { cols = 1; rows = wins.length }
    rows = Math.max(rows, Math.ceil(wins.length / cols));
    const cw = (a.w - g * (cols - 1)) / cols, ch = (a.h - g * (rows - 1)) / rows;
    wins.forEach(w => delete w.dataset.max);
    wins.forEach((w, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      Object.assign(w.style, { left: a.x + c * (cw + g) + 'px', top: a.y + r * (ch + g) + 'px', width: cw + 'px', height: ch + 'px' });
    });
    wins.forEach(w => { w.classList.add('docked'); const b = w.querySelector('.floatb'); if (b) { b.classList.add('on'); b.title = 'Decolar (deixar flutuante)' } });

  }
  function arrangeMain() {
    const wins = [...document.querySelectorAll('.win:not(.min)')];
    if (!wins.length) return;
    const a = area(), g = 0;
    if (wins.length === 1 || mobile()) return arrangeGrid(1, wins.length);
    const mw = Math.round(a.w * .62), sw = a.w - mw - g, n = wins.length - 1;
    const sh = (a.h - g * (n - 1)) / n;
    wins.forEach(w => delete w.dataset.max);
    Object.assign(wins[0].style, { left: a.x + 'px', top: a.y + 'px', width: mw + 'px', height: a.h + 'px' });
    wins.slice(1).forEach((w, i) => Object.assign(w.style, {
      left: a.x + mw + g + 'px', top: a.y + i * (sh + g) + 'px', width: sw + 'px', height: sh + 'px'
    }));
    wins.forEach(w => { w.classList.add('docked'); const b = w.querySelector('.floatb'); if (b) { b.classList.add('on'); b.title = 'Decolar (deixar flutuante)' } });
    ui.layout = 'free'; ui.tiled = true; saveUI(); persist();

  function fitAll() {
    const wins = [...document.querySelectorAll('.win:not(.min)')];
    const a = area();
    wins.forEach(w => {
      delete w.dataset.max;
      const wd = Math.min(parseFloat(w.style.width) || 480, a.w), ht = Math.min(parseFloat(w.style.height) || 360, a.h);
      const lf = Math.min(Math.max(parseFloat(w.style.left) || a.x, a.x), a.x + a.w - wd);
      const tp = Math.min(Math.max(parseFloat(w.style.top) || a.y, a.y), a.y + a.h - ht);

  /* ---------------- LUPA (busca global) ---------------- */
  function dataset() {
    const s = window.state || {}, out = [];
    const add = (tipo, titulo, sub, k, id) => out.push({ tipo, titulo, sub: sub || '', k, id });
    Object.keys(TITLES).forEach(k => add('tela', TITLES[k], 'abrir tela', k));
    (s.itens || []).forEach(i => add('item', i.desc || i.descricao || '(sem descrição)', [i.categoria, i.qtd && ('qtd ' + i.qtd + ' ' + (i.un || ''))].filter(Boolean).join(' · '), 'itens'));
    (s.pedidos || []).forEach(p => add('pedido', `#${p.numero || '—'} ${p.fornecedor || ''}`, [p.status, p.prazo && ('prazo ' + p.prazo)].filter(Boolean).join(' · '), 'pedidos'));
    (s.eventos || []).forEach(e => add('evento', e.titulo, [e.data, e.hora, e.local].filter(Boolean).join(' · '), 'eventos'));
    (s.atividades || []).forEach(a => add('atividade', a.titulo, [a.tipo, a.prazo].filter(Boolean).join(' · '), 'atividades'));
    (s.sends || []).forEach(x => add('send', x.assunto || '(sem assunto)', [x.status, x.data].filter(Boolean).join(' · '), 'send'));
    (s.servicos || []).forEach(p => {
      add('pasta', p.nome, 'pasta de serviço', 'arquivos');
      (p.sub || []).forEach(sb => { add('subpasta', sb.nome, p.nome, 'arquivos'); (sb.itens || []).forEach(it => add('arquivo', String(it), p.nome + ' / ' + sb.nome, 'arquivos')) });
    });
    (s.links || []).forEach(l => add('link', l.nome || l.titulo || l.url, l.url || '', 'links'));
    (s.remotos || s.remoto || []).forEach(r => add('remoto', r.nome || r.host, r.host || '', 'remoto'));
    return out;
  }
  const norm = (v) => String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

    hits = (!t.length ? base.filter(r => r.tipo === 'tela') : base.filter(r => {
      const hay = norm(r.tipo + ' ' + r.titulo + ' ' + r.sub);

    sel = 0; paint();
  }

  }

async function jvChamada(model,contents,key,viaQuery){
  const base='https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent';
  const url=viaQuery?(base+'?key='+encodeURIComponent(key)):base;
  const hd={'Content-Type':'application/json'}; if(!viaQuery)hd['x-goog-api-key']=key;

  if(!r.ok&&!viaQuery&&(r.status===400||r.status===401||r.status===403))return jvChamada(model,contents,key,true);
  if(!r.ok){
    const msg=(j.error&&j.error.message)||('HTTP '+r.status);
    const semCred=r.status===401||/invalid authentication credentials|API key not valid|API_KEY_INVALID|UNAUTHENTICATED/i.test(msg);

      :r.status===404?('Modelo indisponivel: '+model)

      :(r.status===503||r.status===500)?('Modelo ocupado no momento: '+model):msg);
    err.status=r.status; throw err;
  }
  const cand=(j.candidates||[])[0];
  const txt=((cand&&cand.content&&cand.content.parts)||[]).map(p=>p.text||'').join('').trim();
  if(!txt){

  function aplicar(b){S.box=b;win.style.left=b.l+'px';win.style.top=b.t+'px';win.style.width=b.w+'px';win.style.height=b.h+'px';salvarX()}
  function preset(a){
    const W=innerWidth,H=innerHeight;
    win.classList.remove('max');
    if(a==='full'){win.classList.add('max');aplicar({l:0,t:0,w:W,h:H})}
    else if(a==='w')aplicar({l:0,t:S.box.t,w:W,h:S.box.h});
    else if(a==='h')aplicar({l:S.box.l,t:0,w:S.box.w,h:H});
    else if(a==='l')aplicar({l:0,t:0,w:Math.round(W/2),h:H});
    else if(a==='r')aplicar({l:Math.round(W/2),t:0,w:Math.round(W/2),h:H});
    else if(a==='rest')aplicar({l:Math.max(20,Math.round((W-900)/2)),t:60,w:Math.min(900,W-40),h:Math.min(620,H-90)});
  }

  /* arrastar + redimensionar livre */
  function ligarMover(){
    const head=win.querySelector('.jx-head');
    head.addEventListener('pointerdown',e=>{
      if(e.target.closest('button'))return;
      const sx=e.clientX,sy=e.clientY,b={...S.box};
      head.setPointerCapture(e.pointerId);
      const mv=ev=>{win.classList.remove('max');
        aplicar({l:Math.min(innerWidth-60,Math.max(-(b.w-80),b.l+ev.clientX-sx)),t:Math.min(innerHeight-40,Math.max(0,b.t+ev.clientY-sy)),w:b.w,h:b.h})};
      const up=()=>{head.removeEventListener('pointermove',mv);head.removeEventListener('pointerup',up)};
      head.addEventListener('pointermove',mv);head.addEventListener('pointerup',up);
    });
    head.addEventListener('dblclick',e=>{if(!e.target.closest('button'))preset(win.classList.contains('max')?'rest':'full')});
  }
  function ligarResize(){
    win.querySelectorAll('.rz').forEach(h=>{
      const dir=h.className.replace('rz','').trim();
      h.addEventListener('pointerdown',e=>{
        e.preventDefault();h.setPointerCapture(e.pointerId);
        const sx=e.clientX,sy=e.clientY,b={...S.box};
        const mv=ev=>{
          const dx=ev.clientX-sx,dy=ev.clientY-sy;let{l,t,w,hh}={l:b.l,t:b.t,w:b.w,hh:b.h};
          if(dir.includes('e'))w=Math.max(300,b.w+dx);
          if(dir.includes('s'))hh=Math.max(200,b.h+dy);
          if(dir.includes('w')){w=Math.max(300,b.w-dx);l=b.l+(b.w-w)}
          if(dir.includes('n')){hh=Math.max(200,b.h-dy);t=b.t+(b.h-hh)}
          win.classList.remove('max');aplicar({l,t,w,h:hh});
        };
        const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up)};
        h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);
      });
    });
  }

  /* ---------- render ---------- */
  const SUG=['Resumo do meu dia','O que está atrasado?','Gerar planilha das atividades','Criar imagem futurista do meu projeto','Explique o que tem nesta tela'];
  function pintarChips(){
    const c=$x('jx-chips');if(!c)return;
    c.innerHTML=SUG.map((s,i)=>`<button data-i="${i}">${esc2(s)}</button>`).join('');
    [...c.children].forEach((b,i)=>b.onclick=()=>{$x('jx-in').value=SUG[i];enviar()});
  }
  function pintarThreads(){
    const box=$x('jx-threads');if(!box)return;
    box.innerHTML=S.threads.map(t=>`<div class="jx-th ${t.id===S.atual?'sel':''}" data-id="${t.id}">
      <span title="${esc2(t.nome)}">${esc2(t.nome)}</span>
      <button data-r="${t.id}" title="Renomear">✎</button><button data-x="${t.id}" title="Excluir">🗑</button></div>`).join('');
    box.querySelectorAll('.jx-th').forEach(el=>{
      el.onclick=e=>{
        if(e.target.dataset.r){const n=pr('Nome do assunto:',th().nome);const t=S.threads.find(t=>t.id===e.target.dataset.r);if(n&&t){t.nome=n;salvarX();pintarThreads()}return}
        if(e.target.dataset.x){S.threads=S.threads.filter(t=>t.id!==e.target.dataset.x);if(!S.threads.length)novoAssunto(true);S.atual=S.threads[0].id;salvarX();pintarThreads();pintar();return}
        S.atual=el.dataset.id;salvarX();pintarThreads();pintar();
      };
    });
  }
  function fmt(t){
    return esc2(t).replace(/```[a-z]*\n([\s\S]*?)```/g,(m,c)=>`<pre style="white-space:pre-wrap;background:rgba(255,60,60,.08);border:1px solid rgba(255,60,60,.25);padding:8px;border-radius:8px">${c}</pre>`)
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  }
  function pintar(){
    const box=$x('jx-log');if(!box)return;
    const t=th();
    box.innerHTML=(t.msgs.length?'':`<div class="jx-empty"><div class="core">◉</div><p>JARVIS ONLINE</p>
      <small>núcleo conectado ao MODESK · pergunte sobre o site, crie imagens, vídeos, planilhas e registros</small></div>`)
      +t.msgs.map((m,i)=>{
        if(m.tipo==='img')return `<div class="m ai"><b>Imagem gerada</b><img src="${m.url}"/><div class="dl"><button data-dl="img" data-i="${i}">⬇ Baixar imagem</button></div></div>`;
        if(m.tipo==='video')return `<div class="m ai"><b>Vídeo gerado</b><video src="${m.url}" controls style="max-width:100%;border-radius:10px;margin-top:8px"></video></div>`;
        const csv=(m.text||'').match(/```csv\n([\s\S]*?)```/i);
        const dl=m.role==='model'?`<div class="dl">
            <button data-dl="txt" data-i="${i}">⬇ Baixar .txt</button>
            ${csv?`<button data-dl="csv" data-i="${i}">⬇ Baixar planilha .csv</button><button data-dl="xls" data-i="${i}">⬇ Baixar Excel .xls</button>`:''}
          </div>`:'';
        const imgs=(m.imgs||[]).map(u=>`<img src="${u}"/>`).join('');
        return `<div class="m ${m.role==='user'?'me':'ai'}">${fmt(m.text||'')}${imgs}${dl}</div>`;
      }).join('')
      +(S.pensando?'<div class="m sys">JARVIS processando…</div>':'');
    try{box.scrollTo({top:box.scrollHeight,behavior:'smooth'})}catch(e){box.scrollTop=box.scrollHeight}
    box.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>baixarDe(b.dataset.dl,+b.dataset.i));
    $x('jx-st').textContent=S.files.length?S.files.length+' anexo(s)':'';
  }
  function pintarFiles(){
    const f=$x('jx-files');if(!f)return;
    f.innerHTML=S.files.map((a,i)=>`<span>${a.url?`<img src="${a.url}"/>`:'📎'} ${esc2(a.nome)} <button data-i="${i}">✕</button></span>`).join('');
    f.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.files.splice(+b.dataset.i,1);pintarFiles();pintar()});
  }

  /* ---------- downloads ---------- */
  function baixar(nome,conteudo,mime){
    const blob=conteudo instanceof Blob?conteudo:new Blob([conteudo],{type:mime||'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }
  function baixarDe(tipo,i){
    const m=th().msgs[i];if(!m)return;
    if(tipo==='img'){baixar('jarvis-'+Date.now()+'.png',dataURLparaBlob(m.url));return}
    const csv=(m.text||'').match(/```csv\n([\s\S]*?)```/i);
    if(tipo==='csv'&&csv){baixar('jarvis-planilha.csv','\ufeff'+csv[1].trim(),'text/csv;charset=utf-8');return}
    if(tipo==='xls'&&csv){
      const linhas=csv[1].trim().split(/\r?\n/).map(l=>'<tr>'+l.split(/[;,](?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>'<td>'+esc2(c.replace(/^"|"$/g,''))+'</td>').join('')+'</tr>').join('');
      baixar('jarvis-planilha.xls','<html><meta charset="utf-8"><table border="1">'+linhas+'</table></html>','application/vnd.ms-excel');return;
    }
    baixar('jarvis-resposta.txt',m.text||'','text/plain;charset=utf-8');
  }
  function dataURLparaBlob(u){
    const [h,b]=u.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'image/png';
    const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }

  /* ---------- anexos ---------- */
  function lerArquivo(f){
    return new Promise((res,rej)=>{
      if(f.size>18*1024*1024)return rej(new Error('Arquivo muito grande (máx 18MB): '+f.name));
      const r=new FileReader();
      r.onerror=()=>rej(new Error('Falha ao ler '+f.name));
      if(/^image\//.test(f.type)||/^(application\/pdf|audio\/|video\/)/.test(f.type)){
        r.onload=()=>{const u=String(r.result);res({nome:f.name,mime:f.type,b64:u.split(',')[1],url:/^image\//.test(f.type)?u:''})};
        r.readAsDataURL(f);
      }else{
        r.onload=()=>res({nome:f.name,mime:'',texto:String(r.result).slice(0,120000)});
        r.readAsText(f);
      }
    });
  }
  async function anexar(lista){
    for(const f of lista){try{S.files.push(await lerArquivo(f))}catch(e){aviso(e.message)}}
    pintarFiles();pintar();
  }

  /* ---------- chamadas de IA ---------- */
  function chave(){const k=((typeof jvCfg==='function'?jvCfg():{}).apiKey||'').trim();
    if(!k)throw new Error('Cole a chave do Google AI Studio em Configurações para ativar o JARVIS.');return k}

  function contents(){
    const t=th();
    const arr=t.msgs.filter(m=>m.role&&m.text).slice(-24).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}]}));
    const ult=arr[arr.length-1];
    if(ult&&ult.role==='user'){
      S.files.forEach(f=>{
        if(f.b64)ult.parts.push({inlineData:{mimeType:f.mime,data:f.b64}});
        else if(f.texto)ult.parts.push({text:`\n[Arquivo anexado: ${f.nome}]\n${f.texto}`});
      });
    }
    return arr;
  }

  async function gerarImagem(prompt){
    const key=chave();
    const modelos=['gemini-2.5-flash-image','gemini-2.0-flash-preview-image-generation','imagen-3.0-generate-002'];
    let erro;
    for(const m of modelos){
      try{
        const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',
          {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
           body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],generationConfig:{responseModalities:['IMAGE','TEXT']}})});
        const j=await r.json();
        if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
        const parts=((j.candidates||[])[0]||{}).content&&j.candidates[0].content.parts||[];
        const im=parts.find(p=>p.inlineData||p.inline_data);
        if(im){const d=im.inlineData||im.inline_data;return 'data:'+(d.mimeType||d.mime_type||'image/png')+';base64,'+d.data}
        throw new Error('sem imagem retornada');
      }catch(e){erro=e}
    }
    throw new Error('Não consegui gerar a imagem: '+(erro&&erro.message||''));
  }

  async function gerarVideo(prompt){
    const key=chave();
    const modelos=['veo-3.0-fast-generate-001','veo-3.0-generate-preview','veo-2.0-generate-001'];
    let erro;
    for(const m of modelos){
      try{
        const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':predictLongRunning',
          {method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
           body:JSON.stringify({instances:[{prompt}],parameters:{aspectRatio:'16:9'}})});
        const j=await r.json();
        if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
        let op=j;
        for(let i=0;i<60&&!op.done;i++){
          await new Promise(s=>setTimeout(s,5000));
          const p=await fetch('https://generativelanguage.googleapis.com/v1beta/'+op.name,{headers:{'x-goog-api-key':key}});
          op=await p.json();
        }
        const resp=op.response||{};
        const vid=(resp.generateVideoResponse&&resp.generateVideoResponse.generatedSamples||resp.generatedSamples||[])[0];
        const uri=vid&&(vid.video&&(vid.video.uri||vid.video.url));
        if(uri)return uri+(uri.includes('?')?'&':'?')+'key='+encodeURIComponent(key);
        throw new Error('sem vídeo retornado');
      }catch(e){erro=e}
    }
    throw new Error('Geração de vídeo indisponível para esta chave: '+(erro&&erro.message||''));
  }

  /* ---------- chave da API ---------- */
  let chavePedida=false;
  function pedirChave(forcar){
    if(!forcar){if(chavePedida)return true;chavePedida=true}
    const c=(typeof jvCfg==='function')?jvCfg():(window.state&&(state.gemini=state.gemini||{}))||{};
    if(c.apiKey&&!forcar)return true;
    const k=pr('Cole a chave do Google AI Studio (aistudio.google.com/apikey):',c.apiKey||'');
    if(k===null)return !!c.apiKey;
    c.apiKey=k.trim();
    try{save(true)}catch(_){}
    aviso(c.apiKey?'Chave salva · JARVIS ativo':'Chave removida');
    return !!c.apiKey;
  }

  /* ---------- conversa compartilhada do Gemini (herdado da versao antiga) ---------- */
  async function importarShare(){
    const c=(typeof jvCfg==='function')?jvCfg():{};
    const u=(pr('Link da conversa compartilhada do Gemini:',c.share||'')||'').trim();
    if(!u)return;
    if(!/^https?:\/\//i.test(u)){aviso('Cole um link válido (https://...)');return}
    c.share=u;try{save(true)}catch(_){}
    aviso('Lendo conversa compartilhada…');
    const tentativas=[u,'https://r.jina.ai/'+u,'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
    for(const url of tentativas){
      try{
        const r=await fetch(url);if(!r.ok)continue;
        let t=await r.text();
        t=t.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ')
           .replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').replace(/\s{2,}/g,' ').trim();
        if(t.length<80)continue;
        S.files.push({nome:'conversa-gemini.txt',mime:'',texto:t.slice(0,120000)});
        pintarFiles();pintar();aviso('Conversa importada como contexto');return;
      }catch(e){}
    }
    aviso('Não consegui ler o link (bloqueio do Google). Abra a conversa e cole o texto.');
    window.open(u,'_blank','noopener');
  }
  window.jvxImportarShare=importarShare;

  /* ---------- enviar ---------- */
  async function enviar(txtForcado,modo){
    const ta=$x('jx-in');
    const msg=(txtForcado!==undefined?txtForcado:ta.value).trim();
    if(!msg&&!S.files.length)return;
    if(S.pensando)return;
    const t=th();
    t.msgs.push({role:'user',text:msg,imgs:S.files.filter(f=>f.url).map(f=>f.url)});
    if(t.nome==='Novo assunto'&&msg)t.nome=msg.slice(0,38);
    if(ta)ta.value='';
    S.pensando=true;pintar();pintarThreads();salvarX();
    try{
      if(modo==='img'){
        const url=await gerarImagem(msg);
        t.msgs.push({role:'model',tipo:'img',url,text:'Imagem gerada a partir de: '+msg});
      }else if(modo==='vid'){
        const url=await gerarVideo(msg);
        t.msgs.push({role:'model',tipo:'video',url,text:'Vídeo gerado a partir de: '+msg});
      }else{
        const resp=await jvGemini(contents());
        let limpo=resp,feitas=[];
        try{const r=jvAcoes(resp);limpo=r.limpo;feitas=r.feitas}catch(_){}
        t.msgs.push({role:'model',text:limpo+(feitas.length?'\n\n✅ '+feitas.join('\n✅ '):'')});
        if(feitas.length){try{render()}catch(_){}}
      }
      S.files=[];pintarFiles();
    }catch(e){
      t.msgs.push({role:'model',text:'⚠️ '+e.message});
    }finally{
      S.pensando=false;pintar();salvarX();
    }
  }

  /* ---------- voz ---------- */
  let rec=null;
  function ditar(btn){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){aviso('Ditado por voz não suportado neste navegador');return}
    if(rec){try{rec.stop()}catch(_){}rec=null;btn.classList.remove('on');return}
    rec=new SR();rec.lang='pt-BR';rec.interimResults=true;
    const ta=$x('jx-in'),base=ta.value;
    rec.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;ta.value=(base?base+' ':'')+s};
    rec.onend=rec.onerror=()=>{rec=null;btn.classList.remove('on')};
    btn.classList.add('on');rec.start();aviso('Ouvindo…');
  }

  /* ---------- eventos ---------- */
  function ligar(){
    ligarMover();ligarResize();
    win.querySelector('.jx-head').addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='close')fechar();
      else if(a==='min')win.classList.toggle('min');
      else if(a==='side')win.classList.toggle('nosd');
      else preset(a);
    });
    win.querySelector('.jx-new').onclick=()=>novoAssunto();
    win.querySelector('.jx-row').addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a,ta=$x('jx-in');
      if(a==='file')$x('jx-file').click();
      else if(a==='img'){if(!ta.value.trim())ta.value='';const p=ta.value.trim()||pr('Descreva a imagem que devo criar:');if(p){ta.value=p;enviar(undefined,'img')}}
      else if(a==='vid'){const p=ta.value.trim()||pr('Descreva o vídeo que devo criar:');if(p){ta.value=p;enviar(undefined,'vid')}}
      else if(a==='xls'){const p=ta.value.trim()||pr('Qual planilha devo gerar? (ex.: atividades atrasadas por prioridade)');
        if(p)enviar('Gere uma planilha sobre: '+p+'. Responda com uma breve explicação e a tabela completa dentro de um bloco ```csv usando ponto e vírgula como separador, com cabeçalho.');}
      else if(a==='doc'){const p=ta.value.trim()||pr('Qual documento devo escrever?');
        if(p)enviar('Escreva o documento completo e formatado sobre: '+p);}
      else if(a==='mic')ditar(b);
      else if(a==='site'){const p=ta.value.trim()||pr('O que quer saber sobre o sistema/site?');
        if(p)enviar('Com base nos dados reais do MODESK (telas, atividades, pedidos, eventos, SEND, itens, links, arquivos), responda: '+p);}
      else if(a==='share'){importarShare()}
      else if(a==='limpar'){const t=th();t.msgs=[];S.files=[];pintarFiles();pintar();salvarX()}
      else if(a==='chave'){pedirChave(true)}
    });
    $x('jx-send').onclick=()=>enviar();
    $x('jx-file').onchange=e=>{anexar([...e.target.files]);e.target.value=''};
    const ta=$x('jx-in');
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar()}});
    ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px'});
    const log=$x('jx-log');
    log.addEventListener('dragover',e=>{e.preventDefault();log.classList.add('drag')});
    log.addEventListener('dragleave',()=>log.classList.remove('drag'));
    log.addEventListener('drop',e=>{e.preventDefault();log.classList.remove('drag');anexar([...(e.dataTransfer.files||[])])});
    const onPaste=e=>{
      if(!win.classList.contains('on'))return;
      const f=[...(e.clipboardData&&e.clipboardData.files||[])];if(f.length){anexar(f);aviso('Anexo colado no JARVIS')}
    };
    document.addEventListener('paste',onPaste);
    win.addEventListener('paste',onPaste); /* v42: colar dentro da janela externa */
    win.addEventListener('keydown',e=>{   /* v42: Esc/Enter funcionam fora do site */
      if(e.key==='Escape'&&!win.classList.contains('solto'))fechar();
    });
    addEventListener('resize',()=>{if(win.classList.contains('max'))aplicar({l:0,t:0,w:innerWidth,h:innerHeight})});
  }

  function abrir(){criar();win.classList.add('on');pedirChave(false);pintarThreads();pintarChips();pintar();pintarFiles();setTimeout(()=>{try{$x('jx-in').focus()}catch(_){}},80)}
  function fechar(){if(win)win.classList.remove('on')}
  window.jvxAbrir=abrir;window.jvxFechar=fechar;
  window.jvFlutuante=abrir; /* substitui o painel antigo */

  addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='j'){e.preventDefault();win&&win.classList.contains('on')?fechar():abrir()}
    if(e.key==='Escape'&&win&&win.classList.contains('on')&&!document.querySelector('#jvx :focus'))fechar();
  });

  carregar();
})();
</script>

<script>
/* ===================== v26 · JARVIS STARK — presets de tamanho + janela única ===================== */
(function(){
  function win(){return document.getElementById('jvx')}
  /* todos os atalhos antigos abrem a janela Stark v25 */
  function unificar(){
    if(typeof window.jvxAbrir!=='function')return setTimeout(unificar,400);
    /* v27: o JARVIS volta a abrir FORA do site, em janela flutuante do computador
       (Picture-in-Picture / pop-up). A janela Stark interna continua no Ctrl+Alt+J. */
    /* v28: janela ÚNICA — tudo abre o painel JARVIS azul (Stark) */
    window.jvAbrirFlutuante=window.jvxAbrir;
    addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();
      if((e.ctrlKey||e.metaKey)&&e.altKey&&k==='j'){e.preventDefault();window.jvxAbrir();return}
      if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&k==='j'){e.preventDefault();window.jvxAbrir()}
    });
    /* orbe reator: clique = janela flutuante no computador · botão direito = painel Stark */
    (function orbe(){
      const b=document.getElementById('jv-orb');
      if(!b)return setTimeout(orbe,600);
      b.title='JARVIS — clique abre a janela · botao direito abre fora do site';
      b.onclick=()=>window.jvxAbrir();
      b.oncontextmenu=e=>{e.preventDefault();try{window.jvPiP()}catch(_){window.jvxAbrir()}};
    })();
    menu();
  }
  /* menu de tamanhos livres */
  const PRESETS=[
    ['⛶  Tela cheia (100%)',   ()=>({l:0,t:0,w:innerWidth,h:innerHeight}),true],
    ['↔  Largura total',       b=>({l:0,t:b.t,w:innerWidth,h:b.h})],
    ['↕  Altura total',        b=>({l:b.l,t:0,w:b.w,h:innerHeight})],
    ['◧  Metade esquerda',     ()=>({l:0,t:0,w:Math.round(innerWidth/2),h:innerHeight})],
    ['◨  Metade direita',      ()=>({l:Math.round(innerWidth/2),t:0,w:Math.round(innerWidth/2),h:innerHeight})],
    ['▀  Metade de cima',      ()=>({l:0,t:0,w:innerWidth,h:Math.round(innerHeight/2)})],
    ['▄  Metade de baixo',     ()=>({l:0,t:Math.round(innerHeight/2),w:innerWidth,h:Math.round(innerHeight/2)})],
    ['◱  Canto (25%)',         ()=>({l:0,t:0,w:Math.round(innerWidth/2),h:Math.round(innerHeight/2)})],
    ['□  90% da tela',         ()=>({l:Math.round(innerWidth*.05),t:Math.round(innerHeight*.05),w:Math.round(innerWidth*.9),h:Math.round(innerHeight*.9)})],
    ['▫  75% da tela',         ()=>({l:Math.round(innerWidth*.125),t:Math.round(innerHeight*.125),w:Math.round(innerWidth*.75),h:Math.round(innerHeight*.75)})],
    ['▪  50% central',         ()=>({l:Math.round(innerWidth*.25),t:Math.round(innerHeight*.25),w:Math.round(innerWidth*.5),h:Math.round(innerHeight*.5)})],
    ['▁  Barra de comando',    ()=>({l:Math.round(innerWidth*.15),t:innerHeight-260,w:Math.round(innerWidth*.7),h:240})],
    ['⌾  Centralizar',         b=>({l:Math.max(0,Math.round((innerWidth-b.w)/2)),t:Math.max(0,Math.round((innerHeight-b.h)/2)),w:b.w,h:b.h})]
  ];
  function aplicarBox(w,b,cheia){
    w.classList.add('snapfx');
    w.classList.toggle('max',!!cheia);
    w.style.left=b.l+'px';w.style.top=b.t+'px';w.style.width=b.w+'px';w.style.height=b.h+'px';
    try{const d=JSON.parse(localStorage.getItem('jvx_v25')||'{}');d.box=b;localStorage.setItem('jvx_v25',JSON.stringify(d))}catch(_){}
    setTimeout(()=>w.classList.remove('snapfx'),200);
  }
  function caixa(w){const r=w.getBoundingClientRect();return {l:r.left,t:r.top,w:r.width,h:r.height}}
  function menu(){
    const w=win();if(!w)return setTimeout(menu,500);
    if(w.querySelector('.jx-menu'))return;
    const head=w.querySelector('.jx-head');
    const btn=document.createElement('button');
    btn.className='jx-b';btn.title='Tamanhos da janela';btn.textContent='⧉';
    head.insertBefore(btn,head.querySelector('[data-a="min"]'));
    const m=document.createElement('div');m.className='jx-menu';
    PRESETS.forEach(([nome,fn,cheia],i)=>{
      const b=document.createElement('button');b.textContent=nome;
      b.onclick=()=>{aplicarBox(w,fn(caixa(w)),cheia);m.classList.remove('on')};
      m.appendChild(b);
      if(i===0||i===6)m.appendChild(document.createElement('hr'));
    });
    const livre=document.createElement('button');
    livre.textContent='✎  Digitar largura × altura…';
    livre.onclick=()=>{
      const c=caixa(w);
      const v=prompt('Tamanho em pixels (largura x altura):',Math.round(c.w)+' x '+Math.round(c.h));
      if(!v)return;const n=v.match(/(\d+)\s*[x×,;\s]\s*(\d+)/);
      if(n)aplicarBox(w,{l:c.l,t:c.t,w:Math.max(280,+n[1]),h:Math.max(180,+n[2])});
      m.classList.remove('on');
    };
    m.appendChild(document.createElement('hr'));m.appendChild(livre);
    w.appendChild(m);
    btn.onclick=e=>{e.stopPropagation();m.classList.toggle('on')};
    w.addEventListener('click',e=>{if(!e.target.closest('.jx-menu')&&e.target!==btn)m.classList.remove('on')});
    /* encaixe automático ao soltar a janela nas bordas */
    let solto=null;
    w.addEventListener('pointerup',()=>{
      const c=caixa(w);
      if(c.t<=2&&c.l<=2&&c.w>=innerWidth-4)return;
      if(c.t<6&&c.l>6&&c.l<innerWidth-6){aplicarBox(w,{l:0,t:0,w:innerWidth,h:innerHeight},true);return}
      if(c.l<6){aplicarBox(w,{l:0,t:0,w:Math.round(innerWidth/2),h:innerHeight})}
      else if(c.l+c.w>innerWidth-6){aplicarBox(w,{l:Math.round(innerWidth/2),t:0,w:Math.round(innerWidth/2),h:innerHeight})}
      solto=null;
    });
    /* em telas pequenas, abre já em tela cheia */
    if(innerWidth<760)aplicarBox(w,{l:0,t:0,w:innerWidth,h:innerHeight},true);
  }
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',unificar);else unificar();
  const _ab=()=>{const w=win();if(w&&!w.querySelector('.jx-menu'))menu()};
  setInterval(_ab,2000);
})();
</script>

<script>
/* ============ v31 · JARVIS FORA DO SITE — a propria janela Stark vai para o PiP ============ */
(function(){
  let pip=null,volta=null;
  function aviso(m){try{toast(m)}catch(_){console.log(m)}}
  function estilos(doc){
    [...document.styleSheets].forEach(ss=>{
      try{
        const css=[...ss.cssRules].map(r=>r.cssText).join('\n');
        const st=doc.createElement('style');st.textContent=css;doc.head.appendChild(st);
      }catch(_){
        if(ss.href){const l=doc.createElement('link');l.rel='stylesheet';l.href=ss.href;doc.head.appendChild(l)}
      }
    });
  }
  async function abrirFora(){
    const w=document.getElementById('jvx');
    if(!w){try{window.jvxAbrir()}catch(_){} return setTimeout(abrirFora,300)}
    if(pip&&!pip.closed){try{pip.focus()}catch(_){} return}
    if(!(window.documentPictureInPicture&&documentPictureInPicture.requestWindow)){
      try{window.jvxAbrir()}catch(_){}
      aviso('Seu navegador nao suporta janela fora do site. JARVIS aberto aqui dentro.');
      return;
    }
    try{
      const r=w.getBoundingClientRect();
      pip=await documentPictureInPicture.requestWindow({width:Math.max(360,Math.round(r.width)||460),height:Math.max(360,Math.round(r.height)||640)});
      estilos(pip.document);
      pip.document.body.style.margin='0';
      pip.document.body.style.background='#050b14';
      volta=document.createComment('jvx');
      w.parentNode.insertBefore(volta,w);
      pip.document.body.appendChild(w);
      w.classList.add('on','pip');
      pip.addEventListener('pagehide',()=>{
        w.classList.remove('pip');
        if(volta&&volta.parentNode)volta.parentNode.insertBefore(w,volta);
        else document.body.appendChild(w);
        volta=null;pip=null;
      });
      aviso('JARVIS aberto fora do site');
    }catch(e){
      pip=null;
      try{window.jvxAbrir()}catch(_){}
      aviso('Nao consegui abrir fora do site. JARVIS aberto aqui dentro.');
    }
  }
  function fecharFora(){try{pip&&pip.close()}catch(_){}}
  window.jvPiP=abrirFora;window.jvPopup=abrirFora;window.jvAbrirFora=abrirFora;
  window.jvFecharPopup=fecharFora;window.jvVoltarParaSite=fecharFora;

  addEventListener('keydown',e=>{
    const k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&k==='j'){e.preventDefault();pip&&!pip.closed?fecharFora():abrirFora()}
  },true);

  /* botao no cabecalho da janela */
  function instalar(){
    const w=document.getElementById('jvx');
    if(!w)return setTimeout(instalar,600);
    const head=w.querySelector('.jx-head');
    if(head&&!head.querySelector('[data-a="pip"]')){
      const b=document.createElement('button');
      b.className='jx-b';b.dataset.a='pip';b.textContent='\u29e8';
      b.title='Abrir fora do site (Ctrl+Shift+J)';
      b.onclick=e=>{e.stopPropagation();abrirFora()};
      head.insertBefore(b,head.querySelector('[data-a="min"]')||head.querySelector('[data-a="close"]'));
    }
  }
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',instalar);else instalar();
  setInterval(instalar,2500);
})();
</script>

<script>
/* ============ v33 · JARVIS FORA DO SITE SEM LIMITE DE TAMANHO + TEMA/COR ============ */
(function(){
  var pop=null, pip=null, volta=null;
  function aviso(m){try{toast(m)}catch(_){console.log(m)}}
  function jw(){return document.getElementById('jvx')}
  function garantir(){var w=jw();if(!w){try{window.jvxAbrir()}catch(_){}w=jw()}return w}

  /* ---------- copia todo o CSS para a janela externa ---------- */
  function estilos(doc){
    [].slice.call(document.styleSheets).forEach(function(ss){
      try{
        var css=[].slice.call(ss.cssRules).map(function(r){return r.cssText}).join('\n');
        var st=doc.createElement('style');st.textContent=css;doc.head.appendChild(st);
      }catch(_){ if(ss.href){var l=doc.createElement('link');l.rel='stylesheet';l.href=ss.href;doc.head.appendChild(l)} }
    });
    var extra=doc.createElement('style');
    extra.textContent='html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#050b14}';
    doc.head.appendChild(extra);
  }

  /* ---------- devolve a janela para dentro do site ---------- */
  function devolver(w){
    w.classList.remove('solto','pip');
    if(volta&&volta.parentNode)volta.parentNode.insertBefore(w,volta);
    else document.body.appendChild(w);
    volta=null;aplicarTema();
  }

  /* ---------- JANELA REAL DO COMPUTADOR (sem limite de tamanho) ---------- */
  function abrirPopup(){
    var w=garantir();if(!w)return setTimeout(abrirPopup,300);
    if(pop&&!pop.closed){try{pop.focus()}catch(_){}return}
    var lw=Math.min(screen.availWidth-80,1200), lh=Math.min(screen.availHeight-80,800);
    pop=window.open('','jarvisModesk','popup=yes,resizable=yes,scrollbars=no,width='+lw+',height='+lh+',left=40,top=40');
    if(!pop){aviso('O navegador bloqueou a janela. Libere pop-ups deste site.');return}
    try{
      pop.document.open();
      pop.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>J.A.R.V.I.S. \u2014 MODESK</title></head><body></body></html>');
      pop.document.close();
      estilos(pop.document);
      volta=document.createComment('jvx');
      w.parentNode.insertBefore(volta,w);
      pop.document.body.appendChild(w);
      w.classList.add('on','solto');
      barraExterna(pop,w);
      setTimeout(function(){try{w.querySelector('#jx-in').focus()}catch(_){}},120);
      aplicarTema();
      pop.addEventListener('pagehide',function(){try{devolver(w)}catch(_){}pop=null});
      pop.addEventListener('beforeunload',function(){try{devolver(w)}catch(_){}pop=null});
      addEventListener('beforeunload',function(){try{pop&&pop.close()}catch(_){}});
      aviso('JARVIS aberto em janela livre do computador');
    }catch(e){try{pop.close()}catch(_){}pop=null;aviso('Nao consegui abrir a janela livre.')}
  }

  /* botoes de tamanho DENTRO da janela externa (tela cheia real, metades, etc.) */
  function barraExterna(win,w){
    var head=w.querySelector('.jx-head');if(!head)return;
    if(head.querySelector('[data-a="extmax"]'))return;
    function b(acao,txt,tit,fn){
      var el=win.document.createElement('button');
      el.className='jx-b';el.dataset.a=acao;el.textContent=txt;el.title=tit;
      el.onclick=function(e){e.stopPropagation();fn()};
      head.insertBefore(el,head.querySelector('[data-a="tema"]')||head.querySelector('[data-a="close"]'));
    }
    b('extmax','⛶','Tela cheia do computador',function(){
      try{win.moveTo(0,0);win.resizeTo(screen.availWidth,screen.availHeight)}catch(_){}
      try{win.document.documentElement.requestFullscreen&&win.document.documentElement.requestFullscreen()}catch(_){}
    });
    b('exthalf','◨','Metade da tela',function(){try{win.moveTo(Math.round(screen.availWidth/2),0);win.resizeTo(Math.round(screen.availWidth/2),screen.availHeight)}catch(_){}});
    b('extmed','❐','Tamanho medio',function(){try{win.resizeTo(Math.min(1100,screen.availWidth-60),Math.min(760,screen.availHeight-60));win.moveTo(40,40)}catch(_){}});
    b('extlivre','✎','Digitar largura × altura',function(){
      var v=win.prompt('Tamanho da janela (largura x altura):',win.outerWidth+' x '+win.outerHeight);
      if(!v)return;var n=v.match(/(\d+)\s*[x×,;\s]\s*(\d+)/);
      if(n)try{win.resizeTo(Math.max(320,+n[1]),Math.max(240,+n[2]))}catch(_){}
    });
    b('extvolta','⤓','Voltar para dentro do site',function(){try{win.close()}catch(_){}});
  }

  /* ---------- PiP (mini janela sempre visivel) continua disponivel ---------- */
  async function abrirPiP(){
    var w=garantir();if(!w)return;
    if(!(window.documentPictureInPicture&&documentPictureInPicture.requestWindow))return abrirPopup();
    try{
      pip=await documentPictureInPicture.requestWindow({width:Math.min(screen.availWidth-100,1000),height:Math.min(screen.availHeight-100,720)});
      estilos(pip.document);
      volta=document.createComment('jvx');
      w.parentNode.insertBefore(volta,w);
      pip.document.body.appendChild(w);
      w.classList.add('on','solto');aplicarTema();
      setTimeout(function(){try{w.querySelector('#jx-in').focus()}catch(_){}},120);
      pip.addEventListener('pagehide',function(){devolver(w);pip=null});
      aviso('JARVIS em janela flutuante');
    }catch(e){abrirPopup()}
  }

  function fecharFora(){try{pop&&pop.close()}catch(_){}try{pip&&pip.close()}catch(_){}}
  window.jvAbrirFora=abrirPopup;window.jvPopup=abrirPopup;window.jvPiP=abrirPopup;
  window.jvPiPMini=abrirPiP;window.jvFecharPopup=fecharFora;window.jvVoltarParaSite=fecharFora;

  /* ===================== TEMA · COR PREDOMINANTE E ESTILO ===================== */
  var TK='jvx_tema_v33';
  var CORES=['#56c8ff','#00e5a0','#7c5cff','#ff4d6d','#ffb02e','#ff6a00','#00d1d1','#b9c4d0','#ff2bd1','#7dff4d'];
  var ESTILOS={
    stark:{nome:'Stark (padrao)',sat:1,bri:1,con:1,glow:1},
    neon:{nome:'Neon intenso',sat:1.45,bri:1.12,con:1.08,glow:1.6},
    suave:{nome:'Suave / discreto',sat:.65,bri:.98,con:.96,glow:.5},
    grafite:{nome:'Grafite (sem cor)',sat:0,bri:1.05,con:1.05,glow:.6},
    contraste:{nome:'Alto contraste',sat:1.15,bri:1.08,con:1.3,glow:1}
  };
  var T={cor:'#56c8ff',estilo:'stark',brilho:100};
  try{var d=JSON.parse(localStorage.getItem(TK)||'{}');if(d.cor)T=Object.assign(T,d)}catch(_){}

  function hue(hex){
    var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0;
    if(mx!==mn){var dd=mx-mn;
      if(mx===r)h=((g-b)/dd)%6;else if(mx===g)h=(b-r)/dd+2;else h=(r-g)/dd+4;h*=60;if(h<0)h+=360}
    return h;
  }
  function aplicarTema(){
    var w=jw();if(!w)return;
    var e=ESTILOS[T.estilo]||ESTILOS.stark;
    var giro=Math.round(hue(T.cor)-199);
    var br=(e.bri*(T.brilho/100)).toFixed(2);
    w.style.filter='hue-rotate('+giro+'deg) saturate('+e.sat+') brightness('+br+') contrast('+e.con+')';
    w.style.setProperty('--jx-glow',e.glow);
    try{localStorage.setItem(TK,JSON.stringify(T))}catch(_){}
    var orb=document.getElementById('jv-orb');
    if(orb)orb.style.filter='hue-rotate('+giro+'deg) saturate('+e.sat+')';
  }
  window.jvTema=aplicarTema;

  function painelTema(){
    var w=jw();if(!w)return setTimeout(painelTema,600);
    var head=w.querySelector('.jx-head');if(!head)return;
    if(w.querySelector('.jx-tema')){aplicarTema();return}
    var btn=document.createElement('button');
    btn.className='jx-b';btn.dataset.a='tema';btn.textContent='🎨';btn.title='Cor e estilo do JARVIS';
    head.insertBefore(btn,head.querySelector('[data-a="close"]'));
    var p=document.createElement('div');p.className='jx-tema';
    p.innerHTML='<h4>COR PREDOMINANTE</h4><div class="cores"></div>'
      +'<input type="color" id="jxt-cor" value="'+T.cor+'"/>'
      +'<h4>ESTILO</h4><select id="jxt-est"></select>'
      +'<h4>BRILHO</h4><input type="range" id="jxt-bri" min="70" max="130" value="'+T.brilho+'"/>'
      +'<div class="lin"><button id="jxt-reset">Padrao</button><button id="jxt-ok">Fechar</button></div>';
    w.appendChild(p);
    var cx=p.querySelector('.cores');
    CORES.forEach(function(c){
      var b=document.createElement('b');b.style.background=c;if(c===T.cor)b.className='sel';
      b.onclick=function(){T.cor=c;p.querySelector('#jxt-cor').value=c;
        [].slice.call(cx.children).forEach(function(x){x.className=''});b.className='sel';aplicarTema()};
      cx.appendChild(b);
    });
    var sel=p.querySelector('#jxt-est');
    Object.keys(ESTILOS).forEach(function(k){
      var o=document.createElement('option');o.value=k;o.textContent=ESTILOS[k].nome;if(k===T.estilo)o.selected=true;sel.appendChild(o);
    });
    sel.onchange=function(){T.estilo=sel.value;aplicarTema()};
    p.querySelector('#jxt-cor').oninput=function(e){T.cor=e.target.value;aplicarTema()};
    p.querySelector('#jxt-bri').oninput=function(e){T.brilho=+e.target.value;aplicarTema()};
    p.querySelector('#jxt-reset').onclick=function(){T={cor:'#56c8ff',estilo:'stark',brilho:100};
      p.querySelector('#jxt-cor').value=T.cor;sel.value='stark';p.querySelector('#jxt-bri').value=100;aplicarTema()};
    p.querySelector('#jxt-ok').onclick=function(){p.classList.remove('on')};
    btn.onclick=function(e){e.stopPropagation();p.classList.toggle('on')};
    w.addEventListener('click',function(e){if(!e.target.closest('.jx-tema')&&e.target!==btn)p.classList.remove('on')});
    aplicarTema();
  }

  /* ---------- botao "fora do site" refeito ---------- */
  function instalar33(){
    var w=jw();if(!w)return setTimeout(instalar33,600);
    var head=w.querySelector('.jx-head');if(!head)return;
    var antigo=head.querySelector('[data-a="pip"]');
    if(antigo){antigo.title='Abrir em janela livre do computador (Ctrl+Shift+J)';antigo.onclick=function(e){e.stopPropagation();abrirPopup()}}
    else{
      var b=document.createElement('button');b.className='jx-b';b.dataset.a='pip';b.textContent='\u29e8';
      b.title='Abrir em janela livre do computador (Ctrl+Shift+J)';
      b.onclick=function(e){e.stopPropagation();abrirPopup()};
      head.insertBefore(b,head.querySelector('[data-a="tema"]')||head.querySelector('[data-a="close"]'));
    }
    painelTema();
    var orb=document.getElementById('jv-orb');
    if(orb)orb.oncontextmenu=function(e){e.preventDefault();abrirPopup()};
  }
  addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&k==='j'){e.preventDefault();(pop&&!pop.closed)?fecharFora():abrirPopup()}
  },true);
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',instalar33);else instalar33();
  setInterval(instalar33,2500);
})();
</script>

<script>
/* ============ v34 · Central de Interface como 2ª aba da barra lateral ============ */
(function(){
  function pronto(){
    var aside=document.querySelector('.app aside'), menu=document.getElementById('menu');
    if(!aside||!menu||typeof MENU==='undefined')return setTimeout(pronto,500);
    document.body.classList.add('app-on');
    if(!aside.querySelector('.sb-tabs')){
      var tabs=document.createElement('div');tabs.className='sb-tabs';
      tabs.innerHTML='<button data-t="menu" class="act">'+icon('boxes')+'Menu</button>'
                    +'<button data-t="ui">'+icon('monitor')+'Interface</button>';
      menu.parentNode.insertBefore(tabs,menu);
      var ui=document.createElement('div');ui.id='sb-ui';
      menu.parentNode.insertBefore(ui,menu.nextSibling);
      tabs.querySelectorAll('button').forEach(function(b){
        b.onclick=function(){
          tabs.querySelectorAll('button').forEach(function(x){x.classList.remove('act')});
          b.classList.add('act');
          aside.classList.toggle('ui-mode',b.dataset.t==='ui');
          try{localStorage.setItem('sb_aba',b.dataset.t)}catch(_){}
          pintarUI();
        };
      });
      try{if(localStorage.getItem('sb_aba')==='ui')tabs.querySelector('[data-t="ui"]').click()}catch(_){}
    }
    pintarUI();
  }
  function pintarUI(){
    var ui=document.getElementById('sb-ui');if(!ui)return;
    var atual=(typeof tab!=='undefined')?tab:'';
    ui.innerHTML=MENU.map(function(f){
      var itens=f.itens.filter(function(i){return i.k!=='interface'});
      if(!itens.length)return '';
      return '<div class="sbu-g"><div class="sbu-t">'+f.nome+'</div><div class="sbu-grid">'
        +itens.map(function(i){
          return '<button class="sbu-c'+(i.k===atual?' act':'')+'" data-k="'+i.k+'" title="'+i.n+'">'
            +icon(i.i)+'<span>'+i.n+'</span></button>';
        }).join('')+'</div></div>';
    }).join('');
    ui.querySelectorAll('.sbu-c').forEach(function(b){
      b.onclick=function(){go(b.dataset.k);setTimeout(pintarUI,60)};
    });
  }
  window.sbPintarInterface=pintarUI;
  if(typeof window.go==='function'){
    var _go=window.go;
    window.go=function(k){_go(k);setTimeout(pintarUI,60)};
  }
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',pronto);else pronto();
  addEventListener('resize',function(){pintarUI()});
})();
</script>

<script>
/* v36 — protecao de conteudo: bloqueia Ctrl+U, Ctrl+S, F12, atalhos de inspecao e menu do botao direito */
(function(){
  function editavel(t){return t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);}
  document.addEventListener('contextmenu',function(e){if(!editavel(e.target))e.preventDefault();},true);
  document.addEventListener('dragstart',function(e){if(!editavel(e.target))e.preventDefault();},true);
  document.addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if(k==='f12'){e.preventDefault();return false;}
    if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&['u','s','p'].indexOf(k)>-1){e.preventDefault();return false;}
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&['i','j','c','k'].indexOf(k)>-1){e.preventDefault();return false;}
  },true);
  try{
    var m=document.createElement('meta');m.name='robots';m.content='noindex,nofollow';document.head.appendChild(m);
  }catch(e){}
})();
</script>
