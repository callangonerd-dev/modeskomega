<script>

/* ============ PROVEDOR ÚNICO DE IA — GROQ ============ */
const IA_LS='modesk_ia_prov';
const IA_DEF={prov:'groq',groqKey:'',groqModel:'openai/gpt-oss-20b'};
const GROQ_MODELOS=['openai/gpt-oss-120b','openai/gpt-oss-20b','llama-3.3-70b-versatile','groq/compound','groq/compound-mini'];
function jvGroqOpts(){let m='';try{m=String(iaCfg().groqModel||'')}catch(e){}
  const l=GROQ_MODELOS.slice(); if(m&&l.indexOf(m)<0)l.unshift(m);
  return l.map(x=>'<option value="'+x+'"'+(x===m?' selected':'')+'>'+x+'</option>').join('')}
function iaCfg(){ if(!window.__iaCfg){ let s={}; try{s=JSON.parse(localStorage.getItem(IA_LS)||'{}')}catch(e){} window.__iaCfg={prov:'groq',groqKey:String(s.groqKey||''),groqModel:String(s.groqModel||IA_DEF.groqModel)}; } return window.__iaCfg }
function iaSalvarCfg(){ try{localStorage.setItem(IA_LS,JSON.stringify(iaCfg()))}catch(e){} }
function iaPronto(){ return !!String(iaCfg().groqKey||'').trim() }
function iaNome(){ const c=iaCfg(); return 'Groq · '+(c.groqModel||'openai/gpt-oss-20b') }
/* converte mensagens internas para o formato compatível com a Groq */
function iaDeContents(contents){
  const out=[];
  (contents||[]).forEach(c=>{
    const parts=c.parts||[]; let txt=''; let papel=(c.role==='model')?'assistant':'user';
    parts.forEach(p=>{
      if(p.text)txt+=(txt?'\n':'')+p.text;
      else if(p.functionCall)txt+=(txt?'\n':'')+'[acao '+p.functionCall.name+' '+JSON.stringify(p.functionCall.args||{}).slice(0,500)+']';
      else if(p.functionResponse){papel='user';txt+=(txt?'\n':'')+'Resultado da ferramenta '+p.functionResponse.name+': '+JSON.stringify((p.functionResponse.response||{}).result||{}).slice(0,1500)}
      else if(p.inlineData||p.fileData)txt+=(txt?'\n':'')+'[arquivo anexado]';
    });
    if(txt.trim())out.push({role:papel,content:txt});
  });
  return out;
}
function iaFerramentas(body){
  try{
    const fd=((body&&body.tools)||[]).find(t=>t&&t.function_declarations);
    if(!fd)return null;
    const arr=fd.function_declarations.map(f=>({type:'function',function:{name:f.name,description:f.description||'',parameters:f.parameters||{type:'object',properties:{}}}}));
    return arr.length?arr:null;
  }catch(e){return null}
}
function iaErro(status,msg){
  const e=new Error(status===401?'Chave da Groq invalida. Cole a chave (gsk_...) em Configuracoes → JARVIS.'
    :status===429?'Limite de requisicoes do provedor atingido. Aguarde alguns instantes.'
    :status===0?'Nao consegui falar com a IA agora (conexao ou servidor local offline).'
    :(msg||('HTTP '+status)));
  e.status=status; return e;
}
/* chamada unica: envia so o prompt do sistema + as ultimas 4 mensagens */
async function iaRaw(system,mensagens,opc){
  opc=opc||{};
  const c=iaCfg();
  const hist=(mensagens||[]).filter(m=>m&&m.content).slice(-4);
  const msgs=[{role:'system',content:String(system||'').slice(0,12000)}].concat(hist);
  const usarStream=!!opc.onChunk&&!opc.tools;
  if(!String(c.groqKey||'').trim())throw iaErro(401,'');
  const url='https://api.groq.com/openai/v1/chat/completions';
  const headers={'Content-Type':'application/json','Authorization':'Bearer '+String(c.groqKey).trim()};
  const body={model:c.groqModel||'openai/gpt-oss-20b',messages:msgs,temperature:.6,max_tokens:2048,stream:usarStream};
  if(opc.tools){body.tools=opc.tools;body.tool_choice='auto'}
  let r;
  try{ r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)}) }
  catch(e){ throw iaErro(0,'') }
  if(!r.ok){ let j={}; try{j=await r.json()}catch(e){} throw iaErro(r.status,(j.error&&(j.error.message||j.error))||'') }
  if(usarStream&&r.body){
    const rd=r.body.getReader(),dec=new TextDecoder(); let buf='',txt='';
    while(true){
      const {value,done}=await rd.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while((i=buf.indexOf('\n'))>=0){
        let linha=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!linha)continue;
        if(linha.startsWith('data:'))linha=linha.slice(5).trim();
        if(!linha||linha==='[DONE]')continue;
        let j; try{j=JSON.parse(linha)}catch(e){continue}
        const d=((((j.choices||[])[0]||{}).delta||{}).content)||'';
        if(d){txt+=d; try{opc.onChunk(d)}catch(e){}}
      }
    }
    return {text:txt.trim(),tools:[]};
  }
  let j={}; try{j=await r.json()}catch(e){}
  const m=(((j.choices||[])[0]||{}).message)||{};
  const tc=(m.tool_calls||[]).map(t=>{ let a={}; try{a=JSON.parse((t.function||{}).arguments||'{}')}catch(e){} return {name:(t.function||{}).name,args:a} });
  return {text:String(m.content||'').trim(),tools:tc};
}
async function iaChat(system,mensagens,onChunk){
  const r=await iaRaw(system,mensagens,{onChunk});
  return r.text||'';
}

const JV={hist:[],pensando:false};

  const c=iaCfg(),g=id=>{const e=$(id);return e?e.value.trim():''};
  c.prov='groq';
  const kEl=$('cf-iak'); if(kEl)c.groqKey=kEl.value.trim();
  c.groqModel=g('cf-iam')||c.groqModel||'openai/gpt-oss-20b';
  iaSalvarCfg(); toast('IA salva: '+iaNome()); render();
}
function jvSalvarChaveRapida(){const el=$('jv-key');if(!el)return;const k=el.value.trim();
  if(!k){toast('Cole a chave da Groq (gsk_...)');return}
  const c=iaCfg();c.prov='groq';c.groqKey=k;iaSalvarCfg();toast('Chave salva. JARVIS ativo.');render();setTimeout(()=>testarGroq(),300)}
async function testarGroq(){toast('Testando JARVIS...');try{const r=await jvGroq([{role:'user',parts:[{text:'Responda apenas: JARVIS online.'}]}]);toast(r.slice(0,60)||'sem resposta')}catch(e){toast('Falha: '+e.message)}}

function jvResumo(){
  const hoje=new Date().toISOString().slice(0,10);
  const L=k=>Array.isArray(state[k])?state[k]:[];
  const listaAlertas=()=>{try{return alertas()||[]}catch(e){return[]}};
  const at=L('atividades').filter(a=>!a.feito).slice(0,25).map(a=>`- ${a.titulo} | prazo ${a.prazo||'-'} ${a.hora||''} | ${a.prioridade||'Normal'} | ${a.tipo||''}`);
  const pd=L('pedidos').slice(0,20).map(p=>`- Pedido ${p.numero} | ${p.fornecedor||''} | status ${p.status||''} | prazo ${p.prazo||'-'}`);
  const ev=L('eventos').slice(0,20).map(e=>`- ${e.titulo} | ${e.data||'-'} ${e.hora||''} | ${e.local||''}`);
  const sd=L('sends').slice(0,15).map(s=>`- SEND ${s.assunto} | ${s.data||'-'} | ${s.status||''}`);
  const it=L('itens').slice(0,25).map(i=>`- ${i.desc||i.descricao||''} (${i.qtd||1} ${i.un||'UN'}) ${i.cat||''}`);
  const al=listaAlertas().map(a=>'- '+a.m).slice(0,15);
  const lk=L('links').slice(0,20).map(l=>`- ${l.nome} | ${l.url} | ${l.desc||''}`);
  const pa=L('pastas').slice(0,20).map(f=>`- ${f.nome||f.caminho} | ${f.caminho||''}`);
  const ar=L('arquivos').slice(0,20).map(a=>`- ${a.nome||a.titulo||''} | ${a.pasta||a.cat||''}`);
  return `DATA DE HOJE: ${hoje}
TELA ABERTA AGORA: ${typeof tab!=='undefined'?tab:'-'}
ATIVIDADES ABERTAS (${L('atividades').filter(a=>!a.feito).length}):
${at.join('\n')||'nenhuma'}
PEDIDOS (${L('pedidos').length}):
${pd.join('\n')||'nenhum'}
EVENTOS (${L('eventos').length}):
${ev.join('\n')||'nenhum'}
SEND (${L('sends').length}):
${sd.join('\n')||'nenhum'}
ITENS (${L('itens').length}):
${it.join('\n')||'nenhum'}
ALERTAS:
${al.join('\n')||'nenhum'}
LINKS (${L('links').length}):
${lk.join('\n')||'nenhum'}
PASTAS (${L('pastas').length}):
${pa.join('\n')||'nenhuma'}
ARQUIVOS (${L('arquivos').length}):
${ar.join('\n')||'nenhum'}
TELAS DISPONIVEIS: dashboard, agenda, atividades, busca, arquivos, itens, pedidos, send, eventos, remoto, links, config, entrega, interface, jarvis`;
}
function jvSystem(){
  return `Voce e o JARVIS, assistente pessoal completo de ${GESTOR}.
Fale sempre em portugues do Brasil, de forma direta, objetiva e util. Seja breve por padrao e detalhe quando pedirem.

ESCOPO: voce NAO esta limitado aos dados do MODESK. Responda qualquer assunto: conhecimento geral, ciencia,
tecnologia, calculos, matematica, saude, financas, direito, culinaria, viagens, estudos, idiomas, redacao de
textos e e-mails, programacao, conselhos, ideias, resumos, traducoes, conversas do dia a dia, etc.
NUNCA responda que o assunto esta fora do escopo, nem que "o sistema gerencia apenas atividades/pedidos/eventos".
Se nao souber algo com certeza, diga o que sabe e sinalize a incerteza. Se a pergunta depender de dados que nao
estao no sistema nem no seu conhecimento (ex.: noticias de hoje), explique isso e ofereca o melhor caminho.

Alem disso, voce conhece o sistema MODESK PESSOAL de ${GESTOR} e pode usar os dados abaixo quando a pergunta
for sobre atividades, pedidos, eventos, envios, itens ou links. Nesses casos priorize tarefas, cobre prazos e sugira acoes.
Voce pode EXECUTAR acoes no sistema. Quando o usuario pedir para criar/registrar algo ou abrir uma tela,
inclua no FINAL da resposta um bloco de codigo json exatamente assim:
\`\`\`json
{"acoes":[{"tipo":"add_atividade","titulo":"...","prazo":"AAAA-MM-DD","hora":"HH:MM","prioridade":"Normal|Alta|Critica","categoria":"Trabalho|Pessoal","obs":"..."}]}
\`\`\`
Tipos validos: add_atividade, add_evento {titulo,data,hora,local,info}, add_pedido {numero,fornecedor,status,prazo,obs},
add_send {assunto,data,status,obs}, add_item {desc,qtd,un,cat,obs}, ir_para {tela}.
Nunca invente acoes que o usuario nao pediu. Sem pedido de acao, nao envie bloco json.

=== ESTADO ATUAL DO SISTEMA (contexto opcional, use so se for relevante) ===
${jvResumo()}`;
}
function jvAcoes(txt){
  const m=txt.match(/```json([\s\S]*?)```/i); if(!m)return{limpo:txt,feitas:[]};
  let obj={}; try{obj=JSON.parse(m[1].trim())}catch(e){return{limpo:txt.replace(m[0],'').trim(),feitas:[]}}
  const feitas=[];
  ['atividades','eventos','pedidos','sends','itens'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
  (obj.acoes||[]).forEach(a=>{
    try{
      if(a.tipo==='add_atividade'){state.atividades.push({id:u(),titulo:a.titulo||'Sem titulo',prazo:a.prazo||'',hora:a.hora||'',prioridade:a.prioridade||'Normal',categoria:a.categoria||'Trabalho',tipo:a.categoria||'Trabalho',obs:a.obs||'',feito:false,em:Date.now()});feitas.push('Atividade criada: '+(a.titulo||''))}
      else if(a.tipo==='add_evento'){state.eventos.push({id:u(),titulo:a.titulo||'Evento',data:a.data||'',hora:a.hora||'',local:a.local||'',info:a.info||''});feitas.push('Evento criado: '+(a.titulo||''))}
      else if(a.tipo==='add_pedido'){state.pedidos.push({id:u(),numero:a.numero||'-',fornecedor:a.fornecedor||'',status:a.status||'Aberto',prazo:a.prazo||'',obs:a.obs||''});feitas.push('Pedido criado: '+(a.numero||''))}
      else if(a.tipo==='add_send'){state.sends.push({id:u(),assunto:a.assunto||'-',data:a.data||new Date().toISOString().slice(0,10),status:a.status||'Aguardando retorno',obs:a.obs||''});feitas.push('SEND criado: '+(a.assunto||''))}
      else if(a.tipo==='add_item'){state.itens.push({id:u(),desc:a.desc||'-',qtd:a.qtd||1,un:a.un||'UN',cat:a.cat||'',obs:a.obs||''});feitas.push('Item criado: '+(a.desc||''))}
      else if(a.tipo==='ir_para'){const t=a.tela||''; if(t&&t!=='jarvis'){setTimeout(()=>go(t),700);feitas.push('Abrindo tela: '+t)}}
    }catch(e){}
  });
  if(feitas.length){try{save(true)}catch(e){}}
  return {limpo:txt.replace(m[0],'').trim(),feitas};
}

(function(){

    if(document.getElementById('jv-orb'))return;
    const b=document.createElement('button');
    b.id='jv-orb';
    b.title='JARVIS — clique abre a janela · botao direito abre fora do site (Ctrl+J / Ctrl+Shift+J)';

    b.onclick=()=>jvAbrir();
    b.oncontextmenu=e=>{e.preventDefault();jvAbrirFora()};

  if(a)new MutationObserver(ver).observe(a,{attributes:true,attributeFilter:['class']});
})();

<script>
/* ===================== v25 · JARVIS STARK — janela livre + conversas + criação ===================== */
(function(){
  const LS='jvx_v25';
  const S={threads:[],atual:null,files:[],pensando:false,snap:''};
  /* v42: busca sempre DENTRO da janela do JARVIS (funciona tambem quando ela esta
     em janela separada do computador / PiP, onde document.getElementById falha) */
  const $x=id=>{ if(win){ const el=win.querySelector('#'+id); if(el) return el; } return document.getElementById(id); };
  const jwin=()=>(win&&win.ownerDocument&&win.ownerDocument.defaultView)||window;
  const pr=(m,d)=>{ try{ return jwin().prompt(m,d) }catch(_){ return window.prompt(m,d) } };
  const esc2=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>Math.random().toString(36).slice(2,10);
  function aviso(m){try{toast(m)}catch(_){console.log(m)}}

  /* ---------- persistência ---------- */
  function carregar(){
    try{const d=JSON.parse(localStorage.getItem(LS)||'{}');
      S.threads=Array.isArray(d.threads)?d.threads:[];S.atual=d.atual||null;
      if(d.box)S.box=d.box;
    }catch(_){}
    if(!S.threads.length)novoAssunto(true);
    if(!S.threads.find(t=>t.id===S.atual))S.atual=S.threads[0].id;
  }
  function salvarX(){
    try{localStorage.setItem(LS,JSON.stringify({threads:S.threads.slice(0,60),atual:S.atual,box:S.box}))}catch(_){}
  }
  const th=()=>S.threads.find(t=>t.id===S.atual)||S.threads[0];
  function novoAssunto(mudo){
    const t={id:uid(),nome:'Novo assunto',msgs:[],em:Date.now()};
    S.threads.unshift(t);S.atual=t.id;if(!mudo){pintar();pintarThreads();salvarX()}
    return t;
  }

  /* ---------- janela ---------- */
  const HTML=`
  <div class="jx-head">
    <div class="jx-logo">◉</div>
    <div class="jx-title"><b>J.A.R.V.I.S.</b><small>MODESK CORE · IA v42</small></div>
    <div class="jx-sp"></div>
    <button class="jx-b" data-a="side" title="Mostrar/ocultar assuntos">☰</button>
    <button class="jx-b" data-a="w" title="Largura total">↔</button>
    <button class="jx-b" data-a="h" title="Altura total">↕</button>
    <button class="jx-b" data-a="l" title="Encaixar à esquerda">◧</button>
    <button class="jx-b" data-a="r" title="Encaixar à direita">◨</button>
    <button class="jx-b" data-a="full" title="Tela cheia">⛶</button>
    <button class="jx-b" data-a="rest" title="Restaurar tamanho">❐</button>
    <button class="jx-b" data-a="min" title="Minimizar">–</button>
    <button class="jx-b" data-a="close" title="Fechar (Esc)">✕</button>
  </div>
  <div class="jx-body">
    <div class="jx-side">
      <button class="jx-new" data-a="novo">＋ Novo assunto</button>
      <div class="jx-threads" id="jx-threads"></div>
    </div>
    <div class="jx-main">
      <div class="jx-log" id="jx-log"></div>
      <div class="jx-chips" id="jx-chips"></div>
      <div class="jx-files" id="jx-files"></div>
      <div class="jx-foot">
        <div class="jx-comp">
          <textarea id="jx-in" rows="1" placeholder="Fale com o JARVIS… (Enter envia · Shift+Enter quebra linha)"></textarea>
          <div class="jx-row">
            <button class="jx-ic" data-a="file" title="Anexar arquivo">📎</button>
            <button class="jx-ic" data-a="img" title="Gerar imagem com IA">🎨</button>
            <button class="jx-ic" data-a="vid" title="Gerar vídeo com IA">🎬</button>
            <button class="jx-ic" data-a="xls" title="Gerar planilha (CSV/Excel)">📊</button>
            <button class="jx-ic" data-a="doc" title="Gerar documento para download">📄</button>
            <button class="jx-ic" data-a="mic" title="Ditar por voz">🎤</button>
            <button class="jx-ic" data-a="site" title="Perguntar sobre o conteúdo do site">🌐</button>
            <button class="jx-ic" data-a="limpar" title="Limpar este assunto">🧹</button>
            <button class="jx-ic" data-a="chave" title="Chave da IA (Groq)">🔑</button>
            <div class="jx-sp" style="flex:1"></div>
            <span class="jx-st" id="jx-st"></span>
            <button class="jx-send" id="jx-send" title="Enviar">➤</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <input type="file" id="jx-file" multiple style="display:none"/>
  <div class="rz n"></div><div class="rz s"></div><div class="rz e"></div><div class="rz w"></div>
  <div class="rz ne"></div><div class="rz nw"></div><div class="rz se"></div><div class="rz sw"></div>`;

  let win;
  function criar(){
    if(win)return win;
    win=document.createElement('div');win.id='jvx';win.innerHTML=HTML;
    document.body.appendChild(win);
    const b=S.box||{l:Math.max(20,innerWidth-980),t:70,w:Math.min(900,innerWidth-60),h:Math.min(620,innerHeight-100)};
    aplicar(b);
    ligar();
    return win;
  }
  function aplicar(b){S.box=b;win.style.left=b.l+'px';win.style.top=b.t+'px';win.style.width=b.w+'px';win.style.height=b.h+'px';salvarX()}
  function preset(a){
    const W=innerWidth,H=innerHeight;
    win.classList.remove('max');
    if(a==='full'){win.classList.add('max');aplicar({l:0,t:0,w:W,h:H})}
    else if(a==='w')aplicar({l:0,t:S.box.t,w:W,h:S.box.h});
    else if(a==='h')aplicar({l:S.box.l,t:0,w:S.box.w,h:H});
    else if(a==='l')aplicar({l:0,t:0,w:Math.round(W/2),h:H});
    else if(a==='r')aplicar({l:Math.round(W/2),t:0,w:Math.round(W/2),h:H});
    else if(a==='rest')aplicar({l:Math.max(20,Math.round((W-900)/2)),t:60,w:Math.min(900,W-40),h:Math.min(620,H-90)});
  }

  /* arrastar + redimensionar livre */
  function ligarMover(){
    const head=win.querySelector('.jx-head');
    head.addEventListener('pointerdown',e=>{
      if(e.target.closest('button'))return;
      const sx=e.clientX,sy=e.clientY,b={...S.box};
      head.setPointerCapture(e.pointerId);
      const mv=ev=>{win.classList.remove('max');
        aplicar({l:Math.min(innerWidth-60,Math.max(-(b.w-80),b.l+ev.clientX-sx)),t:Math.min(innerHeight-40,Math.max(0,b.t+ev.clientY-sy)),w:b.w,h:b.h})};
      const up=()=>{head.removeEventListener('pointermove',mv);head.removeEventListener('pointerup',up)};
      head.addEventListener('pointermove',mv);head.addEventListener('pointerup',up);
    });
    head.addEventListener('dblclick',e=>{if(!e.target.closest('button'))preset(win.classList.contains('max')?'rest':'full')});
  }
  function ligarResize(){
    win.querySelectorAll('.rz').forEach(h=>{
      const dir=h.className.replace('rz','').trim();
      h.addEventListener('pointerdown',e=>{
        e.preventDefault();h.setPointerCapture(e.pointerId);
        const sx=e.clientX,sy=e.clientY,b={...S.box};
        const mv=ev=>{
          const dx=ev.clientX-sx,dy=ev.clientY-sy;let{l,t,w,hh}={l:b.l,t:b.t,w:b.w,hh:b.h};
          if(dir.includes('e'))w=Math.max(300,b.w+dx);
          if(dir.includes('s'))hh=Math.max(200,b.h+dy);
          if(dir.includes('w')){w=Math.max(300,b.w-dx);l=b.l+(b.w-w)}
          if(dir.includes('n')){hh=Math.max(200,b.h-dy);t=b.t+(b.h-hh)}
          win.classList.remove('max');aplicar({l,t,w,h:hh});
        };
        const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up)};
        h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);
      });
    });
  }

  /* ---------- render ---------- */
  const SUG=['Resumo do meu dia','O que está atrasado?','Gerar planilha das atividades','Criar imagem futurista do meu projeto','Explique o que tem nesta tela'];
  function pintarChips(){
    const c=$x('jx-chips');if(!c)return;
    c.innerHTML=SUG.map((s,i)=>`<button data-i="${i}">${esc2(s)}</button>`).join('');
    [...c.children].forEach((b,i)=>b.onclick=()=>{$x('jx-in').value=SUG[i];enviar()});
  }
  function pintarThreads(){
    const box=$x('jx-threads');if(!box)return;
    box.innerHTML=S.threads.map(t=>`<div class="jx-th ${t.id===S.atual?'sel':''}" data-id="${t.id}">
      <span title="${esc2(t.nome)}">${esc2(t.nome)}</span>
      <button data-r="${t.id}" title="Renomear">✎</button><button data-x="${t.id}" title="Excluir">🗑</button></div>`).join('');
    box.querySelectorAll('.jx-th').forEach(el=>{
      el.onclick=e=>{
        if(e.target.dataset.r){const n=pr('Nome do assunto:',th().nome);const t=S.threads.find(t=>t.id===e.target.dataset.r);if(n&&t){t.nome=n;salvarX();pintarThreads()}return}
        if(e.target.dataset.x){S.threads=S.threads.filter(t=>t.id!==e.target.dataset.x);if(!S.threads.length)novoAssunto(true);S.atual=S.threads[0].id;salvarX();pintarThreads();pintar();return}
        S.atual=el.dataset.id;salvarX();pintarThreads();pintar();
      };
    });
  }
  function fmt(t){
    return esc2(t).replace(/```[a-z]*\n([\s\S]*?)```/g,(m,c)=>`<pre style="white-space:pre-wrap;background:rgba(255,60,60,.08);border:1px solid rgba(255,60,60,.25);padding:8px;border-radius:8px">${c}</pre>`)
      .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  }
  function pintar(){
    const box=$x('jx-log');if(!box)return;
    const t=th();
    box.innerHTML=(t.msgs.length?'':`<div class="jx-empty"><div class="core">◉</div><p>JARVIS ONLINE</p>
      <small>núcleo conectado ao MODESK · pergunte sobre o site, crie imagens, vídeos, planilhas e registros</small></div>`)
      +t.msgs.map((m,i)=>{
        if(m.tipo==='img')return `<div class="m ai"><b>Imagem gerada</b><img src="${m.url}"/><div class="dl"><button data-dl="img" data-i="${i}">⬇ Baixar imagem</button></div></div>`;
        if(m.tipo==='video')return `<div class="m ai"><b>Vídeo gerado</b><video src="${m.url}" controls style="max-width:100%;border-radius:10px;margin-top:8px"></video></div>`;
        const csv=(m.text||'').match(/```csv\n([\s\S]*?)```/i);
        const dl=m.role==='model'?`<div class="dl">
            <button data-dl="txt" data-i="${i}">⬇ Baixar .txt</button>
            ${csv?`<button data-dl="csv" data-i="${i}">⬇ Baixar planilha .csv</button><button data-dl="xls" data-i="${i}">⬇ Baixar Excel .xls</button>`:''}
          </div>`:'';
        const imgs=(m.imgs||[]).map(u=>`<img src="${u}"/>`).join('');
        return `<div class="m ${m.role==='user'?'me':'ai'}">${fmt(m.text||'')}${imgs}${dl}</div>`;
      }).join('')
      +(S.pensando?'<div class="m sys">JARVIS processando…</div>':'');
    try{box.scrollTo({top:box.scrollHeight,behavior:'smooth'})}catch(e){box.scrollTop=box.scrollHeight}
    box.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>baixarDe(b.dataset.dl,+b.dataset.i));
    $x('jx-st').textContent=S.files.length?S.files.length+' anexo(s)':'';
  }
  function pintarFiles(){
    const f=$x('jx-files');if(!f)return;
    f.innerHTML=S.files.map((a,i)=>`<span>${a.url?`<img src="${a.url}"/>`:'📎'} ${esc2(a.nome)} <button data-i="${i}">✕</button></span>`).join('');
    f.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.files.splice(+b.dataset.i,1);pintarFiles();pintar()});
  }

  /* ---------- downloads ---------- */
  function baixar(nome,conteudo,mime){
    const blob=conteudo instanceof Blob?conteudo:new Blob([conteudo],{type:mime||'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  }
  function baixarDe(tipo,i){
    const m=th().msgs[i];if(!m)return;
    if(tipo==='img'){baixar('jarvis-'+Date.now()+'.png',dataURLparaBlob(m.url));return}
    const csv=(m.text||'').match(/```csv\n([\s\S]*?)```/i);
    if(tipo==='csv'&&csv){baixar('jarvis-planilha.csv','\ufeff'+csv[1].trim(),'text/csv;charset=utf-8');return}
    if(tipo==='xls'&&csv){
      const linhas=csv[1].trim().split(/\r?\n/).map(l=>'<tr>'+l.split(/[;,](?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c=>'<td>'+esc2(c.replace(/^"|"$/g,''))+'</td>').join('')+'</tr>').join('');
      baixar('jarvis-planilha.xls','<html><meta charset="utf-8"><table border="1">'+linhas+'</table></html>','application/vnd.ms-excel');return;
    }
    baixar('jarvis-resposta.txt',m.text||'','text/plain;charset=utf-8');
  }
  function dataURLparaBlob(u){
    const [h,b]=u.split(',');const mime=(h.match(/:(.*?);/)||[])[1]||'image/png';
    const bin=atob(b);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    return new Blob([arr],{type:mime});
  }

  /* ---------- anexos ---------- */
  function lerArquivo(f){
    return new Promise((res,rej)=>{
      if(f.size>18*1024*1024)return rej(new Error('Arquivo muito grande (máx 18MB): '+f.name));
      const r=new FileReader();
      r.onerror=()=>rej(new Error('Falha ao ler '+f.name));
      if(/^image\//.test(f.type)||/^(application\/pdf|audio\/|video\/)/.test(f.type)){
        r.onload=()=>{const u=String(r.result);res({nome:f.name,mime:f.type,b64:u.split(',')[1],url:/^image\//.test(f.type)?u:''})};
        r.readAsDataURL(f);
      }else{
        r.onload=()=>res({nome:f.name,mime:'',texto:String(r.result).slice(0,120000)});
        r.readAsText(f);
      }
    });
  }
  async function anexar(lista){
    for(const f of lista){try{S.files.push(await lerArquivo(f))}catch(e){aviso(e.message)}}
    pintarFiles();pintar();
  }

  /* ---------- chamadas de IA ---------- */
  function chave(){
    let k='';
    try{k=String((typeof iaCfg==='function'?iaCfg():{}).groqKey||'').trim()}catch(e){}
    if(!k)throw new Error('Cole a chave da Groq (gsk_...) em Configuracoes → JARVIS para ativar o assistente.');return k}
  // roda a tarefa com a chave ativa e, se a cota estourar, repete com a proxima chave
  async function comChaves(fn){
    let k=chave(),ultimo;
    const total=(typeof jvQtdChaves==='function'?Math.max(1,jvQtdChaves()):1);
    for(let i=0;i<total;i++){
      try{return await fn(k)}
      catch(e){
        ultimo=e;
        const cota=e&&(e.status===429||/quota|cota|RESOURCE_EXHAUSTED|limite/i.test(e.message||''));
        if(!cota)throw e;
        const nk=(typeof jvOutraChave==='function')?jvOutraChave(k,60):'';
        if(!nk)throw e;
        k=nk; /* troca silenciosa de chave */
      }
    }
    throw ultimo||new Error('Limite de uso atingido em todas as chaves.');
  }

  function contents(){
    const t=th();
    const arr=t.msgs.filter(m=>m.role&&m.text).slice(-6).map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}]}));
    const ult=arr[arr.length-1];
    if(ult&&ult.role==='user'){
      S.files.forEach(f=>{
        if(f.b64)ult.parts.push({inlineData:{mimeType:f.mime,data:f.b64}});
        else if(f.texto)ult.parts.push({text:`\n[Arquivo anexado: ${f.nome}]\n${f.texto}`});
      });
    }
    return arr;
  }

  const _semMidia=t=>{throw new Error('Geracao de '+t+' nao esta disponivel no provedor atual (Groq), que responde apenas texto.')};
  async function gerarImagem(){ _semMidia('imagem') }
  async function gerarVideo(){ _semMidia('video') }

  /* ---------- chave da API ---------- */
  let chavePedida=false;
  function pedirChave(forcar){
    if(!forcar){if(chavePedida)return true;chavePedida=true}
    const c=iaCfg();
    if(c.prov==='groq')return true;
    if(c.groqKey&&!forcar)return true;
    const k=pr('Cole a chave da Groq (console.groq.com/keys):',c.groqKey||'');
    if(k===null)return !!c.groqKey;
    c.groqKey=k.trim(); c.prov='groq';
    try{iaSalvarCfg()}catch(_){}
    aviso(c.groqKey?'Chave salva · JARVIS ativo':'Chave removida');
    return !!c.groqKey;
  }


  /* ---------- enviar ---------- */
  async function enviar(txtForcado,modo){
    const ta=$x('jx-in');
    const msg=(txtForcado!==undefined?txtForcado:ta.value).trim();
    if(!msg&&!S.files.length)return;
    if(S.pensando)return;
    const t=th();
    t.msgs.push({role:'user',text:msg,imgs:S.files.filter(f=>f.url).map(f=>f.url)});
    if(t.nome==='Novo assunto'&&msg)t.nome=msg.slice(0,38);
    if(ta)ta.value='';
    S.pensando=true;pintar();pintarThreads();salvarX();
    try{
      if(modo==='img'){
        const url=await gerarImagem(msg);
        t.msgs.push({role:'model',tipo:'img',url,text:'Imagem gerada a partir de: '+msg});
      }else if(modo==='vid'){
        const url=await gerarVideo(msg);
        t.msgs.push({role:'model',tipo:'video',url,text:'Vídeo gerado a partir de: '+msg});
      }else{
        const resp=await jvGroq(contents());
        let limpo=resp,feitas=[];
        try{const r=jvAcoes(resp);limpo=r.limpo;feitas=r.feitas}catch(_){}
        t.msgs.push({role:'model',text:limpo+(feitas.length?'\n\n✅ '+feitas.join('\n✅ '):'')});
        if(feitas.length){try{render()}catch(_){}}
      }
      S.files=[];pintarFiles();
    }catch(e){
      t.msgs.push({role:'model',text:'⚠️ '+e.message});
    }finally{
      S.pensando=false;pintar();salvarX();
    }
  }

  /* ---------- voz ---------- */
  let rec=null;
  function ditar(btn){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){aviso('Ditado por voz não suportado neste navegador');return}
    if(rec){try{rec.stop()}catch(_){}rec=null;btn.classList.remove('on');return}
    rec=new SR();rec.lang='pt-BR';rec.interimResults=true;
    const ta=$x('jx-in'),base=ta.value;
    rec.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;ta.value=(base?base+' ':'')+s};
    rec.onend=rec.onerror=()=>{rec=null;btn.classList.remove('on')};
    btn.classList.add('on');rec.start();aviso('Ouvindo…');
  }

  /* ---------- eventos ---------- */
  function ligar(){
    ligarMover();ligarResize();
    win.querySelector('.jx-head').addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;
      if(a==='close')fechar();
      else if(a==='min')win.classList.toggle('min');
      else if(a==='side')win.classList.toggle('nosd');
      else preset(a);
    });
    win.querySelector('.jx-new').onclick=()=>novoAssunto();
    win.querySelector('.jx-row').addEventListener('click',e=>{
      const b=e.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a,ta=$x('jx-in');
      if(a==='file')$x('jx-file').click();
      else if(a==='img'){if(!ta.value.trim())ta.value='';const p=ta.value.trim()||pr('Descreva a imagem que devo criar:');if(p){ta.value=p;enviar(undefined,'img')}}
      else if(a==='vid'){const p=ta.value.trim()||pr('Descreva o vídeo que devo criar:');if(p){ta.value=p;enviar(undefined,'vid')}}
      else if(a==='xls'){const p=ta.value.trim()||pr('Qual planilha devo gerar? (ex.: atividades atrasadas por prioridade)');
        if(p)enviar('Gere uma planilha sobre: '+p+'. Responda com uma breve explicação e a tabela completa dentro de um bloco ```csv usando ponto e vírgula como separador, com cabeçalho.');}
      else if(a==='doc'){const p=ta.value.trim()||pr('Qual documento devo escrever?');
        if(p)enviar('Escreva o documento completo e formatado sobre: '+p);}
      else if(a==='mic')ditar(b);
      else if(a==='site'){const p=ta.value.trim()||pr('O que quer saber sobre o sistema/site?');
        if(p)enviar('Com base nos dados reais do MODESK (telas, atividades, pedidos, eventos, SEND, itens, links, arquivos), responda: '+p);}
      else if(a==='share'){importarShare()}
      else if(a==='limpar'){const t=th();t.msgs=[];S.files=[];pintarFiles();pintar();salvarX()}
      else if(a==='chave'){pedirChave(true)}
    });
    $x('jx-send').onclick=()=>enviar();
    $x('jx-file').onchange=e=>{anexar([...e.target.files]);e.target.value=''};
    const ta=$x('jx-in');
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviar()}});
    ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px'});
    const log=$x('jx-log');
    log.addEventListener('dragover',e=>{e.preventDefault();log.classList.add('drag')});
    log.addEventListener('dragleave',()=>log.classList.remove('drag'));
    log.addEventListener('drop',e=>{e.preventDefault();log.classList.remove('drag');anexar([...(e.dataTransfer.files||[])])});
    const onPaste=e=>{
      if(!win.classList.contains('on'))return;
      const f=[...(e.clipboardData&&e.clipboardData.files||[])];if(f.length){anexar(f);aviso('Anexo colado no JARVIS')}
    };
    document.addEventListener('paste',onPaste);
    win.addEventListener('paste',onPaste); /* v42: colar dentro da janela externa */
    win.addEventListener('keydown',e=>{   /* v42: Esc/Enter funcionam fora do site */
      if(e.key==='Escape'&&!win.classList.contains('solto'))fechar();
    });
    addEventListener('resize',()=>{if(win.classList.contains('max'))aplicar({l:0,t:0,w:innerWidth,h:innerHeight})});
  }

  function abrir(){criar();win.classList.add('on');pedirChave(false);pintarThreads();pintarChips();pintar();pintarFiles();setTimeout(()=>{try{$x('jx-in').focus()}catch(_){}},80)}
  function fechar(){if(win)win.classList.remove('on')}
  window.jvxAbrir=abrir;window.jvxFechar=fechar;
  window.jvFlutuante=abrir; /* substitui o painel antigo */

  addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='j'){e.preventDefault();win&&win.classList.contains('on')?fechar():abrir()}
    if(e.key==='Escape'&&win&&win.classList.contains('on')&&!document.querySelector('#jvx :focus'))fechar();
  });

  carregar();
})();
</script>


<style>

  border:1px solid transparent;background:transparent}
#jvx .jx-menu button:hover{background:rgba(86,200,255,.20);border-color:rgba(127,224,255,.45);color:#fff;

<script>
/* ===================== v26 · JARVIS STARK — presets de tamanho + janela única ===================== */
(function(){
  function win(){return document.getElementById('jvx')}
  /* todos os atalhos antigos abrem a janela Stark v25 */
  function unificar(){
    if(typeof window.jvxAbrir!=='function')return setTimeout(unificar,400);
    /* v27: o JARVIS volta a abrir FORA do site, em janela flutuante do computador
       (Picture-in-Picture / pop-up). A janela Stark interna continua no Ctrl+Alt+J. */
    /* v28: janela ÚNICA — tudo abre o painel JARVIS azul (Stark) */
    window.jvAbrirFlutuante=window.jvxAbrir;
    addEventListener('keydown',e=>{
      const k=e.key.toLowerCase();
      if((e.ctrlKey||e.metaKey)&&e.altKey&&k==='j'){e.preventDefault();window.jvxAbrir();return}
      if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&!e.altKey&&k==='j'){e.preventDefault();window.jvxAbrir()}
    });
    /* orbe reator: clique = janela flutuante no computador · botão direito = painel Stark */
    (function orbe(){
      const b=document.getElementById('jv-orb');
      if(!b)return setTimeout(orbe,600);
      b.title='JARVIS — clique abre a janela · botao direito abre fora do site';
      b.onclick=()=>window.jvxAbrir();
      b.oncontextmenu=e=>{e.preventDefault();try{window.jvPiP()}catch(_){window.jvxAbrir()}};
    })();
    menu();
  }
  /* menu de tamanhos livres */
  const PRESETS=[
    ['⛶  Tela cheia (100%)',   ()=>({l:0,t:0,w:innerWidth,h:innerHeight}),true],
    ['↔  Largura total',       b=>({l:0,t:b.t,w:innerWidth,h:b.h})],
    ['↕  Altura total',        b=>({l:b.l,t:0,w:b.w,h:innerHeight})],
    ['◧  Metade esquerda',     ()=>({l:0,t:0,w:Math.round(innerWidth/2),h:innerHeight})],
    ['◨  Metade direita',      ()=>({l:Math.round(innerWidth/2),t:0,w:Math.round(innerWidth/2),h:innerHeight})],
    ['▀  Metade de cima',      ()=>({l:0,t:0,w:innerWidth,h:Math.round(innerHeight/2)})],
    ['▄  Metade de baixo',     ()=>({l:0,t:Math.round(innerHeight/2),w:innerWidth,h:Math.round(innerHeight/2)})],
    ['◱  Canto (25%)',         ()=>({l:0,t:0,w:Math.round(innerWidth/2),h:Math.round(innerHeight/2)})],
    ['□  90% da tela',         ()=>({l:Math.round(innerWidth*.05),t:Math.round(innerHeight*.05),w:Math.round(innerWidth*.9),h:Math.round(innerHeight*.9)})],
    ['▫  75% da tela',         ()=>({l:Math.round(innerWidth*.125),t:Math.round(innerHeight*.125),w:Math.round(innerWidth*.75),h:Math.round(innerHeight*.75)})],
    ['▪  50% central',         ()=>({l:Math.round(innerWidth*.25),t:Math.round(innerHeight*.25),w:Math.round(innerWidth*.5),h:Math.round(innerHeight*.5)})],
    ['▁  Barra de comando',    ()=>({l:Math.round(innerWidth*.15),t:innerHeight-260,w:Math.round(innerWidth*.7),h:240})],
    ['⌾  Centralizar',         b=>({l:Math.max(0,Math.round((innerWidth-b.w)/2)),t:Math.max(0,Math.round((innerHeight-b.h)/2)),w:b.w,h:b.h})]
  ];
  function aplicarBox(w,b,cheia){
    w.classList.add('snapfx');
    w.classList.toggle('max',!!cheia);
    w.style.left=b.l+'px';w.style.top=b.t+'px';w.style.width=b.w+'px';w.style.height=b.h+'px';
    try{const d=JSON.parse(localStorage.getItem('jvx_v25')||'{}');d.box=b;localStorage.setItem('jvx_v25',JSON.stringify(d))}catch(_){}
    setTimeout(()=>w.classList.remove('snapfx'),200);
  }
  function caixa(w){const r=w.getBoundingClientRect();return {l:r.left,t:r.top,w:r.width,h:r.height}}
  function menu(){
    const w=win();if(!w)return setTimeout(menu,500);
    if(w.querySelector('.jx-menu'))return;
    const head=w.querySelector('.jx-head');
    const btn=document.createElement('button');
    btn.className='jx-b';btn.title='Tamanhos da janela';btn.textContent='⧉';
    head.insertBefore(btn,head.querySelector('[data-a="min"]'));
    const m=document.createElement('div');m.className='jx-menu';
    PRESETS.forEach(([nome,fn,cheia],i)=>{
      const b=document.createElement('button');b.textContent=nome;
      b.onclick=()=>{aplicarBox(w,fn(caixa(w)),cheia);m.classList.remove('on')};
      m.appendChild(b);
      if(i===0||i===6)m.appendChild(document.createElement('hr'));
    });
    const livre=document.createElement('button');
    livre.textContent='✎  Digitar largura × altura…';
    livre.onclick=()=>{
      const c=caixa(w);
      const v=prompt('Tamanho em pixels (largura x altura):',Math.round(c.w)+' x '+Math.round(c.h));
      if(!v)return;const n=v.match(/(\d+)\s*[x×,;\s]\s*(\d+)/);
      if(n)aplicarBox(w,{l:c.l,t:c.t,w:Math.max(280,+n[1]),h:Math.max(180,+n[2])});
      m.classList.remove('on');
    };
    m.appendChild(document.createElement('hr'));m.appendChild(livre);
    w.appendChild(m);
    btn.onclick=e=>{e.stopPropagation();m.classList.toggle('on')};
    w.addEventListener('click',e=>{if(!e.target.closest('.jx-menu')&&e.target!==btn)m.classList.remove('on')});
    /* encaixe automático ao soltar a janela nas bordas */
    let solto=null;
    w.addEventListener('pointerup',()=>{
      const c=caixa(w);
      if(c.t<=2&&c.l<=2&&c.w>=innerWidth-4)return;
      if(c.t<6&&c.l>6&&c.l<innerWidth-6){aplicarBox(w,{l:0,t:0,w:innerWidth,h:innerHeight},true);return}
      if(c.l<6){aplicarBox(w,{l:0,t:0,w:Math.round(innerWidth/2),h:innerHeight})}
      else if(c.l+c.w>innerWidth-6){aplicarBox(w,{l:Math.round(innerWidth/2),t:0,w:Math.round(innerWidth/2),h:innerHeight})}
      solto=null;
    });
    /* em telas pequenas, abre já em tela cheia */
    if(innerWidth<760)aplicarBox(w,{l:0,t:0,w:innerWidth,h:innerHeight},true);
  }
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',unificar);else unificar();

<script>
/* ============ v33 · JARVIS FORA DO SITE SEM LIMITE DE TAMANHO + TEMA/COR ============ */
(function(){
  var pop=null, pip=null, volta=null;
  function aviso(m){try{toast(m)}catch(_){console.log(m)}}
  function jw(){return document.getElementById('jvx')}
  function garantir(){var w=jw();if(!w){try{window.jvxAbrir()}catch(_){}w=jw()}return w}

  /* ---------- copia todo o CSS para a janela externa ---------- */
  function estilos(doc){
    [].slice.call(document.styleSheets).forEach(function(ss){
      try{
        var css=[].slice.call(ss.cssRules).map(function(r){return r.cssText}).join('\n');
        var st=doc.createElement('style');st.textContent=css;doc.head.appendChild(st);
      }catch(_){ if(ss.href){var l=doc.createElement('link');l.rel='stylesheet';l.href=ss.href;doc.head.appendChild(l)} }
    });
    var extra=doc.createElement('style');
    extra.textContent='html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#050b14}';
    doc.head.appendChild(extra);
  }

  /* ---------- devolve a janela para dentro do site ---------- */
  function devolver(w){
    w.classList.remove('solto','pip');
    if(volta&&volta.parentNode)volta.parentNode.insertBefore(w,volta);
    else document.body.appendChild(w);
    volta=null;aplicarTema();
  }

  /* ---------- JANELA REAL DO COMPUTADOR (sem limite de tamanho) ---------- */
  function abrirPopup(){
    var w=garantir();if(!w)return setTimeout(abrirPopup,300);
    if(pop&&!pop.closed){try{pop.focus()}catch(_){}return}
    /* v81: abre como ABA do navegador (sem features = nova aba) */
    pop=window.open('','jarvisModesk');
    if(!pop){aviso('O navegador bloqueou a nova aba. Libere pop-ups deste site.');return}
    try{
      pop.document.open();
      pop.document.write('<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>J.A.R.V.I.S. \u2014 MODESK</title></head><body></body></html>');
      pop.document.close();
      estilos(pop.document);
      volta=document.createComment('jvx');
      w.parentNode.insertBefore(volta,w);
      pop.document.body.appendChild(w);
      w.classList.add('on','solto');
      barraExterna(pop,w);
      setTimeout(function(){try{w.querySelector('#jx-in').focus()}catch(_){}},120);
      aplicarTema();
      pop.addEventListener('pagehide',function(){try{devolver(w)}catch(_){}pop=null});
      pop.addEventListener('beforeunload',function(){try{devolver(w)}catch(_){}pop=null});
      addEventListener('beforeunload',function(){try{pop&&pop.close()}catch(_){}});
      aviso('JARVIS aberto em janela livre do computador');
    }catch(e){try{pop.close()}catch(_){}pop=null;aviso('Nao consegui abrir a janela livre.')}
  }

  /* botoes de tamanho DENTRO da janela externa (tela cheia real, metades, etc.) */
  function barraExterna(win,w){
    var head=w.querySelector('.jx-head');if(!head)return;
    if(head.querySelector('[data-a="extmax"]'))return;
    function b(acao,txt,tit,fn){
      var el=win.document.createElement('button');
      el.className='jx-b';el.dataset.a=acao;el.textContent=txt;el.title=tit;
      el.onclick=function(e){e.stopPropagation();fn()};
      head.insertBefore(el,head.querySelector('[data-a="tema"]')||head.querySelector('[data-a="close"]'));
    }
    b('extmax','⛶','Tela cheia do computador',function(){
      try{win.moveTo(0,0);win.resizeTo(screen.availWidth,screen.availHeight)}catch(_){}
      try{win.document.documentElement.requestFullscreen&&win.document.documentElement.requestFullscreen()}catch(_){}
    });
    b('exthalf','◨','Metade da tela',function(){try{win.moveTo(Math.round(screen.availWidth/2),0);win.resizeTo(Math.round(screen.availWidth/2),screen.availHeight)}catch(_){}});
    b('extmed','❐','Tamanho medio',function(){try{win.resizeTo(Math.min(1100,screen.availWidth-60),Math.min(760,screen.availHeight-60));win.moveTo(40,40)}catch(_){}});
    b('extlivre','✎','Digitar largura × altura',function(){
      var v=win.prompt('Tamanho da janela (largura x altura):',win.outerWidth+' x '+win.outerHeight);
      if(!v)return;var n=v.match(/(\d+)\s*[x×,;\s]\s*(\d+)/);
      if(n)try{win.resizeTo(Math.max(320,+n[1]),Math.max(240,+n[2]))}catch(_){}
    });
    b('extvolta','⤓','Voltar para dentro do site',function(){try{win.close()}catch(_){}});
  }

  /* ---------- PiP (mini janela sempre visivel) continua disponivel ---------- */
  async function abrirPiP(){
    var w=garantir();if(!w)return;
    if(!(window.documentPictureInPicture&&documentPictureInPicture.requestWindow))return abrirPopup();
    try{
      pip=await documentPictureInPicture.requestWindow({width:Math.min(screen.availWidth-100,1000),height:Math.min(screen.availHeight-100,720)});
      estilos(pip.document);
      volta=document.createComment('jvx');
      w.parentNode.insertBefore(volta,w);
      pip.document.body.appendChild(w);
      w.classList.add('on','solto');aplicarTema();
      setTimeout(function(){try{w.querySelector('#jx-in').focus()}catch(_){}},120);
      pip.addEventListener('pagehide',function(){devolver(w);pip=null});
      aviso('JARVIS em janela flutuante');
    }catch(e){abrirPopup()}
  }

  function fecharFora(){try{pop&&pop.close()}catch(_){}try{pip&&pip.close()}catch(_){}}
  window.jvAbrirFora=abrirPopup;window.jvPopup=abrirPopup;window.jvPiP=abrirPopup;
  window.jvPiPMini=abrirPiP;window.jvFecharPopup=fecharFora;window.jvVoltarParaSite=fecharFora;

  /* ===================== TEMA · COR PREDOMINANTE E ESTILO ===================== */
  var TK='jvx_tema_v33';
  var CORES=['#56c8ff','#00e5a0','#7c5cff','#ff4d6d','#ffb02e','#ff6a00','#00d1d1','#b9c4d0','#ff2bd1','#7dff4d'];
  var ESTILOS={
    stark:{nome:'Stark (padrao)',sat:1,bri:1,con:1,glow:1},
    neon:{nome:'Neon intenso',sat:1.45,bri:1.12,con:1.08,glow:1.6},
    suave:{nome:'Suave / discreto',sat:.65,bri:.98,con:.96,glow:.5},
    grafite:{nome:'Grafite (sem cor)',sat:0,bri:1.05,con:1.05,glow:.6},
    contraste:{nome:'Alto contraste',sat:1.15,bri:1.08,con:1.3,glow:1}
  };
  var T={cor:'#56c8ff',estilo:'stark',brilho:100};
  try{var d=JSON.parse(localStorage.getItem(TK)||'{}');if(d.cor)T=Object.assign(T,d)}catch(_){}

  function hue(hex){
    var r=parseInt(hex.substr(1,2),16)/255,g=parseInt(hex.substr(3,2),16)/255,b=parseInt(hex.substr(5,2),16)/255;
    var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0;
    if(mx!==mn){var dd=mx-mn;
      if(mx===r)h=((g-b)/dd)%6;else if(mx===g)h=(b-r)/dd+2;else h=(r-g)/dd+4;h*=60;if(h<0)h+=360}
    return h;
  }
  function aplicarTema(){
    var w=jw();if(!w)return;
    var e=ESTILOS[T.estilo]||ESTILOS.stark;
    var giro=Math.round(hue(T.cor)-199);
    var br=(e.bri*(T.brilho/100)).toFixed(2);
    w.style.filter='hue-rotate('+giro+'deg) saturate('+e.sat+') brightness('+br+') contrast('+e.con+')';
    w.style.setProperty('--jx-glow',e.glow);
    try{localStorage.setItem(TK,JSON.stringify(T))}catch(_){}
    var orb=document.getElementById('jv-orb');
    if(orb)orb.style.filter='hue-rotate('+giro+'deg) saturate('+e.sat+')';
  }
  window.jvTema=aplicarTema;

  function painelTema(){
    var w=jw();if(!w)return setTimeout(painelTema,600);
    var head=w.querySelector('.jx-head');if(!head)return;
    if(w.querySelector('.jx-tema')){aplicarTema();return}
    var btn=document.createElement('button');
    btn.className='jx-b';btn.dataset.a='tema';btn.textContent='🎨';btn.title='Cor e estilo do JARVIS';
    head.insertBefore(btn,head.querySelector('[data-a="close"]'));
    var p=document.createElement('div');p.className='jx-tema';
    p.innerHTML='<h4>COR PREDOMINANTE</h4><div class="cores"></div>'
      +'<input type="color" id="jxt-cor" value="'+T.cor+'"/>'
      +'<h4>ESTILO</h4><select id="jxt-est"></select>'
      +'<h4>BRILHO</h4><input type="range" id="jxt-bri" min="70" max="130" value="'+T.brilho+'"/>'
      +'<div class="lin"><button id="jxt-reset">Padrao</button><button id="jxt-ok">Fechar</button></div>';
    w.appendChild(p);
    var cx=p.querySelector('.cores');
    CORES.forEach(function(c){
      var b=document.createElement('b');b.style.background=c;if(c===T.cor)b.className='sel';
      b.onclick=function(){T.cor=c;p.querySelector('#jxt-cor').value=c;
        [].slice.call(cx.children).forEach(function(x){x.className=''});b.className='sel';aplicarTema()};
      cx.appendChild(b);
    });
    var sel=p.querySelector('#jxt-est');
    Object.keys(ESTILOS).forEach(function(k){
      var o=document.createElement('option');o.value=k;o.textContent=ESTILOS[k].nome;if(k===T.estilo)o.selected=true;sel.appendChild(o);
    });
    sel.onchange=function(){T.estilo=sel.value;aplicarTema()};
    p.querySelector('#jxt-cor').oninput=function(e){T.cor=e.target.value;aplicarTema()};
    p.querySelector('#jxt-bri').oninput=function(e){T.brilho=+e.target.value;aplicarTema()};
    p.querySelector('#jxt-reset').onclick=function(){T={cor:'#56c8ff',estilo:'stark',brilho:100};
      p.querySelector('#jxt-cor').value=T.cor;sel.value='stark';p.querySelector('#jxt-bri').value=100;aplicarTema()};
    p.querySelector('#jxt-ok').onclick=function(){p.classList.remove('on')};
    btn.onclick=function(e){e.stopPropagation();p.classList.toggle('on')};
    w.addEventListener('click',function(e){if(!e.target.closest('.jx-tema')&&e.target!==btn)p.classList.remove('on')});
    aplicarTema();
  }

  /* ---------- botao "fora do site" refeito ---------- */
  function instalar33(){
    var w=jw();if(!w)return setTimeout(instalar33,600);
    var head=w.querySelector('.jx-head');if(!head)return;
    var antigo=head.querySelector('[data-a="pip"]');
    if(antigo){antigo.title='Abrir em janela livre do computador (Ctrl+Shift+J)';antigo.onclick=function(e){e.stopPropagation();abrirPopup()}}
    else{
      var b=document.createElement('button');b.className='jx-b';b.dataset.a='pip';b.textContent='\u29e8';
      b.title='Abrir em janela livre do computador (Ctrl+Shift+J)';
      b.onclick=function(e){e.stopPropagation();abrirPopup()};
      head.insertBefore(b,head.querySelector('[data-a="tema"]')||head.querySelector('[data-a="close"]'));
    }
    painelTema();
    var orb=document.getElementById('jv-orb');
    if(orb)orb.oncontextmenu=function(e){e.preventDefault();abrirPopup()};
  }
  addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&k==='j'){e.preventDefault();(pop&&!pop.closed)?fecharFora():abrirPopup()}
  },true);
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',instalar33);else instalar33();
  setInterval(instalar33,2500);
})();
</script>

<script>

(function(){
  function pronto(){
    var aside=document.querySelector('.app aside'), menu=document.getElementById('menu');

    document.body.classList.add('app-on');

      var tabs=document.createElement('div');tabs.className='sb-tabs';
      tabs.innerHTML='<button data-t="menu" class="act">'+icon('boxes')+'Menu</button>'
                    +'<button data-t="ui">'+icon('monitor')+'Interface</button>';

      var ui=document.createElement('div');ui.id='sb-ui';
      menu.parentNode.insertBefore(ui,menu.nextSibling);
      tabs.querySelectorAll('button').forEach(function(b){
        b.onclick=function(){
          tabs.querySelectorAll('button').forEach(function(x){x.classList.remove('act')});
          b.classList.add('act');

    }

      if(!url)return{ok:false,erro:'link nao encontrado'};
      if(!/^https?:\/\//i.test(url))url='https://'+url;
      window.open(url,'_blank','noopener');
      return {ok:true,aberto:url};
    }
  }catch(e){return{ok:false,erro:String(e.message||e)}}
  return {ok:false,erro:'ferramenta desconhecida'};
}

/* ---------- chamada base ---------- */
async function chamar(model,body){
  const mods=((body||{}).generationConfig||{}).responseModalities||[];
  if(mods.some(m=>/IMAGE|AUDIO/i.test(m)))throw new Error('Este recurso nao esta disponivel na configuracao atual da Groq.');
  let sys=''; try{sys=(((body.systemInstruction||{}).parts||[])[0]||{}).text||''}catch(e){}
  const txt=await iaChat(sys||sistema(),iaDeContents((body||{}).contents||[]));
  return {candidates:[{content:{parts:[{text:txt}]}}]};
}
function _modeloMorto(msg,st){return st===404||/no longer available|not found|NOT_FOUND|is not supported|nao esta disponivel/i.test(String(msg||''))}
async function chamarAlt(models,body){
  let ultimo;
  for(const m of models){
    try{ return await chamar(m,body) }
    catch(e){ ultimo=e; if(!_modeloMorto(e.message))throw e }
  }
  throw ultimo||new Error('nenhum modelo disponivel');
}
async function stream(model,body,onChunk){
  let sys=''; try{sys=(((body.systemInstruction||{}).parts||[])[0]||{}).text||''}catch(e){}
  const msgs=iaDeContents((body||{}).contents||[]);
  const tools=iaFerramentas(body);
  const partes=[];
  const r=await iaRaw(sys||sistema(),msgs,{tools,onChunk:tools?null:(d=>{const p={text:d};partes.push(p);onChunk&&onChunk(p)})});
  if(tools&&r.text){const p={text:r.text};partes.push(p);onChunk&&onChunk(p)}
  (r.tools||[]).forEach(t=>{if(t&&t.name)partes.push({functionCall:{name:t.name,args:t.args||{}}})});
  return {partes,grounding:null};
}

/* ---------- conversa ---------- */
let anexos=[];
function ferramentas(){
  const t=[];
  if(D.cfg.ferramentas)t.push({function_declarations:FUNCS});
  return t.length?t:undefined;
}
function historico(){
  const t=th();const out=[];
  t.msgs.filter(m=>m.role==='user'||m.role==='model').slice(-6).forEach(m=>{
    const parts=[];
    if(m.text)parts.push({text:m.text});
    (m.anexos||[]).forEach(a=>{
      if(a.uri)parts.push({fileData:{mimeType:a.mime,fileUri:a.uri}});
      else if(a.b64)parts.push({inlineData:{mimeType:a.mime,data:a.b64}});
      else if(a.texto)parts.push({text:'[Arquivo '+a.nome+']\n'+a.texto});
    });
    if(parts.length)out.push({role:m.role,parts});
  });
  return out;
}
async function enviar(texto){
  const t=th();
  if(!texto&&!anexos.length)return;
  t.msgs.push({role:'user',text:texto,anexos:anexos.slice(),em:Date.now()});
  if(t.nome==='Nova conversa'&&texto)t.nome=texto.slice(0,32);
  anexos=[];pintarChips();
  const alvo={role:'model',text:'',pensando:'',imgs:[],fontes:[],em:Date.now()};
  t.msgs.push(alvo);pintar();gravar();
  const body={systemInstruction:{parts:[{text:sistema()}]},contents:historico(),
    tools:ferramentas(),generationConfig:{temperature:.7,maxOutputTokens:8192}};
  try{
    for(let volta=0;volta<4;volta++){
      const chamadas=[];
      const {partes,grounding}=await stream(D.cfg.model,body,p=>{
        if(p.thought&&p.text){alvo.pensando+=p.text}
        else if(p.text){alvo.text+=p.text}
        else if(p.inlineData&&/image/.test(p.inlineData.mimeType||''))alvo.imgs.push('data:'+p.inlineData.mimeType+';base64,'+p.inlineData.data);
        else if(p.executableCode)alvo.text+='\n```'+(p.executableCode.language||'python').toLowerCase()+'\n'+p.executableCode.code+'\n```\n';
        else if(p.codeExecutionResult)alvo.text+='\n> saida: '+(p.codeExecutionResult.output||'')+'\n';
        pintar(true);
      });
      const partesFn=partes.filter(p=>p.functionCall);
      partesFn.forEach(p=>chamadas.push(p.functionCall));
      if(grounding){
        const gs=(grounding.groundingChunks||[]).map(c=>c.web&&({t:c.web.title,u:c.web.uri})).filter(Boolean);
        alvo.fontes=gs.slice(0,8);
      }
      if(!chamadas.length)break;
      body.contents.push({role:'model',parts:partesFn});
      const respostas=[];
      for(const c of chamadas){
        let r;
        try{ r=await exec(c.name,c.args) }catch(er){ r={ok:false,erro:String(er.message||er)} }
        alvo.text+='\n· '+c.name+' executado\n';
        respostas.push({functionResponse:{name:c.name,response:{result:r}}});
      }
      body.contents.push({role:'user',parts:respostas});
      pintar(true);
    }
    if(!alvo.text&&!alvo.imgs.length)alvo.text='(sem resposta do modelo)';
    if(D.cfg.falar&&alvo.text)falar(alvo.text.slice(0,900));
  }catch(e){alvo.text=(alvo.text||'')+'\n⚠ '+e.message}
  alvo.fim=true;pintar();gravar();
}

let rec=null;
function falar(texto){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(texto);u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){aviso('Voz indisponivel neste navegador.')}}
function ditar(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)throw new Error('Ditado por voz nao suportado neste navegador.');
  if(rec){try{rec.stop()}catch(e){}rec=null;return}
  rec=new SR();rec.lang='pt-BR';rec.interimResults=false;
  const b=document.getElementById('jn-mic');if(b)b.textContent='⏹ parar';
  rec.onresult=e=>{const txt=e.results[0][0].transcript;const el=document.getElementById('jn-in');el.value=(el.value?el.value+' ':'')+txt;el.focus()};
  rec.onend=()=>{rec=null;if(b)b.textContent='🎙 falar'};rec.onerror=e=>aviso('Voz: '+(e.error||'erro'));rec.start();
}

/* ---------- anexos ---------- */
const TEXTO=/^(text\/|application\/(json|xml|csv|javascript|x-)|$)/;
function ler(f){
  if(f.size>18*1024*1024)throw new Error('Arquivo maior que 18 MB. Reduza o tamanho antes de anexar.');
  return new Promise((res,rej)=>{
    const bin=/^(image|audio|video)\//.test(f.type)||f.type==='application/pdf';
    const r=new FileReader();
    r.onerror=()=>rej(new Error('Falha ao ler '+f.name));
    if(bin){r.onload=()=>res({nome:f.name,mime:f.type,b64:String(r.result).split(',')[1]});r.readAsDataURL(f)}
    else{r.onload=()=>res({nome:f.name,mime:f.type||'text/plain',texto:String(r.result).slice(0,150000)});r.readAsText(f)}
  });
}
async function anexar(lista){for(const f of lista){try{anexos.push(await ler(f))}catch(e){aviso(e.message)}}pintarChips()}

<script>
/* ===================== ALERTAS LOCAIS DO MODESK ===================== */
(function(){
'use strict';
var LSA='modesk.v54.alertados', LSC='modesk.v54.cfg';
function ler(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function grava(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function cfg(){var c=ler(LSC,{});c.antes=(c.antes==null?5:c.antes);c.popup=(c.popup!==false);c.som=(c.som!==false);return c}
function salvarCfg(c){grava(LSC,c)}
function aviso(m){try{if(typeof toast==='function')return toast(m)}catch(e){}console.log('[MODESK]',m)}
function S(){try{if(typeof state!=='undefined'&&state)return state}catch(e){}return window.state||{}}
/* ---------------- alertas de desktop ---------------- */
function alertados(){return ler(LSA,{})}
function marcarAlertado(id){var a=alertados();a[id]=Date.now();
  var lim=Date.now()-7*864e5;Object.keys(a).forEach(function(k){if(a[k]<lim)delete a[k]});grava(LSA,a)}
function quando(data,hora){
  if(!data)return 0;
  var d=String(data).slice(0,10), h=String(hora||'').match(/(\d{1,2}):(\d{2})/);
  var t=new Date(d+'T'+(h?(('0'+h[1]).slice(-2)+':'+h[2]):'00:00')+':00');
  return isNaN(t)?0:t.getTime();
}
function compromissos(){
  var out=[],St=S();
  (St.eventos||[]).forEach(function(e){var ms=quando(e.data,e.hora);if(ms)out.push({id:'e:'+(e.id||e.titulo+e.data+e.hora),titulo:e.titulo||'Evento',ms:ms,local:e.local||'',info:e.info||'',fonte:'Agenda MODESK'})});
  (St.atividades||[]).forEach(function(a){if(a.feito)return;var ms=quando(a.prazo,a.hora);if(ms&&a.hora)out.push({id:'a:'+(a.id||a.titulo+a.prazo),titulo:a.titulo||'Atividade',ms:ms,local:'',info:(a.prioridade||'')+' '+(a.obs||''),fonte:'Atividades'})});
  (St.pedidos||[]).forEach(function(p){var ms=quando(p.prazo,'08:00');if(ms&&!/entreg|conclu|cancel/i.test(p.status||''))out.push({id:'p:'+(p.id||p.numero),titulo:'Pedido '+(p.numero||'')+' vence hoje',ms:ms,local:p.fornecedor||'',info:p.obs||'',fonte:'Pedidos'})});
  return out.sort(function(a,b){return a.ms-b.ms});
}
function beep(){

  try{var C=window.AudioContext||window.webkitAudioContext;var c=new C();
    [0,0.35,0.7].forEach(function(t){var o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=880;
      o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(0.0001,c.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25,c.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t+0.25);

  function linha(r){
    return [r.nome||r.maquina||'(sem nome)', r.setor?('· '+r.setor):'', r.andar?('· '+r.andar):'',
            r.pat?('· pat '+r.pat):'', r.maquina&&r.maquina!==r.nome?('· '+r.maquina):'',
            r.anydesk?('· AnyDesk '+r.anydesk):'', r.ip?('· VNC/IP '+r.ip):''].filter(Boolean).join(' ');
  }
  function texto(termo){
    var r = buscar(termo);
    if(!r.length) return 'Nao encontrei "'+termo+'" no mapeamento da unidade.';
    return r.map(linha).join('\n') + '\nSenha padrao de acesso AnyDesk nas estacoes: ' + SENHA_ANYDESK;
  }
  window.MDK_PC = {buscar:buscar, texto:texto, senha:SENHA_ANYDESK, base:base};

  /* ---- 2) busca rapida dentro da janela do JARVIS (funciona sem internet/chave) ---- */
  function cartao(r){
    var d = document.createElement('div');
    d.className = 'mdk-pc';
    d.innerHTML = '<b>'+(r.nome||r.maquina||'(sem nome)')+'</b>'
      + (r.setor?' — '+r.setor:'') + (r.andar?' · '+r.andar:'')
      + '<div style="opacity:.85;margin-top:3px">'
      + (r.maquina?('Maquina: '+r.maquina+'<br>'):'')
      + (r.pat?('Patrimonio: '+r.pat+'<br>'):'')
      + (r.anydesk?('AnyDesk: '+r.anydesk+'<br>'):'')
      + (r.ip?('VNC/IP: '+r.ip+'<br>'):'')
      + 'Senha: '+SENHA_ANYDESK
      + '</div><div class="l"></div>';
    var l = d.querySelector('.l');
    if(r.anydesk){
      var a = document.createElement('a'); a.href='anydesk:'+r.anydesk; a.textContent='▶ Abrir AnyDesk'; l.appendChild(a);
      var b1 = document.createElement('button'); b1.textContent='⧉ Copiar ID';
      b1.onclick=function(){ navigator.clipboard.writeText(r.anydesk) }; l.appendChild(b1);
    }
    if(r.ip){
      var b3 = document.createElement('button'); b3.textContent='⧉ Copiar IP';
      b3.onclick=function(){ navigator.clipboard.writeText(r.ip) }; l.appendChild(b3);
    }
    var b2 = document.createElement('button'); b2.textContent='⧉ Copiar senha';
    b2.onclick=function(){ navigator.clipboard.writeText(SENHA_ANYDESK) }; l.appendChild(b2);
    return d;
  }
  function mostrar(termo){
    var res = document.getElementById('mdk-pcres');
    if(!res) return;
    res.innerHTML='';
    var r = buscar(termo);
    if(!termo.trim()) return;
    if(!r.length){ res.innerHTML='<div class="mdk-pc">Nada encontrado para "'+termo+'".</div>'; return }
    r.forEach(function(x){ res.appendChild(cartao(x)) });
  }
  function montarBarra(){
    var pane = document.getElementById('jn-p-chat');
    if(!pane || document.getElementById('mdk-pcbar')) return;
    var bar = document.createElement('div');
    bar.id='mdk-pcbar';
    bar.innerHTML='<input id="mdk-pcq" placeholder="🔎 Buscar pessoa, setor, patrimonio, IP ou AnyDesk no site"/>';
    var res = document.createElement('div'); res.id='mdk-pcres';
    pane.parentNode.insertBefore(bar, pane);
    pane.parentNode.insertBefore(res, pane);
    var inp = document.getElementById('mdk-pcq');
    var t=0;
    inp.oninput=function(){ clearTimeout(t); var v=inp.value; t=setTimeout(function(){ mostrar(v) },250) };
  }
  setInterval(montarBarra, 1200);
  montarBarra();

  /* ---- 3) comando de voz / texto respondido na hora, mesmo sem a API ---- */
  var VOZ = /(anydesk|acesso remoto|vnc|ip)\b/i;
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' || e.shiftKey) return;
    var ta = e.target;
    if(!ta || ta.id!=='jn-in') return;
    var txt = String(ta.value||'');
    if(!VOZ.test(txt)) return;
    var r = buscar(txt.replace(/(qual|o|a|do|da|de|id|link|anydesk|acesso|remoto|ip|vnc|computador|pc|me|da|passa|abrir|abre|por favor|jarvis)\b/gi,' '));
    if(!r.length) return;
    mostrar(r[0].nome || r[0].maquina || txt);
    var q = document.getElementById('mdk-pcq'); if(q) q.value = r[0].nome || r[0].maquina || '';
  }, true);

  console.log('[MODESK v59] JARVIS consulta o mapeamento do site · busca rapida de AnyDesk · layout limpo');
})();
</script>
<script>
/* ============ MODESK v60 · Rede editavel (varredura + perifericos) + import por lista/JARVIS ============ */
(function(){
  'use strict';
  var LSK_SCAN='modesk.rede.scan.v60', LSK_PERIF='modesk.rede.perif.v60';
  function A(){ try{ return REDE_DATA }catch(e){ return [] } }
  function P(){ try{ return REDE_PERIF }catch(e){ return [] } }
  function say(m){ try{ toast(m) }catch(e){ console.log(m) } }
  function E(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

  /* ---------- persistencia ---------- */
  function guardar(){
    try{
      localStorage.setItem(LSK_SCAN, JSON.stringify(A()));
      localStorage.setItem(LSK_PERIF, JSON.stringify(P()));
    }catch(e){ say('Nao foi possivel salvar (armazenamento cheio)') }
    refazer();
  }
  function carregar(){
    try{
      var s=JSON.parse(localStorage.getItem(LSK_SCAN)||'null');
      if(Array.isArray(s)&&s.length) A().splice.apply(A(),[0,A().length].concat(s));
      var p=JSON.parse(localStorage.getItem(LSK_PERIF)||'null');
      if(Array.isArray(p)&&p.length) P().splice.apply(P(),[0,P().length].concat(p));
    }catch(e){}
    refazer(1);
  }
  /* recalcula a planilha unica (inventario + varredura) sem trocar a referencia do array */
  function refazer(quieto){
    try{
      var nova=mpAmalgamar(PCS_PLANILHA, A());
      PCS_UNIDADE.splice.apply(PCS_UNIDADE,[0,PCS_UNIDADE.length].concat(nova));
    }catch(e){}
    if(!quieto){ try{ render() }catch(e){} }
  }

  /* ---------- normalizacao de linhas ---------- */
  var reIP=/^\d{1,3}(\.\d{1,3}){3}$/, reMAC=/^[0-9A-Za-z]{2}([:-][0-9A-Za-z]{2}){5}$/, reANY=/^\d{8,12}$/;
  function colunas(l){
    if(l.indexOf('\t')>=0) return l.split('\t');
    if(l.indexOf(';')>=0) return l.split(';');
    if(/\s{2,}/.test(l)) return l.split(/\s{2,}/);
    if(l.indexOf(',')>=0) return l.split(',');
    return l.split(/\s+/);
  }
  function limpar(v){ return String(v==null?'':v).replace(/^"|"$/g,'').trim() }
  var reTipoPerif=/^(impressora|telefone|tel\b|ar cond|ar-cond|nobreak|catraca|celular|switch|roteador|camera|relogio|perif)/i;

  function linhaScan(cols){
    var c=cols.map(limpar), ip='', mac='', any='', resto=[];
    c.forEach(function(v){
      if(!ip&&reIP.test(v)) ip=v;
      else if(!mac&&reMAC.test(v)) mac=v.toUpperCase().replace(/-/g,':');
      else if(!any&&reANY.test(v)) any=v;
      else resto.push(v);
    });
    var andar=resto[0]||'', nome=resto[1]||'', dono=resto[2]||'', oper=resto[3]||'';
    if(resto.length===2){ andar=''; nome=resto[0]; dono=resto[1] }
    if(resto.length===1){ andar=''; nome=resto[0] }
    return [andar,nome,ip||'-',mac,dono,oper,any];
  }
  function linhaPerif(cols){
    var c=cols.map(limpar), ip='', mac='', tipo='', resto=[];
    c.forEach(function(v){
      if(!ip&&reIP.test(v)) ip=v;
      else if(!mac&&reMAC.test(v)) mac=v.toUpperCase().replace(/-/g,':');
      else if(!tipo&&reTipoPerif.test(v)) tipo=v;
      else resto.push(v);
    });
    return [tipo||resto.shift()||'Periferico', ip, mac, resto.join(' ')];
  }
  function parse(txt,tipo){
    var out=[];
    String(txt||'').split(/\r?\n/).forEach(function(l){
      if(!l.trim()) return;
      if(/^(andar|tipo|nome|ip|mac|status)\b/i.test(l.trim()) && !reIP.test(limpar(colunas(l)[1]||''))) return;
      var cols=colunas(l); if(cols.length<2) return;
      out.push(tipo==='perif'?linhaPerif(cols):linhaScan(cols));
    });
    return out;
  }
  function chave(r,tipo){
    var mac=(tipo==='perif'?r[2]:r[3])||'', ip=(tipo==='perif'?r[1]:r[2])||'';
    return (String(mac).toUpperCase().replace(/[^0-9A-F]/g,'')||String(ip));
  }
  function aplicar(linhas,tipo,modo){
    var alvo = tipo==='perif'?P():A(), add=0, upd=0;
    if(modo==='substituir'){ alvo.splice.apply(alvo,[0,alvo.length].concat(linhas)); add=linhas.length }
    else{
      linhas.forEach(function(r){
        var k=chave(r,tipo), i=-1;
        if(k) for(var j=0;j<alvo.length;j++){ if(chave(alvo[j],tipo)===k){ i=j; break } }
        if(i>=0){ alvo[i]=r; upd++ } else { alvo.push(r); add++ }
      });
    }
    guardar();
    return {add:add,upd:upd};
  }
  function detectarTipo(txt){
    var l=String(txt||'').split(/\r?\n/).filter(function(x){return x.trim()});
    var p=l.filter(function(x){ return reTipoPerif.test(limpar(colunas(x)[0]||'')) }).length;
    return (p>=Math.max(1,l.length*0.6))?'perif':'scan';
  }

  /* ---------- painel de edicao ---------- */
  var CAB={scan:['Andar','Nome do dispositivo','IP','MAC','Setor / Dono','Operador','AnyDesk'],
           perif:['Tipo','IP','MAC','Descricao / Local']};
  function tabela(tipo){
    var d=tipo==='perif'?P():A(), c=CAB[tipo];
    return '<div style="overflow:auto;max-height:420px"><table><thead><tr>'
      + c.map(function(h){return '<th>'+E(h)+'</th>'}).join('')
      + '<th style="width:60px">—</th></tr></thead><tbody>'
      + d.map(function(r,i){
          return '<tr>'+c.map(function(_,j){
            return '<td><input data-ed="'+tipo+'" data-i="'+i+'" data-j="'+j+'" class="mono" style="min-width:96px" value="'+E(r[j]||'')+'"/></td>';
          }).join('')
          + '<td><button class="btn sm danger" onclick="mdkRedeExcluir(\''+tipo+'\','+i+')" title="Remover linha">✕</button></td></tr>';
        }).join('')
      + '</tbody></table></div>';
  }
  function painel(){
    return '<div class="card" style="margin-top:16px"><h3>✏️ Editar dados da rede (varredura e perifericos)</h3>'
     + '<div class="hint">Altere qualquer campo direto na tabela e clique em <b>Salvar</b>. Tudo fica guardado neste navegador '
     + 'e a planilha unica e recalculada automaticamente. O caminho <span class="mono">'
     + E((function(){try{return MP_PATH_SCANNER}catch(e){return ''}})()) + '</span> continua sendo a origem da varredura.</div>'
     + '<div class="row" style="gap:8px;flex-wrap:wrap;margin:12px 0">'
     + '<button class="btn primary" onclick="mdkRedeSalvar()">💾 Salvar edicoes</button>'
     + '<button class="btn" onclick="mdkRedeAdd(\'scan\')">＋ Novo computador/dispositivo</button>'
     + '<button class="btn" onclick="mdkRedeAdd(\'perif\')">＋ Nova impressora/periferico/telefonia</button>'
     + '<button class="btn" onclick="mdkRedeImportar()">📋 Colar nova lista</button>'
     + '<button class="btn warn" onclick="mdkRedeRestaurar()">↺ Restaurar lista original</button>'
     + '</div>'
     + '<h4 style="margin:10px 0 6px">Varredura Advanced IP Scanner v2 — '+A().length+' registros</h4>'
     + tabela('scan')
     + '<h4 style="margin:16px 0 6px">Impressoras, perifericos e telefonia — '+P().length+' registros</h4>'
     + tabela('perif')
     + '<div id="mdk-imp" class="card" style="margin-top:14px;display:none">'
     + '<label>Cole a lista (uma linha por equipamento; colunas separadas por tabulacao, ; ou virgula)</label>'
     + '<textarea id="mdk-imp-t" rows="7" class="mono" placeholder="0 TERREO&#9;REF033694CAF1PC&#9;10.18.1.18&#9;D0:94:66:B2:33:4C&#9;Cafe&#9;Caixa&#9;1182931073"></textarea>'
     + '<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">'
     + '<select id="mdk-imp-tipo"><option value="auto">Detectar automaticamente</option><option value="scan">Computadores / varredura</option><option value="perif">Impressoras, perifericos e telefonia</option></select>'
     + '<select id="mdk-imp-modo"><option value="mesclar">Mesclar (atualiza por MAC/IP e adiciona novos)</option><option value="substituir">Substituir a lista inteira</option></select>'
     + '<button class="btn primary" onclick="mdkRedeImportarOk()">Aplicar lista</button>'
     + '<button class="btn" onclick="document.getElementById(\'mdk-imp\').style.display=\'none\'">Cancelar</button>'
     + '</div></div></div>';
  }

  window.mdkRedeSalvar=function(){
    document.querySelectorAll('[data-ed]').forEach(function(el){
      var t=el.getAttribute('data-ed'), i=+el.getAttribute('data-i'), j=+el.getAttribute('data-j');
      var d=t==='perif'?P():A(); if(d[i]) d[i][j]=el.value.trim();
    });
    guardar(); say('Edicoes salvas');
  };
  window.mdkRedeExcluir=function(t,i){
    if(!confirm('Remover este registro da lista?')) return;
    var d=t==='perif'?P():A(); d.splice(i,1); guardar(); say('Registro removido');
  };
  window.mdkRedeAdd=function(t){
    window.mdkRedeSalvar();
    var d=t==='perif'?P():A();
    d.push(t==='perif'?['Impressora','','','']:['','','','','','','']);
    guardar(); say('Linha criada — preencha e salve');
  };
  window.mdkRedeImportar=function(){ var b=document.getElementById('mdk-imp'); if(b){ b.style.display='block'; b.scrollIntoView({behavior:'smooth',block:'center'}) } };
  window.mdkRedeImportarOk=function(){
    var t=(document.getElementById('mdk-imp-t')||{}).value||'';
    if(!t.trim()) return say('Cole a lista primeiro');
    var tipo=(document.getElementById('mdk-imp-tipo')||{}).value||'auto';
    var modo=(document.getElementById('mdk-imp-modo')||{}).value||'mesclar';
    if(tipo==='auto') tipo=detectarTipo(t);
    var linhas=parse(t,tipo);
    if(!linhas.length) return say('Nao entendi nenhuma linha da lista');
    var r=aplicar(linhas,tipo,modo);
    say('Lista aplicada: '+r.add+' novos · '+r.upd+' atualizados');
  };
  window.mdkRedeRestaurar=function(){
    if(!confirm('Restaurar as listas originais e apagar suas edicoes?')) return;
    try{ localStorage.removeItem(LSK_SCAN); localStorage.removeItem(LSK_PERIF) }catch(e){}
    say('Listas originais serao recarregadas'); setTimeout(function(){ location.reload() },600);
  };
  window.MDK_REDE={aplicar:aplicar,parse:parse,detectar:detectarTipo,salvar:guardar};

  /* injeta o painel no bloco de rede da tela de mapeamento */
  var _bloco = window.blocoRede;
  window.blocoRede = function(){
    var base=''; try{ base=_bloco?_bloco():'' }catch(e){}
    return base + painel();
  };

  /* ---------- JARVIS: "atualize a lista" com a lista colada ---------- */
  var GAT=/(atualiz\w*|nova|substitu\w*|corrig\w*|import\w*)[^\n]{0,40}(lista|varredura|scanner|impressor|perifer|telefon|equipament)/i;
  function tratarTexto(txt){
    if(!GAT.test(txt)) return null;
    var linhas=String(txt).split(/\r?\n/);
    var corpo=linhas.filter(function(l){ return reIP.test(limpar(colunas(l)[0]||''))||colunas(l).some(function(c){return reIP.test(limpar(c))||reMAC.test(limpar(c))}) });
    if(corpo.length<1) return null;
    var texto=corpo.join('\n');
    var tipo=/impressor|perifer|telefon|ar cond/i.test(txt)?'perif':detectarTipo(texto);
    var modo=/substitu/i.test(txt)?'substituir':'mesclar';
    var r=aplicar(parse(texto,tipo),tipo,modo);
    return 'Lista de '+(tipo==='perif'?'impressoras/perifericos/telefonia':'computadores da varredura')+' atualizada: '
      + r.add+' novos e '+r.upd+' atualizados ('+modo+').';
  }
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter'||e.shiftKey) return;
    var ta=e.target; if(!ta||ta.id!=='jn-in') return;
    var res=tratarTexto(String(ta.value||''));
    if(!res) return;
    e.preventDefault(); e.stopPropagation();
    ta.value=''; say(res);
    try{ alert('J.A.R.V.I.S.: '+res) }catch(_){}
  }, true);

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',carregar); else carregar();
  console.log('[MODESK v60] rede editavel: editar/adicionar/remover + importar lista pelo painel ou pelo JARVIS');
})();
</script>

<script>
/* ============ MODESK v61 · Edicao direta na lista de Impressoras, perifericos e telefonia ============ */
(function(){
  'use strict';
  var LSK_PERIF='modesk.rede.perif.v60';
  function P(){ try{ return REDE_PERIF }catch(e){ return [] } }
  function say(m){ try{ toast(m) }catch(e){ console.log(m) } }
  function E(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
  function persistir(){ try{ localStorage.setItem(LSK_PERIF, JSON.stringify(P())) }catch(e){ say('Nao foi possivel salvar (armazenamento cheio)') } }

  /* le os campos da lista principal para o array */
  function colher(){
    document.querySelectorAll('[data-pf]').forEach(function(el){
      var i=+el.getAttribute('data-i'), j=+el.getAttribute('data-j');
      if(P()[i]) P()[i][j]=String(el.value||'').trim();
    });
  }
  window.mdkPerifSalvar=function(recarregar){
    colher(); persistir(); say('Lista de impressoras/perifericos salva');
    if(recarregar!==false){ try{ render() }catch(e){} }
  };
  window.mdkPerifAdd=function(){
    colher(); P().push(['Impressora','','','']); persistir();
    try{ render() }catch(e){} say('Nova linha criada — preencha e salve');
  };
  window.mdkPerifRemover=function(i){
    if(!confirm('Remover este equipamento da lista?')) return;
    colher(); P().splice(i,1); persistir();
    try{ render() }catch(e){} say('Equipamento removido');
  };
  window.mdkPerifCSV=function(){
    colher();
    var cab=['Tipo','IP','MAC','Descricao / Local'];
    var linhas=P().map(function(r){ return r.map(function(v){ return '"'+String(v||'').replace(/"/g,'""')+'"' }).join(';') });
    try{ dl(new Blob(['\ufeff'+cab.join(';')+'\n'+linhas.join('\n')],{type:'text/csv;charset=utf-8'}),'impressoras-perifericos-telefonia.csv') }catch(e){}
  };
  window.mdkPerifColar=function(){
    var b=document.getElementById('mdk-imp');
    if(b){ b.style.display='block';
      var s=document.getElementById('mdk-imp-tipo'); if(s) s.value='perif';
      b.scrollIntoView({behavior:'smooth',block:'center'});
      var t=document.getElementById('mdk-imp-t'); if(t) t.focus();
    } else say('Painel de importacao indisponivel');
  };

  /* auto-salva ao sair do campo, sem redesenhar a tela */
  document.addEventListener('change', function(e){
    var el=e.target; if(!el||!el.getAttribute||!el.getAttribute('data-pf')) return;
    var i=+el.getAttribute('data-i'), j=+el.getAttribute('data-j');
    if(P()[i]){ P()[i][j]=String(el.value||'').trim(); persistir(); say('Alteracao salva'); }
  }, true);

  function cartaoPerif(){
    var d=P();
    var linhas=d.map(function(p,i){
      var campos=[0,1,2,3].map(function(j){
        return '<td><input data-pf="1" data-i="'+i+'" data-j="'+j+'" class="mono" style="min-width:'+(j===3?'220px':'110px')+'" value="'+E(p[j]||'')+'"/></td>';
      }).join('');
      return '<tr>'+campos
        + '<td><div class="row" style="gap:6px;flex-wrap:wrap">'
        + '<button class="btn sm primary" title="Abrir painel do IP dentro do MODESK" onclick="mpAbrirIP(String(REDE_PERIF['+i+'][1]||\'\'),String(REDE_PERIF['+i+'][3]||\'\'))">🌐</button>'
        + '<button class="btn sm" title="Abrir em nova aba" onclick="mpAbrirIP(String(REDE_PERIF['+i+'][1]||\'\'),String(REDE_PERIF['+i+'][3]||\'\'),1)">↗</button>'
        + '<button class="btn sm" title="Copiar IP" onclick="mpCopiar(String(REDE_PERIF['+i+'][1]||\'\'),\'IP copiado\')">⧉</button>'
        + '<button class="btn sm danger" title="Remover equipamento" onclick="mdkPerifRemover('+i+')">✕</button>'
        + '</div></td></tr>';
    }).join('');
    return '<div class="card" style="margin-top:16px"><h3>🖨️ Impressoras, perifericos e telefonia — '+d.length+' registros</h3>'
      + '<div class="hint">Edite <b>direto na lista</b>: altere qualquer campo e clique fora (salva sozinho) ou use <b>Salvar lista</b>. '
      + '<b>🌐</b> abre o painel do equipamento dentro do MODESK, <b>↗</b> em nova aba, <b>⧉</b> copia o IP e <b>✕</b> remove o registro.</div>'
      + '<div class="row" style="gap:8px;flex-wrap:wrap;margin:12px 0">'
      + '<button class="btn primary" onclick="mdkPerifSalvar()">💾 Salvar lista</button>'
      + '<button class="btn" onclick="mdkPerifAdd()">＋ Adicionar equipamento</button>'
      + '<button class="btn" onclick="mdkPerifColar()">📋 Colar nova lista</button>'
      + '<button class="btn" onclick="mdkPerifCSV()">⬇ Exportar CSV</button>'
      + '</div>'
      + '<div style="overflow:auto"><table><thead><tr><th>Tipo</th><th>IP</th><th>MAC</th><th>Descricao / Local</th><th>Acoes</th></tr></thead>'
      + '<tbody>'+(linhas||'<tr><td colspan="5" class="dim">Nenhum equipamento cadastrado.</td></tr>')+'</tbody></table></div></div>';
  }

  /* substitui o cartao antigo (somente leitura) e remove a tabela duplicada do painel de edicao */

      var marca=html.indexOf('<div class="card" style="margin-top:16px"><h3>✏️', ini);
      fim = marca>=0 ? marca : html.length;
      html = html.slice(0,ini) + cartaoPerif() + html.slice(fim);
    } else {
      html += cartaoPerif();

    var d1=html.indexOf('<h4 style="margin:16px 0 6px">Impressoras, perifericos e telefonia');

      var d2=html.indexOf('<div id="mdk-imp"', d1);

<script>
(function(){

  };

  /* ---------- 2) comando de voz ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec=null, ouvindo=false, falarOn=false, ultimaFalada='';

  function jx(id){ var w=document.getElementById('jvx'); return w? w.querySelector('#'+id) : null; }

  function falarTexto(t){

      var u=new SpeechSynthesisUtterance(String(t).replace(/```[\s\S]*?```/g,' ').replace(/[*#`_>]/g,'').slice(0,900));
      u.lang='pt-BR'; u.rate=1.03;

      var ta=jx('jx-in'); if(ta) ta.value=(falado+' '+parcial).trim();
    };
    rec.onerror=function(){};
    rec.onend=function(){
      rec=null;
      var t=falado.trim();
      if(t){ enviarTexto(t); }
      else if(ouvindo){ setTimeout(iniciarRec,400); }
    };
    try{ rec.start() }catch(e){ rec=null }

  function alternarVoz(btn){
