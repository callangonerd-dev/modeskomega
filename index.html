/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:80;padding:20px;
  background:radial-gradient(900px 500px at 50% 0%,rgba(229,9,20,.22),transparent 60%),#050a12}

  border-radius:22px;padding:30px;box-shadow:var(--sh);animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- LAYOUT ---------- */
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:16px 14px 40px;
  background:linear-gradient(180deg,rgba(12,19,30,.9),rgba(6,13,23,.92));backdrop-filter:blur(16px);border-right:1px solid var(--line)}

.brand small{color:var(--mut);display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.folder{margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:rgba(17,25,36,.5)}
.folder>.fhead{width:100%;display:flex;align-items:center;gap:11px;padding:13px 13px;background:transparent;border:0;cursor:pointer;font-weight:700;transition:.2s}
.folder>.fhead:hover{background:rgba(229,9,20,.10)}
.folder>.fhead .chev{margin-left:auto;transition:.25s;color:var(--dim)}
.folder.open>.fhead .chev{transform:rotate(90deg);color:var(--acc2)}
.fbody{display:none;padding:6px 8px 10px}
.folder.open .fbody{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.navbtn{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;margin:4px 0;border-radius:12px;border:1px solid transparent;
  background:rgba(255,255,255,.03);cursor:pointer;font-weight:600;font-size:13.6px;transition:.18s;text-align:left}
.navbtn:hover{transform:translateX(4px);border-color:var(--line2);background:rgba(229,9,20,.12)}
.navbtn.active{background:var(--grad);box-shadow:var(--sh-acc);border-color:transparent}
.navbtn .ic{width:26px;height:26px;display:grid;place-items:center;font-size:16px}
.badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
main{padding:22px 26px 70px;max-width:1400px}

.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:pulse 1.8s infinite}

.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:.25s}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

  background:rgba(255,255,255,.05);cursor:pointer;font-weight:700;font-size:13.5px;transition:.18s}
.btn:hover{transform:translateY(-2px);border-color:var(--acc2);box-shadow:0 8px 22px rgba(229,9,20,.25)}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

h2.page{font-size:25px;margin-bottom:4px}
.hint{font-size:12.8px;color:var(--mut);margin-bottom:16px}

.alertbar{border-left:4px solid var(--acc2);background:rgba(229,9,20,.10);padding:11px 14px;border-radius:0 12px 12px 0;margin-bottom:9px}
.alertbar.w{border-color:var(--warn);background:rgba(245,181,10,.10)}
.alertbar.o{border-color:var(--ok);background:rgba(34,197,139,.10)}
.tree{list-style:none;margin:0;padding-left:14px;border-left:1px dashed var(--line2)}

.mono{font-family:'JetBrains Mono',monospace;font-size:12.4px}

/* ========== MODESK v8 — REDESIGN CINEMÁTICO / WINDOWS ========== */
:root{

function detectOS(){
  const ua=navigator.userAgent, p=navigator.platform||'';
  let os='Desconhecido';
  if(/Windows NT 10|Windows NT 11/.test(ua))os='Windows 10/11';
  else if(/Windows/.test(ua))os='Windows';
  else if(/Mac OS X/.test(ua))os='macOS';
  else if(/Android/.test(ua))os='Android';
  else if(/iPhone|iPad/.test(ua))os='iOS';
  else if(/Linux/.test(ua))os='Linux';
  OSINFO={os,plataforma:p,nucleos:navigator.hardwareConcurrency||'—',
    memoria:(navigator.deviceMemory?navigator.deviceMemory+' GB':'—'),
    idioma:navigator.language,tela:screen.width+'×'+screen.height,

  const c=state.fb; if(!c.apiKey||!c.projectId)return;

    const app=firebase.apps.length?firebase.app():firebase.initializeApp({apiKey:c.apiKey,projectId:c.projectId,authDomain:c.authDomain||c.projectId+'.firebaseapp.com',appId:c.appId});
    db=firebase.firestore(app);
    unsub&&unsub();
    unsub=db.collection('modesk_pessoal').doc(GESTOR).onSnapshot(d=>{
      const data=d.data(); if(!data?.payload)return;
      const remote=JSON.parse(data.payload);
      if(JSON.stringify(remote)!==JSON.stringify(state)){state=Object.assign(structuredClone(DEF),remote);localStorage.setItem(LS,JSON.stringify(state));render();}

/* ================= ALERTAS DE DATAS ================= */
function dias(d){return Math.ceil((new Date(d)-new Date().setHours(0,0,0,0))/864e5)}
function alertas(){
  const out=[];
  state.eventos.forEach(e=>{const d=dias(e.data);
    if(d<0)out.push({t:'err',m:`Evento vencido: ${e.titulo} (${fmt(e.data)})`});
    else if(d===0)out.push({t:'err',m:`HOJE: ${e.titulo} às ${e.hora||'--:--'}`});
    else if(d<=3)out.push({t:'w',m:`Em ${d} dia(s): ${e.titulo} — ${fmt(e.data)} ${e.hora||''}`});});
  state.pedidos.forEach(p=>{if(!p.prazo)return;const d=dias(p.prazo);
    if(p.status!=='Concluído'&&d<0)out.push({t:'err',m:`Pedido ${p.numero} atrasado ${Math.abs(d)}d`});
    else if(p.status!=='Concluído'&&d<=5)out.push({t:'w',m:`Pedido ${p.numero} vence em ${d}d`});});
  state.atividades.forEach(a=>{if(a.feito||!a.prazo)return;const st=statusAtiv(a);
    if(st.late)out.push({t:'err',m:`ATIVIDADE ${a.tipo||''}: ${a.titulo} — prazo ${fmt(a.prazo)} ${a.hora||''}`});
    else if(dias(a.prazo)<=2)out.push({t:'w',m:`Atividade em breve: ${a.titulo} (${fmt(a.prazo)})`});});
  state.sends.forEach(s=>{if(s.status==='Aguardando retorno'&&dias(s.data)<-2)out.push({t:'w',m:`SEND "${s.assunto}" sem retorno há ${Math.abs(dias(s.data))} dias`})});
  return out;
}
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—';

function addItem(){const d=$('it-d').value.trim();if(!d)return toast('Descrição obrigatória');
  state.itens.push({id:u(),desc:d,qtd:$('it-q').value||1,un:$('it-u').value||'UN',cat:$('it-c').value,obs:$('it-o').value});save();toast('Item cadastrado')}
function importCSV(){
  const f=$('it-f').files[0]; if(!f)return toast('Selecione um CSV ou XLSX');
  if(/\.xlsx?$/i.test(f.name))return importXLSX(f);
  const r=new FileReader();
  r.onload=()=>{
    const linhas=r.result.split(/\r?\n/).filter(Boolean);
    if(!linhas.length)return toast('Arquivo vazio');
    const sep=linhas[0].includes(';')?';':',';
    const head=linhas[0].split(sep).map(h=>h.trim().toLowerCase());
    const find=(...ns)=>head.findIndex(h=>ns.some(n=>h.includes(n)));
    const iD=find('desc','item','produto'),iQ=find('qtd','quant'),iU=find('unid','un'),iC=find('categ','tipo');
    let n=0;
    linhas.slice(1).forEach(l=>{const c=l.split(sep);const d=(c[iD]||c[0]||'').trim();if(!d)return;
      state.itens.push({id:u(),desc:d,qtd:(c[iQ]||1).toString().trim(),un:(c[iU]||'UN').trim(),cat:(c[iC]||'').trim(),obs:'importado'});n++});
    $('it-prev').textContent=`Reconhecido: ${n} itens (colunas: ${head.join(' | ')})`;
    save();toast(n+' itens importados');
  };
  r.readAsText(f,'utf-8');
}

/* ---- Importação .xlsx nativa (SheetJS sob demanda) ---- */
function carregarSheetJS(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((ok,err)=>{const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    sc.onload=()=>ok(window.XLSX);sc.onerror=()=>err(new Error('offline'));document.head.append(sc)});
}
async function importXLSX(f){
  let XLSX;
  try{toast('Lendo planilha...');XLSX=await carregarSheetJS()}
  catch(e){return toast('Precisa de internet na 1a leitura de .xlsx')}
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const linhas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!linhas.length)return toast('Planilha vazia');
  const head=Object.keys(linhas[0]);
  const col=(...ns)=>head.find(h=>ns.some(n=>h.toLowerCase().includes(n)));
  const cD=col('desc','item','produto')||head[0],cQ=col('qtd','quant'),cU=col('unid','un'),cC=col('categ','tipo');
  let n=0;
  linhas.forEach(l=>{const d=String(l[cD]||'').trim();if(!d)return;
    state.itens.push({id:u(),desc:d,qtd:String(cQ?l[cQ]||1:1).trim(),un:String(cU?l[cU]||'UN':'UN').trim(),cat:String(cC?l[cC]||'':'').trim(),obs:'importado xlsx'});n++});
  const pv=$('it-prev');if(pv)pv.textContent=`Planilha ${wb.SheetNames[0]}: ${n} itens (colunas: ${head.join(' | ')})`;
  save();toast(n+' itens importados do Excel');
}

if(!Array.isArray(state.atividades))state.atividades=[];
if(!Array.isArray(state.arquivos))state.arquivos=[];

  return page('Atividades e lembretes','Cadastre atividades de trabalho ou pessoais. No prazo (deadline) o aviso pisca em vermelho na tela.',`
  <div class="grid g2" style="margin-bottom:16px">
   <div class="card"><h3>Nova atividade</h3>
    <label>Título</label><input id="at-t"/>
    <div class="grid g2">
      <div><label>Data (deadline)</label><input id="at-d" type="date"/></div>
      <div><label>Hora</label><input id="at-h" type="time"/></div>

      <div><label>Prioridade</label><select id="at-p">${PRIOS.map(p=>`<option>${p}</option>`).join('')}</select></div>
      <div><label>Repetir</label><select id="at-r"><option value="">Não repetir</option><option value="diario">Diariamente</option><option value="semanal">Semanalmente</option><option value="mensal">Mensalmente</option></select></div>
      <div><label>Avisar antes (minutos)</label><input id="at-av" type="number" value="30" min="0"/></div>
    </div>
    <label>Descrição / informações</label><textarea id="at-i" rows="3"></textarea>
    <label>Arquivo de referência (opcional, salvo no app)</label><input id="at-f" type="file"/>
    <div style="margin-top:14px"><button class="btn primary" onclick="addAtividade()">＋ Salvar atividade</button>
      <button class="btn" onclick="pedirNotificacao()">🔔 Ativar notificações</button></div>
   </div>
   <div class="card"><h3>Resumo</h3>
    <div class="grid g3" style="margin-top:10px">
      ${kpi('Abertas',abertas.length,'bell')}${kpi('Atrasadas',abertas.filter(a=>statusAtiv(a).late).length,'pulse')}${kpi('Concluídas',feitas.length,'shield')}
    </div>
    <div style="margin-top:12px">${abertas.filter(a=>statusAtiv(a).late).map(a=>`<div class="alertbar">⏰ <b>${esc(a.titulo)}</b> — ${fmt(a.prazo)} ${esc(a.hora||'')}</div>`).join('')||'<div class="alertbar o">Nenhuma atividade vencida.</div>'}</div>
   </div>
  </div>
  <div class="card"><h3>Atividades abertas <span class="badge">${abertas.length}</span></h3>
   <table style="margin-top:10px"><thead><tr><th>Prazo</th><th>Atividade</th><th>Tipo</th><th>Prioridade</th><th>Situação</th><th></th></tr></thead>
   <tbody>${abertas.map(linha).join('')||'<tr><td colspan="6" class="dim">Nenhuma atividade cadastrada.</td></tr>'}</tbody></table></div>
  <div class="card" style="margin-top:14px"><h3>Concluídas <span class="badge">${feitas.length}</span></h3>
   <table style="margin-top:10px"><tbody>${feitas.map(linha).join('')||'<tr><td class="dim">Nada concluído ainda.</td></tr>'}</tbody></table></div>`);
}
function statusAtiv(a){
  if(a.feito)return{cls:'t-ok',txt:'Concluída',late:false};
  const dl=deadlineMs(a); if(!dl)return{cls:'',txt:'Sem prazo',late:false};
  const diff=dl-Date.now(), min=Math.round(diff/60000);
  if(diff<=0)return{cls:'t-err',txt:'VENCIDA',late:true};
  if(min<=(a.aviso??30))return{cls:'t-err',txt:'AGORA ('+min+' min)',late:true};
  if(diff<864e5)return{cls:'t-warn',txt:'Hoje/24h',late:false};
  return{cls:'t-ok',txt:'em '+Math.ceil(diff/864e5)+'d',late:false};
}
function deadlineMs(a){if(!a.prazo)return 0;return new Date(a.prazo+'T'+(a.hora||'23:59')+':00').getTime()}
function addAtividade(){
  const t=$('at-t').value.trim(); if(!t)return toast('Informe o título');
  const f=$('at-f').files[0];
  const push=arq=>{state.atividades.push({id:u(),titulo:t,prazo:$('at-d').value,hora:$('at-h').value,tipo:$('at-tp').value,
    prioridade:$('at-p').value,repetir:$('at-r').value,aviso:+$('at-av').value||0,desc:$('at-i').value,arquivo:arq,feito:false,criado:Date.now()});
    save();toast('Atividade salva');checarDeadlines();};
  if(f){if(f.size>1.5e6)return toast('Arquivo muito grande (máx 1,5 MB) — use o Explorador para arquivos maiores');
    const r=new FileReader();r.onload=()=>push({nome:f.name,tipo:f.type,dados:r.result});r.readAsDataURL(f);}else push(null);
}
function toggleAtiv(id){const a=state.atividades.find(x=>x.id===id);if(!a)return;
  a.feito=!a.feito;
  if(a.feito&&a.repetir&&a.prazo){const d=new Date(a.prazo+'T00:00:00');
    if(a.repetir==='diario')d.setDate(d.getDate()+1);
    if(a.repetir==='semanal')d.setDate(d.getDate()+7);
    if(a.repetir==='mensal')d.setMonth(d.getMonth()+1);
    state.atividades.push({...a,id:u(),feito:false,prazo:d.toISOString().slice(0,10),criado:Date.now()});}
  save();checarDeadlines();}
function verAtiv(id){const a=state.atividades.find(x=>x.id===id);if(!a)return;const st=statusAtiv(a);
  const an=a.arquivo?(a.arquivo.tipo&&a.arquivo.tipo.startsWith('image')
     ?`<img src="${a.arquivo.dados}" style="max-width:100%;border-radius:12px"/>`
     :`<a class="btn" href="${a.arquivo.dados}" download="${esc(a.arquivo.nome)}">⬇ ${esc(a.arquivo.nome)}</a>`):'<div class="dim">Sem arquivo.</div>';
  modal(`<h2>${esc(a.titulo)}</h2><div class="row" style="margin:10px 0">
    <span class="tag t-info mono">${fmt(a.prazo)} ${esc(a.hora||'')}</span>
    <span class="tag">${esc(a.tipo)}</span><span class="tag">${esc(a.prioridade||'Normal')}</span>
    <span class="tag ${st.cls} ${st.late?'blink':''}">${st.txt}</span></div>
    <p>${esc(a.desc||'')}</p><h4 style="margin-top:12px">Arquivo</h4><div style="margin-top:8px">${an}</div>`);}
function pedirNotificacao(){if(!('Notification'in window))return toast('Navegador sem suporte');
  Notification.requestPermission().then(p=>toast(p==='granted'?'Notificações ativadas':'Notificações negadas'))}

/* ---------- MONITOR DE DEADLINE (pisca em vermelho) ---------- */
let deadlineAtivas=[],avisadas={};
function checarDeadlines(){
  deadlineAtivas=state.atividades.filter(a=>!a.feito&&statusAtiv(a).late);
  const evHoje=state.eventos.filter(e=>dias(e.data)<=0);
  const bar=$('deadline-bar');
  if(bar){
    if(deadlineAtivas.length||evHoje.length){
      const nomes=deadlineAtivas.map(a=>a.titulo).concat(evHoje.map(e=>'Evento: '+e.titulo)).slice(0,3).join(' · ');
      bar.innerHTML=`⏰ LEMBRETE NO PRAZO — ${esc(nomes)}${(deadlineAtivas.length+evHoje.length)>3?' +'+(deadlineAtivas.length+evHoje.length-3):''} <span style="margin-left:auto;font-weight:600">clique para abrir · Esc dispensa</span>`;
      bar.classList.add('on');document.body.classList.add('deadline-on');
    }else{bar.classList.remove('on');document.body.classList.remove('deadline-on');}
  }
  deadlineAtivas.forEach(a=>{if(!avisadas[a.id]){avisadas[a.id]=1;
    try{if(window.Notification&&Notification.permission==='granted')new Notification('MODESK — '+a.titulo,{body:'Prazo: '+fmt(a.prazo)+' '+(a.hora||'')});}catch(e){}
    toast('⏰ '+a.titulo+' está no prazo!');}});
  atualizarStatusbar();
}
function atualizarStatusbar(){
  const sb=$('sb-alert'); if(!sb)return;
  const n=deadlineAtivas.length;
  sb.innerHTML=n?`<span class="blink">⏰ ${n} atividade(s) no prazo</span>`:'<span class="muted">Sem pendências críticas</span>';
  const c=$('sb-count'); if(c)c.textContent=`${state.atividades.filter(a=>!a.feito).length} atividades · ${state.pedidos.length} pedidos · ${state.itens.length} itens`;
  const o=$('sb-os'); if(o)o.textContent=(OSINFO.os||'—')+' · '+(navigator.onLine?'Online':'Offline');
}

/* ---------- EXPLORADOR DE ARQUIVOS DO PC ---------- */
let EXP={root:null,dir:null,path:[],itens:[],filtro:'',modo:'grid'};
const idbGet=k=>new Promise(r=>{const q=indexedDB.open('modesk-fs',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');
  q.onsuccess=()=>{const t=q.result.transaction('h','readonly').objectStore('h').get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(null)};q.onerror=()=>r(null)});
const idbSet=(k,v)=>new Promise(r=>{const q=indexedDB.open('modesk-fs',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');
  q.onsuccess=()=>{const t=q.result.transaction('h','readwrite').objectStore('h').put(v,k);t.onsuccess=()=>r(1);t.onerror=()=>r(0)};q.onerror=()=>r(0)});

function vExplorer(){
  const sup=!!window.showDirectoryPicker;
  return page('Explorador de arquivos','Navegue pelas pastas do computador dentro da plataforma, abra e visualize internamente ou externamente, e salve arquivos direto no PC.',`
  ${sup?'':'<div class="alertbar">Este navegador não suporta acesso a pastas. Use Chrome ou Edge no Windows (no modo aplicativo instalado funciona igual a um programa do PC).</div>'}
  <div class="exp-toolbar">
    <button class="btn primary" onclick="expEscolherPasta()">📂 Abrir pasta do PC</button>
    <button class="btn" onclick="expVoltar()">⬅ Voltar</button>
    <button class="btn" onclick="expRaiz()">🏠 Raiz</button>
    <button class="btn" onclick="expNovaPasta()">🗂 Nova pasta</button>
    <button class="btn" onclick="expEnviarArquivo()">⬆ Salvar arquivo aqui</button>
    <input id="exp-q" placeholder="Buscar nesta pasta..." style="max-width:240px" oninput="EXP.filtro=this.value;expPintar()"/>
    <button class="btn sm" onclick="EXP.modo=EXP.modo==='grid'?'list':'grid';expPintar()">🔀 Modo</button>
    <button class="btn" onclick="expBuscarConteudo()">🔎 Buscar dentro dos arquivos</button>
  </div>
  <div class="exp-wrap">
    <div class="exp-side"><h4 style="font-size:13px">Locais salvos</h4>
      <div style="margin-top:8px">${state.pastas.map(p=>`<div class="exp-list-row" onclick="abrirCaminho('${esc(p.caminho).replace(/\\/g,'\\\\')}')"><span>📁</span><div><b style="font-size:12.6px">${esc(p.nome)}</b><div class="mono dim" style="font-size:11px">${esc(p.caminho)}</div></div></div>`).join('')||'<div class="dim">Nenhum local salvo.</div>'}</div>
      <h4 style="font-size:13px;margin-top:14px">Dica</h4>
      <div class="dim" style="font-size:12px">A permissão da pasta fica lembrada neste PC. Arquivos criados aqui são gravados de verdade no disco.</div>
    </div>
    <div class="exp-main"><div class="crumb" id="exp-crumb"></div><div id="exp-body"><div class="dim">Clique em “Abrir pasta do PC” para começar.</div></div></div>
  </div>`);
}
async function expEscolherPasta(){
  if(!window.showDirectoryPicker)return toast('Use Chrome/Edge no desktop');
  try{const h=await window.showDirectoryPicker({mode:'readwrite'});EXP.root=h;EXP.dir=h;EXP.path=[h];await idbSet('root',h);await expLer();}catch(e){}
}
async function expRestaurar(){
  const h=await idbGet('root'); if(!h)return;
  try{const perm=await h.queryPermission({mode:'readwrite'});
    if(perm==='granted'){EXP.root=h;EXP.dir=h;EXP.path=[h];if(tab==='explorer')expLer();}
    else if(tab==='explorer'){const b=$('exp-body');if(b)b.innerHTML=`<button class="btn primary" onclick="expPermitir()">🔓 Reconectar pasta "${esc(h.name)}"</button>`}
  }catch(e){}
}
async function expPermitir(){const h=await idbGet('root');if(!h)return;
  const p=await h.requestPermission({mode:'readwrite'});
  if(p==='granted'){EXP.root=h;EXP.dir=h;EXP.path=[h];expLer()}else toast('Permissão negada')}
async function expLer(){
  if(!EXP.dir)return;
  const arr=[];
  try{for await(const [nome,h] of EXP.dir.entries()){
    let tam=0,mod=0;
    if(h.kind==='file'){try{const f=await h.getFile();tam=f.size;mod=f.lastModified}catch(e){}}
    arr.push({nome,kind:h.kind,h,tam,mod});}}catch(e){toast('Erro ao ler pasta')}
  arr.sort((a,b)=>a.kind===b.kind?a.nome.localeCompare(b.nome):(a.kind==='directory'?-1:1));
  EXP.itens=arr;expPintar();
}
const bytes=n=>n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024).toFixed(0)+' KB':n+' B';
function fileIcon(n,k){if(k==='directory')return'📁';const e=n.split('.').pop().toLowerCase();
  if(['png','jpg','jpeg','gif','webp','bmp','svg'].includes(e))return'🖼️';if(e==='pdf')return'📕';
  if(['xlsx','xls','csv'].includes(e))return'📊';if(['doc','docx','txt','md','rtf'].includes(e))return'📄';
  if(['mp3','wav','ogg','flac'].includes(e))return'🎵';if(['mp4','avi','mkv','mov'].includes(e))return'🎬';
  if(['zip','rar','7z'].includes(e))return'🗜️';if(['exe','msi','bat'].includes(e))return'⚙️';return'📃'}
function expPintar(){
  const cr=$('exp-crumb'),bo=$('exp-body'); if(!cr||!bo)return;
  cr.innerHTML=EXP.path.map((p,i)=>`<button onclick="expIr(${i})">${esc(p.name||'raiz')}</button>`).join('<span>›</span>')||'';
  const f=EXP.filtro.toLowerCase();
  const list=EXP.itens.filter(i=>!f||i.nome.toLowerCase().includes(f));
  if(!list.length){bo.innerHTML='<div class="dim">Pasta vazia ou nada encontrado.</div>';return}
  if(EXP.modo==='grid'){
    bo.innerHTML=`<div class="exp-grid">${list.map((i,ix)=>`<div class="exp-item" ondblclick="expAbrir(${ix})" onclick="expAbrir(${ix})">
      <span class="fi">${fileIcon(i.nome,i.kind)}</span><div class="fn">${esc(i.nome)}</div>
      <div class="fs">${i.kind==='file'?bytes(i.tam):'pasta'}</div></div>`).join('')}</div>`;
  }else{
    bo.innerHTML=list.map((i,ix)=>`<div class="exp-list-row" onclick="expAbrir(${ix})"><span>${fileIcon(i.nome,i.kind)}</span>
      <b style="font-size:12.8px">${esc(i.nome)}</b><span class="dim" style="margin-left:auto">${i.kind==='file'?bytes(i.tam)+' · '+new Date(i.mod).toLocaleDateString('pt-BR'):'pasta'}</span></div>`).join('');
  }
}
function expFiltrados(){const f=EXP.filtro.toLowerCase();return EXP.itens.filter(i=>!f||i.nome.toLowerCase().includes(f))}
async function expAbrir(ix){
  const it=expFiltrados()[ix]; if(!it)return;
  if(it.kind==='directory'){EXP.dir=it.h;EXP.path.push(it.h);EXP.filtro='';await expLer();return}
  const f=await it.h.getFile(); const url=URL.createObjectURL(f);
  const ext=it.nome.split('.').pop().toLowerCase();
  let inner='';
  if(f.type.startsWith('image'))inner=`<img src="${url}" class="viewer" style="object-fit:contain"/>`;
  else if(ext==='pdf')inner=`<iframe src="${url}" class="viewer"></iframe>`;
  else if(f.type.startsWith('video'))inner=`<video src="${url}" class="viewer" controls></video>`;
  else if(f.type.startsWith('audio'))inner=`<audio src="${url}" controls style="width:100%"></audio>`;
  else if(['txt','csv','log','json','md','xml','ini','js','html','css'].includes(ext)){
    const txt=await f.text();inner=`<pre class="mono viewer" style="overflow:auto;padding:12px;white-space:pre-wrap">${esc(txt.slice(0,120000))}</pre>`;}
  else inner='<div class="dim">Pré-visualização interna não disponível para este tipo. Use “Abrir externamente”.</div>';
  modal(`<h2>${esc(it.nome)}</h2><div class="row" style="margin:8px 0">
    <span class="tag mono">${bytes(f.size)}</span><span class="tag mono">${esc(f.type||ext)}</span>
    <span class="tag mono">${new Date(f.lastModified).toLocaleString('pt-BR')}</span>
    <a class="btn sm" href="${url}" target="_blank" rel="noopener">↗ Abrir externamente</a>
    <a class="btn sm" href="${url}" download="${esc(it.nome)}">⬇ Baixar cópia</a></div>${inner}`);
}
function expIr(i){EXP.path=EXP.path.slice(0,i+1);EXP.dir=EXP.path[EXP.path.length-1];EXP.filtro='';expLer()}
function expVoltar(){if(EXP.path.length>1){EXP.path.pop();EXP.dir=EXP.path[EXP.path.length-1];expLer()}}
function expRaiz(){if(EXP.root){EXP.path=[EXP.root];EXP.dir=EXP.root;expLer()}}
async function expNovaPasta(){if(!EXP.dir)return toast('Abra uma pasta primeiro');
  const n=prompt('Nome da nova pasta:');if(!n)return;
  try{await EXP.dir.getDirectoryHandle(n,{create:true});toast('Pasta criada no PC');expLer()}catch(e){toast('Não foi possível criar')}}
async function expEnviarArquivo(){
  if(!EXP.dir)return toast('Abra uma pasta do PC primeiro');
  const inp=document.createElement('input');inp.type='file';inp.multiple=true;
  inp.onchange=async()=>{for(const f of inp.files){try{
      const h=await EXP.dir.getFileHandle(f.name,{create:true});const w=await h.createWritable();await w.write(await f.arrayBuffer());await w.close();
      state.arquivos.push({id:u(),nome:f.name,tam:f.size,pasta:EXP.dir.name,em:Date.now()});
    }catch(e){toast('Falha ao salvar '+f.name)}}
    save(true);toast('Arquivo(s) gravado(s) na pasta do PC');expLer()};
  inp.click();
}

/* ---------- BUSCA GLOBAL ---------- */
let BUSCA='';
function vBusca(){
  const q=BUSCA.trim().toLowerCase();
  const hits=[];
  const add=(cat,titulo,sub,acao)=>hits.push({cat,titulo,sub,acao});
  if(q){
    state.atividades.forEach(a=>{if((a.titulo+' '+(a.desc||'')).toLowerCase().includes(q))add('Atividade',a.titulo,fmt(a.prazo)+' '+(a.tipo||''),`verAtiv('${a.id}')`)});
    state.eventos.forEach(e=>{if((e.titulo+' '+(e.info||'')).toLowerCase().includes(q))add('Evento',e.titulo,fmt(e.data),`verEvento('${e.id}')`)});
    state.pedidos.forEach(p=>{if(JSON.stringify(p).toLowerCase().includes(q))add('Pedido de compra','Pedido '+p.numero,(p.fornecedor||'')+' · '+(p.status||''),`go('pedidos')`)});
    state.itens.forEach(i=>{if(JSON.stringify(i).toLowerCase().includes(q))add('Inventário',i.descricao||i.nome||'item',(i.categoria||'')+' · '+(i.quantidade||'')+' '+(i.unidade||''),`go('itens')`)});
    state.sends.forEach(s=>{if(JSON.stringify(s).toLowerCase().includes(q))add('SEND',s.assunto,(s.destinatario||'')+' · '+(s.status||''),`go('send')`)});
    state.acessos.forEach(a=>{if(JSON.stringify(a).toLowerCase().includes(q))add('Acesso remoto',a.nome,(a.tipo||'')+' · '+(a.endereco||''),`go('remoto')`)});
    state.pastas.forEach(p=>{if(JSON.stringify(p).toLowerCase().includes(q))add('Pasta do PC',p.nome,p.caminho,`go('explorer')`)});
    state.links.forEach(l=>{if(JSON.stringify(l).toLowerCase().includes(q))add('Atalho',l.nome,l.url||'sem URL',`go('links')`)});
    state.servicos.forEach(s=>{(s.sub||[]).forEach(sb=>(sb.itens||[]).forEach(it=>{const txt=typeof it==='string'?it:(it.nome||'');
      if(txt.toLowerCase().includes(q))add('Serviço',txt,s.nome+' › '+sb.nome,`go('servicos')`)}))});
    state.arquivos.forEach(a=>{if(a.nome.toLowerCase().includes(q))add('Arquivo salvo',a.nome,a.pasta||'',`go('explorer')`)});
  }
  return page('Busca geral','Procure em atividades, pedidos, inventário, SEND, chamados, acessos, pastas e arquivos.',`
  <div class="card" style="margin-bottom:14px"><div class="row">
    <input id="bs-q" value="${esc(BUSCA)}" placeholder="Digite o que procura..." style="max-width:420px" oninput="BUSCA=this.value;render();setTimeout(()=>{const el=$('bs-q');el&&el.focus();el.setSelectionRange(el.value.length,el.value.length)},0)"/>
    <span class="tag mono">${hits.length} resultado(s)</span></div></div>
  <div class="card"><table><tbody>
   ${hits.map(h=>`<tr><td><span class="tag t-info">${esc(h.cat)}</span></td><td><b>${esc(h.titulo)}</b><div class="dim">${esc(h.sub||'')}</div></td>

function buscaTopo(v){BUSCA=v;tab='busca';render()}

const TEXTEXT=['txt','csv','log','json','md','xml','ini','js','ts','html','htm','css','sql','bat','cmd','yml','yaml','srt','svg'];
async function expBuscarConteudo(){
  if(!EXP.dir)return toast('Abra uma pasta do PC primeiro');
  const termo=(prompt('Buscar este texto DENTRO dos arquivos desta pasta (e subpastas):')||'').trim();
  if(!termo)return;
  const alvo=termo.toLowerCase(),achados=[];let lidos=0;
  const bo=$('exp-body');if(bo)bo.innerHTML='<div class="dim">Procurando dentro dos arquivos...</div>';
  async function varrer(dir,base,nivel){
    if(nivel>4||achados.length>=200)return;
    for await(const [nome,h] of dir.entries()){
      if(achados.length>=200)return;
      if(h.kind==='directory'){await varrer(h,base+nome+'/',nivel+1);continue}
      const ext=nome.split('.').pop().toLowerCase();
      if(!TEXTEXT.includes(ext))continue;
      try{const f=await h.getFile();if(f.size>3e6)continue;
        const t=await f.text();lidos++;
        const i=t.toLowerCase().indexOf(alvo);
        if(i>=0)achados.push({nome,caminho:base+nome,trecho:t.slice(Math.max(0,i-70),i+130).replace(/\s+/g,' ')});
      }catch(e){}
    }
  }
  await varrer(EXP.dir,'',0);
  if(!bo)return;
  bo.innerHTML=`<div class="row" style="margin-bottom:10px"><span class="tag t-info">${achados.length} arquivo(s) com "${esc(termo)}"</span>
    <span class="tag mono">${lidos} arquivos de texto lidos</span><button class="btn sm" onclick="expLer()">↩ Voltar à pasta</button></div>`+
    (achados.map(a=>`<div class="exp-list-row"><span>${fileIcon(a.nome,'file')}</span><div><b style="font-size:12.8px">${esc(a.nome)}</b>
      <div class="mono dim" style="font-size:11px">${esc(a.caminho)}</div>
      <div class="dim" style="font-size:12px">…${esc(a.trecho)}…</div></div></div>`).join('')
     ||'<div class="dim">Nada encontrado no conteúdo dos arquivos (busca em arquivos de texto: txt, csv, log, json, md, xml, html, sql...).</div>');
}

<script>
/* ============ MODESK v12 — arrastar e soltar + janela Win11 ============ */
(function(){
  const LABELS={
    'ev-f':['Anexo do evento','Imagem, planilha ou PDF'],
    'it-f':['Planilha de inventário','Arquivo .csv'],
    'cf-f':['Backup do MODESK','Arquivo .json de restauração'],
    'at-f':['Arquivo de referência','Qualquer arquivo salvo no app']
  };
  function upgrade(inp){
    if(!inp||inp.dataset.dz)return; inp.dataset.dz='1';
    const dz=document.createElement('div'); dz.className='dropzone';
    const L=LABELS[inp.id]||['Solte o arquivo aqui','ou clique para escolher no PC'];
    dz.innerHTML='<div class="dz-ico">⇧</div><div class="dz-txt"><b>Arraste e solte: '+L[0]+'</b><span>'+L[1]+' — ou clique para escolher</span></div><div class="dz-btn">Escolher arquivo</div>';
    inp.parentNode.insertBefore(dz,inp); dz.appendChild(inp);
    const txt=dz.querySelector('.dz-txt b');
    const base=txt.textContent;
    inp.addEventListener('change',()=>{
      if(inp.files&&inp.files[0]){dz.classList.add('has-file');txt.textContent='✓ '+inp.files[0].name;}
      else{dz.classList.remove('has-file');txt.textContent=base;}
    });
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('over')}));
    dz.addEventListener('drop',e=>{
      const f=e.dataTransfer&&e.dataTransfer.files; if(!f||!f.length)return;
      const dt=new DataTransfer(); dt.items.add(f[0]); inp.files=dt.files;
      inp.dispatchEvent(new Event('change',{bubbles:true}));
    });
  }
  function upgradeAll(){document.querySelectorAll('input[type=file]:not([data-dz])').forEach(upgrade)}
  new MutationObserver(upgradeAll).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',upgradeAll); upgradeAll();

  /* soltar arquivos em qualquer lugar → grava na pasta aberta do PC */
  const veil=document.getElementById('dropveil');
  let dragDepth=0;
  const temArquivo=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
  window.addEventListener('dragenter',e=>{
    if(!temArquivo(e)||e.target.closest('.dropzone'))return;
    dragDepth++; if(typeof EXP!=='undefined'&&EXP.dir)veil.classList.add('on');
  });
  window.addEventListener('dragover',e=>{if(temArquivo(e))e.preventDefault()});
  window.addEventListener('dragleave',e=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)veil.classList.remove('on')});
  window.addEventListener('drop',async e=>{
    if(!temArquivo(e)||e.target.closest('.dropzone'))return;
    e.preventDefault(); dragDepth=0; veil.classList.remove('on');
    const files=Array.from(e.dataTransfer.files||[]); if(!files.length)return;
    if(typeof EXP==='undefined'||!EXP.dir){typeof toast==='function'&&toast('Abra uma pasta do PC no Explorador para gravar os arquivos');return}
    let ok=0;
    for(const f of files){
      try{
        const h=await EXP.dir.getFileHandle(f.name,{create:true});
        const w=await h.createWritable(); await w.write(await f.arrayBuffer()); await w.close();
        if(typeof state!=='undefined'&&state.arquivos)state.arquivos.push({id:(typeof u==='function'?u():String(Date.now()+ok)),nome:f.name,tam:f.size,pasta:EXP.dir.name,em:Date.now()});
        ok++;
      }catch(err){}
    }
    typeof save==='function'&&save();
    typeof toast==='function'&&toast(ok+' arquivo(s) gravado(s) em '+EXP.dir.name);
    typeof expLer==='function'&&expLer();
  });

  /* maximizar / restaurar como no Windows 11 */
  document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('win-max',!!document.fullscreenElement));
  if(matchMedia('(display-mode: standalone)').matches)document.body.classList.add('win-max');
})();
</script>

<script>
/* ===================== MODESK v15 — JARVIS FX · LUPA · MULTITELAS · RAIL INFERIOR =====================
   Camada adicional: não altera as regras do sistema, apenas a apresentação/navegação.

====================================================================================== */
(function () {
  const KEY = 'modesk.v15.ui';

    dashboard: 'Dashboard', agenda: 'Agenda & Avisos', atividades: 'Atividades & Lembretes',

    remoto: 'Conexões Remotas', monitor: 'Monitoramento do PC', pastasfs: 'Pastas Internas',
    explorer: 'Explorador de Arquivos', links: 'Sistemas & Sites', config: 'Configurações',
    entrega: 'Entrega & Pendências', interface: 'Central de Interface'
  };
  const VIEW = () => ({
    dashboard: window.vDash, agenda: window.vAgenda, servicos: window.vServicos, itens: window.vItens,
    pedidos: window.vPedidos, send: window.vSend, eventos: window.vEventos, remoto: window.vRemoto,
    monitor: window.vMonitor, pastasfs: window.vPastas, links: window.vLinks, config: window.vConfig,
    entrega: window.vEntrega, atividades: window.vAtividades, explorer: window.vExplorer, busca: window.vBusca,
    interface: window.vInterface
  });

  const ui = Object.assign({ deck: false, dock: 'left', fx: true, wins: {} }, readUI());
  function readUI() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') } catch (e) { return {} } }
  function saveUI() { try { localStorage.setItem(KEY, JSON.stringify(ui)) } catch (e) { } }
  const mobile = () => matchMedia('(max-width:900px)').matches;
  const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild };

  /* ---------------- JARVIS FX ---------------- */
  function fxLayer() {
    if (document.getElementById('jfx')) return;
    document.body.append(el(`<div id="jfx">
      <div class="lines"></div><div class="scan"></div><div class="vig"></div>
      <div class="hud tl"></div><div class="hud tr"></div><div class="hud bl"></div><div class="hud br"></div>
      <div class="ret" id="jret"><i></i><i></i><i></i></div>
    </div>`));
    const ret = document.getElementById('jret');
    let tx = -300, ty = -300, x = tx, y = ty;
    addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; }, { passive: true });
    (function loop() {
      x += (tx - x) * .12; y += (ty - y) * .12;

      requestAnimationFrame(loop);

  }
  function boot() {
    const b = el(`<div id="jboot"><div class="t">
      <div>MODESK · núcleo pessoal</div><div style="color:var(--acc3)">inicializando interface</div>
      <div class="bar"><b></b></div></div></div>`);
    document.body.append(b);
    setTimeout(() => b.remove(), 2400);
  }

  /* ---------------- MENU DOCK ---------------- */
  const DOCKS = ['left', 'right', 'top', 'hide'];
  const DOCK_LBL = { left: 'Menu à esquerda', right: 'Menu à direita', top: 'Menu no topo', hide: 'Menu oculto' };
  function applyDock() {
    document.body.classList.remove('dock-left', 'dock-right', 'dock-top', 'dock-hide');
    document.body.classList.add('dock-' + ui.dock);
    const b = document.getElementById('r-dock');
    if (b) b.title = DOCK_LBL[ui.dock];

  }
  function cycleDock() {
    ui.dock = DOCKS[(DOCKS.indexOf(ui.dock) + 1) % DOCKS.length];

  }

  /* ---------------- MULTITELAS ---------------- */
  let z = 100;
  const deck = () => document.getElementById('deck');
  function area() {
    const m = document.querySelector('main');
    const r = m ? m.getBoundingClientRect() : { left: 0, top: 0, width: innerWidth, height: innerHeight };
    const pad = 10, bottom = 56;
    return {
      x: Math.max(4, r.left + pad), y: Math.max(4, r.top + pad),
      w: Math.max(240, r.width - pad * 2), h: Math.max(220, innerHeight - Math.max(4, r.top + pad) - bottom)
    };
  }
  function content(k) {
    const f = VIEW()[k] || VIEW().dashboard;

    const a = area(), n = document.querySelectorAll('.win').length;
    const st = (ui.wins[k] && !mobile()) ? ui.wins[k] : null;
    const w = st ? st.w : Math.min(a.w, mobile() ? a.w : Math.max(420, a.w / 2 - 8));
    const h = st ? st.h : Math.min(a.h, 460);
    const x = st ? st.x : a.x + (n % 4) * 28;
    const y = st ? st.y : a.y + (n % 4) * 26;
    const win = el(`<section class="win" data-k="${k}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">
      <header class="wh"><b>${TITLES[k] || k}</b>
        <button class="wb floatb" data-a="float" title="Decolar (flutuar) / encaixar colado">⤢</button>
        <button class="wb pinb" data-a="pin" title="Fixar tela (trava posição/tamanho) ou deixar flutuante">📌</button>
        <button class="wb" data-a="min" title="Minimizar">–</button>
        <button class="wb" data-a="max" title="Maximizar / restaurar">▢</button>
        <button class="wb" data-a="close" title="Fechar">✕</button></header>
      <div class="wbody">${content(k)}</div><div class="rz n" data-d="n"></div><div class="rz s" data-d="s"></div><div class="rz w" data-d="w" title="Arraste para mover a parede entre as telas"></div><div class="rz e" data-d="e" title="Arraste para mover a parede entre as telas"></div><div class="rz nw" data-d="nw"></div><div class="rz ne" data-d="ne"></div><div class="rz sw" data-d="sw"></div><div class="rz se" data-d="se"></div></section>`);
    if (st && st.docked) { win.classList.add('docked'); }
    if (st && st.pin) { win.classList.add('pin'); win.querySelector('.pinb').classList.add('on'); win.querySelector('.pinb').title = 'Tela fixada — clique para deixar flutuante' }
    deck().append(win);
    afterMount(k);
    focus(win);
    dragify(win);
    win.querySelectorAll('.wb').forEach(b => b.onclick = (ev) => {
      ev.stopPropagation();
      const act = b.dataset.a;
      if (act === 'float') { toggleFloat(win); return; }
      if (act === 'pin') {
        const pinned = win.classList.toggle('pin');
        b.classList.toggle('on', pinned);
        b.title = pinned ? 'Tela fixada — clique para deixar flutuante' : 'Fixar tela (trava posição/tamanho) ou deixar flutuante';
        if (window.toast) toast(pinned ? '📌 Tela fixada no lugar' : 'Tela flutuante — arraste à vontade');

      }

    tasks();

    return win;
  }
  function focus(win) {
    document.querySelectorAll('.win.focus').forEach(w => w.classList.remove('focus'));
    win.classList.add('focus'); win.style.zIndex = ++z; tasks();
  }
  function maximize(win) {
    const a = area();

  function persist() {
    document.querySelectorAll('.win').forEach(w => {
      ui.wins[w.dataset.k] = { x: parseFloat(w.style.left), y: parseFloat(w.style.top), w: parseFloat(w.style.width), h: parseFloat(w.style.height), pin: w.classList.contains('pin'), docked: w.classList.contains('docked') };

  }
  /* ---------- ENCAIXE MAGNÉTICO (parede colante, sem sobreposição) ---------- */
  function snapCss() {
    if (document.getElementById('snapcss')) return;
    const s = document.createElement('style'); s.id = 'snapcss';
    s.textContent = `#snapghost{position:fixed;z-index:99998;display:none;pointer-events:none;border-radius:12px;
      border:2px dashed rgba(86,217,255,.85);background:linear-gradient(180deg,rgba(86,217,255,.16),rgba(239,20,39,.10));
      box-shadow:0 0 24px rgba(86,217,255,.35),inset 0 0 40px rgba(86,217,255,.10);transition:left .09s,top .09s,width .09s,height .09s}
    #snapghost.on{display:block}
    #snapghost b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:700 12px 'Sora',sans-serif;
      color:#dff3ff;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 10px rgba(86,217,255,.6)}
    .snapline{position:fixed;z-index:99997;background:rgba(239,20,39,.85);box-shadow:0 0 10px rgba(239,20,39,.8);pointer-events:none}
    .win.dragging{opacity:.88;filter:drop-shadow(0 18px 34px rgba(0,0,0,.55))}`;
    document.head.append(s);
  }
  function ghost() {
    snapCss();
    let g = document.getElementById('snapghost');
    if (!g) { g = el('<div id="snapghost"><b></b></div>'); document.body.append(g) }

  }
  function showGhost(r, label) {
    const g = ghost();
    Object.assign(g.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });

  }
  function hideGhost() { const g = document.getElementById('snapghost'); if (g) g.classList.remove('on'); clearLines() }
  function clearLines() { document.querySelectorAll('.snapline').forEach(l => l.remove()) }
  function line(vertical, pos, from, to) {
    snapCss();
    const d = el('<div class="snapline"></div>');
    if (vertical) Object.assign(d.style, { left: pos + 'px', top: from + 'px', width: '2px', height: (to - from) + 'px' });
    else Object.assign(d.style, { top: pos + 'px', left: from + 'px', height: '2px', width: (to - from) + 'px' });

  const rectOf = (w) => ({ x: parseFloat(w.style.left) || 0, y: parseFloat(w.style.top) || 0, w: w.offsetWidth, h: w.offsetHeight });
  const others = (win) => [...document.querySelectorAll('.win:not(.min)')].filter(w => w !== win);

  /* zona de encaixe na borda da área (estilo Photoshop/Filmora) */
  function zoneAt(px, py, win) {
    const a = area(), g = 0, m = 46;
    if (px < a.x - 40 || px > a.x + a.w + 40 || py < a.y - 40 || py > a.y + a.h + 40) return null;
    const hw = (a.w - g) / 2, hh = (a.h - g) / 2;
    const L = px - a.x < m, R = a.x + a.w - px < m, T = py - a.y < m, B = a.y + a.h - py < m;
    if (T && !L && !R) return { r: { x: a.x, y: a.y, w: a.w, h: a.h }, l: 'Tela cheia' };
    if (L && T) return { r: { x: a.x, y: a.y, w: hw, h: hh }, l: 'Canto sup. esq.' };
    if (R && T) return { r: { x: a.x + hw + g, y: a.y, w: hw, h: hh }, l: 'Canto sup. dir.' };
    if (L && B) return { r: { x: a.x, y: a.y + hh + g, w: hw, h: hh }, l: 'Canto inf. esq.' };
    if (R && B) return { r: { x: a.x + hw + g, y: a.y + hh + g, w: hw, h: hh }, l: 'Canto inf. dir.' };
    if (L) return { r: { x: a.x, y: a.y, w: hw, h: a.h }, l: 'Coluna esquerda' };
    if (R) return { r: { x: a.x + hw + g, y: a.y, w: hw, h: a.h }, l: 'Coluna direita' };
    if (B) return { r: { x: a.x, y: a.y + hh + g, w: a.w, h: hh }, l: 'Metade de baixo' };
    return null;
  }
  /* encaixe colado nas bordas de outra tela (dividindo o espaço, sem sobrepor) */
  function dockAt(px, py, win) {
    const a = area(), g = 0;
    for (const o of others(win)) {
      const r = rectOf(o);
      if (px < r.x || px > r.x + r.w || py < r.y || py > r.y + r.h) continue;
      const fx = (px - r.x) / r.w, fy = (py - r.y) / r.h;
      const edge = Math.min(fx, 1 - fx, fy, 1 - fy);
      if (edge > .3) return null; // centro = trocar/livre
      const hw = (r.w - g) / 2, hh = (r.h - g) / 2;
      if (edge === fx) return { r: { x: r.x, y: r.y, w: hw, h: r.h }, l: 'Colar à esquerda', host: o, hr: { x: r.x + hw + g, y: r.y, w: hw, h: r.h } };
      if (edge === 1 - fx) return { r: { x: r.x + hw + g, y: r.y, w: hw, h: r.h }, l: 'Colar à direita', host: o, hr: { x: r.x, y: r.y, w: hw, h: r.h } };
      if (edge === fy) return { r: { x: r.x, y: r.y, w: r.w, h: hh }, l: 'Colar acima', host: o, hr: { x: r.x, y: r.y + hh + g, w: r.w, h: hh } };
      return { r: { x: r.x, y: r.y + hh + g, w: r.w, h: hh }, l: 'Colar abaixo', host: o, hr: { x: r.x, y: r.y, w: r.w, h: hh } };
    }
    return null;
  }
  function applyRect(w, r) { Object.assign(w.style, { left: Math.round(r.x) + 'px', top: Math.round(r.y) + 'px', width: Math.round(r.w) + 'px', height: Math.round(r.h) + 'px' }); delete w.dataset.max }

  /* ímã: alinha bordas com a área e com as outras telas */
  function magnet(win, x, y, w, h) {
    const a = area(), T = 12, gu = [];
    const xs = [a.x, a.x + a.w], ys = [a.y, a.y + a.h];
    others(win).forEach(o => { const r = rectOf(o); xs.push(r.x, r.x + r.w); ys.push(r.y, r.y + r.h) });
    let bx = null, by = null;
    xs.forEach(v => {
      if (Math.abs(x - v) < T && (bx === null || Math.abs(x - v) < Math.abs(x - bx))) bx = v;
      if (Math.abs(x + w - v) < T) { const c = v - w; if (bx === null || Math.abs(x - c) < Math.abs(x - bx)) bx = c }
    });
    ys.forEach(v => {
      if (Math.abs(y - v) < T && (by === null || Math.abs(y - v) < Math.abs(y - by))) by = v;
      if (Math.abs(y + h - v) < T) { const c = v - h; if (by === null || Math.abs(y - c) < Math.abs(y - by)) by = c }
    });
    if (bx !== null) { x = bx; gu.push([true, x <= a.x + 1 ? x : x, a.y, a.y + a.h]) }
    if (by !== null) { y = by; gu.push([false, y, a.x, a.x + a.w]) }
    clearLines(); gu.forEach(g => line(g[0], g[1], g[2], g[3]));
    return { x, y };
  }

  /* empurra telas para que nada fique sobreposto (parede colante) */
  function unoverlap(win) {
    if (ui.snap === false) return;
    if (win.classList.contains('docked')) return;
    const a = area(), g = 0, r = rectOf(win);
    others(win).forEach(o => {
      if (o.classList.contains('docked') || o.classList.contains('pin')) return;
      const q = rectOf(o);
      const ox = Math.min(r.x + r.w, q.x + q.w) - Math.max(r.x, q.x);
      const oy = Math.min(r.y + r.h, q.y + q.h) - Math.max(r.y, q.y);
      if (ox <= 0 || oy <= 0) return;
      if (ox < oy) { // desloca/encolhe na horizontal
        if (q.x + q.w / 2 < r.x + r.w / 2) { const nx = r.x + r.w + g; if (nx + q.w <= a.x + a.w) applyRect(o, { ...q, x: nx }); else applyRect(o, { x: nx, y: q.y, w: Math.max(240, a.x + a.w - nx), h: q.h }) }
        else { const nx = r.x - g - q.w; if (nx >= a.x) applyRect(o, { ...q, x: nx }); else applyRect(o, { x: a.x, y: q.y, w: Math.max(240, r.x - g - a.x), h: q.h }) }
      } else {
        if (q.y + q.h / 2 < r.y + r.h / 2) { const ny = r.y + r.h + g; if (ny + q.h <= a.y + a.h) applyRect(o, { ...q, y: ny }); else applyRect(o, { x: q.x, y: ny, w: q.w, h: Math.max(150, a.y + a.h - ny) }) }
        else { const ny = r.y - g - q.h; if (ny >= a.y) applyRect(o, { ...q, y: ny }); else applyRect(o, { x: q.x, y: a.y, w: q.w, h: Math.max(150, r.y - g - a.y) }) }
      }
    });
  }

  const MINW = 260, MINH = 150, TOL = 8;

  /* vizinhos colados no lado que está sendo puxado */
  function neighbors(win, dir) {
    const r = rectOf(win), out = [];
    others(win).forEach(o => {
      if (o.classList.contains('pin')) return;
      const q = rectOf(o);
      const vOver = Math.min(r.y + r.h, q.y + q.h) - Math.max(r.y, q.y) > 8;
      const hOver = Math.min(r.x + r.w, q.x + q.w) - Math.max(r.x, q.x) > 8;
      if (dir.includes('e') && vOver && Math.abs(q.x - (r.x + r.w)) <= TOL) out.push({ el: o, side: 'e', b: q });
      if (dir.includes('w') && vOver && Math.abs((q.x + q.w) - r.x) <= TOL) out.push({ el: o, side: 'w', b: q });
      if (dir.includes('s') && hOver && Math.abs(q.y - (r.y + r.h)) <= TOL) out.push({ el: o, side: 's', b: q });
      if (dir.includes('n') && hOver && Math.abs((q.y + q.h) - r.y) <= TOL) out.push({ el: o, side: 'n', b: q });
    });
    return out;
  }

  function toggleFloat(win) {
    const b = win.querySelector('.floatb');
    if (win.classList.contains('docked')) {
      win.classList.remove('docked');
      const r = rectOf(win);
      applyRect(win, { x: r.x + 18, y: r.y + 18, w: Math.max(MINW, r.w - 36), h: Math.max(MINH, r.h - 36) });
      focus(win);
      if (b) { b.classList.remove('on'); b.title = 'Encaixar colado às outras telas' }
      window.toast && toast('Tela decolada — agora flutua livremente');
    } else {
      glue(win);
      win.classList.add('docked');
      if (b) { b.classList.add('on'); b.title = 'Decolar (deixar flutuante)' }
      window.toast && toast('Tela colada — encaixada sem sobrepor');
    }
    persist();
  }

  /* cola a tela na borda mais próxima (outra tela ou área) */
  function glue(win) {
    const a = area(), r = rectOf(win);
    let x = r.x, y = r.y, w = r.w, h = r.h, best = 1e9, cand = null;
    others(win).forEach(o => {
      const q = rectOf(o);
      [['e', Math.abs(r.x - (q.x + q.w)), { x: q.x + q.w, y: q.y, w: Math.max(MINW, a.x + a.w - (q.x + q.w)), h: q.h }],
       ['w', Math.abs((r.x + r.w) - q.x), { x: Math.max(a.x, q.x - r.w), y: q.y, w: Math.min(r.w, q.x - a.x) || MINW, h: q.h }],
       ['s', Math.abs(r.y - (q.y + q.h)), { x: q.x, y: q.y + q.h, w: q.w, h: Math.max(MINH, a.y + a.h - (q.y + q.h)) }],
       ['n', Math.abs((r.y + r.h) - q.y), { x: q.x, y: Math.max(a.y, q.y - r.h), w: q.w, h: Math.min(r.h, q.y - a.y) || MINH }]
      ].forEach(([, d, rect]) => { if (d < best) { best = d; cand = rect } });
    });
    if (cand && best < 220) applyRect(win, cand);
    else applyRect(win, { x: Math.max(a.x, Math.min(x, a.x + a.w - w)), y: Math.max(a.y, Math.min(y, a.y + a.h - h)), w, h });
  }

  function dragify(win) {
    const head = win.querySelector('.wh');
    let mode = null, dir = '', sx = 0, sy = 0, base = {}, target = null, pairs = [];
    const down = (m, d) => (e) => {
      if (e.target.closest('.wb')) return;
      if (win.classList.contains('pin')) { if (window.toast) toast('Tela fixada — desfixe com o 📌 para mover'); return; }
      if (m === 'drag' && win.classList.contains('docked')) {
        if (window.toast) toast('Tela colada — clique em ⤢ para decolar e deixar flutuante');
        focus(win); return;
      }
      mode = m; dir = d || 'se'; sx = e.clientX; sy = e.clientY; target = null;
      base = { x: parseFloat(win.style.left), y: parseFloat(win.style.top), w: win.offsetWidth, h: win.offsetHeight };
      pairs = (m === 'size') ? neighbors(win, dir) : [];
      focus(win); win.setPointerCapture?.(e.pointerId);
      if (m === 'drag') win.classList.add('dragging');
      addEventListener('pointermove', move); addEventListener('pointerup', up, { once: true });
      e.preventDefault();
    };
    const move = (e) => {
      if (!mode) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      const on = ui.snap !== false;
      if (mode === 'drag') {
        let x = base.x + dx, y = base.y + dy;
        target = on ? (zoneAt(e.clientX, e.clientY, win) || dockAt(e.clientX, e.clientY, win)) : null;
        if (target) { showGhost(target.r, target.l); clearLines() }
        else {
          hideGhost();
          if (on) { const p = magnet(win, x, y, base.w, base.h); x = p.x; y = p.y }
        }
        win.style.left = Math.max(2, Math.min(innerWidth - 80, x)) + 'px';
        win.style.top = Math.max(2, Math.min(innerHeight - 60, y)) + 'px';
        return;
      }
      /* ---- redimensionar por qualquer lateral / canto ---- */
      let x = base.x, y = base.y, w = base.w, h = base.h;
      let ddx = dx, ddy = dy;
      pairs.forEach(p => {
        if (p.side === 'e') ddx = Math.min(ddx, p.b.w - MINW);
        if (p.side === 'w') ddx = Math.max(ddx, MINW - p.b.w);
        if (p.side === 's') ddy = Math.min(ddy, p.b.h - MINH);
        if (p.side === 'n') ddy = Math.max(ddy, MINH - p.b.h);
      });
      if (dir.includes('e')) w = Math.max(MINW, base.w + ddx);
      if (dir.includes('s')) h = Math.max(MINH, base.h + ddy);
      if (dir.includes('w')) { const nw = Math.max(MINW, base.w - ddx); x = base.x + (base.w - nw); w = nw }
      if (dir.includes('n')) { const nh = Math.max(MINH, base.h - ddy); y = base.y + (base.h - nh); h = nh }
      if (!pairs.length && ui.snap !== false && !win.classList.contains('docked')) {
        const p = magnet(win, x + w, y + h, 0, 0);
        if (dir.includes('e')) w = Math.max(MINW, p.x - x);
        if (dir.includes('s')) h = Math.max(MINH, p.y - y);
      }
      applyRect(win, { x, y, w, h });
      /* arrasta junto as telas coladas — a parede compartilhada se move */
      pairs.forEach(p => {
        const q = p.b;
        if (p.side === 'e') applyRect(p.el, { x: x + w, y: q.y, w: Math.max(MINW, (q.x + q.w) - (x + w)), h: q.h });
        if (p.side === 'w') applyRect(p.el, { x: q.x, y: q.y, w: Math.max(MINW, x - q.x), h: q.h });
        if (p.side === 's') applyRect(p.el, { x: q.x, y: y + h, w: q.w, h: Math.max(MINH, (q.y + q.h) - (y + h)) });
        if (p.side === 'n') applyRect(p.el, { x: q.x, y: q.y, w: q.w, h: Math.max(MINH, y - q.y) });
      });
    };
    const up = () => {
      const was = mode; mode = null;
      removeEventListener('pointermove', move);
      win.classList.remove('dragging'); hideGhost();
      if (target) {
        applyRect(win, target.r);
        win.classList.add('docked');
        const fb = win.querySelector('.floatb'); if (fb) { fb.classList.add('on'); fb.title = 'Decolar (deixar flutuante)' }
        if (target.host && target.hr) {
          applyRect(target.host, target.hr);
          target.host.classList.add('docked');
          const hb = target.host.querySelector('.floatb'); if (hb) { hb.classList.add('on'); hb.title = 'Decolar (deixar flutuante)' }
        }
        target = null;
      }
      else if (was === 'drag') unoverlap(win);
      ui.layout = 'free'; persist();
    };
    head.addEventListener('pointerdown', down('drag'));
    win.querySelectorAll('.rz').forEach(hd => hd.addEventListener('pointerdown', down('size', hd.dataset.d)));
    head.addEventListener('dblclick', () => maximize(win));
  }

  /* layouts automáticos (estilo Filmora) */
  const LAYOUTS = ['free', 'cols', 'rows', 'grid', 'cascade'];
  function arrange(mode) {
    ui.layout = mode; ui.tiled = (mode !== 'cascade' && mode !== 'free'); saveUI();
    const wins = [...document.querySelectorAll('.win:not(.min)')];
    if (!wins.length) return;
    const a = area(), g = 0, n = wins.length;
    wins.forEach(w => delete w.dataset.max);
    if (mode === 'cascade') {
      wins.forEach((w, i) => Object.assign(w.style, {
        left: a.x + i * 34 + 'px', top: a.y + i * 30 + 'px',
        width: Math.min(a.w - i * 34, Math.max(380, a.w * .66)) + 'px', height: Math.min(a.h - i * 30, a.h * .8) + 'px'
      }));
    } else {
      let cols = n, rows = 1;
      if (mode === 'rows') { cols = 1; rows = n }
      if (mode === 'grid') { cols = Math.ceil(Math.sqrt(n)); rows = Math.ceil(n / cols) }
      if (mobile()) { cols = 1; rows = n }
      const cw = (a.w - g * (cols - 1)) / cols, ch = (a.h - g * (rows - 1)) / rows;
      wins.forEach((w, i) => {
        const c = i % cols, r = Math.floor(i / cols);
        Object.assign(w.style, { left: a.x + c * (cw + g) + 'px', top: a.y + r * (ch + g) + 'px', width: cw + 'px', height: ch + 'px' });
      });
    }
    if (mode !== 'cascade') wins.forEach(w => { w.classList.add('docked'); const b = w.querySelector('.floatb'); if (b) { b.classList.add('on'); b.title = 'Decolar (deixar flutuante)' } });
    else wins.forEach(w => { w.classList.remove('docked'); const b = w.querySelector('.floatb'); if (b) b.classList.remove('on') });
    persist();
  }
  function cycleLayout() {
    const i = LAYOUTS.indexOf(ui.layout || 'free');
    const next = LAYOUTS[(i + 1) % LAYOUTS.length];
    if (next === 'free') { ui.layout = 'free'; saveUI(); window.toast && toast('Layout livre — arraste as telas') }
    else { arrange(next); window.toast && toast('Layout: ' + ({ cols: 'colunas', rows: 'linhas', grid: 'grade', cascade: 'cascata' }[next])) }
  }

  function tasks() {
    const bar = document.getElementById('taskbar'); if (!bar) return;
    const wins = [...document.querySelectorAll('.win')];
    bar.innerHTML = wins.map(w => `<button class="tb ${w.classList.contains('focus') && !w.classList.contains('min') ? 'act' : ''}" data-k="${w.dataset.k}">
      ${w.classList.contains('min') ? '▫' : '▪'} ${TITLES[w.dataset.k] || w.dataset.k}</button>`).join('')
      + `<span class="sp">${wins.length} tela(s) · multitelas ativo</span>`;
    bar.querySelectorAll('.tb').forEach(b => b.onclick = () => {
      const w = document.querySelector(`.win[data-k="${b.dataset.k}"]`);
      if (!w) return;
      if (w.classList.contains('min')) { w.classList.remove('min'); focus(w) }
      else if (w.classList.contains('focus')) { w.classList.add('min'); tasks() }
      else focus(w);
    });
    persist();
  }
  function refresh(k) {
    const list = k ? [document.querySelector(`.win[data-k="${k}"]`)] : [...document.querySelectorAll('.win')];
    list.filter(Boolean).forEach(w => {
      const key = w.dataset.k, body = w.querySelector('.wbody'), sc = body.scrollTop;
      body.innerHTML = content(key); body.scrollTop = sc; afterMount(key);
    });
  }
  function toggleDeck(on) {
    ui.deck = on === undefined ? !ui.deck : on;
    document.body.classList.toggle('deck-on', ui.deck);
    document.getElementById('r-deck')?.classList.toggle('on', ui.deck);
    const mtB = document.getElementById('btn-mt'), mtS = document.getElementById('btn-mt-st');
    if (mtB) mtB.classList.toggle('primary', ui.deck);
    if (mtS) mtS.textContent = ui.deck ? 'ligado' : 'desligado';
    saveUI();
    if (ui.deck) {
      if (!document.querySelector('.win')) (ui.open && ui.open.length ? ui.open : ['interface', 'dashboard']).forEach(k => openWin(k, true));
      if (ui.layout && ui.layout !== 'free') arrange(ui.layout); else tileAll();
    } else { window.render && render() }
  }


  /* ---------------- ENCAIXE EM GRADE + MENUS DO RAIL ---------------- */
  function tileAll() {
    const n = document.querySelectorAll('.win:not(.min)').length;
    if (!n) return;
    const cols = mobile() ? 1 : Math.ceil(Math.sqrt(n));
    arrangeGrid(cols, Math.ceil(n / cols));
  }
  function arrangeGrid(cols, rows) {
    const wins = [...document.querySelectorAll('.win:not(.min)')];
    if (!wins.length) return;
    const a = area(), g = 0;
    if (mobile()) { cols = 1; rows = wins.length }
    rows = Math.max(rows, Math.ceil(wins.length / cols));
    const cw = (a.w - g * (cols - 1)) / cols, ch = (a.h - g * (rows - 1)) / rows;
    wins.forEach(w => delete w.dataset.max);
    wins.forEach((w, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      Object.assign(w.style, { left: a.x + c * (cw + g) + 'px', top: a.y + r * (ch + g) + 'px', width: cw + 'px', height: ch + 'px' });
    });
    wins.forEach(w => { w.classList.add('docked'); const b = w.querySelector('.floatb'); if (b) { b.classList.add('on'); b.title = 'Decolar (deixar flutuante)' } });
    ui.layout = 'free'; ui.tiled = true; saveUI(); persist();
  }
  function arrangeMain() {
    const wins = [...document.querySelectorAll('.win:not(.min)')];
    if (!wins.length) return;
    const a = area(), g = 0;
    if (wins.length === 1 || mobile()) return arrangeGrid(1, wins.length);
    const mw = Math.round(a.w * .62), sw = a.w - mw - g, n = wins.length - 1;
    const sh = (a.h - g * (n - 1)) / n;
    wins.forEach(w => delete w.dataset.max);
    Object.assign(wins[0].style, { left: a.x + 'px', top: a.y + 'px', width: mw + 'px', height: a.h + 'px' });
    wins.slice(1).forEach((w, i) => Object.assign(w.style, {
      left: a.x + mw + g + 'px', top: a.y + i * (sh + g) + 'px', width: sw + 'px', height: sh + 'px'
    }));
    wins.forEach(w => { w.classList.add('docked'); const b = w.querySelector('.floatb'); if (b) { b.classList.add('on'); b.title = 'Decolar (deixar flutuante)' } });
    ui.layout = 'free'; ui.tiled = true; saveUI(); persist();
  }
  function fitAll() {
    const wins = [...document.querySelectorAll('.win:not(.min)')];
    const a = area();
    wins.forEach(w => {
      delete w.dataset.max;
      const wd = Math.min(parseFloat(w.style.width) || 480, a.w), ht = Math.min(parseFloat(w.style.height) || 360, a.h);
      const lf = Math.min(Math.max(parseFloat(w.style.left) || a.x, a.x), a.x + a.w - wd);
      const tp = Math.min(Math.max(parseFloat(w.style.top) || a.y, a.y), a.y + a.h - ht);
      Object.assign(w.style, { left: lf + 'px', top: tp + 'px', width: wd + 'px', height: ht + 'px' });
    });
    persist();
  }
  const gi = (c, r) => {
    let s = '';
    for (let i = 0; i < c * r; i++) s += '<span></span>';
    return `<i class="gi" style="grid-template-columns:repeat(${c},1fr);grid-template-rows:repeat(${r},1fr)">${s}</i>`;
  };
  function railMenus(rail) {
    const need = () => { if (!ui.deck) { toggleDeck(true); return new Promise(r => requestAnimationFrame(() => r())) } return Promise.resolve() };
    const menus = {
      'r-layout': () => ({
        groups: [
          { h: 'Layout', items: [
            { l: 'Livre (arrastar)', on: (ui.layout || 'free') === 'free', fn: () => { ui.layout = 'free'; saveUI(); window.toast && toast('Layout livre — arraste as telas') } },
            { l: 'Colunas', on: ui.layout === 'cols', fn: () => arrange('cols') },
            { l: 'Linhas', on: ui.layout === 'rows', fn: () => arrange('rows') },
            { l: 'Grade automática', on: ui.layout === 'grid', fn: () => arrange('grid') },
            { l: 'Cascata', on: ui.layout === 'cascade', fn: () => arrange('cascade') } ] },
          { h: 'Acomodar no espaço', items: [
            { l: '2 telas lado a lado', i: gi(2, 1), fn: () => arrangeGrid(2, 1) },
            { l: '3 telas lado a lado', i: gi(3, 1), fn: () => arrangeGrid(3, 1) },
            { l: 'Grade 2 × 2', i: gi(2, 2), fn: () => arrangeGrid(2, 2) },
            { l: 'Grade 3 × 2', i: gi(3, 2), fn: () => arrangeGrid(3, 2) },
            { l: 'Principal + laterais', i: gi(2, 1), fn: () => arrangeMain() },
            { l: 'Acomodar todas (grade cheia)', i: gi(2, 2), fn: () => tileAll() },
            { l: 'Ajustar tudo à área', fn: () => fitAll() } ] },
          { h: 'Novas telas', items: [
            { l: 'Acomodar automaticamente', on: ui.tiled !== false, fn: () => { ui.tiled = true; saveUI(); tileAll(); window.toast && toast('Novas telas serão acomodadas') } },
            { l: 'Abrir flutuando', on: ui.tiled === false, fn: () => { ui.tiled = false; saveUI(); window.toast && toast('Novas telas abrem flutuando') } } ] },
          { h: 'Encaixe ao arrastar', items: [
            { l: 'Colar e organizar (sem sobrepor)', on: ui.snap !== false, fn: () => { ui.snap = true; saveUI(); window.toast && toast('Encaixe magnético ligado') } },
            { l: 'Livre total (pode sobrepor)', on: ui.snap === false, fn: () => { ui.snap = false; saveUI(); window.toast && toast('Arraste livre — sobreposição permitida') } } ] }

        ], pre: need
      }),
      'r-dock': () => ({ groups: [{ h: 'Posição do menu', items: DOCKS.map(d => ({
        l: DOCK_LBL[d], on: ui.dock === d, fn: () => { ui.dock = d; saveUI(); applyDock(); window.toast && toast(DOCK_LBL[d]) } })) }] }),
      'r-deck': () => ({ groups: [{ h: 'Multitelas', items: [
        { l: 'Ativar multitelas', on: !!ui.deck, fn: () => toggleDeck(true) },
        { l: 'Tela única', on: !ui.deck, fn: () => toggleDeck(false) } ] }] }),
      'r-fx': () => ({ groups: [{ h: 'Efeitos', items: [
        { l: 'Efeitos ligados', on: !!ui.fx, fn: () => { ui.fx = true; saveUI(); document.body.classList.remove('jfx-off') } },
        { l: 'Efeitos desligados', on: !ui.fx, fn: () => { ui.fx = false; saveUI(); document.body.classList.add('jfx-off') } } ] }] })
    };
    let t = null;
    Object.keys(menus).forEach(id => {
      const btn = rail.querySelector('#' + id), wrap = btn.parentElement;
      const box = el('<div class="railmenu"></div>');
      wrap.append(box);
      const build = () => {
        const cfg = menus[id]();
        box.innerHTML = cfg.groups.map((g, k) => (k ? '<div class="msep"></div>' : '') + `<div class="mh">${g.h}</div>` +
          g.items.map((it, j) => `<div class="mi ${it.on ? 'act' : ''}" data-g="${k}" data-j="${j}">${it.i || ''}<span>${it.l}</span></div>`).join('')).join('');
        box.querySelectorAll('.mi').forEach(d => d.onclick = async () => {
          const it = cfg.groups[+d.dataset.g].items[+d.dataset.j];
          if (cfg.pre) await cfg.pre();
          it.fn(); build(); close();
        });
      };
      const open = () => { clearTimeout(t); document.querySelectorAll('.railmenu.open').forEach(m => m !== box && m.classList.remove('open')); build(); box.classList.add('open') };
      const close = () => { clearTimeout(t); t = setTimeout(() => box.classList.remove('open'), 220) };
      wrap.addEventListener('pointerenter', open);
      wrap.addEventListener('pointerleave', close);
      box.addEventListener('pointerenter', () => clearTimeout(t));
      box.addEventListener('pointerleave', close);
    });
    addEventListener('pointerdown', e => { if (!e.target.closest('#rail')) document.querySelectorAll('.railmenu.open').forEach(m => m.classList.remove('open')) });
  }

  /* ---------------- LUPA (busca global) ---------------- */
  function dataset() {
    const s = window.state || {}, out = [];
    const add = (tipo, titulo, sub, k, id) => out.push({ tipo, titulo, sub: sub || '', k, id });
    Object.keys(TITLES).forEach(k => add('tela', TITLES[k], 'abrir tela', k));
    (s.itens || []).forEach(i => add('item', i.desc || i.descricao || '(sem descrição)', [i.categoria, i.qtd && ('qtd ' + i.qtd + ' ' + (i.un || ''))].filter(Boolean).join(' · '), 'itens'));
    (s.pedidos || []).forEach(p => add('pedido', `#${p.numero || '—'} ${p.fornecedor || ''}`, [p.status, p.prazo && ('prazo ' + p.prazo)].filter(Boolean).join(' · '), 'pedidos'));
    (s.eventos || []).forEach(e => add('evento', e.titulo, [e.data, e.hora, e.local].filter(Boolean).join(' · '), 'eventos'));
    (s.atividades || []).forEach(a => add('atividade', a.titulo, [a.tipo, a.prazo].filter(Boolean).join(' · '), 'atividades'));
    (s.sends || []).forEach(x => add('send', x.assunto || '(sem assunto)', [x.status, x.data].filter(Boolean).join(' · '), 'send'));
    (s.servicos || []).forEach(p => {
      add('pasta', p.nome, 'pasta de serviço', 'servicos');
      (p.sub || []).forEach(sb => { add('subpasta', sb.nome, p.nome, 'servicos'); (sb.itens || []).forEach(it => add('arquivo', String(it), p.nome + ' / ' + sb.nome, 'servicos')) });
    });
    (s.links || []).forEach(l => add('link', l.nome || l.titulo || l.url, l.url || '', 'links'));
    (s.remotos || s.remoto || []).forEach(r => add('remoto', r.nome || r.host, r.host || '', 'remoto'));
    return out;
  }
  const norm = (v) => String(v || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  let sel = 0, hits = [];
  function search(q) {
    const t = norm(q).split(/\s+/).filter(Boolean);
    const base = dataset();
    hits = (!t.length ? base.filter(r => r.tipo === 'tela') : base.filter(r => {
      const hay = norm(r.tipo + ' ' + r.titulo + ' ' + r.sub);
      return t.every(w => hay.includes(w));
    })).slice(0, 60);
    sel = 0; paint();
  }
  function paint() {
    const box = document.getElementById('lupa-res');
    box.innerHTML = hits.length ? hits.map((r, i) => `<div class="r ${i === sel ? 'sel' : ''}" data-i="${i}">
      <span class="k">${r.tipo}</span><span class="tx"><b>${esc(r.titulo)}</b><small>${esc(r.sub)}</small></span></div>`).join('')
      : `<div class="r"><span class="tx"><b>Nada encontrado</b><small>tente outro termo</small></span></div>`;
    box.querySelectorAll('.r[data-i]').forEach(d => d.onclick = () => { sel = +d.dataset.i; pick() });
    box.querySelector('.r.sel')?.scrollIntoView({ block: 'nearest' });
  }
  function pick() {
    const r = hits[sel]; if (!r) return;
    closeLupa();
    if (ui.deck) { openWin(r.k); focus(document.querySelector(`.win[data-k="${r.k}"]`)) }
    else window.go && go(r.k);
    if (r.tipo !== 'tela') window.toast && toast(r.tipo.toUpperCase() + ': ' + r.titulo);
  }
  function openLupa() {
    document.getElementById('lupa').classList.add('open');
    const i = document.getElementById('lupa-q'); i.value = ''; i.focus(); search('');
  }
  function closeLupa() { document.getElementById('lupa').classList.remove('open') }

  /* ---------------- MONTAGEM ---------------- */
  function mount() {
    fxLayer();
    if (!document.getElementById('deck')) document.body.append(el('<div id="deck"></div>'));
    if (!document.getElementById('taskbar')) document.body.append(el('<div id="taskbar"></div>'));
    if (!document.getElementById('rail')) {
      const ICON_LUPA = '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>';
      const ICON_MULT = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>';
      const ICON_LAYOUT = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="8" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/><rect x="13" y="14" width="8" height="7" rx="1.5"/></svg>';
      const ICON_DOCK = '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
      const ICON_FX = '<svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2h7.6l-6 4.8 2.4 7.2-6-4.8-6 4.8 2.4-7.2-6-4.8h7.6z"/></svg>';
      const rail = el(`<div id="rail">
        <button id="r-lupa" title="Buscar (Ctrl+K)">${ICON_LUPA}</button><span class="sep"></span>
        <span class="rwrap"><button id="r-deck" title="Multitelas ligado/desligado">${ICON_MULT}</button></span>
        <span class="rwrap"><button id="r-layout" title="Layout das telas">${ICON_LAYOUT}</button></span>
        <span class="rwrap"><button id="r-dock" title="Posição do menu">${ICON_DOCK}</button></span>
        <span class="rwrap"><button id="r-fx" title="Efeitos JARVIS">${ICON_FX}</button></span></div>`);
      document.body.append(rail);
      rail.querySelector('#r-lupa').onclick = openLupa;
      rail.querySelector('#r-deck').onclick = () => toggleDeck();
      rail.querySelector('#r-layout').onclick = cycleLayout;
      rail.querySelector('#r-dock').onclick = cycleDock;
      rail.querySelector('#r-fx').onclick = () => { ui.fx = !ui.fx; saveUI(); document.body.classList.toggle('jfx-off', !ui.fx) };
      railMenus(rail);
    }
    if (!document.getElementById('lupa')) {
      const l = el(`<div id="lupa"><div class="box">
        <div class="head"><span>🔍</span><input id="lupa-q" placeholder="Buscar item, pedido, evento, pasta, tela…" autocomplete="off"/></div>
        <div class="res" id="lupa-res"></div>
        <div class="foot"><span>↑↓ navegar</span><span>Enter abrir</span><span>Esc fechar</span><span>Ctrl+K a qualquer momento</span></div>
      </div></div>`);
      document.body.append(l);
      l.addEventListener('click', e => { if (e.target === l) closeLupa() });
      l.querySelector('#lupa-q').addEventListener('input', e => search(e.target.value));
    }
    applyDock();
    document.getElementById('r-deck').classList.toggle('on', !!ui.deck);
    if (ui.deck) { ui.deck = false; toggleDeck(true) }
  }

  addEventListener('keydown', e => {
    const open = document.getElementById('lupa')?.classList.contains('open');
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' || e.key === 'F3') { e.preventDefault(); open ? closeLupa() : openLupa(); return }
    if (!open) return;
    if (e.key === 'Escape') closeLupa();
    else if (e.key === 'ArrowDown') { sel = Math.min(hits.length - 1, sel + 1); paint(); e.preventDefault() }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); paint(); e.preventDefault() }
    else if (e.key === 'Enter') pick();
  });
  addEventListener('resize', () => { if (ui.deck && ui.layout && ui.layout !== 'free') arrange(ui.layout) });

  function hook() {
    if (!window.render || window.__v13) return;
    window.__v13 = true;
    const R = window.render, G = window.go, S = window.start;
    window.render = function () {
      if (ui.deck) {
        const v = document.getElementById('view'); if (v) v.innerHTML = '';
        document.querySelectorAll('.navbtn[data-k]').forEach(b => b.classList.toggle('active', !!document.querySelector(`.win[data-k="${b.dataset.k}"]`)));
        refresh();
        try { window.atualizarStatusbar && atualizarStatusbar() } catch (e) { }
        return;
      }
      return R.apply(this, arguments);
    };
    window.go = function (k) { if (ui.deck) { openWin(k); return } return G.apply(this, arguments) };
    if (S) window.start = function () { const r = S.apply(this, arguments); setTimeout(mount, 0); return r };
    window.MODESK13 = { openWin, arrange, toggleDeck, cycleDock, openLupa, refresh };
    window.toggleMultitelas = function () { toggleDeck(); window.toast && toast(ui.deck ? 'Multitelas ativado' : 'Multitelas desativado') };
  }

  if (document.readyState === 'loading') addEventListener('DOMContentLoaded', init); else init();
  function init() {
    boot(); hook();
    if (!document.getElementById('app')?.classList.contains('hidden')) mount(); else fxLayer();
    const app = document.getElementById('app');
    if (app) new MutationObserver(() => { if (!app.classList.contains('hidden')) mount() }).observe(app, { attributes: true, attributeFilter: ['class'] });
  }
})();

</script>
</body>
</html>
