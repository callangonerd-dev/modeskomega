<style>
:root{
  --bg0:#050a12; --bg1:#060d17; --bg2:#0c131e; --bg3:#111924; --bg4:#131c30;
  --fg:#e7eaf0; --mut:#9aa3b2; --dim:#6d7686;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --acc:#e50914; --acc2:#ff2b3d; --acc3:#ff5a63;
  --warn:#f5b50a; --ok:#22c58b; --info:#4aa3ff;
  --grad:linear-gradient(135deg,#ff2b3d 0%,#e50914 55%,#8f050c 100%);
  --grad2:linear-gradient(135deg,#f5b50a,#e50914);
  --glass:rgba(12,19,30,.62);
  --sh:0 18px 50px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --sh-acc:0 10px 34px rgba(229,9,20,.35);
  --r:16px; --r-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg0);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;font-size:14.5px;line-height:1.55}
body{background:
  radial-gradient(1100px 620px at 88% -12%, rgba(229,9,20,.20), transparent 62%),
  radial-gradient(820px 520px at -10% 108%, rgba(245,181,10,.10), transparent 60%),
  linear-gradient(180deg,#050a12,#060d17 40%,#050a12);
  background-attachment:fixed}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc3);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1c2534;border-radius:9px}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:80;padding:20px;
  background:radial-gradient(900px 500px at 50% 0%,rgba(229,9,20,.22),transparent 60%),#050a12}
.card-login{width:min(420px,100%);background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line2);
  border-radius:22px;padding:30px;box-shadow:var(--sh);animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- LAYOUT ---------- */
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:16px 14px 40px;
  background:linear-gradient(180deg,rgba(12,19,30,.9),rgba(6,13,23,.92));backdrop-filter:blur(16px);border-right:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;padding:10px 8px 18px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-family:'Sora';box-shadow:var(--sh-acc)}
.brand small{color:var(--mut);display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.folder{margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:rgba(17,25,36,.5)}
.folder>.fhead{width:100%;display:flex;align-items:center;gap:11px;padding:13px 13px;background:transparent;border:0;cursor:pointer;font-weight:700;transition:.2s}
.folder>.fhead:hover{background:rgba(229,9,20,.10)}
.folder>.fhead .chev{margin-left:auto;transition:.25s;color:var(--dim)}
.folder.open>.fhead .chev{transform:rotate(90deg);color:var(--acc2)}
.fbody{display:none;padding:6px 8px 10px}
.folder.open .fbody{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.navbtn{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;margin:4px 0;border-radius:12px;border:1px solid transparent;
  background:rgba(255,255,255,.03);cursor:pointer;font-weight:600;font-size:13.6px;transition:.18s;text-align:left}
.navbtn:hover{transform:translateX(4px);border-color:var(--line2);background:rgba(229,9,20,.12)}
.navbtn.active{background:var(--grad);box-shadow:var(--sh-acc);border-color:transparent}
.navbtn .ic{width:26px;height:26px;display:grid;place-items:center;font-size:16px}
.badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
main{padding:22px 26px 70px;max-width:1400px}
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px;position:sticky;top:0;z-index:20;
  padding:14px 16px;border-radius:var(--r);background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--sh)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- UI ---------- */
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:.25s}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 17px;border-radius:12px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);cursor:pointer;font-weight:700;font-size:13.5px;transition:.18s}
.btn:hover{transform:translateY(-2px);border-color:var(--acc2);box-shadow:0 8px 22px rgba(229,9,20,.25)}
.btn.primary{background:var(--grad);border-color:transparent;box-shadow:var(--sh-acc)}
.btn.warn{background:var(--grad2);border-color:transparent;color:#14100a}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
label{display:block;font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 5px}

/* ========== MODESK v8 — REDESIGN CINEMÁTICO / WINDOWS ========== */
:root{
  --bg0:#03060c;--bg1:#070c16;--bg2:#0a111d;--bg3:#101722;--bg4:#151d2a;
  --fg:#f5f7fb;--mut:#9ca7ba;--dim:#6f7b8f;
  --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.15);
  --acc:#ef1427;--acc2:#ff2035;--acc3:#ff6674;
  --warn:#f6b91b;--ok:#28d59a;--info:#5ba9ff;
  --grad:linear-gradient(135deg,#ff273b 0%,#e70c20 58%,#9d0612 100%);
  --grad2:linear-gradient(135deg,#f7c42d,#e7182c);
  --glass:rgba(8,14,24,.78);
  --sh:0 24px 64px rgba(0,0,0,.48),0 1px 0 rgba(255,255,255,.025) inset;
  --sh-acc:0 12px 36px rgba(239,20,39,.26),0 0 0 1px rgba(255,61,77,.13);
  --r:14px;--r-sm:9px;
}
*{scrollbar-color:#8c1020 #070b12}
html{background:#03060c;scroll-behavior:smooth}
body{min-height:100vh;letter-spacing:0;background:
  radial-gradient(900px 700px at 9% 35%,rgba(173,0,23,.25),transparent 66%),
  radial-gradient(1000px 740px at 100% 18%,rgba(20,67,137,.23),transparent 68%),
  linear-gradient(125deg,#06050b 0%,#080d17 48%,#07101e 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 80%)}
::selection{background:rgba(255,32,53,.35);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#070b12}::-webkit-scrollbar-thumb{background:linear-gradient(#b11325,#6e0b18);border-radius:8px}
h1,h2,h3,h4{letter-spacing:0}

/* login */
#login{overflow:hidden;background:radial-gradient(850px 520px at 12% 50%,rgba(209,7,34,.29),transparent 65%),radial-gradient(900px 600px at 100% 0%,rgba(25,69,142,.24),transparent 67%),#050810}
#login:before{content:"MODESK";position:absolute;left:-1.5vw;bottom:-10vh;font:800 clamp(100px,20vw,320px)/1 'Sora',system-ui;color:rgba(255,255,255,.018);letter-spacing:.08em;pointer-events:none}
.card-login{position:relative;width:min(460px,100%);padding:34px;background:rgba(8,14,24,.84);border:1px solid rgba(255,255,255,.12);border-top-color:rgba(255,50,70,.35);border-radius:16px;box-shadow:0 40px 100px rgba(0,0,0,.65),-30px 0 90px rgba(207,7,31,.12);animation:loginIn .7s cubic-bezier(.16,1,.3,1)}
.card-login:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,44,62,.08),transparent 35%)}
@keyframes loginIn{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

/* shell */
.app{grid-template-columns:252px minmax(0,1fr);position:relative}
aside{padding:16px 12px 36px;background:linear-gradient(180deg,rgba(4,8,15,.97),rgba(7,12,21,.94));border-right:1px solid rgba(239,20,39,.18);box-shadow:12px 0 50px rgba(0,0,0,.28);scrollbar-width:thin}
.brand{position:sticky;top:-16px;z-index:3;margin:-16px -12px 15px;padding:18px 18px 17px;background:rgba(4,8,15,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(239,20,39,.2)}
.logo{width:40px;height:40px;border-radius:8px;position:relative;overflow:hidden;background:var(--grad);box-shadow:0 0 28px rgba(239,20,39,.3);animation:logoGlow 3.5s ease-in-out infinite}

.folder{margin-bottom:7px;border-color:rgba(255,255,255,.065);border-radius:9px;background:rgba(255,255,255,.018);transition:border-color .2s,background .2s}
.folder:hover{border-color:rgba(255,255,255,.11)}
.folder>.fhead{padding:11px 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.055em;color:#bdc5d2}

.fbody{padding:4px 6px 8px}

.navbtn:hover{transform:translateX(2px);border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:var(--fg)}
.navbtn.active{background:linear-gradient(90deg,rgba(239,20,39,.22),rgba(239,20,39,.04));box-shadow:none;border-color:rgba(239,20,39,.22);color:#fff}

.navbtn .ic{width:23px;height:23px;filter:saturate(.8)}
main{width:100%;max-width:none;padding:22px clamp(18px,3vw,48px) 80px;overflow:hidden}
.topbar{margin-bottom:26px;padding:11px 14px;border-radius:10px;background:rgba(5,10,18,.78);border-color:rgba(255,255,255,.08);border-bottom-color:rgba(239,20,39,.18);box-shadow:0 14px 40px rgba(0,0,0,.28);backdrop-filter:blur(20px)}
.topbar>b{text-transform:uppercase;font-family:'Sora',system-ui;font-size:12px;letter-spacing:.08em}.dot{width:7px;height:7px}

/* content */

.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(239,20,39,.045),transparent 38%);opacity:.7}

.card h3{font-size:14px}.grid{gap:13px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{font-size:29px;color:var(--fg);background:none;-webkit-text-fill-color:initial;margin-top:8px;text-shadow:0 0 28px rgba(239,20,39,.24)}
.badge{background:rgba(239,20,39,.16);color:#ff8b96;border:1px solid rgba(239,20,39,.22)}
.btn{min-height:39px;padding:9px 15px;border-radius:8px;background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.03);transition:transform .18s,border-color .18s,background .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.075);border-color:rgba(255,42,60,.55);box-shadow:0 9px 24px rgba(0,0,0,.28),0 0 20px rgba(239,20,39,.1)}

.btn.warn{color:#160c08}.btn.sm{min-height:32px;padding:6px 10px;border-radius:7px}
input,select,textarea{border-radius:8px;background:rgba(2,7,14,.72);border-color:rgba(255,255,255,.12);caret-color:var(--acc2)}
input:hover,select:hover,textarea:hover{border-color:rgba(255,255,255,.21)}
input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(239,20,39,.13),0 8px 24px rgba(0,0,0,.18)}
label{color:#8994a7;font-size:10.5px;letter-spacing:.09em}
table{border-collapse:separate;border-spacing:0}th{color:#7f899c;font-size:10px}th,td{border-color:rgba(255,255,255,.065)}tbody tr{transition:background .18s}tbody tr:hover{background:rgba(239,20,39,.055)}
.tag{border-radius:6px}.linkcard{border-radius:10px;background:linear-gradient(145deg,rgba(18,24,34,.8),rgba(8,13,22,.8))}.ico-lg{border-radius:9px}

.ui-icon{width:18px;height:18px;display:inline-grid;place-items:center;flex:none;color:currentColor;transition:transform .32s cubic-bezier(.2,.8,.2,1),color .25s,filter .25s}.ui-icon svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fhead .ui-icon{color:#65748a}.fhead:hover .ui-icon{color:var(--tech-cyan);transform:rotate(-5deg) scale(1.12);filter:drop-shadow(0 0 7px rgba(86,217,255,.5))}.navbtn .ui-icon{width:17px;height:17px;color:#748197}.navbtn:hover .ui-icon{color:var(--tech-cyan);transform:translateY(-2px) scale(1.14);filter:drop-shadow(0 0 7px rgba(86,217,255,.55))}.navbtn.active .ui-icon{color:var(--acc3);filter:drop-shadow(0 0 8px rgba(255,32,53,.6))}.navbtn.active:hover .ui-icon{transform:translateY(-2px) rotate(4deg) scale(1.16)}

/* brilho liquido que percorre botoes e cards no hover */

/* entrada escalonada de secoes, cards e linhas de tabela */
@keyframes riseIn{from{opacity:0;transform:translateY(16px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes softIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card:nth-child(5),.syscard:nth-child(5),.linkcard:nth-child(5),.kpi-card:nth-child(5){animation-delay:.2s}
.card:nth-child(n+6),.syscard:nth-child(n+6),.linkcard:nth-child(n+6),.kpi-card:nth-child(n+6){animation-delay:.25s}
tbody tr{animation:softIn .34s var(--ease-soft) both}
tbody tr:nth-child(2){animation-delay:.03s}tbody tr:nth-child(3){animation-delay:.06s}
tbody tr:nth-child(4){animation-delay:.09s}tbody tr:nth-child(5){animation-delay:.12s}
tbody tr:nth-child(n+6){animation-delay:.15s}
tbody tr:hover{transform:translateX(3px);transition:transform var(--t-fast),background var(--t-fast)}

/* troca de tela mais liquida */
@keyframes viewIn{from{opacity:0;transform:translateY(14px) scale(.994);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
main>section,.view,.screen,[data-view]{animation:viewIn .42s var(--ease-glide) both}

/* ===== JARVIS: chat fluido ===== */
#jx-log{scroll-behavior:smooth}
#jx-log .m{animation:msgIn .42s var(--ease-glide) both;transition:transform var(--t-med),box-shadow var(--t-med),border-color var(--t-med);transform-origin:bottom left}
#jx-log .m.me{transform-origin:bottom right;animation-name:msgInMe}
#jx-log .m:hover{transform:translateY(-2px)}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) translateX(-8px) scale(.97);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@keyframes msgInMe{from{opacity:0;transform:translateY(14px) translateX(8px) scale(.97);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}

#jx-log .m .dl button:hover{transform:translateY(-2px) scale(1.03)}

/* "processando" com respiracao e pontos animados */
#jx-log .m.sys{animation:msgIn .35s var(--ease-glide) both,breathe 1.9s ease-in-out .35s infinite}
#jx-log .m.sys:after{content:"";display:inline-block;width:1.6em;text-align:left;animation:dots 1.4s steps(4,end) infinite}

/* nucleo/idle do JARVIS pulsando de forma organica */
.jx-empty .core{animation:coreFloat 4.2s ease-in-out infinite}
@keyframes coreFloat{0%,100%{transform:translateY(0) scale(1);filter:drop-shadow(0 0 10px rgba(86,217,255,.35))}

/* anexos e chips do JARVIS */
.jv-file,.jv-files span{animation:popChip .3s var(--ease-spring) both}
@keyframes popChip{from{opacity:0;transform:scale(.8) translateY(6px)}to{opacity:1;transform:none}}
.jv-drop.drag:after{animation:softIn .2s var(--ease-soft) both}

/* menus, modais e overlays */
.menu,.modal,.sheet,.popover,dialog{transition:opacity var(--t-med),transform var(--t-med) var(--ease-glide)}

@media (prefers-reduced-motion:reduce){

}

/* ================= DETECÇÃO DE SO ================= */
let OSINFO={};
function detectOS(){
  const ua=navigator.userAgent, p=navigator.platform||'';
  let os='Desconhecido';
  if(/Windows NT 10|Windows NT 11/.test(ua))os='Windows 10/11';
  else if(/Windows/.test(ua))os='Windows';
  else if(/Mac OS X/.test(ua))os='macOS';
  else if(/Android/.test(ua))os='Android';
  else if(/iPhone|iPad/.test(ua))os='iOS';
  else if(/Linux/.test(ua))os='Linux';
  OSINFO={os,plataforma:p,nucleos:navigator.hardwareConcurrency||'—',
    memoria:(navigator.deviceMemory?navigator.deviceMemory+' GB':'—'),
    idioma:navigator.language,tela:screen.width+'×'+screen.height,
    online:navigator.onLine?'Online':'Offline',fuso:Intl.DateTimeFormat().resolvedOptions().timeZone};
  ($('tb-os')||{}).textContent='SO: '+os;
}

let db=null,unsub=null;
function connectCloud(){
  const c=state.fb; if(!c.apiKey||!c.projectId)return;
  try{
    const app=firebase.apps.length?firebase.app():firebase.initializeApp({apiKey:c.apiKey,projectId:c.projectId,authDomain:c.authDomain||c.projectId+'.firebaseapp.com',appId:c.appId});
    db=firebase.firestore(app);
    unsub&&unsub();
    unsub=db.collection('modesk_pessoal').doc(GESTOR).onSnapshot(d=>{
      const data=d.data(); if(!data?.payload)return;
      const remote=JSON.parse(data.payload);
      if(JSON.stringify(remote)!==JSON.stringify(state)){state=Object.assign(structuredClone(DEF),remote);localStorage.setItem(LS,JSON.stringify(state));render();}
    });
    ($('tb-sync')||{}).textContent='nuvem · tempo real ativo';
    toast('Tempo real conectado');
  }catch(e){toast('Falha na nuvem: '+e.message)}
}
function pushCloud(){if(!db)return;db.collection('modesk_pessoal').doc(GESTOR).set({payload:JSON.stringify(state),at:Date.now()}).catch(()=>{})}

/* ================= ALERTAS DE DATAS ================= */
function dias(d){return Math.ceil((new Date(d)-new Date().setHours(0,0,0,0))/864e5)}
function alertas(){
  const out=[];
  state.eventos.forEach(e=>{const d=dias(e.data);
    if(d<0)out.push({t:'err',m:`Evento vencido: ${e.titulo} (${fmt(e.data)})`});
    else if(d===0)out.push({t:'err',m:`HOJE: ${e.titulo} às ${e.hora||'--:--'}`});
    else if(d<=3)out.push({t:'w',m:`Em ${d} dia(s): ${e.titulo} — ${fmt(e.data)} ${e.hora||''}`});});
  state.pedidos.forEach(p=>{if(!p.prazo)return;const d=dias(p.prazo);
    if(p.status!=='Concluído'&&d<0)out.push({t:'err',m:`Pedido ${p.numero} atrasado ${Math.abs(d)}d`});
    else if(p.status!=='Concluído'&&d<=5)out.push({t:'w',m:`Pedido ${p.numero} vence em ${d}d`});});
  state.atividades.forEach(a=>{if(a.feito||!a.prazo)return;const st=statusAtiv(a);
    if(st.late)out.push({t:'err',m:`ATIVIDADE ${a.tipo||''}: ${a.titulo} — prazo ${fmt(a.prazo)} ${a.hora||''}`});
    else if(dias(a.prazo)<=2)out.push({t:'w',m:`Atividade em breve: ${a.titulo} (${fmt(a.prazo)})`});});
  state.sends.forEach(s=>{if(s.status==='Aguardando retorno'&&dias(s.data)<-2)out.push({t:'w',m:`SEND "${s.assunto}" sem retorno há ${Math.abs(dias(s.data))} dias`})});
  return out;
}

/* ---------- GRAFICOS DE ACOMPANHAMENTO E DESEMPENHO (v35) ---------- */
const GC=['#56c8ff','#38f2b5','#ffc857','#ff6b81','#a78bfa','#7dd3fc'];
function gkey(items){return items.map((x,i)=>`<span class="g-lg"><i style="background:${x.cor||GC[i%GC.length]}"></i>${esc(x.rot)} <b>${x.val}</b></span>`).join('')}
function gDonut(dados){
  const tot=dados.reduce((a,b)=>a+b.val,0);
  const R=52,C=2*Math.PI*R;let off=0;
  const arcos=tot?dados.filter(d=>d.val>0).map((d,i)=>{
    const len=C*(d.val/tot);const el=`<circle class="g-arc" cx="70" cy="70" r="${R}" fill="none" stroke="${d.cor||GC[i%GC.length]}"
      stroke-width="17" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" stroke-linecap="butt"/>`;
    off+=len;return el}).join(''):`<circle cx="70" cy="70" r="${R}" fill="none" stroke="rgba(127,180,220,.18)" stroke-width="17"/>`;
  return `<div class="g-donut"><svg viewBox="0 0 140 140" width="150" height="150">
    <g transform="rotate(-90 70 70)">${arcos}</g>
    <text x="70" y="66" text-anchor="middle" class="g-num">${tot}</text>
    <text x="70" y="84" text-anchor="middle" class="g-sub">total</text></svg>
    <div class="g-legend">${gkey(dados)}</div></div>`;
}
function gBarras(dados){
  const max=Math.max(1,...dados.map(d=>Math.max(d.a||0,d.b||0)));
  return `<div class="g-bars">${dados.map(d=>`<div class="g-col">
     <div class="g-stack">
       <span class="g-b b1" style="height:${Math.round((d.a||0)/max*100)}%" title="${d.a||0}"></span>
       <span class="g-b b2" style="height:${Math.round((d.b||0)/max*100)}%" title="${d.b||0}"></span>
     </div><small>${esc(d.rot)}</small></div>`).join('')}</div>`;
}
function gLinha(vals,rots){
  const max=Math.max(1,...vals),W=320,H=110,st=vals.length>1?W/(vals.length-1):W;
  const pts=vals.map((v,i)=>[i*st,H-6-(v/max)*(H-24)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L ${W} ${H} L 0 ${H} Z`;
  return `<div class="g-line"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <path d="${area}" fill="url(#gfill)"/><defs><linearGradient id="gfill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#56c8ff" stop-opacity=".45"/><stop offset="1" stop-color="#56c8ff" stop-opacity="0"/></linearGradient></defs>
    <path d="${d}" fill="none" stroke="#56c8ff" stroke-width="2.5"/>
    ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="#eafcff" stroke="#56c8ff" stroke-width="2"/>`).join('')}
  </svg><div class="g-rot">${rots.map((r,i)=>`<small>${esc(r)}<b>${vals[i]}</b></small>`).join('')}</div></div>`;
}
function gMeta(rot,pct,cor){
  return `<div class="g-meta"><div class="row" style="justify-content:space-between"><span>${esc(rot)}</span><b>${pct}%</b></div>
    <div class="g-track"><i style="width:${Math.max(0,Math.min(100,pct))}%;background:${cor}"></i></div></div>`;
}
function ultimosMeses(n){
  const out=[],h=new Date();
  for(let i=n-1;i>=0;i--){const d=new Date(h.getFullYear(),h.getMonth()-i,1);
    out.push({k:d.toISOString().slice(0,7),rot:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')})}
  return out;
}
function blocoGraficos(){
  const P=state.pedidos||[],A=state.atividades||[],S=state.sends||[],E=state.eventos||[];
  const meses=ultimosMeses(6);
  /* pedidos por status */
  const st={};P.forEach(p=>{const k=p.status||'Sem status';st[k]=(st[k]||0)+1});
  const donut=Object.keys(st).map((k,i)=>({rot:k,val:st[k],cor:GC[i%GC.length]}));
  /* atividades por mes: abertas x concluidas */
  const barras=meses.map(m=>({rot:m.rot,
    a:A.filter(x=>!x.feito&&(x.prazo||'').startsWith(m.k)).length,
    b:A.filter(x=>x.feito&&(x.prazo||'').startsWith(m.k)).length}));
  /* volume de servicos por mes (pedidos + send + eventos) */
  const linha=meses.map(m=>P.filter(x=>(x.prazo||'').startsWith(m.k)).length
    +S.filter(x=>(x.data||'').startsWith(m.k)).length
    +E.filter(x=>(x.data||'').startsWith(m.k)).length);
  /* desempenho por area de servico */
  const areas=(state.servicos||[]).map(sv=>({nome:sv.nome,icone:sv.icone||'📁',
    qtd:(sv.sub||[]).reduce((t,sb)=>t+((sb.itens||[]).length),0),subs:(sv.sub||[]).length}));
  const maxA=Math.max(1,...areas.map(x=>x.qtd));
  /* indicadores de desempenho */
  const conc=P.filter(p=>p.status==='Concluído').length;
  const pctPed=P.length?Math.round(conc/P.length*100):0;
  const feitas=A.filter(a=>a.feito).length;
  const pctAtiv=A.length?Math.round(feitas/A.length*100):0;
  const resp=S.filter(x=>x.status==='Respondido').length;
  const pctSend=S.length?Math.round(resp/S.length*100):0;
  const atrasados=P.filter(p=>p.status!=='Concluído'&&p.prazo&&dias(p.prazo)<0).length
    +A.filter(a=>!a.feito&&a.prazo&&statusAtiv(a).late).length;
  const sla=Math.max(0,100-Math.round(atrasados/Math.max(1,P.length+A.length)*100));
  return `
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('Conclusão pedidos',pctPed+'%','shield')}${kpi('Atividades feitas',pctAtiv+'%','pulse')}
    ${kpi('SEND respondidos',pctSend+'%','✉️')}${kpi('Em atraso',atrasados,'bell')}
  </div>
  <div class="grid g2">
    <div class="card"><h3>🥯 Pedidos por status</h3><div style="margin-top:10px">
      ${P.length?gDonut(donut):'<div class="dim">Sem pedidos cadastrados ainda.</div>'}</div></div>
    <div class="card"><h3>📊 Atividades por mês</h3>
      <p class="dim" style="margin:2px 0 6px"><span class="g-lg"><i style="background:#ffc857"></i>abertas</span> <span class="g-lg"><i style="background:#38f2b5"></i>concluídas</span></p>
      ${gBarras(barras)}</div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>📈 Volume de serviços (6 meses)</h3>
      <p class="dim" style="margin:2px 0 8px">Pedidos, SEND e eventos somados por mês.</p>
      ${gLinha(linha,meses.map(m=>m.rot))}</div>
    <div class="card"><h3>🎯 Indicadores de desempenho</h3><div style="margin-top:12px">
      ${gMeta('Pedidos concluídos',pctPed,'#38f2b5')}
      ${gMeta('Atividades concluídas',pctAtiv,'#56c8ff')}
      ${gMeta('SEND respondidos',pctSend,'#ffc857')}
      ${gMeta('Cumprimento de prazos (SLA)',sla,'#a78bfa')}
    </div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>🗂 Carga por área de serviço</h3><div style="margin-top:12px">
    ${areas.length?areas.map((x,i)=>`<div class="g-hrow"><span class="g-hl">${esc(x.icone)} ${esc(x.nome)}</span>
      <span class="g-htrack"><i style="width:${Math.round(x.qtd/maxA*100)}%;background:${GC[i%GC.length]}"></i></span>
      <b class="mono">${x.qtd}</b><small class="dim">${x.subs} sub</small></div>`).join(''):'<div class="dim">Sem áreas cadastradas.</div>'}
  </div></div>`;
}

function addItem(){const d=$('it-d').value.trim();if(!d)return toast('Descrição obrigatória');
  state.itens.push({id:u(),desc:d,qtd:$('it-q').value||1,un:$('it-u').value||'UN',cat:$('it-c').value,obs:$('it-o').value});save();toast('Item cadastrado')}
function importCSV(){
  const f=$('it-f').files[0]; if(!f)return toast('Selecione um CSV ou XLSX');
  if(/\.xlsx?$/i.test(f.name))return importXLSX(f);
  const r=new FileReader();
  r.onload=()=>{
    const linhas=r.result.split(/\r?\n/).filter(Boolean);
    if(!linhas.length)return toast('Arquivo vazio');
    const sep=linhas[0].includes(';')?';':',';
    const head=linhas[0].split(sep).map(h=>h.trim().toLowerCase());
    const find=(...ns)=>head.findIndex(h=>ns.some(n=>h.includes(n)));
    const iD=find('desc','item','produto'),iQ=find('qtd','quant'),iU=find('unid','un'),iC=find('categ','tipo');
    let n=0;
    linhas.slice(1).forEach(l=>{const c=l.split(sep);const d=(c[iD]||c[0]||'').trim();if(!d)return;
      state.itens.push({id:u(),desc:d,qtd:(c[iQ]||1).toString().trim(),un:(c[iU]||'UN').trim(),cat:(c[iC]||'').trim(),obs:'importado'});n++});
    $('it-prev').textContent=`Reconhecido: ${n} itens (colunas: ${head.join(' | ')})`;
    save();toast(n+' itens importados');
  };
  r.readAsText(f,'utf-8');
}

/* ---- Importação .xlsx nativa (SheetJS sob demanda) ---- */
function carregarSheetJS(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((ok,err)=>{const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    sc.onload=()=>ok(window.XLSX);sc.onerror=()=>err(new Error('offline'));document.head.append(sc)});
}
async function importXLSX(f){
  let XLSX;
  try{toast('Lendo planilha...');XLSX=await carregarSheetJS()}
  catch(e){return toast('Precisa de internet na 1a leitura de .xlsx')}
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  const linhas=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!linhas.length)return toast('Planilha vazia');
  const head=Object.keys(linhas[0]);
  const col=(...ns)=>head.find(h=>ns.some(n=>h.toLowerCase().includes(n)));
  const cD=col('desc','item','produto')||head[0],cQ=col('qtd','quant'),cU=col('unid','un'),cC=col('categ','tipo');
  let n=0;
  linhas.forEach(l=>{const d=String(l[cD]||'').trim();if(!d)return;
    state.itens.push({id:u(),desc:d,qtd:String(cQ?l[cQ]||1:1).trim(),un:String(cU?l[cU]||'UN':'UN').trim(),cat:String(cC?l[cC]||'':'').trim(),obs:'importado xlsx'});n++});
  const pv=$('it-prev');if(pv)pv.textContent=`Planilha ${wb.SheetNames[0]}: ${n} itens (colunas: ${head.join(' | ')})`;
  save();toast(n+' itens importados do Excel');
}

const MP_PATH_ANYDESK = 'C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\AnyDesk';
const MP_PATH_VNC = 'C:\\ProgramData\\Microsoft\\Windows\\Start Menu\\Programs\\UltraVNC';
const MP = {q:'', setor:'', andar:''};
function mpLista(){
  const q=MP.q.toLowerCase();
  return PCS_UNIDADE.filter(p=>
    (!MP.setor||p.setor===MP.setor)&&(!MP.andar||p.andar===MP.andar)&&
    (!q||[p.nome,p.pat,p.vnc,p.anydesk,p.mac,p.setor,p.andar,p.obs,p.so].join(' ').toLowerCase().includes(q)));
}
function mpFiltrar(){MP.q=($('mp-q')||{}).value||'';MP.setor=($('mp-set')||{}).value||'';MP.andar=($('mp-and')||{}).value||'';mpPintar()}
function mpPintar(){const el=$('mp-tb');if(el)el.innerHTML=mpLinhas()}
function mpCopiar(t,m){navigator.clipboard.writeText(t);toast(m||'Copiado')}
function mpAnydesk(id){if(!id)return toast('Sem ID AnyDesk');toast('Abrindo AnyDesk '+id+'…');window.location.href='anydesk:'+id}
function mpVnc(end){if(!end)return toast('Sem endereço VNC');toast('Abrindo VNC '+end+'…');window.location.href='vnc://'+end}
function mpTagDe(v){const s=(v||'').toLowerCase();return s.includes('atualizad')?'t-ok':(s?'t-warn':'t-info')}
function mpFmtAny(id){if(!id)return '';return String(id).replace(/\B(?=(\d{3})+$)/g,' ')}
function mpLinhas(){
  const L=mpLista();
  if(!L.length)return '<tr><td colspan="7" class="dim">Nenhum computador encontrado.</td></tr>';
  return L.map(p=>`<tr>
    <td><b>${esc(p.nome||'—')}</b><div class="dim mono">Patrimônio ${esc(p.pat||'—')}</div>${p.obs?`<div class="dim">⚠ ${esc(p.obs)}</div>`:''}</td>
    <td>${esc(p.setor||'—')}<div class="dim">${esc(p.andar||'')}</div></td>
    <td class="mono">${esc(p.vnc||'—')}${p.mac?`<div class="dim mono">${esc(p.mac)}</div>`:''}</td>
    <td class="mono">${esc(mpFmtAny(p.anydesk)||'—')}</td>
    <td>${esc(p.so||'—')}<div class="dim">${esc(p.ram||'')} ${esc(p.disco?'· '+p.disco:'')}</div></td>
    <td><span class="tag ${mpTagDe(p.drivers)}">${esc(p.drivers||'—')}</span><div style="margin-top:4px"><span class="tag ${mpTagDe(p.update)}">${esc(p.update||'—')}</span></div></td>
    <td><div class="row" style="gap:6px;flex-wrap:wrap">
      <button class="btn sm primary" onclick="mpVnc('${esc(p.vnc)}')" ${p.vnc?'':'disabled style="opacity:.35"'}>🖥 VNC</button>
      <button class="btn sm" onclick="mpAnydesk('${esc(p.anydesk)}')" ${p.anydesk?'':'disabled style="opacity:.35"'}>▶ AnyDesk</button>
      <button class="btn sm" onclick="mpCopiar('${esc(p.vnc||p.anydesk)}','Acesso copiado')">⧉</button>
    </div></td></tr>`).join('');
}
function mpImportar(){
  let n=0;
  PCS_UNIDADE.forEach(p=>{
    if(p.anydesk&&!state.acessos.some(a=>a.endereco===p.anydesk)){
      state.acessos.push({id:u(),nome:(p.nome||p.pat)+' (AnyDesk)',tipo:'AnyDesk',endereco:p.anydesk,so:'Windows',obs:p.setor});n++}
    if(p.vnc&&!state.acessos.some(a=>a.endereco===p.vnc)){
      state.acessos.push({id:u(),nome:(p.nome||p.pat)+' (VNC)',tipo:'VNC',endereco:p.vnc,so:'Windows',obs:p.setor});n++}
  });
  save();toast(n+' acesso(s) enviados para Conexões Remotas');
}
function mpCSV(){
  const cab=['Andar','Setor','Patrimonio','Nome','VNC','MAC','AnyDesk','SO','RAM','Armazenamento','Drivers','Windows Update','Observacao'];
  const linhas=mpLista().map(p=>[p.andar,p.setor,p.pat,p.nome,p.vnc,p.mac,p.anydesk,p.so,p.ram,p.disco,p.drivers,p.update,p.obs]
    .map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(';'));
  dl(new Blob(['\ufeff'+cab.join(';')+'\n'+linhas.join('\n')],{type:'text/csv;charset=utf-8'}),'mapeamento-computadores.csv');
}
function vMapa(){
  const setores=[...new Set(PCS_UNIDADE.map(p=>p.setor).filter(Boolean))];
  const andares=[...new Set(PCS_UNIDADE.map(p=>p.andar).filter(Boolean))];
  const total=PCS_UNIDADE.length, comAny=PCS_UNIDADE.filter(p=>p.anydesk).length,
        comVnc=PCS_UNIDADE.filter(p=>p.vnc).length,
        pend=PCS_UNIDADE.filter(p=>/pendente|não|erro/i.test((p.drivers||'')+' '+(p.update||''))).length;
  return page('Mapeamento dos Computadores da Unidade','Inventário por andar e setor com acesso direto por VNC e AnyDesk.',`
  <div class="grid g4" style="margin-bottom:16px">
   <div class="card"><div class="dim">Computadores mapeados</div><h3>${total}</h3></div>
   <div class="card"><div class="dim">Com AnyDesk</div><h3>${comAny}</h3></div>
   <div class="card"><div class="dim">Com VNC</div><h3>${comVnc}</h3></div>
   <div class="card"><div class="dim">Pendências técnicas</div><h3>${pend}</h3></div>
  </div>
  <div class="card" style="margin-bottom:16px"><div class="grid g3">
    <div><label>Buscar</label><input id="mp-q" placeholder="nome, patrimônio, IP, ID AnyDesk…" oninput="mpFiltrar()" value="${esc(MP.q)}"/></div>
    <div><label>Setor</label><select id="mp-set" onchange="mpFiltrar()"><option value="">Todos</option>
      ${setores.map(s=>`<option ${MP.setor===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
    <div><label>Andar</label><select id="mp-and" onchange="mpFiltrar()"><option value="">Todos</option>
      ${andares.map(s=>`<option ${MP.andar===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
   </div>
   <div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap">
     <button class="btn primary" onclick="mpImportar()">＋ Enviar para Conexões Remotas</button>
     <button class="btn" onclick="mpCSV()">⬇ Exportar CSV</button>
   </div></div>
  <div class="card" style="margin-bottom:16px"><h3>📂 Onde ficam os atalhos no computador</h3>
   <div class="grid g2" style="margin-top:10px">
    <div><label>AnyDesk (Menu Iniciar)</label>
      <div class="row" style="gap:8px"><input class="mono" value="${esc(MP_PATH_ANYDESK)}" readonly/>
      <button class="btn sm" onclick="mpCopiar(MP_PATH_ANYDESK,'Caminho do AnyDesk copiado')">⧉ Copiar</button></div></div>
    <div><label>UltraVNC (Menu Iniciar)</label>
      <div class="row" style="gap:8px"><input class="mono" value="${esc(MP_PATH_VNC)}" readonly/>
      <button class="btn sm" onclick="mpCopiar(MP_PATH_VNC,'Caminho do UltraVNC copiado')">⧉ Copiar</button></div></div>
   </div>
   <ul class="dim" style="margin-top:12px">
    <li>Cole o caminho na barra do <b>Explorador de Arquivos</b> (ou em Win+R) para abrir a pasta de atalhos.</li>
    <li><b>VNC:</b> o botão abre <span class="mono">vnc://IP:5900</span> — o UltraVNC Viewer instalado assume a conexão.</li>
    <li><b>AnyDesk:</b> o botão abre <span class="mono">anydesk:&lt;ID&gt;</span> — o AnyDesk instalado assume a conexão.</li>
   </ul></div>
  <div class="card"><div style="overflow:auto"><table>
   <thead><tr><th>Computador</th><th>Setor / Andar</th><th>VNC / MAC</th><th>AnyDesk</th><th>Sistema</th><th>Status</th><th>Acesso</th></tr></thead>
   <tbody id="mp-tb">${mpLinhas()}</tbody></table></div></div>`);
}

function sysHost(url){try{return new URL(url).hostname.replace(/^www\./,'')}catch(e){return ''}}
function sysLogo(url){const h=sysHost(url);return h?'https://www.google.com/s2/favicons?sz=128&domain='+encodeURIComponent(h):''}
function sysGlow(nome){let n=0;for(const c of String(nome))n=(n*31+c.charCodeAt(0))%360;return 'hsla('+n+',85%,55%,.20)'}
function sysLogoHTML(l){
  const src=l.logo||sysLogo(l.url||''), ini=esc((l.nome||'?').trim().charAt(0).toUpperCase());
  return `<div class="syslogo">${src?`<img src="${esc(src)}" alt="Logo ${esc(l.nome)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fb',textContent:'${ini}'}))"/>`:`<span class="fb">${ini}</span>`}</div>`;
}
function vLinks(){
  const chips=SYS_CATALOGO.filter(c=>!state.links.some(l=>l.nome.toLowerCase()===c.nome.toLowerCase()))
    .map(c=>`<button class="chip" onclick="addSys('${esc(c.nome)}')"><img src="${sysLogo(c.url)}" alt=""/>＋ ${esc(c.nome)}</button>`).join('');
  return page('Sistemas & sites importantes','Atalhos com os logos oficiais de cada sistema. Clique no card para abrir.',`

   <div style="margin-top:14px"><button class="btn primary" onclick="addLink()">＋ Adicionar sistema</button></div></div>
  <div class="sysgrid">
  ${state.links.map(l=>`<div class="syscard ${l.url?'':'off'}" style="--sysglow:${sysGlow(l.nome)}" onclick="abrirSys('${l.id}')">
    <span class="open">abrir ↗</span>
    <div class="top">${sysLogoHTML(l)}<div style="min-width:0"><h4>${esc(l.nome)}</h4><div class="host">${esc(sysHost(l.url)||'sem link cadastrado')}</div></div></div>
    <div class="desc">${esc(l.desc||'')}</div>
    <div class="acts">
      <button class="btn sm" onclick="event.stopPropagation();editLink('${l.id}')">✎ Editar</button>
      <button class="btn sm" onclick="event.stopPropagation();navigator.clipboard.writeText('${esc(l.url||'')}');toast('Link copiado')">⧉ Copiar</button>
      <button class="btn sm" onclick="event.stopPropagation();del('links','${l.id}')">🗑</button>
    </div></div>`).join('')||'<div class="card dim">Nenhum sistema cadastrado.</div>'}
  </div>`);
}
function abrirSys(id){const l=state.links.find(x=>x.id===id);if(!l)return;if(!l.url)return toast('Informe a URL em Editar');abrirInterno(l.url,l.nome)}
function addSys(nome){const c=SYS_CATALOGO.find(x=>x.nome===nome);if(!c)return;
  state.links.push({id:u(),nome:c.nome,url:c.url,desc:c.desc,logo:''});save();toast(c.nome+' adicionado')}
function addLink(){const n=$('lk-n').value.trim();if(!n)return toast('Informe o nome');
  state.links.push({id:u(),nome:n,url:$('lk-u').value.trim(),logo:$('lk-i').value.trim(),desc:$('lk-d').value});save();toast('Sistema adicionado')}
function editLink(id){const l=state.links.find(x=>x.id===id);const v=prompt('URL de '+l.nome,l.url||'https://');if(v!==null){l.url=v.trim();save();toast('Atualizado')}}

function statusAtiv(a){
  if(a.feito)return{cls:'t-ok',txt:'Concluída',late:false};
  const dl=deadlineMs(a); if(!dl)return{cls:'',txt:'Sem prazo',late:false};
  const diff=dl-Date.now(), min=Math.round(diff/60000);
  if(diff<=0)return{cls:'t-err',txt:'VENCIDA',late:true};
  if(min<=(a.aviso??30))return{cls:'t-err',txt:'AGORA ('+min+' min)',late:true};
  if(diff<864e5)return{cls:'t-warn',txt:'Hoje/24h',late:false};
  return{cls:'t-ok',txt:'em '+Math.ceil(diff/864e5)+'d',late:false};
}
function deadlineMs(a){if(!a.prazo)return 0;return new Date(a.prazo+'T'+(a.hora||'23:59')+':00').getTime()}
function addAtividade(){
  const t=$('at-t').value.trim(); if(!t)return toast('Informe o título');
  const f=$('at-f').files[0];
  const push=arq=>{state.atividades.push({id:u(),titulo:t,prazo:$('at-d').value,hora:$('at-h').value,tipo:$('at-tp').value,
    prioridade:$('at-p').value,repetir:$('at-r').value,aviso:+$('at-av').value||0,desc:$('at-i').value,arquivo:arq,feito:false,criado:Date.now()});
    save();toast('Atividade salva');checarDeadlines();};
  if(f){if(f.size>1.5e6)return toast('Arquivo muito grande (máx 1,5 MB) — use o Explorador para arquivos maiores');
    const r=new FileReader();r.onload=()=>push({nome:f.name,tipo:f.type,dados:r.result});r.readAsDataURL(f);}else push(null);
}
function toggleAtiv(id){const a=state.atividades.find(x=>x.id===id);if(!a)return;
  a.feito=!a.feito;
  if(a.feito&&a.repetir&&a.prazo){const d=new Date(a.prazo+'T00:00:00');
    if(a.repetir==='diario')d.setDate(d.getDate()+1);
    if(a.repetir==='semanal')d.setDate(d.getDate()+7);
    if(a.repetir==='mensal')d.setMonth(d.getMonth()+1);
    state.atividades.push({...a,id:u(),feito:false,prazo:d.toISOString().slice(0,10),criado:Date.now()});}
  save();checarDeadlines();}
function verAtiv(id){const a=state.atividades.find(x=>x.id===id);if(!a)return;const st=statusAtiv(a);
  const an=a.arquivo?(a.arquivo.tipo&&a.arquivo.tipo.startsWith('image')

  modal(`<h2>${esc(a.titulo)}</h2><div class="row" style="margin:10px 0">
    <span class="tag t-info mono">${fmt(a.prazo)} ${esc(a.hora||'')}</span>
    <span class="tag">${esc(a.tipo)}</span><span class="tag">${esc(a.prioridade||'Normal')}</span>

    <p>${esc(a.desc||'')}</p><h4 style="margin-top:12px">Arquivo</h4><div style="margin-top:8px">${an}</div>`);}
function pedirNotificacao(){if(!('Notification'in window))return toast('Navegador sem suporte');

function ativarNotificacoes(){if(!('Notification'in window))return;

let pedidosAvisados={};
function notificarPedidosHoje(forcar){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  (state.pedidos||[]).forEach(p=>{
    if(!p.prazo||p.status==='Concluído')return;
    const d=dias(p.prazo); if(d>0) return;
    const chave=p.id+'|'+p.prazo; if(pedidosAvisados[chave]&&!forcar)return; pedidosAvisados[chave]=1;
    try{new Notification('MODESK: Pedido '+(d<0?'está atrasado!':'vence hoje!'),
      {body:'#'+(p.numero||'—')+' '+(p.forn||'')+' — prazo '+fmt(p.prazo)});}catch(e){}
  });
}

/* ---------- MONITOR DE DEADLINE (pisca em vermelho) ---------- */
let deadlineAtivas=[],avisadas={};
function checarDeadlines(){
  deadlineAtivas=state.atividades.filter(a=>!a.feito&&statusAtiv(a).late);
  const evHoje=state.eventos.filter(e=>dias(e.data)<=0);
  const bar=$('deadline-bar');
  if(bar){
    if(deadlineAtivas.length||evHoje.length){
      const nomes=deadlineAtivas.map(a=>a.titulo).concat(evHoje.map(e=>'Evento: '+e.titulo)).slice(0,3).join(' · ');
      bar.innerHTML=`⏰ LEMBRETE NO PRAZO — ${esc(nomes)}${(deadlineAtivas.length+evHoje.length)>3?' +'+(deadlineAtivas.length+evHoje.length-3):''} <span style="margin-left:auto;font-weight:600">clique para abrir · Esc dispensa</span>`;
      bar.classList.add('on');document.body.classList.add('deadline-on');
    }else{bar.classList.remove('on');document.body.classList.remove('deadline-on');}
  }
  deadlineAtivas.forEach(a=>{if(!avisadas[a.id]){avisadas[a.id]=1;
    try{if(window.Notification&&Notification.permission==='granted')new Notification('MODESK — '+a.titulo,{body:'Prazo: '+fmt(a.prazo)+' '+(a.hora||'')});}catch(e){}
    toast('⏰ '+a.titulo+' está no prazo!');}});
  atualizarStatusbar();
}
function atualizarStatusbar(){

}

/* ---------- EXPLORADOR DE ARQUIVOS DO PC ---------- */
let EXP={roots:[],root:null,dir:null,path:[],itens:[],filtro:'',modo:'grid'};
const idbGet=k=>new Promise(r=>{const q=indexedDB.open('modesk-fs',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');
  q.onsuccess=()=>{const t=q.result.transaction('h','readonly').objectStore('h').get(k);t.onsuccess=()=>r(t.result);t.onerror=()=>r(null)};q.onerror=()=>r(null)});
const idbSet=(k,v)=>new Promise(r=>{const q=indexedDB.open('modesk-fs',1);q.onupgradeneeded=()=>q.result.createObjectStore('h');
  q.onsuccess=()=>{const t=q.result.transaction('h','readwrite').objectStore('h').put(v,k);t.onsuccess=()=>r(1);t.onerror=()=>r(0)};q.onerror=()=>r(0)});

/* ============ CENTRAL DE ARQUIVOS (única) ============
   Une: Explorador de Arquivos + Pastas Internas + Pastas de Serviços.
   - Acesso automático a todas as pastas autorizadas (reconecta sozinho)
   - Pastas novas aparecem sozinhas (atualização automática)
   - Abre/visualiza/salva arquivos dentro do próprio site
====================================================== */
async function fsSalvarRaizes(){try{await idbSet('roots',EXP.roots.map(r=>r.h))}catch(e){}}
function fsRegistrarLocal(h){
  const nome=h.name||'pasta';
  if(!state.pastas.some(p=>(p.nome||'').toLowerCase()===nome.toLowerCase())){
    state.pastas.push({id:u(),nome:nome,caminho:nome,desc:'pasta autorizada no PC'});save(true);
  }
}
async function fsAutoConectar(pedir){
  if(!window.showDirectoryPicker)return;
  let hs=[];
  try{hs=(await idbGet('roots'))||[]}catch(e){hs=[]}
  if(!hs.length){const legado=await idbGet('root');if(legado)hs=[legado]}
  const ok=[];
  for(const h of hs){
    try{
      let p=await h.queryPermission({mode:'readwrite'});
      if(p!=='granted'&&pedir)p=await h.requestPermission({mode:'readwrite'});
      if(p==='granted')ok.push({h,nome:h.name,livre:true});
      else ok.push({h,nome:h.name,livre:false});
    }catch(e){}
  }
  EXP.roots=ok;
  const primeira=ok.find(r=>r.livre);
  if(primeira&&!EXP.dir){EXP.root=primeira.h;EXP.dir=primeira.h;EXP.path=[primeira.h];}
  if(tab==='arquivos'){ if(EXP.dir)expLer(); else expPintar(); }
  fsAutoRefresh();
}
async function fsLiberarTudo(){await fsAutoConectar(true);toast('Pastas reconectadas')}
async function fsAdicionarPasta(){
  if(!window.showDirectoryPicker)return toast('Use o Chrome ou o Edge no computador');
  try{
    const h=await window.showDirectoryPicker({mode:'readwrite'});
    if(!EXP.roots.some(r=>r.nome===h.name))EXP.roots.push({h,nome:h.name,livre:true});
    fsRegistrarLocal(h);
    await fsSalvarRaizes();
    EXP.root=h;EXP.dir=h;EXP.path=[h];EXP.filtro='';
    await expLer();toast('Pasta conectada: '+h.name);
  }catch(e){}
}
async function fsRemoverRaiz(nome){
  EXP.roots=EXP.roots.filter(r=>r.nome!==nome);
  await fsSalvarRaizes();
  if(EXP.root&&EXP.root.name===nome){EXP.root=null;EXP.dir=null;EXP.path=[];EXP.itens=[]}
  render();
}
async function fsAbrirRaiz(nome){
  const r=EXP.roots.find(x=>x.nome===nome);if(!r)return;
  if(!r.livre){const p=await r.h.requestPermission({mode:'readwrite'});if(p!=='granted')return toast('Permissão negada');r.livre=true}
  EXP.root=r.h;EXP.dir=r.h;EXP.path=[r.h];EXP.filtro='';expLer();
}

async function expLer(silencioso){
  if(!EXP.dir)return;
  const arr=[];
  try{for await(const [nome,h] of EXP.dir.entries()){
    let tam=0,mod=0;
    if(h.kind==='file'){try{const f=await h.getFile();tam=f.size;mod=f.lastModified}catch(e){}}
    arr.push({nome,kind:h.kind,h,tam,mod});}}catch(e){if(!silencioso)toast('Erro ao ler pasta');return}
  arr.sort((a,b)=>a.kind===b.kind?a.nome.localeCompare(b.nome):(a.kind==='directory'?-1:1));
  const assinatura=arr.map(i=>i.nome+i.kind+i.tam+i.mod).join('|');
  if(silencioso&&assinatura===EXP.sig)return;
  EXP.sig=assinatura;EXP.itens=arr;expPintar();
}
const bytes=n=>n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024).toFixed(0)+' KB':n+' B';
function fileIcon(n,k){if(k==='directory')return'📁';const e=n.split('.').pop().toLowerCase();
  if(['png','jpg','jpeg','gif','webp','bmp','svg'].includes(e))return'🖼️';if(e==='pdf')return'📕';
  if(['xlsx','xls','csv'].includes(e))return'📊';if(['doc','docx','txt','md','rtf'].includes(e))return'📄';
  if(['mp3','wav','ogg','flac'].includes(e))return'🎵';if(['mp4','avi','mkv','mov'].includes(e))return'🎬';
  if(['zip','rar','7z'].includes(e))return'🗜️';if(['exe','msi','bat'].includes(e))return'⚙️';return'📃'}
function expPintar(){
  const cr=$('exp-crumb'),bo=$('exp-body'); if(!cr||!bo)return;
  cr.innerHTML=EXP.path.map((p,i)=>`<button onclick="expIr(${i})">${esc(p.name||'raiz')}</button>`).join('<span>›</span>')||'';
  const list=expFiltrados();
  if(!EXP.dir){bo.innerHTML='<div class="dim">Clique em “Conectar pasta do PC” para começar.</div>';return}
  if(!list.length){bo.innerHTML='<div class="dim">Pasta vazia ou nada encontrado.</div>';return}
  if(EXP.modo==='grid'){
    bo.innerHTML=`<div class="exp-grid">${list.map((i,ix)=>`<div class="exp-item" onclick="expAbrir(${ix})">
      <span class="fi">${fileIcon(i.nome,i.kind)}</span><div class="fn">${esc(i.nome)}</div>
      <div class="fs">${i.kind==='file'?bytes(i.tam):'pasta'}</div></div>`).join('')}</div>`;
  }else{
    bo.innerHTML=list.map((i,ix)=>`<div class="exp-list-row" onclick="expAbrir(${ix})"><span>${fileIcon(i.nome,i.kind)}</span>
      <b style="font-size:12.8px">${esc(i.nome)}</b><span class="dim" style="margin-left:auto">${i.kind==='file'?bytes(i.tam)+' · '+new Date(i.mod).toLocaleDateString('pt-BR'):'pasta'}</span></div>`).join('');
  }
}
function expFiltrados(){const f=EXP.filtro.toLowerCase();return EXP.itens.filter(i=>!f||i.nome.toLowerCase().includes(f))}
async function expAbrir(ix){
  const it=expFiltrados()[ix]; if(!it)return;
  if(it.kind==='directory'){EXP.dir=it.h;EXP.path.push(it.h);EXP.filtro='';EXP.sig='';await expLer();return}
  const f=await it.h.getFile(); const url=URL.createObjectURL(f);
  const ext=it.nome.split('.').pop().toLowerCase();
  let inner='';
  if(f.type.startsWith('image'))inner=`<img src="${url}" class="viewer" style="object-fit:contain"/>`;
  else if(ext==='pdf')inner=`<iframe src="${url}" class="viewer"></iframe>`;
  else if(f.type.startsWith('video'))inner=`<video src="${url}" class="viewer" controls></video>`;
  else if(f.type.startsWith('audio'))inner=`<audio src="${url}" controls style="width:100%"></audio>`;
  else if(['txt','csv','log','json','md','xml','ini','js','html','css','sql'].includes(ext)){
    const txt=await f.text();inner=`<pre class="mono viewer" style="overflow:auto;padding:12px;white-space:pre-wrap">${esc(txt.slice(0,120000))}</pre>`;}
  else inner='<div class="dim">Pré-visualização interna não disponível para este tipo. Use “Baixar cópia”.</div>';
  modal(`<h2>${esc(it.nome)}</h2><div class="row" style="margin:8px 0">
    <span class="tag mono">${bytes(f.size)}</span><span class="tag mono">${esc(f.type||ext)}</span>
    <span class="tag mono">${new Date(f.lastModified).toLocaleString('pt-BR')}</span>
    <a class="btn sm" href="${url}" download="${esc(it.nome)}">⬇ Baixar cópia</a></div>${inner}`);
}
function expIr(i){EXP.path=EXP.path.slice(0,i+1);EXP.dir=EXP.path[EXP.path.length-1];EXP.filtro='';EXP.sig='';expLer()}
function expVoltar(){if(EXP.path.length>1){EXP.path.pop();EXP.dir=EXP.path[EXP.path.length-1];EXP.sig='';expLer()}}
function expRaiz(){if(EXP.root){EXP.path=[EXP.root];EXP.dir=EXP.root;EXP.sig='';expLer()}}
async function expNovaPasta(){if(!EXP.dir)return toast('Conecte uma pasta primeiro');
  const n=prompt('Nome da nova pasta:');if(!n)return;
  try{await EXP.dir.getDirectoryHandle(n,{create:true});toast('Pasta criada no PC');EXP.sig='';expLer()}catch(e){toast('Não foi possível criar')}}
async function expEnviarArquivo(){
  if(!EXP.dir)return toast('Conecte uma pasta do PC primeiro');
  const inp=document.createElement('input');inp.type='file';inp.multiple=true;
  inp.onchange=async()=>{for(const f of inp.files){try{
      const h=await EXP.dir.getFileHandle(f.name,{create:true});const w=await h.createWritable();await w.write(await f.arrayBuffer());await w.close();
      state.arquivos.push({id:u(),nome:f.name,tam:f.size,pasta:EXP.dir.name,em:Date.now()});
    }catch(e){toast('Falha ao salvar '+f.name)}}
    save(true);toast('Arquivo(s) gravado(s) na pasta do PC');EXP.sig='';expLer()};
  inp.click();
}

let BUSCA='';
function vBusca(){
  const q=BUSCA.trim().toLowerCase();

  if(q){
    state.atividades.forEach(a=>{if((a.titulo+' '+(a.desc||'')).toLowerCase().includes(q))add('Atividade',a.titulo,fmt(a.prazo)+' '+(a.tipo||''),`verAtiv('${a.id}')`)});

    state.pedidos.forEach(p=>{if(JSON.stringify(p).toLowerCase().includes(q))add('Pedido de compra','Pedido '+p.numero,(p.fornecedor||'')+' · '+(p.status||''),`go('pedidos')`)});
    state.itens.forEach(i=>{if(JSON.stringify(i).toLowerCase().includes(q))add('Inventário',i.descricao||i.nome||'item',(i.categoria||'')+' · '+(i.quantidade||'')+' '+(i.unidade||''),`go('itens')`)});
    state.sends.forEach(s=>{if(JSON.stringify(s).toLowerCase().includes(q))add('SEND',s.assunto,(s.destinatario||'')+' · '+(s.status||''),`go('send')`)});
    state.acessos.forEach(a=>{if(JSON.stringify(a).toLowerCase().includes(q))add('Acesso remoto',a.nome,(a.tipo||'')+' · '+(a.endereco||''),`go('remoto')`)});
    state.pastas.forEach(p=>{if(JSON.stringify(p).toLowerCase().includes(q))add('Pasta do PC',p.nome,p.caminho,`go('arquivos')`)});
    state.links.forEach(l=>{if(JSON.stringify(l).toLowerCase().includes(q))add('Atalho',l.nome,l.url||'sem URL',`go('links')`)});
    state.servicos.forEach(s=>{(s.sub||[]).forEach(sb=>(sb.itens||[]).forEach(it=>{const txt=typeof it==='string'?it:(it.nome||'');
      if(txt.toLowerCase().includes(q))add('Serviço',txt,s.nome+' › '+sb.nome,`go('arquivos')`)}))});
    state.arquivos.forEach(a=>{if(a.nome.toLowerCase().includes(q))add('Arquivo salvo',a.nome,a.pasta||'',`go('arquivos')`)});

  return page('Busca geral','Procure em atividades, pedidos, inventário, SEND, chamados, acessos, pastas e arquivos.',`

    <span class="tag mono">${hits.length} resultado(s)</span></div></div>
  <div class="card"><table><tbody>
   ${hits.map(h=>`<tr><td><span class="tag t-info">${esc(h.cat)}</span></td><td><b>${esc(h.titulo)}</b><div class="dim">${esc(h.sub||'')}</div></td>
     <td style="text-align:right"><button class="btn sm" onclick="${h.acao}">Abrir</button></td></tr>`).join('')||`<tr><td class="dim">${q?'Nada encontrado.':'Digite para buscar.'}</td></tr>`}
  </tbody></table></div>`);
}

const TEXTEXT=['txt','csv','log','json','md','xml','ini','js','ts','html','htm','css','sql','bat','cmd','yml','yaml','srt','svg'];
async function expBuscarConteudo(){
  if(!EXP.dir)return toast('Abra uma pasta do PC primeiro');
  const termo=(prompt('Buscar este texto DENTRO dos arquivos desta pasta (e subpastas):')||'').trim();
  if(!termo)return;
  const alvo=termo.toLowerCase(),achados=[];let lidos=0;
  const bo=$('exp-body');if(bo)bo.innerHTML='<div class="dim">Procurando dentro dos arquivos...</div>';
  async function varrer(dir,base,nivel){
    if(nivel>4||achados.length>=200)return;
    for await(const [nome,h] of dir.entries()){
      if(achados.length>=200)return;
      if(h.kind==='directory'){await varrer(h,base+nome+'/',nivel+1);continue}
      const ext=nome.split('.').pop().toLowerCase();
      if(!TEXTEXT.includes(ext))continue;
      try{const f=await h.getFile();if(f.size>3e6)continue;
        const t=await f.text();lidos++;
        const i=t.toLowerCase().indexOf(alvo);
        if(i>=0)achados.push({nome,caminho:base+nome,trecho:t.slice(Math.max(0,i-70),i+130).replace(/\s+/g,' ')});
      }catch(e){}
    }
  }
  await varrer(EXP.dir,'',0);
  if(!bo)return;
  bo.innerHTML=`<div class="row" style="margin-bottom:10px"><span class="tag t-info">${achados.length} arquivo(s) com "${esc(termo)}"</span>
    <span class="tag mono">${lidos} arquivos de texto lidos</span><button class="btn sm" onclick="expLer()">↩ Voltar à pasta</button></div>`+
    (achados.map(a=>`<div class="exp-list-row"><span>${fileIcon(a.nome,'file')}</span><div><b style="font-size:12.8px">${esc(a.nome)}</b>
      <div class="mono dim" style="font-size:11px">${esc(a.caminho)}</div>
      <div class="dim" style="font-size:12px">…${esc(a.trecho)}…</div></div></div>`).join('')
     ||'<div class="dim">Nada encontrado no conteúdo dos arquivos (busca em arquivos de texto: txt, csv, log, json, md, xml, html, sql...).</div>');
}

<div id="dropveil"><div class="box">⇩ Solte os arquivos para gravar na pasta aberta<small>Explorador de Arquivos do MODESK</small></div></div>

<script>
/* ============ MODESK v12 — arrastar e soltar + janela Win11 ============ */
(function(){
  const LABELS={
    'ev-f':['Anexo do evento','Imagem, planilha ou PDF'],
    'it-f':['Planilha de inventário','Arquivo .csv'],
    'cf-f':['Backup do MODESK','Arquivo .json de restauração'],
    'at-f':['Arquivo de referência','Qualquer arquivo salvo no app']
  };
  function upgrade(inp){
    if(!inp||inp.dataset.dz)return; inp.dataset.dz='1';
    const dz=document.createElement('div'); dz.className='dropzone';
    const L=LABELS[inp.id]||['Solte o arquivo aqui','ou clique para escolher no PC'];
    dz.innerHTML='<div class="dz-ico">⇧</div><div class="dz-txt"><b>Arraste e solte: '+L[0]+'</b><span>'+L[1]+' — ou clique para escolher</span></div><div class="dz-btn">Escolher arquivo</div>';
    inp.parentNode.insertBefore(dz,inp); dz.appendChild(inp);
    const txt=dz.querySelector('.dz-txt b');
    const base=txt.textContent;
    inp.addEventListener('change',()=>{
      if(inp.files&&inp.files[0]){dz.classList.add('has-file');txt.textContent='✓ '+inp.files[0].name;}
      else{dz.classList.remove('has-file');txt.textContent=base;}
    });
    ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.add('over')}));
    ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.remove('over')}));
    dz.addEventListener('drop',e=>{
      const f=e.dataTransfer&&e.dataTransfer.files; if(!f||!f.length)return;
      const dt=new DataTransfer(); dt.items.add(f[0]); inp.files=dt.files;
      inp.dispatchEvent(new Event('change',{bubbles:true}));
    });
  }
  function upgradeAll(){document.querySelectorAll('input[type=file]:not([data-dz])').forEach(upgrade)}
  new MutationObserver(upgradeAll).observe(document.documentElement,{childList:true,subtree:true});
  document.addEventListener('DOMContentLoaded',upgradeAll); upgradeAll();

  /* soltar arquivos em qualquer lugar → grava na pasta aberta do PC */
  const veil=document.getElementById('dropveil');
  let dragDepth=0;
  const temArquivo=e=>e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files');
  window.addEventListener('dragenter',e=>{
    if(!temArquivo(e)||e.target.closest('.dropzone'))return;
    dragDepth++; if(typeof EXP!=='undefined'&&EXP.dir)veil.classList.add('on');
  });
  window.addEventListener('dragover',e=>{if(temArquivo(e))e.preventDefault()});
  window.addEventListener('dragleave',e=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)veil.classList.remove('on')});
  window.addEventListener('drop',async e=>{
    if(!temArquivo(e)||e.target.closest('.dropzone'))return;
    e.preventDefault(); dragDepth=0; veil.classList.remove('on');
    const files=Array.from(e.dataTransfer.files||[]); if(!files.length)return;
    if(typeof EXP==='undefined'||!EXP.dir){typeof toast==='function'&&toast('Abra uma pasta do PC no Explorador para gravar os arquivos');return}
    let ok=0;
    for(const f of files){
      try{
        const h=await EXP.dir.getFileHandle(f.name,{create:true});
        const w=await h.createWritable(); await w.write(await f.arrayBuffer()); await w.close();
        if(typeof state!=='undefined'&&state.arquivos)state.arquivos.push({id:(typeof u==='function'?u():String(Date.now()+ok)),nome:f.name,tam:f.size,pasta:EXP.dir.name,em:Date.now()});
        ok++;
      }catch(err){}
    }
    typeof save==='function'&&save();
    typeof toast==='function'&&toast(ok+' arquivo(s) gravado(s) em '+EXP.dir.name);
    typeof expLer==='function'&&expLer();
  });

  /* maximizar / restaurar como no Windows 11 */
  document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('win-max',!!document.fullscreenElement));
  if(matchMedia('(display-mode: standalone)').matches)document.body.classList.add('win-max');
})();
</script>

<script>
/* ===================== MODESK v15 — JARVIS FX · LUPA · MULTITELAS · RAIL INFERIOR =====================
   Camada adicional: não altera as regras do sistema, apenas a apresentação/navegação.
   - Lupa de busca global (clique na lupa ou Ctrl+K / F3)
   - Efeitos estilo JARVIS (scanner, retícula, HUD, boot)
   - Multitelas arrastáveis/redimensionáveis com layouts (estilo Filmora)
   - Menu acomodável: esquerda / direita / topo / oculto
====================================================================================== */
(function () {
  const KEY = 'modesk.v15.ui';
  const TITLES = {
    dashboard: 'Dashboard', agenda: 'Agenda & Avisos', atividades: 'Atividades & Lembretes',
    busca: 'Busca Geral', arquivos: 'Central de Arquivos', itens: 'Cadastro de Itens',
    pedidos: 'Pedidos de Compra', send: 'Acompanhamento SEND', eventos: 'Eventos',
    remoto: 'Conexões Remotas', links: 'Sistemas & Sites', config: 'Configurações',
    entrega: 'Entrega & Pendências', interface: 'Central de Interface',
    jarvis: 'JARVIS — Assistente do Sistema'
  };
  const VIEW = () => ({
    dashboard: window.vDash, agenda: window.vAgenda, arquivos: window.vArquivos, itens: window.vItens,
    pedidos: window.vPedidos, send: window.vSend, eventos: window.vEventos, remoto: window.vRemoto,
    links: window.vLinks, config: window.vConfig,
    entrega: window.vEntrega, atividades: window.vAtividades, busca: window.vBusca,
    interface: window.vInterface, jarvis: window.vJarvis
  });

  const ui = Object.assign({ deck: false, dock: 'left', fx: true, wins: {} }, readUI());
  function readUI() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') } catch (e) { return {} } }
  function saveUI() { try { localStorage.setItem(KEY, JSON.stringify(ui)) } catch (e) { } }
  const mobile = () => matchMedia('(max-width:900px)').matches;
  const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild };

  /* ---------------- JARVIS FX ---------------- */
  function fxLayer() {
    if (document.getElementById('jfx')) return;
    document.body.append(el(`<div id="jfx">
      <div class="lines"></div><div class="scan"></div><div class="vig"></div>
      <div class="hud tl"></div><div class="hud tr"></div><div class="hud bl"></div><div class="hud br"></div>
      <div class="ret" id="jret"><i></i><i></i><i></i></div>
    </div>`));
    const ret = document.getElementById('jret');
    let tx = -300, ty = -300, x = tx, y = ty;

    (function loop() {
      x += (tx - x) * .12; y += (ty - y) * .12;
      ret.style.transform = `translate(${x}px,${y}px)`;

  }
  function boot() {
    const b = el(`<div id="jboot"><div class="t">
      <div>MODESK · núcleo pessoal</div><div style="color:var(--acc3)">inicializando interface</div>
      <div class="bar"><b></b></div></div></div>`);
