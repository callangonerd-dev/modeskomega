<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>MODESK PESSOAL v9 — Gestão de Serviços · marciooliveira</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg0:#050a12; --bg1:#060d17; --bg2:#0c131e; --bg3:#111924; --bg4:#131c30;
  --fg:#e7eaf0; --mut:#9aa3b2; --dim:#6d7686;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --acc:#e50914; --acc2:#ff2b3d; --acc3:#ff5a63;
  --warn:#f5b50a; --ok:#22c58b; --info:#4aa3ff;
  --grad:linear-gradient(135deg,#ff2b3d 0%,#e50914 55%,#8f050c 100%);
  --grad2:linear-gradient(135deg,#f5b50a,#e50914);
  --glass:rgba(12,19,30,.62);
  --sh:0 18px 50px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
  --sh-acc:0 10px 34px rgba(229,9,20,.35);
  --r:16px; --r-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg0);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;font-size:14.5px;line-height:1.55}
body{background:
  radial-gradient(1100px 620px at 88% -12%, rgba(229,9,20,.20), transparent 62%),
  radial-gradient(820px 520px at -10% 108%, rgba(245,181,10,.10), transparent 60%),
  linear-gradient(180deg,#050a12,#060d17 40%,#050a12);
  background-attachment:fixed}
h1,h2,h3,h4{font-family:'Sora',system-ui,sans-serif;margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc3);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#1c2534;border-radius:9px}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:grid;place-items:center;z-index:80;padding:20px;
  background:radial-gradient(900px 500px at 50% 0%,rgba(229,9,20,.22),transparent 60%),#050a12}
.card-login{width:min(420px,100%);background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--line2);
  border-radius:22px;padding:30px;box-shadow:var(--sh);animation:pop .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}

/* ---------- LAYOUT ---------- */
.app{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:16px 14px 40px;
  background:linear-gradient(180deg,rgba(12,19,30,.9),rgba(6,13,23,.92));backdrop-filter:blur(16px);border-right:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center;padding:10px 8px 18px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-family:'Sora';box-shadow:var(--sh-acc)}
.brand small{color:var(--mut);display:block;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.folder{margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:rgba(17,25,36,.5)}
.folder>.fhead{width:100%;display:flex;align-items:center;gap:11px;padding:13px 13px;background:transparent;border:0;cursor:pointer;font-weight:700;transition:.2s}
.folder>.fhead:hover{background:rgba(229,9,20,.10)}
.folder>.fhead .chev{margin-left:auto;transition:.25s;color:var(--dim)}
.folder.open>.fhead .chev{transform:rotate(90deg);color:var(--acc2)}
.fbody{display:none;padding:6px 8px 10px}
.folder.open .fbody{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.navbtn{width:100%;display:flex;align-items:center;gap:11px;padding:11px 12px;margin:4px 0;border-radius:12px;border:1px solid transparent;
  background:rgba(255,255,255,.03);cursor:pointer;font-weight:600;font-size:13.6px;transition:.18s;text-align:left}
.navbtn:hover{transform:translateX(4px);border-color:var(--line2);background:rgba(229,9,20,.12)}
.navbtn.active{background:var(--grad);box-shadow:var(--sh-acc);border-color:transparent}
.navbtn .ic{width:26px;height:26px;display:grid;place-items:center;font-size:16px}
.badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700}
main{padding:22px 26px 70px;max-width:1400px}
.topbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px;position:sticky;top:0;z-index:20;
  padding:14px 16px;border-radius:var(--r);background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--sh)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- UI ---------- */
.card{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);transition:.25s}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 17px;border-radius:12px;border:1px solid var(--line2);
  background:rgba(255,255,255,.05);cursor:pointer;font-weight:700;font-size:13.5px;transition:.18s}
.btn:hover{transform:translateY(-2px);border-color:var(--acc2);box-shadow:0 8px 22px rgba(229,9,20,.25)}
.btn.primary{background:var(--grad);border-color:transparent;box-shadow:var(--sh-acc)}
.btn.warn{background:var(--grad2);border-color:transparent;color:#14100a}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
label{display:block;font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px 13px;border-radius:11px;border:1px solid var(--line2);background:rgba(5,10,18,.7);outline:none;transition:.18s}
input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(229,9,20,.18)}
table{width:100%;border-collapse:collapse;font-size:13.4px}
th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
tbody tr:hover{background:rgba(229,9,20,.07)}
.kpi{font-family:'Sora';font-size:31px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;border:1px solid var(--line2)}
.t-ok{background:rgba(34,197,139,.16);color:#6ff0bd;border-color:rgba(34,197,139,.4)}
.t-warn{background:rgba(245,181,10,.16);color:#ffd15c;border-color:rgba(245,181,10,.4)}
.t-err{background:rgba(229,9,20,.18);color:#ff8b93;border-color:rgba(229,9,20,.45)}
.t-info{background:rgba(74,163,255,.16);color:#a5d0ff;border-color:rgba(74,163,255,.4)}
.muted{color:var(--mut)}.dim{color:var(--dim);font-size:12.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sect{animation:fade .3s}
h2.page{font-size:25px;margin-bottom:4px}
.hint{font-size:12.8px;color:var(--mut);margin-bottom:16px}
#toast{position:fixed;right:18px;bottom:18px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--acc2);border-radius:12px;padding:12px 16px;box-shadow:var(--sh);animation:pop .3s}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(3,6,11,.75);backdrop-filter:blur(6px)}
.modal .inner{width:min(880px,100%);max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:22px;box-shadow:var(--sh);animation:pop .3s}
.linkcard{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(17,25,36,.55);transition:.2s;cursor:pointer}
.linkcard:hover{transform:translateY(-3px);border-color:var(--acc2);box-shadow:var(--sh-acc)}
.ico-lg{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:var(--grad);box-shadow:var(--sh-acc);flex:0 0 auto}
.alertbar{border-left:4px solid var(--acc2);background:rgba(229,9,20,.10);padding:11px 14px;border-radius:0 12px 12px 0;margin-bottom:9px}
.alertbar.w{border-color:var(--warn);background:rgba(245,181,10,.10)}
.alertbar.o{border-color:var(--ok);background:rgba(34,197,139,.10)}
.tree{list-style:none;margin:0;padding-left:14px;border-left:1px dashed var(--line2)}
.tree li{padding:5px 0}
.mono{font-family:'JetBrains Mono',monospace;font-size:12.4px}
@media(max-width:960px){.app{grid-template-columns:1fr}aside{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:16px}}


/* ========== MODESK v8 — REDESIGN CINEMÁTICO / WINDOWS ========== */
:root{
  --bg0:#03060c;--bg1:#070c16;--bg2:#0a111d;--bg3:#101722;--bg4:#151d2a;
  --fg:#f5f7fb;--mut:#9ca7ba;--dim:#6f7b8f;
  --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.15);
  --acc:#ef1427;--acc2:#ff2035;--acc3:#ff6674;
  --warn:#f6b91b;--ok:#28d59a;--info:#5ba9ff;
  --grad:linear-gradient(135deg,#ff273b 0%,#e70c20 58%,#9d0612 100%);
  --grad2:linear-gradient(135deg,#f7c42d,#e7182c);
  --glass:rgba(8,14,24,.78);
  --sh:0 24px 64px rgba(0,0,0,.48),0 1px 0 rgba(255,255,255,.025) inset;
  --sh-acc:0 12px 36px rgba(239,20,39,.26),0 0 0 1px rgba(255,61,77,.13);
  --r:14px;--r-sm:9px;
}
*{scrollbar-color:#8c1020 #070b12}
html{background:#03060c;scroll-behavior:smooth}
body{min-height:100vh;letter-spacing:0;background:
  radial-gradient(900px 700px at 9% 35%,rgba(173,0,23,.25),transparent 66%),
  radial-gradient(1000px 740px at 100% 18%,rgba(20,67,137,.23),transparent 68%),
  linear-gradient(125deg,#06050b 0%,#080d17 48%,#07101e 100%);background-attachment:fixed}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(to bottom,black,transparent 80%)}
::selection{background:rgba(255,32,53,.35);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#070b12}::-webkit-scrollbar-thumb{background:linear-gradient(#b11325,#6e0b18);border-radius:8px}
h1,h2,h3,h4{letter-spacing:0}

/* login */
#login{overflow:hidden;background:radial-gradient(850px 520px at 12% 50%,rgba(209,7,34,.29),transparent 65%),radial-gradient(900px 600px at 100% 0%,rgba(25,69,142,.24),transparent 67%),#050810}
#login:before{content:"MODESK";position:absolute;left:-1.5vw;bottom:-10vh;font:800 clamp(100px,20vw,320px)/1 'Sora',system-ui;color:rgba(255,255,255,.018);letter-spacing:.08em;pointer-events:none}
.card-login{position:relative;width:min(460px,100%);padding:34px;background:rgba(8,14,24,.84);border:1px solid rgba(255,255,255,.12);border-top-color:rgba(255,50,70,.35);border-radius:16px;box-shadow:0 40px 100px rgba(0,0,0,.65),-30px 0 90px rgba(207,7,31,.12);animation:loginIn .7s cubic-bezier(.16,1,.3,1)}
.card-login:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(135deg,rgba(255,44,62,.08),transparent 35%)}
@keyframes loginIn{from{opacity:0;transform:translateY(24px) scale(.97);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}

/* shell */
.app{grid-template-columns:252px minmax(0,1fr);position:relative}
aside{padding:16px 12px 36px;background:linear-gradient(180deg,rgba(4,8,15,.97),rgba(7,12,21,.94));border-right:1px solid rgba(239,20,39,.18);box-shadow:12px 0 50px rgba(0,0,0,.28);scrollbar-width:thin}
.brand{position:sticky;top:-16px;z-index:3;margin:-16px -12px 15px;padding:18px 18px 17px;background:rgba(4,8,15,.94);backdrop-filter:blur(18px);border-bottom:1px solid rgba(239,20,39,.2)}
.logo{width:40px;height:40px;border-radius:8px;position:relative;overflow:hidden;background:var(--grad);box-shadow:0 0 28px rgba(239,20,39,.3);animation:logoGlow 3.5s ease-in-out infinite}
.logo:after{content:"";position:absolute;inset:-120% 30%;transform:rotate(25deg);background:rgba(255,255,255,.26);animation:logoSweep 5s ease-in-out infinite}
@keyframes logoGlow{50%{box-shadow:0 0 38px rgba(239,20,39,.48)}}
@keyframes logoSweep{0%,65%{transform:translateX(-80px) rotate(25deg)}85%,100%{transform:translateX(80px) rotate(25deg)}}
.brand h3{font-size:14px!important;letter-spacing:.04em}.brand small{font-size:9px;letter-spacing:.2em;color:#818da2}
.folder{margin-bottom:7px;border-color:rgba(255,255,255,.065);border-radius:9px;background:rgba(255,255,255,.018);transition:border-color .2s,background .2s}
.folder:hover{border-color:rgba(255,255,255,.11)}
.folder>.fhead{padding:11px 12px;font-size:12.5px;text-transform:uppercase;letter-spacing:.055em;color:#bdc5d2}
.folder>.fhead:hover{background:rgba(239,20,39,.08);color:var(--fg)}
.fbody{padding:4px 6px 8px}
.navbtn{min-height:40px;padding:9px 10px;border-radius:7px;background:transparent;color:#929dae;font-size:12.8px;position:relative;overflow:hidden}
.navbtn:before{content:"";position:absolute;left:0;top:25%;bottom:25%;width:2px;background:var(--acc2);opacity:0;transform:scaleY(0);transition:.2s}
.navbtn:hover{transform:translateX(2px);border-color:rgba(255,255,255,.08);background:rgba(255,255,255,.035);color:var(--fg)}
.navbtn.active{background:linear-gradient(90deg,rgba(239,20,39,.22),rgba(239,20,39,.04));box-shadow:none;border-color:rgba(239,20,39,.22);color:#fff}
.navbtn.active:before{opacity:1;transform:scaleY(1);box-shadow:0 0 12px var(--acc2)}
.navbtn .ic{width:23px;height:23px;filter:saturate(.8)}
main{width:100%;max-width:none;padding:22px clamp(18px,3vw,48px) 80px;overflow:hidden}
.topbar{margin-bottom:26px;padding:11px 14px;border-radius:10px;background:rgba(5,10,18,.78);border-color:rgba(255,255,255,.08);border-bottom-color:rgba(239,20,39,.18);box-shadow:0 14px 40px rgba(0,0,0,.28);backdrop-filter:blur(20px)}
.topbar>b{text-transform:uppercase;font-family:'Sora',system-ui;font-size:12px;letter-spacing:.08em}.dot{width:7px;height:7px}

/* content */
.sect{max-width:1280px;margin:0 auto;animation:sectionIn .48s cubic-bezier(.2,.75,.25,1)}
@keyframes sectionIn{from{opacity:0;transform:translateY(12px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
h2.page{font-size:clamp(25px,3vw,38px);font-weight:800;margin:5px 0 5px;position:relative;display:inline-block}
h2.page:after{content:"";display:block;width:56px;height:3px;margin-top:11px;border-radius:3px;background:var(--acc2);box-shadow:0 0 14px rgba(255,32,53,.35)}
.hint{font-size:13.5px;margin:12px 0 22px;color:#8e99ab;max-width:760px}
.card{position:relative;padding:18px;background:linear-gradient(145deg,rgba(18,24,34,.82),rgba(9,14,23,.82));border-color:rgba(255,255,255,.085);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.025);transition:transform .28s cubic-bezier(.2,.8,.2,1),border-color .28s,box-shadow .28s;overflow:hidden}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,rgba(239,20,39,.045),transparent 38%);opacity:.7}
.card>*{position:relative}.card:hover{border-color:rgba(255,58,76,.23);transform:translateY(-3px);box-shadow:0 22px 50px rgba(0,0,0,.35),0 0 30px rgba(239,20,39,.055)}
.card h3{font-size:14px}.grid{gap:13px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{font-size:29px;color:var(--fg);background:none;-webkit-text-fill-color:initial;margin-top:8px;text-shadow:0 0 28px rgba(239,20,39,.24)}
.badge{background:rgba(239,20,39,.16);color:#ff8b96;border:1px solid rgba(239,20,39,.22)}
.btn{min-height:39px;padding:9px 15px;border-radius:8px;background:rgba(255,255,255,.045);border-color:rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.03);transition:transform .18s,border-color .18s,background .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.075);border-color:rgba(255,42,60,.55);box-shadow:0 9px 24px rgba(0,0,0,.28),0 0 20px rgba(239,20,39,.1)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{background:var(--grad);border-color:rgba(255,74,89,.35);box-shadow:0 8px 24px rgba(239,20,39,.23)}
.btn.primary:hover{box-shadow:0 12px 30px rgba(239,20,39,.38);filter:saturate(1.08)}
.btn.warn{color:#160c08}.btn.sm{min-height:32px;padding:6px 10px;border-radius:7px}
input,select,textarea{border-radius:8px;background:rgba(2,7,14,.72);border-color:rgba(255,255,255,.12);caret-color:var(--acc2)}
input:hover,select:hover,textarea:hover{border-color:rgba(255,255,255,.21)}
input:focus,select:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px rgba(239,20,39,.13),0 8px 24px rgba(0,0,0,.18)}
label{color:#8994a7;font-size:10.5px;letter-spacing:.09em}
table{border-collapse:separate;border-spacing:0}th{color:#7f899c;font-size:10px}th,td{border-color:rgba(255,255,255,.065)}tbody tr{transition:background .18s}tbody tr:hover{background:rgba(239,20,39,.055)}
.tag{border-radius:6px}.linkcard{border-radius:10px;background:linear-gradient(145deg,rgba(18,24,34,.8),rgba(8,13,22,.8))}.ico-lg{border-radius:9px}
.alertbar{border-radius:0 8px 8px 0}.modal{background:rgba(0,3,8,.82)}.modal .inner{border-radius:14px;background:#0a111d}.toast{border-radius:8px}

@media(max-width:960px){.app{grid-template-columns:1fr}aside{position:relative;height:auto;max-height:44vh;border-right:0;border-bottom:1px solid rgba(239,20,39,.2)}.brand{position:relative;top:auto}main{padding:14px 12px 60px}.topbar{position:relative;top:auto}.sect{width:100%}}
@media(max-width:620px){.card-login{padding:24px 20px}.topbar{display:grid;grid-template-columns:auto minmax(0,1fr)}.topbar>div{grid-column:1/-1;margin-left:0!important}.g2,.g3,.g4{grid-template-columns:1fr}.card{padding:15px}table{display:block;overflow-x:auto;white-space:nowrap}h2.page{font-size:27px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}



/* ========== MODESK v9 — TECH INTERFACE ========== */
:root{--tech-cyan:#56d9ff;--tech-violet:#9d7cff;--panel-glow:rgba(67,164,255,.12)}
.card-login{border-radius:10px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px))}
.remember-row{display:flex;align-items:center;gap:10px;margin-top:13px;color:var(--mut);font-size:12.5px;cursor:pointer;user-select:none}.remember-row input{appearance:none;width:36px;height:20px;padding:0;margin:0;border-radius:20px;background:var(--bg4);position:relative;flex:none}.remember-row input:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;left:2px;top:2px;background:var(--mut);transition:.22s}.remember-row input:checked{background:rgba(239,20,39,.32);border-color:var(--acc2)}.remember-row input:checked:after{left:18px;background:var(--fg);box-shadow:0 0 10px var(--acc2)}
.folder{border:0;border-radius:0;background:transparent;margin:0 0 3px;overflow:visible}
.folder>.fhead{border-radius:7px;border:1px solid transparent;padding:10px 9px;color:#738096}.folder>.fhead:hover{border-color:rgba(86,217,255,.1);background:linear-gradient(90deg,rgba(86,217,255,.07),transparent);color:#dce5f2}.folder>.fhead .chev{font-size:17px}
.fbody{position:relative;padding:2px 3px 7px 13px;margin-left:17px;border-left:1px solid rgba(91,169,255,.12)}
.navbtn{min-height:38px;border:0;border-radius:5px;padding:8px 9px;margin:2px 0;color:#8f9bad}
.navbtn.active{background:linear-gradient(90deg,rgba(239,20,39,.2),rgba(49,113,184,.08) 68%,transparent);box-shadow:inset 0 0 18px rgba(239,20,39,.045);color:#f7f9fc}
.navbtn.active:after{content:"";position:absolute;right:7px;width:5px;height:5px;border-radius:50%;background:var(--acc2);box-shadow:0 0 9px var(--acc2)}
.ui-icon{width:18px;height:18px;display:inline-grid;place-items:center;flex:none;color:currentColor;transition:transform .32s cubic-bezier(.2,.8,.2,1),color .25s,filter .25s}.ui-icon svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fhead .ui-icon{color:#65748a}.fhead:hover .ui-icon{color:var(--tech-cyan);transform:rotate(-5deg) scale(1.12);filter:drop-shadow(0 0 7px rgba(86,217,255,.5))}.navbtn .ui-icon{width:17px;height:17px;color:#748197}.navbtn:hover .ui-icon{color:var(--tech-cyan);transform:translateY(-2px) scale(1.14);filter:drop-shadow(0 0 7px rgba(86,217,255,.55))}.navbtn.active .ui-icon{color:var(--acc3);filter:drop-shadow(0 0 8px rgba(255,32,53,.6))}.navbtn.active:hover .ui-icon{transform:translateY(-2px) rotate(4deg) scale(1.16)}
.card{border-radius:7px;background:linear-gradient(145deg,rgba(13,21,33,.88),rgba(6,11,20,.9));clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,0 100%);border-color:rgba(105,135,173,.14);box-shadow:0 14px 36px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.025)}
.card:before{background:linear-gradient(115deg,rgba(86,217,255,.04),transparent 32%,rgba(239,20,39,.035));opacity:1}.card:after{content:"";position:absolute;left:0;top:0;width:42px;height:1px;background:var(--tech-cyan);box-shadow:0 0 10px rgba(86,217,255,.7);opacity:.42;transition:width .35s,opacity .35s}.card:hover{transform:translateY(-4px);border-color:rgba(86,217,255,.25);box-shadow:0 22px 48px rgba(0,0,0,.38),0 0 28px rgba(43,137,213,.07)}.card:hover:after{width:105px;opacity:.9}
.kpi-card{min-height:126px;display:flex;flex-direction:column;justify-content:space-between}.kpi-head{display:flex;justify-content:space-between;align-items:center;color:#8390a4;text-transform:uppercase;font-size:10px;font-weight:700;letter-spacing:.1em}.kpi-icon{width:36px;height:36px;display:grid;place-items:center;color:var(--tech-cyan);border:1px solid rgba(86,217,255,.18);background:rgba(86,217,255,.045);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,0 100%);transition:.3s}.kpi-card:hover .kpi-icon{color:var(--acc3);border-color:rgba(255,32,53,.3);background:rgba(239,20,39,.08);transform:translateY(-3px) rotate(3deg);filter:drop-shadow(0 0 10px rgba(239,20,39,.3))}.kpi-icon .ui-icon{width:18px;height:18px}.kpi{font-family:'JetBrains Mono',monospace;font-size:32px;margin-top:14px}.kpi-card:hover .kpi{color:#fff;text-shadow:0 0 20px rgba(86,217,255,.32)}
.ico-lg{border-radius:5px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,0 100%);background:rgba(239,20,39,.1);color:var(--acc3);border:1px solid rgba(239,20,39,.25);box-shadow:inset 0 0 18px rgba(239,20,39,.07)}.ico-lg .ui-icon{width:21px;height:21px}.card:hover .ico-lg .ui-icon,.linkcard:hover .ico-lg .ui-icon{transform:translateY(-2px) rotate(5deg) scale(1.12);filter:drop-shadow(0 0 8px currentColor)}
.linkcard{border-radius:6px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
@media(max-width:960px){.fbody{margin-left:13px}.kpi-card{min-height:110px}}

</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="card-login">
    <div class="row" style="gap:14px;margin-bottom:12px">
      <div class="logo">M</div>
      <div><h2 style="font-size:20px">MODESK PESSOAL</h2><small class="dim">v9 · central operacional pessoal</small></div>
    </div>
    <p class="dim">Acesso exclusivo — usuário único <b class="mono">marciooliveira</b>.</p>
    <label>Usuário</label><input id="lg-user" value="marciooliveira" autocomplete="username"/>
    <label>Senha</label><input id="lg-pass" type="password" placeholder="senha" autocomplete="current-password"/>
    <label class="remember-row"><input id="lg-remember" type="checkbox" checked/><span>Manter este PC conectado</span></label>
    <div class="row" style="margin-top:16px">
      <button class="btn primary" onclick="doLogin()">Entrar</button>
      <span class="dim">acesso pessoal protegido</span>
    </div>
    <div id="lg-err" class="dim" style="color:var(--acc3);margin-top:8px"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app hidden" id="app">
  <aside>
    <div class="brand">
      <div class="logo">M</div>
      <div><h3 style="font-size:16px">MODESK PESSOAL</h3><small>gestão de serviços</small></div>
    </div>
    <div id="menu"></div>
    <button class="navbtn" style="margin-top:14px" onclick="logout()"><span class="ic">⏻</span>Sair</button>
  </aside>

  <main>
    <div class="topbar">
      <span class="dot"></span>
      <b id="tb-title">Dashboard</b>
      <span class="dim" id="tb-sync">local · tempo real entre abas</span>
      <div style="margin-left:auto" class="row">
        <span class="tag t-info mono" id="tb-os">SO: —</span>
        <span class="tag mono" id="tb-clock">--:--</span>
        <button class="btn sm" onclick="exportJSON()">⬇ Backup</button>
        <button class="btn sm primary" onclick="baixarHTML()">⬇ Baixar HTML</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="toast"></div>
<div id="modal-root"></div>

<script>
/* ================= ESTADO ================= */
const LS='modesk.pessoal.v7';
const GESTOR='marciooliveira';
const DEF={
  senha:'marcio2026',
  servicos:[
    {id:u(),nome:'Suporte Técnico',icone:'🛠️',sub:[{id:u(),nome:'Chamados internos',itens:[]},{id:u(),nome:'Manutenções',itens:[]}]},
    {id:u(),nome:'Compras',icone:'🧾',sub:[{id:u(),nome:'Pedidos abertos',itens:[]}]},
    {id:u(),nome:'Documentos',icone:'📁',sub:[{id:u(),nome:'Laudos',itens:[]},{id:u(),nome:'Planilhas',itens:[]}]}
  ],
  acessos:[
    {id:u(),nome:'PC Sala de Som',tipo:'AnyDesk',endereco:'000 000 000',so:'Windows',obs:'estação principal'},
    {id:u(),nome:'Servidor Local',tipo:'VNC',endereco:'192.168.0.10:5900',so:'Linux',obs:''}
  ],
  pastas:[
    {id:u(),nome:'Pedidos de Compra',caminho:'C:\\MODESK\\Pedidos',desc:'PDFs e planilhas dos pedidos'},
    {id:u(),nome:'SEND',caminho:'C:\\MODESK\\SEND',desc:'Comprovantes e retornos de e-mail'}
  ],
  links:[
    {id:u(),nome:'MXM',url:'',icone:'🏢',desc:'ERP MXM — inserir link'},
    {id:u(),nome:'Websuporte Senac',url:'',icone:'🎓',desc:'Portal de suporte — inserir link'},
    {id:u(),nome:'SEND',url:'',icone:'✉️',desc:'Plataforma SEND — inserir link'}
  ],
  pedidos:[], sends:[], eventos:[], itens:[],
  fb:{apiKey:'',projectId:'',authDomain:'',appId:''}
};
let state=load(), tab='dashboard';

function u(){return Math.random().toString(36).slice(2,10)}
function load(){try{const v=localStorage.getItem(LS);if(v)return Object.assign(structuredClone(DEF),JSON.parse(v))}catch(e){}return structuredClone(DEF)}
function save(silent){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){toast('Armazenamento cheio')}
  bc.postMessage({t:'sync',s:state}); pushCloud(); if(!silent)render()}
const bc=new BroadcastChannel('modesk-pessoal');
bc.onmessage=e=>{if(e.data?.t==='sync'){state=e.data.s;render();}};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.getElementById('toast').append(d);setTimeout(()=>d.remove(),3200)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

/* ================= LOGIN ================= */
function doLogin(){
  const usr=$('lg-user').value.trim().toLowerCase(), pw=$('lg-pass').value;
  if(usr!==GESTOR){return $('lg-err').textContent='Plataforma pessoal: somente '+GESTOR+'.'}
  if(pw!==state.senha){return $('lg-err').textContent='Senha incorreta.'}
  sessionStorage.setItem('modesk.sess','1'); if($('lg-remember').checked)localStorage.setItem('modesk.trusted','1'); start();
}
function logout(){sessionStorage.removeItem('modesk.sess');localStorage.removeItem('modesk.trusted');location.reload()}
function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');detectOS();buildMenu();render();connectCloud();
  setInterval(()=>{$('tb-clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})},1000);}
$('lg-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
if(sessionStorage.getItem('modesk.sess')||localStorage.getItem('modesk.trusted')==='1')start();

/* ================= DETECÇÃO DE SO ================= */
let OSINFO={};
function detectOS(){
  const ua=navigator.userAgent, p=navigator.platform||'';
  let os='Desconhecido';
  if(/Windows NT 10|Windows NT 11/.test(ua))os='Windows 10/11';
  else if(/Windows/.test(ua))os='Windows';
  else if(/Mac OS X/.test(ua))os='macOS';
  else if(/Android/.test(ua))os='Android';
  else if(/iPhone|iPad/.test(ua))os='iOS';
  else if(/Linux/.test(ua))os='Linux';
  OSINFO={os,plataforma:p,nucleos:navigator.hardwareConcurrency||'—',
    memoria:(navigator.deviceMemory?navigator.deviceMemory+' GB':'—'),
    idioma:navigator.language,tela:screen.width+'×'+screen.height,
    online:navigator.onLine?'Online':'Offline',fuso:Intl.DateTimeFormat().resolvedOptions().timeZone};
  $('tb-os').textContent='SO: '+os;
}

/* ================= NUVEM (tempo real) ================= */
let db=null,unsub=null;
function connectCloud(){
  const c=state.fb; if(!c.apiKey||!c.projectId)return;
  try{
    const app=firebase.apps.length?firebase.app():firebase.initializeApp({apiKey:c.apiKey,projectId:c.projectId,authDomain:c.authDomain||c.projectId+'.firebaseapp.com',appId:c.appId});
    db=firebase.firestore(app);
    unsub&&unsub();
    unsub=db.collection('modesk_pessoal').doc(GESTOR).onSnapshot(d=>{
      const data=d.data(); if(!data?.payload)return;
      const remote=JSON.parse(data.payload);
      if(JSON.stringify(remote)!==JSON.stringify(state)){state=Object.assign(structuredClone(DEF),remote);localStorage.setItem(LS,JSON.stringify(state));render();}
    });
    $('tb-sync').textContent='nuvem · tempo real ativo';
    toast('Tempo real conectado');
  }catch(e){toast('Falha na nuvem: '+e.message)}
}
function pushCloud(){if(!db)return;db.collection('modesk_pessoal').doc(GESTOR).set({payload:JSON.stringify(state),at:Date.now()}).catch(()=>{})}

/* ================= MENU (pastas/subpastas) ================= */
const ICONS={
 dashboard:'<path d="M4 13h6V4H4zM14 20h6V11h-6zM4 20h6v-3H4zM14 7h6V4h-6z"/>',
 bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
 folder:'<path d="M3 6h7l2 2h9v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 boxes:'<path d="m12 2 4 2.3v4.5L12 11 8 8.8V4.3zM5 11l4 2.3v4.5L5 20l-4-2.2v-4.5zM19 11l4 2.3v4.5L19 20l-4-2.2v-4.5z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"/>',
 cart:'<circle cx="9" cy="20" r="1"/><circle cx="19" cy="20" r="1"/><path d="M3 4h2l2.5 11h11l2-7H6"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
 calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
 monitor:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
 plug:'<path d="m8 12 8-8M14 3l7 7M6 11l7 7M3 21l5-5"/>',
 pulse:'<path d="M3 12h4l2-6 4 12 2-6h6"/>',
 database:'<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/>',
 link:'<path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
 package:'<path d="m21 8-9-5-9 5 9 5zM3 8v8l9 5 9-5V8M12 13v8"/>'
};
function icon(name){return `<span class="ui-icon" aria-hidden="true"><svg viewBox="0 0 24 24">${ICONS[name]||ICONS.boxes}</svg></span>`}
const MENU=[
  {nome:'Painel',icone:'dashboard',itens:[{k:'dashboard',n:'Dashboard',i:'dashboard'},{k:'agenda',n:'Agenda & Avisos',i:'bell'}]},
  {nome:'Serviços',icone:'folder',itens:[{k:'servicos',n:'Pastas de Serviços',i:'folder'},{k:'itens',n:'Cadastro de Itens',i:'boxes'}]},
  {nome:'Operacional',icone:'gear',itens:[{k:'pedidos',n:'Pedidos de Compra',i:'cart'},{k:'send',n:'Acompanhamento SEND',i:'mail'},{k:'eventos',n:'Eventos',i:'calendar'}]},
  {nome:'Máquina & Acessos',icone:'monitor',itens:[{k:'remoto',n:'Conexões Remotas',i:'plug'},{k:'monitor',n:'Monitoramento do PC',i:'pulse'},{k:'pastasfs',n:'Pastas Internas',i:'database'}]},
  {nome:'Atalhos',icone:'link',itens:[{k:'links',n:'Sites Importantes',i:'link'}]},
  {nome:'Sistema',icone:'shield',itens:[{k:'config',n:'Configurações',i:'gear'},{k:'entrega',n:'Entrega & Pendências',i:'package'}]}
];
function buildMenu(){
  $('menu').innerHTML=MENU.map((f,ix)=>`
   <div class="folder ${ix<3?'open':''}" id="fold-${ix}">
     <button class="fhead" onclick="document.getElementById('fold-${ix}').classList.toggle('open')">
       ${icon(f.icone)}${f.nome}<span class="chev">›</span></button>
     <div class="fbody">${f.itens.map(i=>`<button class="navbtn" data-k="${i.k}" onclick="go('${i.k}')">${icon(i.i)}${i.n}</button>`).join('')}</div>
   </div>`).join('');
}
function go(k){tab=k;render();window.scrollTo({top:0,behavior:'smooth'})}

/* ================= ALERTAS DE DATAS ================= */
function dias(d){return Math.ceil((new Date(d)-new Date().setHours(0,0,0,0))/864e5)}
function alertas(){
  const out=[];
  state.eventos.forEach(e=>{const d=dias(e.data);
    if(d<0)out.push({t:'err',m:`Evento vencido: ${e.titulo} (${fmt(e.data)})`});
    else if(d===0)out.push({t:'err',m:`HOJE: ${e.titulo} às ${e.hora||'--:--'}`});
    else if(d<=3)out.push({t:'w',m:`Em ${d} dia(s): ${e.titulo} — ${fmt(e.data)} ${e.hora||''}`});});
  state.pedidos.forEach(p=>{if(!p.prazo)return;const d=dias(p.prazo);
    if(p.status!=='Concluído'&&d<0)out.push({t:'err',m:`Pedido ${p.numero} atrasado ${Math.abs(d)}d`});
    else if(p.status!=='Concluído'&&d<=5)out.push({t:'w',m:`Pedido ${p.numero} vence em ${d}d`});});
  state.sends.forEach(s=>{if(s.status==='Aguardando retorno'&&dias(s.data)<-2)out.push({t:'w',m:`SEND "${s.assunto}" sem retorno há ${Math.abs(dias(s.data))} dias`})});
  return out;
}
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('pt-BR'):'—';

/* ================= RENDER ================= */
function render(){
  document.querySelectorAll('.navbtn[data-k]').forEach(b=>b.classList.toggle('active',b.dataset.k===tab));
  const map={dashboard:vDash,agenda:vAgenda,servicos:vServicos,itens:vItens,pedidos:vPedidos,send:vSend,eventos:vEventos,
    remoto:vRemoto,monitor:vMonitor,pastasfs:vPastas,links:vLinks,config:vConfig,entrega:vEntrega};
  const titulos={dashboard:'Dashboard',agenda:'Agenda & Avisos',servicos:'Pastas de Serviços',itens:'Cadastro de Itens',pedidos:'Pedidos de Compra',
    send:'Acompanhamento SEND',eventos:'Eventos',remoto:'Conexões Remotas',monitor:'Monitoramento do PC',pastasfs:'Pastas Internas',
    links:'Sites Importantes',config:'Configurações',entrega:'Entrega & Pendências'};
  $('tb-title').textContent=titulos[tab]||'';
  $('view').innerHTML=`<div class="sect">${(map[tab]||vDash)()}</div>`;
}
const page=(t,h,b)=>`<h2 class="page">${t}</h2><div class="hint">${h}</div>${b}`;

/* ---- Dashboard ---- */
function vDash(){
  const a=alertas();
  return page('Bem-vindo, Marcio','Visão geral em tempo real da sua operação pessoal.',`
  <div class="grid g4" style="margin-bottom:16px">
    ${kpi('Serviços',state.servicos.length,'📂')}${kpi('Pedidos',state.pedidos.length,'🧾')}
    ${kpi('SEND',state.sends.length,'✉️')}${kpi('Eventos',state.eventos.length,'📅')}
    ${kpi('Acessos',state.acessos.length,'🔌')}${kpi('Itens',state.itens.length,'🧩')}
  </div>
  <div class="grid g2">
    <div class="card"><h3>🔔 Avisos e análise de datas</h3><div style="margin-top:12px">
      ${a.length?a.map(x=>`<div class="alertbar ${x.t==='w'?'w':''}">${esc(x.m)}</div>`).join(''):'<div class="alertbar o">Nada crítico. Tudo em dia ✅</div>'}
    </div></div>
    <div class="card"><h3>📅 Próximos eventos</h3><div style="margin-top:10px">
      ${state.eventos.slice().sort((x,y)=>x.data.localeCompare(y.data)).slice(0,6).map(e=>
        `<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0">
          <div><b>${esc(e.titulo)}</b><div class="dim">${fmt(e.data)} ${esc(e.hora||'')} · ${esc(e.local||'—')}</div></div>
          <button class="btn sm" onclick="verEvento('${e.id}')">Visualizar</button></div>`).join('')||'<div class="dim">Sem eventos.</div>'}
    </div></div>
  </div>`);
}
const kpi=(n,v,i)=>`<div class="card kpi-card"><div class="kpi-head"><span>${n}</span><span class="kpi-icon">${icon(i)}</span></div><div class="kpi">${v}</div></div>`;

/* ---- Agenda ---- */
function vAgenda(){
  const evs=state.eventos.slice().sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
  const a=alertas();
  return page('Agenda integrada','Eventos, pedidos e SEND unificados com avisos automáticos por data.',`
  <div class="card" style="margin-bottom:16px"><h3>Avisos ativos <span class="badge">${a.length}</span></h3>
    <div style="margin-top:10px">${a.length?a.map(x=>`<div class="alertbar ${x.t==='w'?'w':''}">${esc(x.m)}</div>`).join(''):'<div class="alertbar o">Agenda limpa.</div>'}</div></div>
  <div class="card"><h3>Linha do tempo</h3><table style="margin-top:10px"><thead><tr><th>Data</th><th>Hora</th><th>Evento</th><th>Local</th><th>Status</th><th></th></tr></thead><tbody>
  ${evs.map(e=>{const d=dias(e.data);const cls=d<0?'t-err':d<=3?'t-warn':'t-ok';
    return `<tr><td class="mono">${fmt(e.data)}</td><td class="mono">${esc(e.hora||'--:--')}</td><td><b>${esc(e.titulo)}</b><div class="dim">${esc(e.info||'')}</div></td>
    <td>${esc(e.local||'—')}</td><td><span class="tag ${cls}">${d<0?'Vencido':d===0?'Hoje':'em '+d+'d'}</span></td>
    <td><button class="btn sm" onclick="verEvento('${e.id}')">Visualizar</button></td></tr>`}).join('')||'<tr><td colspan="6" class="dim">Sem eventos.</td></tr>'}
  </tbody></table></div>`);
}

/* ---- Eventos (CRUD + anexos) ---- */
function vEventos(){

   <div class="card"><h3>Novo evento</h3>

    <div class="grid g2"><div><label>Data</label><input id="ev-d" type="date"/></div><div><label>Hora</label><input id="ev-h" type="time"/></div></div>

    <div style="margin-top:14px"><button class="btn primary" onclick="addEvento()">＋ Salvar evento</button></div>
   </div>
   <div class="card"><h3>Cadastrados <span class="badge">${state.eventos.length}</span></h3>

    </tbody></table></div>
  </div>`);
}
function addEvento(){
  const t=$('ev-t').value.trim(),d=$('ev-d').value; if(!t||!d)return toast('Título e data obrigatórios');
  const f=$('ev-f').files[0];
  const push=(anexo)=>{state.eventos.push({id:u(),titulo:t,data:d,hora:$('ev-h').value,local:$('ev-l').value,info:$('ev-i').value,anexo});save();toast('Evento salvo')};
  if(f){if(f.size>1.5e6)return toast('Anexo muito grande (máx 1,5 MB)');
    const r=new FileReader();r.onload=()=>push({nome:f.name,tipo:f.type,dados:r.result});r.readAsDataURL(f);}else push(null);
}
function verEvento(id){
  const e=state.eventos.find(x=>x.id===id); if(!e)return;
  const d=dias(e.data);
  const an=e.anexo?(e.anexo.tipo.startsWith('image')
      ?`<img src="${e.anexo.dados}" style="max-width:100%;border-radius:12px;border:1px solid var(--line2)"/>`
      :`<a class="btn" href="${e.anexo.dados}" download="${esc(e.anexo.nome)}">⬇ ${esc(e.anexo.nome)}</a>`)
    :'<div class="dim">Sem anexo.</div>';
  modal(`<h2>${esc(e.titulo)}</h2>
    <div class="row" style="margin:10px 0"><span class="tag t-info mono">${fmt(e.data)} ${esc(e.hora||'')}</span>
    <span class="tag ${d<0?'t-err':d<=3?'t-warn':'t-ok'}">${d<0?'Vencido há '+Math.abs(d)+'d':d===0?'É hoje!':'Faltam '+d+' dias'}</span>
    <span class="tag">${esc(e.local||'sem local')}</span></div>
    <p>${esc(e.info||'')}</p><h4 style="margin-top:14px">Anexo</h4><div style="margin-top:8px">${an}</div>`);
}

  <div class="grid g2">

    <div><label>Unidade</label><input id="it-u" value="UN"/></div></div>

    <label>Observação</label><input id="it-o"/>
    <div style="margin-top:14px"><button class="btn primary" onclick="addItem()">＋ Cadastrar</button></div>
   </div>
   <div class="card"><h3>Importar planilha (CSV)</h3>
    <p class="dim">Reconhece automaticamente colunas: descrição, quantidade, unidade, categoria.</p>
    <input type="file" id="it-f" accept=".csv,text/csv"/>
    <div style="margin-top:12px"><button class="btn warn" onclick="importCSV()">⇪ Importar e reconhecer</button></div>
    <div id="it-prev" class="dim" style="margin-top:10px"></div>
   </div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Itens <span class="badge">${state.itens.length}</span></h3>
   <table style="margin-top:10px"><thead><tr><th>Descrição</th><th>Qtd</th><th>Un</th><th>Categoria</th><th>Obs</th><th></th></tr></thead><tbody>
   ${state.itens.map(i=>`<tr><td>${esc(i.desc)}</td><td class="mono">${esc(i.qtd)}</td><td>${esc(i.un)}</td><td>${esc(i.cat||'—')}</td><td class="dim">${esc(i.obs||'')}</td>
    <td><button class="btn sm" onclick="del('itens','${i.id}')">🗑</button></td></tr>`).join('')||'<tr><td colspan="6" class="dim">Nenhum item.</td></tr>'}
   </tbody></table></div>`);
}
function addItem(){const d=$('it-d').value.trim();if(!d)return toast('Descrição obrigatória');
  state.itens.push({id:u(),desc:d,qtd:$('it-q').value||1,un:$('it-u').value||'UN',cat:$('it-c').value,obs:$('it-o').value});save();toast('Item cadastrado')}
function importCSV(){
  const f=$('it-f').files[0]; if(!f)return toast('Selecione um CSV');
  const r=new FileReader();
  r.onload=()=>{
    const linhas=r.result.split(/\r?\n/).filter(Boolean);
    if(!linhas.length)return toast('Arquivo vazio');
    const sep=linhas[0].includes(';')?';':',';
    const head=linhas[0].split(sep).map(h=>h.trim().toLowerCase());
    const find=(...ns)=>head.findIndex(h=>ns.some(n=>h.includes(n)));
    const iD=find('desc','item','produto'),iQ=find('qtd','quant'),iU=find('unid','un'),iC=find('categ','tipo');
    let n=0;
    linhas.slice(1).forEach(l=>{const c=l.split(sep);const d=(c[iD]||c[0]||'').trim();if(!d)return;
      state.itens.push({id:u(),desc:d,qtd:(c[iQ]||1).toString().trim(),un:(c[iU]||'UN').trim(),cat:(c[iC]||'').trim(),obs:'importado'});n++});
    $('it-prev').textContent=`Reconhecido: ${n} itens (colunas: ${head.join(' | ')})`;
    save();toast(n+' itens importados');
  };
  r.readAsText(f,'utf-8');
}

function addAcesso(){const n=$('ac-n').value.trim();if(!n)return toast('Informe o nome');
  state.acessos.push({id:u(),nome:n,tipo:$('ac-t').value,endereco:$('ac-e').value,so:$('ac-s').value,obs:$('ac-o').value});save();toast('Acesso adicionado')}
function abrirRemoto(id){const a=state.acessos.find(x=>x.id===id);if(!a)return;
  let url=a.endereco;
  if(a.tipo==='AnyDesk')url='anydesk:'+a.endereco.replace(/\s/g,'');
  else if(a.tipo==='VNC')url='vnc://'+a.endereco;
  else if(a.tipo==='RDP')url='rdp://'+a.endereco;
  else if(!/^https?:/.test(url))url='https://'+url;
  toast('Abrindo '+a.tipo+'…');window.location.href=url;
}

    <ul class="dim">
      <li><b>Agente local leve</b> (Node.js/Python) expondo <span class="mono">http://localhost:8765/status</span> com CPU, RAM, disco, uptime — a plataforma consome via fetch.</li>
      <li><b>Windows:</b> script PowerShell + tarefa agendada gravando JSON numa pasta monitorada.</li>
      <li><b>Zabbix / Netdata / Glances</b> em modo web e embutir o painel via iframe.</li>
      <li><b>File System Access API</b> (Chrome/Edge) para ler pastas locais autorizadas por você.</li>
    </ul>
    <label>URL do agente local (opcional)</label>
    <div class="row"><input id="mon-url" value="${esc(state.agente||'http://localhost:8765/status')}" style="max-width:320px"/>

    <div id="mon-out" class="mono dim" style="margin-top:10px"></div></div>
  </div>`);
}
function testarAgente(){const url=$('mon-url').value.trim();state.agente=url;save(true);
  $('mon-out').textContent='Consultando…';
  fetch(url,{cache:'no-store'}).then(r=>r.json()).then(j=>$('mon-out').textContent=JSON.stringify(j,null,2))
    .catch(e=>$('mon-out').textContent='Sem resposta do agente ('+e.message+'). Instale o agente local para habilitar.');
}

  state.pastas.push({id:u(),nome:n,caminho:$('pf-c').value,desc:$('pf-d').value});save();toast('Pasta adicionada')}
function abrirCaminho(c){try{window.open('file:///'+c.replace(/\\/g,'/'),'_blank')}catch(e){}
  navigator.clipboard&&navigator.clipboard.writeText(c);toast('Caminho copiado — cole no Explorer se o navegador bloquear')}
async function abrirLocal(){
  if(!window.showDirectoryPicker)return toast('Recurso disponível no Chrome/Edge desktop');
  try{const dir=await window.showDirectoryPicker();const arr=[];
    for await(const [nome,h] of dir.entries()){arr.push((h.kind==='directory'?'📂 ':'📄 ')+nome);if(arr.length>200)break}
    $('fs-list').innerHTML=`<h3>📂 ${esc(dir.name)} <span class="badge">${arr.length}</span></h3><ul class="tree" style="margin-top:10px">${arr.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>`;
  }catch(e){}
}

  state.links.push({id:u(),nome:n,url:$('lk-u').value,icone:$('lk-i').value||'🌐',desc:$('lk-d').value});save();toast('Atalho criado')}
function editLink(id){const l=state.links.find(x=>x.id===id);const v=prompt('URL de '+l.nome,l.url||'https://');if(v!==null){l.url=v.trim();save();toast('Atualizado')}}

/* ---- Config ---- */
function vConfig(){
  return page('Configurações','Segurança, sincronização em tempo real e backup.',`
  <div class="grid g2">
   <div class="card"><h3>🔐 Acesso</h3><p class="dim">Usuário fixo: <b class="mono">${GESTOR}</b> (plataforma pessoal, sem multiusuário).</p>
     <label>Nova senha</label><input id="cf-s" type="password"/>
     <div style="margin-top:12px"><button class="btn primary" onclick="trocarSenha()">Salvar senha</button></div></div>
   <div class="card"><h3>☁️ Tempo real (Firebase)</h3><p class="dim">Sincroniza este mesmo usuário entre seus dispositivos.</p>
     <div class="grid g2">
      <div><label>API Key</label><input id="cf-k" value="${esc(state.fb.apiKey)}"/></div>
      <div><label>Project ID</label><input id="cf-p" value="${esc(state.fb.projectId)}"/></div>
      <div><label>Auth Domain</label><input id="cf-a" value="${esc(state.fb.authDomain)}"/></div>
      <div><label>App ID</label><input id="cf-i" value="${esc(state.fb.appId)}"/></div></div>
     <div class="row" style="margin-top:12px"><button class="btn primary" onclick="salvarFb()">Conectar</button>
     <span class="dim" id="cf-st">${db?'conectado':'offline (local + abas)'}</span></div></div>
   <div class="card"><h3>💾 Backup</h3>
     <div class="row"><button class="btn" onclick="exportJSON()">⬇ Exportar JSON</button>
     <input type="file" id="cf-f" accept=".json" style="max-width:230px"/><button class="btn" onclick="importJSON()">⇪ Importar</button></div>
     <div class="row" style="margin-top:12px"><button class="btn warn" onclick="baixarHTML()">⬇ Baixar HTML completo</button></div></div>
  </div>`);
}
function trocarSenha(){const v=$('cf-s').value;if(v.length<4)return toast('Mínimo 4 caracteres');state.senha=v;save();toast('Senha atualizada')}
function salvarFb(){state.fb={apiKey:$('cf-k').value.trim(),projectId:$('cf-p').value.trim(),authDomain:$('cf-a').value.trim(),appId:$('cf-i').value.trim()};save(true);connectCloud();render()}
function exportJSON(){dl(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'modesk-pessoal-backup.json')}
function importJSON(){const f=$('cf-f').files[0];if(!f)return toast('Selecione o arquivo');const r=new FileReader();
  r.onload=()=>{try{state=Object.assign(structuredClone(DEF),JSON.parse(r.result));save();toast('Backup restaurado')}catch(e){toast('JSON inválido')}};r.readAsText(f)}
function baixarHTML(){
  const html='<!doctype html>\n'+document.documentElement.outerHTML
    .replace('<div class="app hidden"','<div class="app hidden"')
    .replace(/<div id="toast">[\s\S]*?<\/div>/,'<div id="toast"></div>');
  dl(new Blob([html],{type:'text/html;charset=utf-8'}),'MODESK-PESSOAL-v9.html');
  toast('HTML gerado — verifique seus Downloads');
}
function dl(blob,nome){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

/* ---- Entrega & pendências ---- */
function vEntrega(){
  return page('Entrega & Pendências','Onde o HTML é gerado e o que ainda precisa ser inserido depois.',`
  <div class="grid g2">
   <div class="card"><h3>📦 Geração do HTML</h3>
    <ul class="dim">
     <li>O download é gerado no botão <b>“⬇ Baixar HTML”</b> (topo e em Configurações), pela função <span class="mono">baixarHTML()</span>.</li>
     <li>Ele serializa o documento inteiro (<span class="mono">document.documentElement.outerHTML</span>) em um Blob e salva como <span class="mono">MODESK-PESSOAL-v7.html</span>.</li>
     <li>O arquivo é 100% offline (só as fontes e o Firebase vêm de CDN) e funciona com duplo clique.</li>
     <li>Os <b>dados</b> ficam no navegador (localStorage) — use <b>Exportar JSON</b> para levá-los para outro PC.</li>
    </ul></div>
   <div class="card"><h3>⚠️ O que falta inserir posteriormente</h3>
    <ul class="dim">
     <li><b>URLs reais</b> de MXM, Websuporte Senac e SEND (campo Editar em Atalhos).</li>
     <li><b>IDs/hosts reais</b> de AnyDesk e VNC das máquinas.</li>
     <li><b>Agente local</b> de monitoramento (CPU/RAM/disco) — o navegador não acessa hardware.</li>
     <li><b>Credenciais Firebase</b> para o tempo real entre dispositivos (hoje: local + abas).</li>
     <li><b>Leitura .xlsx nativa</b> (hoje CSV); requer biblioteca SheetJS.</li>
     <li><b>OCR de imagens</b> para reconhecimento automático de pedidos (requer Tesseract.js).</li>
     <li><b>Notificações do sistema/e-mail</b> dos avisos da agenda (Notification API / serviço SMTP).</li>
     <li><b>Anexos grandes</b> (>1,5 MB) — exigem storage em nuvem.</li>
    </ul></div>
  </div>`);
}

/* ---- utilidades ---- */
function del(col,id){if(!confirm('Excluir este registro?'))return;state[col]=state[col].filter(x=>x.id!==id);save()}
function modal(html){$('modal-root').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="inner">${html}
  <div style="margin-top:18px"><button class="btn" onclick="closeModal()">Fechar</button></div></div></div>`}
function closeModal(){$('modal-root').innerHTML=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
</script>
