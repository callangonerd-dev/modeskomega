<script>
(function(){
  var LS='modesk_groq_cores', N=5;

  function lerCores(){
    var a=[];
    try{ a=JSON.parse(localStorage.getItem(LS)||'[]') }catch(e){ a=[] }
    if(!Array.isArray(a)) a=[];
    while(a.length<N) a.push('');
    a=a.slice(0,N).map(function(x){ return String(x||'').trim() });
    if(!a.some(Boolean)){
      var antiga=''; try{ antiga=String((iaCfg()||{}).groqKey||'').trim() }catch(e){}
      if(antiga){ a[0]=antiga; salvarCores(a); }
    }
    return a;
  }
  function salvarCores(a){
    a=(a||[]).slice(0,N).map(function(x){ return String(x||'').trim() });
    while(a.length<N) a.push('');
    try{ localStorage.setItem(LS,JSON.stringify(a)) }catch(e){}
    try{ var c=iaCfg(); c.prov='groq'; c.groqKey=a.filter(Boolean)[0]||''; iaSalvarCfg() }catch(e){}
    return a;
  }
  window.modeskCores={ler:lerCores,salvar:salvarCores};

  /* ---------- chamada Groq com rotação silenciosa das 5 chaves ---------- */
  var URL_G='https://api.groq.com/openai/v1/chat/completions';
  var MSG_FALHA='Serviço temporariamente indisponível. Tente novamente em instantes.';

  async function lerStream(r,onChunk){
    var rd=r.body.getReader(),dec=new TextDecoder(),buf='',txt='';
    while(true){
      var s=await rd.read(); if(s.done)break;
      buf+=dec.decode(s.value,{stream:true});
      var i;
      while((i=buf.indexOf('\n'))>=0){
        var linha=buf.slice(0,i).trim(); buf=buf.slice(i+1);
        if(!linha)continue;
        if(linha.indexOf('data:')===0)linha=linha.slice(5).trim();
        if(!linha||linha==='[DONE]')continue;
        var j; try{j=JSON.parse(linha)}catch(e){continue}
        var d=((((j.choices||[])[0]||{}).delta||{}).content)||'';
        if(d){ txt+=d; try{onChunk(d)}catch(e){} }
      }
    }
    return txt;
  }

  window.iaRaw=async function(system,mensagens,opc){
    opc=opc||{};
    var cfg={}; try{ cfg=iaCfg()||{} }catch(e){}
    var modelo=String(cfg.groqModel||'llama-3.3-70b-versatile');
    /* contexto: system + últimas 8 mensagens (payload reaproveitado em toda troca de chave) */
    var hist=(mensagens||[]).filter(function(m){return m&&m.content}).slice(-8);
    var msgs=[{role:'system',content:String(system||'').slice(0,12000)}].concat(hist);
    var usarStream=!!opc.onChunk&&!opc.tools;
    var body={model:modelo,messages:msgs,temperature:0.7,max_tokens:2048,stream:usarStream};
    if(opc.tools){ body.tools=opc.tools; body.tool_choice='auto' }
    var payload=JSON.stringify(body);

    var chaves=lerCores().filter(Boolean);
    if(!chaves.length){ var e0=new Error('Cole as chaves da Groq em Ajustes (ModeskCore 1 a 5).'); e0.status=401; throw e0 }

    var ultimo=null;
    for(var i=0;i<chaves.length;i++){
      var r=null;
      try{
        r=await fetch(URL_G,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+chaves[i]},body:payload});
      }catch(err){ ultimo=err; continue; }            /* falha de rede: próxima chave, em silêncio */
      if(!r.ok){
        var j={}; try{ j=await r.clone().json() }catch(e){}
        var cod=String(((j.error||{}).code)||''), m=String(((j.error||{}).message)||'');
        var trocar = r.status===429 || r.status===401 || r.status===403 || r.status>=500
                  || /rate_limit|quota|insufficient|invalid_api_key/i.test(cod+' '+m);
        ultimo=new Error(m||('HTTP '+r.status)); ultimo.status=r.status;
        if(trocar) continue;                           /* rotação 100% silenciosa */
        throw ultimo;
      }
      if(usarStream&&r.body){
        var txt=await lerStream(r,opc.onChunk);
        return {text:String(txt).trim(),tools:[]};
      }
      var jr={}; try{ jr=await r.json() }catch(e){}
      var mm=(((jr.choices||[])[0]||{}).message)||{};
      var tc=(mm.tool_calls||[]).map(function(t){ var a={}; try{a=JSON.parse((t.function||{}).arguments||'{}')}catch(e){} return {name:(t.function||{}).name,args:a} });
      return {text:String(mm.content||'').trim(),tools:tc};
    }
    var ef=new Error(MSG_FALHA); ef.status=(ultimo&&ultimo.status)||429; throw ef;
  };

  try{ window.iaPronto=function(){ return lerCores().some(Boolean) } }catch(e){}

  /* ---------- painel de Ajustes: ModeskCore 1 a 5 ---------- */

<script>
(function(){

  function salvarCores(a){ try{ window.modeskCores.salvar(a) }catch(e){} }
  function modelo(){ try{ return String((iaCfg()||{}).groqModel||'') }catch(e){ return '' } }

  try{ if(MODELOS.indexOf(modelo())<0) setModelo('llama-3.3-70b-versatile') }catch(e){}

  /* ============ 1) NUCLEO VIVO ============ */
  var nivel=0, alvoNivel=0, estado='idle'; /* idle | ouvindo | falando */
  var orbes=[];
  function criarOrb(tam){
    var c=document.createElement('canvas');
    c.className='jv6-orb'; c.width=tam*2; c.height=tam*2;
    c.style.width=tam+'px'; c.style.height=tam+'px';
    orbes.push(c); return c;
  }
  function desenhar(t){
    nivel += (alvoNivel - nivel)*0.18;
    for(var k=orbes.length-1;k>=0;k--){
      var c=orbes[k];
      if(!c.isConnected){ orbes.splice(k,1); continue }
      var x=c.width/2, y=c.height/2, R=Math.min(x,y)*0.80, g=c.getContext('2d');
      g.clearRect(0,0,c.width,c.height);
      var cor = estado==='ouvindo' ? [80,240,180] : estado==='falando' ? [140,190,255] : (window.__jvOrbCor||[25,200,255]);
      var rgb=function(a){ return 'rgba('+cor[0]+','+cor[1]+','+cor[2]+','+a+')' };
      var vivo = 0.5 + 0.5*Math.sin(t/900);
      var amp = 0.10 + nivel*0.55 + vivo*0.06;

      var gl=g.createRadialGradient(x,y,R*0.2,x,y,R*(1.12+nivel*0.45));
      gl.addColorStop(0,rgb(0.40)); gl.addColorStop(1,rgb(0));
      g.fillStyle=gl; g.beginPath(); g.arc(x,y,R*(1.12+nivel*0.45),0,Math.PI*2); g.fill();

      for(var r=0;r<3;r++){

        g.strokeStyle=rgb(0.26+0.20*(2-r)/2+nivel*0.3);
        g.lineWidth=Math.max(1.1,c.width/74); g.stroke();
      }

      g.fillStyle=nc; g.beginPath(); g.arc(x,y,R*(0.46+nivel*0.16),0,Math.PI*2); g.fill();
    }

      b.innerHTML='<div class="rot">Ouvindo…</div><canvas></canvas>';
      f.insertBefore(b,f.firstChild);
    }
    return b;
  }
  function pintarBarra(vals){
    var b=barra(); if(!b)return;
    var c=b.querySelector('canvas');
    var lg=c.clientWidth||420, al=c.clientHeight||34;
    if(c.width!==lg*2){ c.width=lg*2; c.height=al*2 }
    var g=c.getContext('2d'); g.clearRect(0,0,c.width,c.height);

      var v=vals[i]||0;

      g.fill();
    }

  function loopMic(){
    if(!an)return;

      fluxo=await navigator.mediaDevices.getUserMedia({audio:true});
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended'){ try{ await ac.resume() }catch(e){} }
      an=ac.createAnalyser(); an.fftSize=128; an.smoothingTimeConstant=.75;
      dados=new Uint8Array(an.frequencyBinCount);

      loopMic();

  function desligarMic(){

      var vals=[],soma=0,t=Date.now()/120;

  }
  function pararFala(){
    clearInterval(falaTm); alvoNivel=0;
    if(estado==='falando'){

      campos+='<label>ModeskCore '+(i+1)+'</label><input type="password" autocomplete="off" spellcheck="false" placeholder="gsk_..." data-i="'+i+'" value="'+String(v[i]||'').replace(/"/g,'&quot;')+'"/>';
    }
    var opts=MODELOS.map(function(m){ return '<option value="'+m+'"'+(m===modelo()?' selected':'')+'>'+m+'</option>' }).join('');
    ov.innerHTML='<div class="bx"><h3>Ajustes do J.A.R.V.I.S.</h3>'
      +'<p class="sub">API Groq · até 5 chaves. O JARVIS começa pela ModeskCore 1 e, se ela atingir o limite, troca sozinho para a próxima — em silêncio, sem perder o assunto da conversa.</p>'
      +'<label>Modelo</label><select id="jv6-model">'+opts+'</select>'
      +campos
      +'<div class="st">'+v.filter(Boolean).length+' de 5 chaves salvas neste computador.</div>'
      +'<div class="rw"><button data-x="get">Obter chave</button><button data-x="c">Fechar</button><button class="pri" data-x="s">Salvar</button></div></div>';
    document.body.appendChild(ov);

<script id="jv73-layouts-js">
(function(){
  'use strict';
  var LS='modesk_jarvis_layout_v73';
  var ITENS=[
    {id:'gpt',nome:'GPT Minimal',desc:'limpo e silencioso'},
    {id:'gemini',nome:'Gemini Aurora',desc:'fluido e luminoso'},
    {id:'claude',nome:'Claude Editorial',desc:'quente e focado'},
    {id:'obsidian',nome:'Obsidian Grid',desc:'técnico e denso'},
    {id:'dragon',nome:'Red Dragon GX',desc:'intenso e gamer'}
  ];
  function atual(){var x='gpt';try{x=localStorage.getItem(LS)||'gpt'}catch(e){}return ITENS.some(function(i){return i.id===x})?x:'gpt'}
  function aplicar(id,salvar){if(!ITENS.some(function(i){return i.id===id}))id='gpt';if(salvar!==false)try{localStorage.setItem(LS,id)}catch(e){}
    var w=document.getElementById('jn-win'),o=document.getElementById('jn-orb');if(w)w.setAttribute('data-jv-layout',id);if(o)o.setAttribute('data-jv-layout',id);
    document.querySelectorAll('.jv73-card,.jv73-inline-card').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-layout')===id);b.setAttribute('aria-pressed',b.getAttribute('data-layout')===id?'true':'false')});
  }
  function cards(cls){return ITENS.map(function(i){return '<button type="button" class="'+cls+(i.id===atual()?' on':'')+'" data-layout="'+i.id+'" aria-pressed="'+(i.id===atual())+'"><span class="pv"></span><b>'+i.nome+'</b><small>'+i.desc+'</small></button>'}).join('')}
  function ligar(box,aoEscolher){box.querySelectorAll('[data-layout]').forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();aplicar(b.getAttribute('data-layout'),true);if(aoEscolher)aoEscolher(b.getAttribute('data-layout'));try{if(typeof toast==='function')toast('Visual do JARVIS: '+b.querySelector('b').textContent)}catch(_){} }});}
  function painelModal(){var ov=document.getElementById('jv6-cfg');if(!ov||ov.querySelector('.jv73-grid'))return;var sel=ov.querySelector('#jv6-model');if(!sel)return;var label=sel.previousElementSibling;var wrap=document.createElement('div');wrap.innerHTML='<div class="jv73-title">Visual do JARVIS</div><p class="jv73-hint">Escolha uma experiência. A mudança aparece na hora e fica salva neste computador.</p><div class="jv73-grid">'+cards('jv73-card')+'</div>';var frag=document.createDocumentFragment();while(wrap.firstChild)frag.appendChild(wrap.firstChild);label.parentNode.insertBefore(frag,label);ligar(ov);
  }

  window.jvLayout={aplicar:aplicar,atual:atual,itens:ITENS};
  function instalar(){aplicar(atual(),false);painelModal();painelInline()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',instalar);else instalar();
  document.addEventListener('click',function(){setTimeout(instalar,60)},true);setInterval(instalar,1200);

})();

/* ---------- 1) NUCLEO ANIMADO (idle / thinking / speaking) ---------- */
.jvc{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:2;display:block}

#jn-orb{position:relative}
.jv6-hero{position:relative}
.jv6-hero .jvc-wrap{position:relative;width:104px;height:104px}

/* Arc Reactor Classico */
[data-core="arc"] .jvc i.r1{border:2px solid rgba(25,200,255,.85);box-shadow:0 0 16px rgba(25,200,255,.55) inset,0 0 18px rgba(25,200,255,.45);animation:jvc-spin 6s linear infinite}
[data-core="arc"] .jvc i.r2{inset:16%;border:2px dashed rgba(120,225,255,.7);animation:jvc-spin-r 4.5s linear infinite}
[data-core="arc"] .jvc i.r3{inset:33%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#eaffff,#19c8ff 62%,rgba(10,120,180,.15));animation:jvc-breathe 3s ease-in-out infinite}

[data-core="arc"][data-core-state="thinking"] .jvc i.r2{animation-duration:.8s}
[data-core="arc"][data-core-state="thinking"] .jvc i.r3{animation:jvc-flare .7s ease-in-out infinite}
[data-core="arc"][data-core-state="speaking"] .jvc i.r3{animation:jvc-eq .38s ease-in-out infinite}

/* Orb de Plasma */
[data-core="plasma"] .jvc i.r1{background:conic-gradient(from 0deg,#19c8ff,#8a6bff,#22e0c0,#19c8ff);filter:blur(6px);opacity:.75;animation:jvc-spin 9s linear infinite}
[data-core="plasma"] .jvc i.r2{inset:12%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.95),rgba(120,150,255,.55) 48%,rgba(10,20,50,.15) 72%);animation:jvc-breathe 3s ease-in-out infinite}

[data-core="plasma"][data-core-state="thinking"] .jvc i.r1{animation-duration:1.6s;opacity:1}
[data-core="plasma"][data-core-state="thinking"] .jvc i.r2{animation:jvc-flare .8s ease-in-out infinite}
[data-core="plasma"][data-core-state="speaking"] .jvc i.r2{animation:jvc-eq .34s ease-in-out infinite}

/* Minimal Pulse */
[data-core="pulse"] .jvc i.r1{border:1.5px solid var(--jv-accent,#19c8ff);opacity:.55;animation:jvc-ripple 3s ease-out infinite}
[data-core="pulse"] .jvc i.r2{inset:22%;border:1.5px solid var(--jv-accent,#19c8ff);opacity:.75;animation:jvc-ripple 3s ease-out .9s infinite}
[data-core="pulse"] .jvc i.r3{inset:38%;background:var(--jv-accent,#19c8ff);box-shadow:0 0 18px var(--jv-accent,#19c8ff);animation:jvc-breathe 3s ease-in-out infinite}
[data-core="pulse"][data-core-state="thinking"] .jvc i.r1,[data-core="pulse"][data-core-state="thinking"] .jvc i.r2{animation-duration:1s}
[data-core="pulse"][data-core-state="thinking"] .jvc i.r3{animation:jvc-flare .6s ease-in-out infinite}
[data-core="pulse"][data-core-state="speaking"] .jvc i.r3{animation:jvc-eq .32s ease-in-out infinite}

@keyframes jvc-spin{to{transform:rotate(360deg)}}
@keyframes jvc-spin-r{to{transform:rotate(-360deg)}}
@keyframes jvc-breathe{0%,100%{transform:scale(.94);opacity:.82;filter:brightness(.95)}50%{transform:scale(1.06);opacity:1;filter:brightness(1.25)}}
@keyframes jvc-flare{0%,100%{transform:scale(1);filter:brightness(1.1)}50%{transform:scale(1.14);filter:brightness(1.9)}}
@keyframes jvc-eq{0%{transform:scale(.9)}30%{transform:scale(1.18)}55%{transform:scale(.98)}80%{transform:scale(1.12)}100%{transform:scale(.9)}}
@keyframes jvc-ripple{0%{transform:scale(.6);opacity:.85}100%{transform:scale(1.25);opacity:0}}
@keyframes jvc-drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6%,-5%) scale(1.1)}}

<script id="jv74-js">
(function(){
  'use strict';
  var LS_SKIN='modesk_jarvis_skin_v74', LS_CORE='modesk_jarvis_core_v74', LS_V73='modesk_jarvis_layout_v73';

  /* temas: 5 originais (v73) + 3 novos */
  var TEMAS=[
    {id:'gpt',base:'gpt',nome:'GPT Minimal',desc:'limpo e silencioso',bg:'#171717',a:'#ffffff',a2:'#555'},
    {id:'gemini',base:'gemini',nome:'Gemini Aurora',desc:'fluido e luminoso',bg:'linear-gradient(135deg,#101827,#1c2541)',a:'#65d5ff',a2:'#a884ff'},
    {id:'claude',base:'claude',nome:'Claude Editorial',desc:'quente e legível',bg:'#f0eee8',a:'#d97745',a2:'#8a8074'},
    {id:'obsidian',base:'obsidian',nome:'Obsidian Grid',desc:'técnico e denso',bg:'#090b10',a:'#9b7cff',a2:'#4b3a7a'},
    {id:'dragon',base:'dragon',nome:'Red Dragon GX',desc:'intenso e gamer',bg:'#090909',a:'#ff2b2b',a2:'#7a0e0e'},
    {id:'hud',base:'obsidian',nome:'HUD Cyberpunk',desc:'painel sci-fi neon',bg:'linear-gradient(135deg,#04070f,#0b2230)',a:'#00f0ff',a2:'#ff008c'},
    {id:'glass',base:'gemini',nome:'Glassmorphism Pro',desc:'vidro fosco elegante',bg:'linear-gradient(135deg,rgba(255,255,255,.5),rgba(120,150,220,.35))',a:'#8fd3ff',a2:'#ffffff'},
    {id:'terminal',base:'obsidian',nome:'Terminal Retro',desc:'verde e âmbar',bg:'#020402',a:'#39ff88',a2:'#ffbf40'}
  ];
  var NUCLEOS=[
    {id:'arc',nome:'Arc Reactor Clássico',desc:'anéis giratórios cyan'},
    {id:'plasma',nome:'Orb de Plasma',desc:'esfera fluida'},
    {id:'pulse',nome:'Minimal Pulse',desc:'néon em expansão'}
  ];
  function acharTema(id){for(var i=0;i<TEMAS.length;i++)if(TEMAS[i].id===id)return TEMAS[i];return TEMAS[0]}
  function temaAtual(){var x='';try{x=localStorage.getItem(LS_SKIN)||''}catch(e){}
    if(!x){try{x=localStorage.getItem(LS_V73)||'gpt'}catch(e){x='gpt'}}
    return acharTema(x).id}
  function coreAtual(){var x='arc';try{x=localStorage.getItem(LS_CORE)||'arc'}catch(e){}
    return NUCLEOS.some(function(n){return n.id===x})?x:'arc'}

  /* ---------- aplicação e persistência ---------- */
  function aplicarTema(id,salvar){
    var t=acharTema(id);
    if(salvar!==false){try{localStorage.setItem(LS_SKIN,t.id);localStorage.setItem(LS_V73,t.base)}catch(e){}}
    ['jn-win','jn-orb'].forEach(function(el){
      var n=document.getElementById(el); if(!n)return;
      n.setAttribute('data-jv-skin',t.id);
      n.setAttribute('data-jv-layout',t.base);
    });
    try{ if(window.jvLayout&&window.jvLayout.aplicar) window.jvLayout.aplicar(t.base,false) }catch(e){}
    marcar();
  }
  function aplicarCore(id,salvar){
    if(!NUCLEOS.some(function(n){return n.id===id}))id='arc';
    if(salvar!==false){try{localStorage.setItem(LS_CORE,id)}catch(e){}}
    document.querySelectorAll('[data-core]:not(.mini)').forEach(function(n){n.setAttribute('data-core',id)});
    marcar();
  }
  function marcar(){
    var t=temaAtual(),c=coreAtual();
    document.querySelectorAll('.jv74-opt[data-tema]').forEach(function(b){var on=b.getAttribute('data-tema')===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
    document.querySelectorAll('.jv74-opt[data-core-id]').forEach(function(b){var on=b.getAttribute('data-core-id')===c;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  }

  /* ---------- estados do núcleo: ocioso | pensando | falando ---------- */
  var pensando=0, falando=0;
  function estado(){return falando>0?'speaking':(pensando>0?'thinking':'idle')}
  function pintarEstado(){
    var e=estado();
    document.querySelectorAll('[data-core]:not(.mini)').forEach(function(n){n.setAttribute('data-core-state',e)});
  }
  function montarNucleo(host,tam){
    if(!host||host.querySelector(':scope > .jvc'))return;
    var d=document.createElement('span');
    d.className='jvc';
    d.innerHTML='<i class="r1"></i><i class="r2"></i><i class="r3"></i>';
    if(tam){d.style.width=tam+'px';d.style.height=tam+'px'}
    host.appendChild(d);
    host.setAttribute('data-core',coreAtual());
    host.setAttribute('data-core-state',estado());
  }

  /* pensando: enquanto a chamada da Groq não responde (lógica de IA intocada) */
  function envolverIA(){
    if(!window.iaRaw||window.iaRaw.__jv74)return;
    var orig=window.iaRaw;
    var wrap=function(){
      pensando++; pintarEstado();
      var p;
      try{ p=orig.apply(this,arguments) }catch(e){ pensando=Math.max(0,pensando-1); pintarEstado(); throw e }
      return Promise.resolve(p).then(function(r){ pensando=Math.max(0,pensando-1); pintarEstado(); return r },
                                     function(e){ pensando=Math.max(0,pensando-1); pintarEstado(); throw e });
    };
    wrap.__jv74=1; window.iaRaw=wrap;
  }
  envolverIA(); setInterval(envolverIA,1500);

  /* falando: acompanha a leitura da resposta em voz */
  try{
    var falar=speechSynthesis.speak.bind(speechSynthesis);
    speechSynthesis.speak=function(u){
      try{
        u.addEventListener('start',function(){falando++;pintarEstado()});
        var fim=function(){falando=Math.max(0,falando-1);pintarEstado()};
        u.addEventListener('end',fim); u.addEventListener('error',fim);
      }catch(e){}
      return falar(u);
    };
  }catch(e){}
  setInterval(function(){
    try{ if(!speechSynthesis.speaking && falando>0){ falando=0; pintarEstado() } }catch(e){}
  },900);

  /* ---------- UI dos Ajustes ---------- */
  function miniCore(id){return '<span class="mini jvc-wrap" data-core="'+id+'" data-core-state="idle"><span class="jvc"><i class="r1"></i><i class="r2"></i><i class="r3"></i></span></span>'}
  function cardsTema(){
    return TEMAS.map(function(t){
      return '<button type="button" class="jv74-opt" data-tema="'+t.id+'" style="--bg:'+t.bg+';--a:'+t.a+';--a2:'+t.a2+'" aria-pressed="false">'
        +'<span class="sw"></span><b>'+t.nome+'</b><small>'+t.desc+'</small></button>';
    }).join('');
  }
  function cardsCore(){
    return NUCLEOS.map(function(n){
      return '<button type="button" class="jv74-opt core" data-core-id="'+n.id+'" aria-pressed="false">'
        +'<span class="sw">'+miniCore(n.id)+'</span><b>'+n.nome+'</b><small>'+n.desc+'</small></button>';
    }).join('');
  }
  function ligar(raiz){
    raiz.querySelectorAll('[data-tema]').forEach(function(b){
      b.onclick=function(e){e.preventDefault();e.stopPropagation();aplicarTema(b.getAttribute('data-tema'),true);
        try{ if(typeof toast==='function')toast('Visual: '+b.querySelector('b').textContent) }catch(_){}}
    });
    raiz.querySelectorAll('[data-core-id]').forEach(function(b){
      b.onclick=function(e){e.preventDefault();e.stopPropagation();aplicarCore(b.getAttribute('data-core-id'),true);
        try{ if(typeof toast==='function')toast('Núcleo: '+b.querySelector('b').textContent) }catch(_){}}
    });
  }
  function blocoAparencia(aberto){
    var d=document.createElement('details'); d.className='jv74-acc'; if(aberto)d.open=true;
    d.innerHTML='<summary>APARÊNCIA · 8 VISUAIS <small>prévia de cor ao lado de cada nome</small></summary>'
      +'<div class="jv74-bd"><p class="h">Escolha o visual da janela. A troca acontece na hora e fica salva neste computador.</p>'
      +'<div class="jv74-grid">'+cardsTema()+'</div></div>';
    return d;
  }
  function blocoNucleo(){
    var d=document.createElement('details'); d.className='jv74-acc';
    d.innerHTML='<summary>NÚCLEO DO J.A.R.V.I.S. <small>ocioso, pensando e falando</small></summary>'
      +'<div class="jv74-bd"><p class="h">O núcleo respira quando está parado, acelera enquanto a resposta é preparada e vira equalizador enquanto fala.</p>'
      +'<div class="jv74-grid">'+cardsCore()+'</div></div>';
    return d;
  }

  /* modal de ajustes: agrupa modelo + 5 chaves em cards expansíveis */
  function arrumarModal(){
    var ov=document.getElementById('jv6-cfg'); if(!ov)return;
    var bx=ov.querySelector('.bx'); if(!bx||bx.querySelector('.jv74-acc'))return;
    var sel=bx.querySelector('#jv6-model'); if(!sel)return;
    var ap=blocoAparencia(true), nu=blocoNucleo();
    var ch=document.createElement('details'); ch.className='jv74-acc';
    var qtd=bx.querySelectorAll('input[data-i]').length;
    ch.innerHTML='<summary>CHAVES GROQ · MODESKCORE 1 A 5 <small>rotação silenciosa</small></summary><div class="jv74-bd jv74-keys"><p class="h">Se uma chave atingir o limite, o JARVIS troca sozinho para a próxima, sem perder o assunto.</p></div>';
    var corpo=ch.querySelector('.jv74-bd');
    var mod=document.createElement('details'); mod.className='jv74-acc';
    mod.innerHTML='<summary>MODELO DA IA <small>não altera a lógica</small></summary><div class="jv74-bd"></div>';
    /* move o rótulo + seletor de modelo */
    var lbModel=sel.previousElementSibling;
    mod.querySelector('.jv74-bd').appendChild(lbModel); mod.querySelector('.jv74-bd').appendChild(sel);
    /* move rótulos + inputs das chaves */
    bx.querySelectorAll('input[data-i]').forEach(function(inp){
      var lb=inp.previousElementSibling, i=+inp.dataset.i;
      var linha=document.createElement('div'); linha.className='lbl';
      linha.innerHTML='<span>ModeskCore '+(i+1)+'</span><span class="tag'+(inp.value?' ok':'')+'">'+(inp.value?'salva':'vazia')+'</span>';
      if(lb&&lb.tagName==='LABEL')lb.remove();
      corpo.appendChild(linha); corpo.appendChild(inp);
    });
    var st=bx.querySelector('.st');
    var rw=bx.querySelector('.rw');
    bx.insertBefore(ap,st||rw); bx.insertBefore(nu,st||rw); bx.insertBefore(mod,st||rw); bx.insertBefore(ch,st||rw);
    if(qtd) ch.open=false;
    ligar(bx); marcar(); pintarEstado();
  }

  /* aba AJUSTES dentro da janela */
  function arrumarInline(){
    var p=document.getElementById('jn-p-cfg'); if(!p||p.querySelector('.jv74-inline'))return;
    var box=document.createElement('div'); box.className='jv74-inline';
    box.appendChild(blocoAparencia(false)); box.appendChild(blocoNucleo());
    p.insertBefore(box,p.firstChild);
    ligar(box); marcar(); pintarEstado();
  }

  /* núcleos animados no orbe, na barra e no chat vazio */
  function montarNucleos(){
    montarNucleo(document.getElementById('jn-orb'));
    var hero=document.querySelector('#jn-p-chat .jv6-hero');
    if(hero&&!hero.querySelector('.jvc-wrap')){

      w.style.width='104px'; w.style.height='104px';
      hero.insertBefore(w,hero.firstChild);
      montarNucleo(w);
    }
    pintarEstado();
  }

  function instalar(){
    aplicarTema(temaAtual(),false);
    aplicarCore(coreAtual(),false);
    montarNucleos(); arrumarModal(); arrumarInline(); pintarEstado();
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',instalar); else instalar();
  document.addEventListener('click',function(){setTimeout(instalar,80)},true);
  setInterval(instalar,1000);

  window.jvSkin={temas:TEMAS,nucleos:NUCLEOS,aplicarTema:aplicarTema,aplicarCore:aplicarCore,tema:temaAtual,core:coreAtual,estado:estado};
  console.log('[MODESK v74] 8 visuais (+HUD, Glass, Terminal) · núcleo animado em 3 estilos · ajustes em cards');
})();
</script>

/* ================= 2) NOVOS NÚCLEOS ================= */
/* Anéis J.A.R.V.I.S. */
[data-core="ring"] .jvc i.r1{border:3px solid var(--jv-accent,#19c8ff);border-top-color:transparent;border-left-color:transparent;box-shadow:0 0 18px var(--jv-glow,rgba(25,200,255,.5));animation:jvc-spin 5s linear infinite}
[data-core="ring"] .jvc i.r2{inset:14%;border:2px dotted color-mix(in srgb,var(--jv-accent,#19c8ff) 80%,#fff);animation:jvc-spin-r 3.4s linear infinite}
[data-core="ring"] .jvc i.r3{inset:30%;border:2px solid var(--jv-accent,#19c8ff);border-bottom-color:transparent;box-shadow:0 0 14px var(--jv-glow,rgba(25,200,255,.5)) inset;animation:jvc-spin 2.4s linear infinite}
[data-core="ring"][data-core-state="thinking"] .jvc i.r1{animation-duration:1s}
[data-core="ring"][data-core-state="thinking"] .jvc i.r2{animation-duration:.7s}
[data-core="ring"][data-core-state="speaking"] .jvc i.r3{animation:jvc-eq .36s ease-in-out infinite}

/* Célula hexagonal HUD */
[data-core="hex"] .jvc i{border-radius:0!important;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
[data-core="hex"] .jvc i.r1{border:2px solid var(--jv-accent,#19c8ff);box-shadow:0 0 16px var(--jv-glow,rgba(25,200,255,.5));animation:jvc-breathe 3.2s ease-in-out infinite}
[data-core="hex"] .jvc i.r2{inset:20%;border:1.5px solid color-mix(in srgb,var(--jv-accent,#19c8ff) 70%,#fff);animation:jvc-spin 7s linear infinite}
[data-core="hex"] .jvc i.r3{inset:38%;background:var(--jv-accent,#19c8ff);box-shadow:0 0 20px var(--jv-accent,#19c8ff);animation:jvc-flare 2.4s ease-in-out infinite}
[data-core="hex"][data-core-state="thinking"] .jvc i.r2{animation-duration:1.2s}
[data-core="hex"][data-core-state="speaking"] .jvc i.r3{animation:jvc-eq .34s ease-in-out infinite}

/* Reator vermelho */
[data-core="reactor"] .jvc i.r1{border:2px solid rgba(255,40,40,.9);box-shadow:0 0 20px rgba(255,40,40,.6),0 0 22px rgba(255,40,40,.4) inset;animation:jvc-spin 5.5s linear infinite}
[data-core="reactor"] .jvc i.r2{inset:15%;background:conic-gradient(from 0deg,rgba(255,30,30,.9),rgba(90,0,0,.2),rgba(255,30,30,.9));filter:blur(3px);animation:jvc-spin-r 3.6s linear infinite}
[data-core="reactor"] .jvc i.r3{inset:34%;background:radial-gradient(circle at 45% 40%,#fff,#ff2a2a 60%,rgba(120,0,0,.3));box-shadow:0 0 26px rgba(255,40,40,.75);animation:jvc-breathe 2.6s ease-in-out infinite}
[data-core="reactor"][data-core-state="thinking"] .jvc i.r2{animation-duration:1s}
[data-core="reactor"][data-core-state="speaking"] .jvc i.r3{animation:jvc-eq .32s ease-in-out infinite}

/* Triângulo neon */
[data-core="tri"] .jvc i{border-radius:0!important}
[data-core="tri"] .jvc i.r1{clip-path:polygon(50% 4%,96% 92%,4% 92%);background:linear-gradient(180deg,color-mix(in srgb,var(--jv-accent,#c46bff) 70%,transparent),transparent);filter:drop-shadow(0 0 12px var(--jv-accent,#c46bff));animation:jvc-breathe 3s ease-in-out infinite}
[data-core="tri"] .jvc i.r2{inset:22%;clip-path:polygon(50% 8%,94% 90%,6% 90%);border:2px solid var(--jv-accent,#c46bff);animation:jvc-flare 2.6s ease-in-out infinite}
[data-core="tri"] .jvc i.r3{inset:42%;clip-path:polygon(50% 100%,100% 8%,0 8%);background:var(--jv-accent,#c46bff);box-shadow:0 0 18px var(--jv-accent,#c46bff);animation:jvc-drift 4s ease-in-out infinite}
[data-core="tri"][data-core-state="thinking"] .jvc i.r2{animation-duration:.8s}
[data-core="tri"][data-core-state="speaking"] .jvc i.r1{animation:jvc-eq .34s ease-in-out infinite}

/* Órbita de satélites */
[data-core="orbit"] .jvc i.r1{border:1px solid color-mix(in srgb,var(--jv-accent,#19c8ff) 45%,transparent);animation:jvc-spin 8s linear infinite}
[data-core="orbit"] .jvc i.r1:before,[data-core="orbit"] .jvc i.r1:after{content:'';position:absolute;width:16%;height:16%;border-radius:50%;background:var(--jv-accent,#19c8ff);box-shadow:0 0 14px var(--jv-accent,#19c8ff)}
[data-core="orbit"] .jvc i.r1:before{top:-6%;left:42%}
[data-core="orbit"] .jvc i.r1:after{bottom:-6%;left:42%;opacity:.6}
[data-core="orbit"] .jvc i.r2{inset:24%;border:1px dashed color-mix(in srgb,var(--jv-accent,#19c8ff) 60%,transparent);animation:jvc-spin-r 4.4s linear infinite}
[data-core="orbit"] .jvc i.r3{inset:40%;background:radial-gradient(circle at 42% 38%,#fff,var(--jv-accent,#19c8ff) 65%,transparent);animation:jvc-breathe 3s ease-in-out infinite}
[data-core="orbit"][data-core-state="thinking"] .jvc i.r1{animation-duration:1.6s}
[data-core="orbit"][data-core-state="speaking"] .jvc i.r3{animation:jvc-eq .3s ease-in-out infinite}

/* Equalizador em barras */
[data-core="bars"] .jvc{display:flex!important;align-items:center;justify-content:center;gap:9%;border-radius:0}
[data-core="bars"] .jvc i{position:relative!important;inset:auto!important;width:15%;height:52%;border-radius:4px!important;background:var(--jv-accent,#19c8ff);box-shadow:0 0 14px var(--jv-glow,rgba(25,200,255,.5));animation:jvc-bar 1.5s ease-in-out infinite}
[data-core="bars"] .jvc i.r2{height:76%;animation-delay:.2s}
[data-core="bars"] .jvc i.r3{height:44%;animation-delay:.4s}
[data-core="bars"][data-core-state="thinking"] .jvc i{animation-duration:.7s}
[data-core="bars"][data-core-state="speaking"] .jvc i{animation-duration:.3s}
@keyframes jvc-bar{0%,100%{transform:scaleY(.5);opacity:.7}50%{transform:scaleY(1.25);opacity:1}}

/* ---------- velocidade / estilo de animação ---------- */
[data-core-anim="suave"] .jvc i{animation-duration:9s!important}
[data-core-anim="turbo"] .jvc i{animation-duration:1.2s!important}
[data-core-anim="off"] .jvc i{animation:none!important}
[data-core-anim="off"] .jvc i.r3{opacity:.95}

/* ---------- posição fixa do orbe na tela ---------- */
#jn-orb[data-jv-pos]{position:fixed!important}
#jn-orb[data-jv-pos="br"]{right:22px!important;bottom:88px!important;left:auto!important;top:auto!important}
#jn-orb[data-jv-pos="bl"]{left:22px!important;bottom:88px!important;right:auto!important;top:auto!important}
#jn-orb[data-jv-pos="tr"]{right:22px!important;top:88px!important;left:auto!important;bottom:auto!important}
#jn-orb[data-jv-pos="tl"]{left:22px!important;top:88px!important;right:auto!important;bottom:auto!important}
#jn-orb[data-jv-pos="mr"]{right:22px!important;top:50%!important;transform:translateY(-50%);left:auto!important;bottom:auto!important}
#jn-orb[data-jv-pos="ml"]{left:22px!important;top:50%!important;transform:translateY(-50%);right:auto!important;bottom:auto!important}
#jn-orb[data-jv-pos="bc"]{left:50%!important;bottom:20px!important;transform:translateX(-50%);right:auto!important;top:auto!important}
#jn-orb[data-jv-pos="tc"]{left:50%!important;top:16px!important;transform:translateX(-50%);right:auto!important;bottom:auto!important}
#jn-orb[data-jv-pos="mr"]:hover,#jn-orb[data-jv-pos="ml"]:hover{transform:translateY(-50%) scale(1.06)}
#jn-orb[data-jv-pos="bc"]:hover,#jn-orb[data-jv-pos="tc"]:hover{transform:translateX(-50%) scale(1.06)}

/* ---------- painel editável ---------- */
.jv75-edit{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.jv75-edit label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#c9c9c9;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 10px}
.jv75-edit input[type=color]{width:34px;height:24px;border:0;background:none;padding:0;cursor:pointer}
.jv75-edit input[type=range]{width:96px;accent-color:var(--jvx-accent,#19c8ff)}
.jv75-edit .full{grid-column:1 / -1}
.jv75-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.jv75-btn{padding:8px 13px;border-radius:999px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#e8e8e8;font-size:11px;cursor:pointer}
.jv75-btn:hover{border-color:var(--jvx-accent,#19c8ff)}
.jv75-pos{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:250px}
.jv75-pos button{height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:#bbb;font-size:9.5px;cursor:pointer;line-height:1.15}
.jv75-pos button.on{border-color:var(--jvx-accent,#19c8ff);color:#fff;background:color-mix(in srgb,var(--jvx-accent,#19c8ff) 22%,transparent)}
.jv75-pos .gap{visibility:hidden}
@media(max-width:620px){.jv75-edit{grid-template-columns:1fr}}
</style>
<script id="jv75-js">
(function(){
  'use strict';
  var LS_EDIT='modesk_jarvis_edit_v75', LS_ANIM='modesk_jarvis_anim_v75', LS_POS='modesk_jarvis_pos_v75';

  var NOVOS_TEMAS=[
    {id:'opera',base:'dragon',nome:'Opera GX',desc:'preto + vermelho gamer',bg:'linear-gradient(135deg,#140208,#ff1155)',a:'#ff1155',a2:'#7a0322'},
    {id:'blackred',base:'dragon',nome:'Black Red',desc:'preto puro, vermelho seco',bg:'#000000',a:'#ff2e2e',a2:'#5c0000'},
    {id:'stark',base:'obsidian',nome:'Stark Blue HUD',desc:'grade técnica azul',bg:'linear-gradient(135deg,#03080d,#0b2b3d)',a:'#00d5ff',a2:'#0a5e7a'},
    {id:'crimson',base:'dragon',nome:'Crimson Reactor',desc:'HUD vermelho Mark',bg:'linear-gradient(135deg,#070203,#4a0206)',a:'#ff1e1e',a2:'#00bcff'},
    {id:'vapor',base:'obsidian',nome:'Neon Vapor',desc:'roxo e ciano neon',bg:'linear-gradient(135deg,#120823,#3a0d5c)',a:'#c46bff',a2:'#00c8ff'},
    {id:'cine',base:'gpt',nome:'Cine Dark',desc:'cartões suaves, vermelho',bg:'linear-gradient(135deg,#0b0e14,#2a1020)',a:'#ff3b3b',a2:'#2b4a8a'},
    {id:'custom',base:'gpt',nome:'Editável (você escolhe)',desc:'cores, cantos e brilho',bg:'linear-gradient(135deg,#0a0a0c,#19c8ff)',a:'#19c8ff',a2:'#ff2e88'}
  ];
  var NOVOS_NUCLEOS=[
    {id:'ring',nome:'Anéis J.A.R.V.I.S.',desc:'arcos giratórios'},
    {id:'hex',nome:'Célula Hexagonal',desc:'HUD colmeia'},
    {id:'reactor',nome:'Reator Vermelho',desc:'Mark em vermelho'},
    {id:'tri',nome:'Triângulo Neon',desc:'cyberpunk luminoso'},
    {id:'orbit',nome:'Órbita',desc:'satélites em volta'},
    {id:'bars',nome:'Equalizador',desc:'três barras vivas'}
  ];
  var ANIMS=[
    {id:'suave',nome:'Suave',desc:'movimento lento'},
    {id:'normal',nome:'Normal',desc:'padrão equilibrado'},
    {id:'turbo',nome:'Turbo',desc:'rápido e intenso'},
    {id:'off',nome:'Sem animação',desc:'núcleo parado'}
  ];
  var POSICOES=[
    {id:'tl',nome:'↖ Topo esq.'},{id:'tc',nome:'↑ Topo centro'},{id:'tr',nome:'↗ Topo dir.'},
    {id:'ml',nome:'← Meio esq.'},{id:'gap',nome:''},{id:'mr',nome:'→ Meio dir.'},
    {id:'bl',nome:'↙ Base esq.'},{id:'bc',nome:'↓ Base centro'},{id:'br',nome:'↘ Base dir.'}
  ];
  var PADRAO_EDIT={bg:'#0a0a0c',accent:'#19c8ff',accent2:'#ff2e88',text:'#eef4ff',radius:18};

  function ler(k,d){try{var v=localStorage.getItem(k);return v||d}catch(e){return d}}
  function grava(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function edit(){var o={};try{o=JSON.parse(localStorage.getItem(LS_EDIT)||'{}')||{}}catch(e){o={}}
    var r={};for(var k in PADRAO_EDIT)r[k]=(o[k]!==undefined&&o[k]!==null&&o[k]!=='')?o[k]:PADRAO_EDIT[k];return r}
  function anim(){var a=ler(LS_ANIM,'normal');return ANIMS.some(function(x){return x.id===a})?a:'normal'}
  function pos(){var p=ler(LS_POS,'br');return POSICOES.some(function(x){return x.id===p&&x.id!=='gap'})?p:'br'}

  /* ---- registra os novos temas/núcleos no motor do v74 ---- */
  function registrar(){
    if(!window.jvSkin)return false;
    NOVOS_TEMAS.forEach(function(t){if(!window.jvSkin.temas.some(function(x){return x.id===t.id}))window.jvSkin.temas.push(t)});
    NOVOS_NUCLEOS.forEach(function(n){if(!window.jvSkin.nucleos.some(function(x){return x.id===n.id}))window.jvSkin.nucleos.push(n)});
    return true;
  }

  function aplicarEdit(salvar){
    var e=edit(); if(salvar)grava(LS_EDIT,JSON.stringify(e));
    var s=document.documentElement.style;
    s.setProperty('--jvx-bg',e.bg); s.setProperty('--jvx-accent',e.accent);
    s.setProperty('--jvx-accent2',e.accent2); s.setProperty('--jvx-text',e.text);
    s.setProperty('--jvx-radius',(parseInt(e.radius,10)||0)+'px');
  }
  function salvarEdit(campo,valor){
    var e=edit(); e[campo]=valor; grava(LS_EDIT,JSON.stringify(e)); aplicarEdit(false);
    if(window.jvSkin&&window.jvSkin.tema()!=='custom')window.jvSkin.aplicarTema('custom',true);
  }
  function aplicarAnim(id,salvar){
    if(!ANIMS.some(function(x){return x.id===id}))id='normal';
    if(salvar)grava(LS_ANIM,id);
    document.querySelectorAll('[data-core]:not(.mini)').forEach(function(n){n.setAttribute('data-core-anim',id)});
    marcar75();
  }
  function aplicarPos(id,salvar){
    if(!POSICOES.some(function(x){return x.id===id&&x.id!=='gap'}))id='br';
    if(salvar)grava(LS_POS,id);
    var o=document.getElementById('jn-orb'); if(o)o.setAttribute('data-jv-pos',id);
    marcar75();
  }
  function marcar75(){
    var a=anim(),p=pos();
    document.querySelectorAll('.jv74-opt[data-anim]').forEach(function(b){var on=b.getAttribute('data-anim')===a;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
    document.querySelectorAll('.jv75-pos button[data-pos]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-pos')===p)});
  }

  /* ---- injeta cards novos nas grades já existentes do v74 ---- */
  function cardTema(t){
    return '<button type="button" class="jv74-opt" data-tema="'+t.id+'" style="--bg:'+t.bg+';--a:'+t.a+';--a2:'+t.a2+'" aria-pressed="false"><span class="sw"></span><b>'+t.nome+'</b><small>'+t.desc+'</small></button>';
  }
  function cardCore(n){
    return '<button type="button" class="jv74-opt core" data-core-id="'+n.id+'" aria-pressed="false"><span class="sw"><span class="mini jvc-wrap" data-core="'+n.id+'" data-core-state="idle" data-core-anim="normal"><span class="jvc"><i class="r1"></i><i class="r2"></i><i class="r3"></i></span></span></span><b>'+n.nome+'</b><small>'+n.desc+'</small></button>';
  }
  function ligarTema(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();if(window.jvSkin)window.jvSkin.aplicarTema(b.getAttribute('data-tema'),true);
    try{if(typeof toast==='function')toast('Visual: '+b.querySelector('b').textContent)}catch(_){}}}
  function ligarCore(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();if(window.jvSkin)window.jvSkin.aplicarCore(b.getAttribute('data-core-id'),true);
    aplicarAnim(anim(),false);
    try{if(typeof toast==='function')toast('Núcleo: '+b.querySelector('b').textContent)}catch(_){}}}

  function completarGrades(){
    document.querySelectorAll('.jv74-grid').forEach(function(g){
      var temTema=g.querySelector('[data-tema]'), temCore=g.querySelector('[data-core-id]');
      if(temTema){
        NOVOS_TEMAS.forEach(function(t){
          if(!g.querySelector('[data-tema="'+t.id+'"]')){
            var d=document.createElement('div'); d.innerHTML=cardTema(t);
            var b=d.firstChild; g.appendChild(b); ligarTema(b);
          }
        });
      }
      if(temCore){
        NOVOS_NUCLEOS.forEach(function(n){
          if(!g.querySelector('[data-core-id="'+n.id+'"]')){
            var d=document.createElement('div'); d.innerHTML=cardCore(n);
            var b=d.firstChild; g.appendChild(b); ligarCore(b);
          }
        });
      }
    });
  }

  /* ---- blocos novos: animação, posição, editor de cores ---- */
  function blocoAnimPos(){
    var d=document.createElement('details'); d.className='jv74-acc';
    var cards=ANIMS.map(function(a){return '<button type="button" class="jv74-opt" data-anim="'+a.id+'" style="--bg:#141416;--a:var(--jvx-accent,#19c8ff)" aria-pressed="false"><span class="sw"></span><b>'+a.nome+'</b><small>'+a.desc+'</small></button>'}).join('');
    var grid=POSICOES.map(function(p){return p.id==='gap'?'<button class="gap" tabindex="-1"></button>':'<button type="button" data-pos="'+p.id+'">'+p.nome+'</button>'}).join('');
    d.innerHTML='<summary>ANIMAÇÃO E POSIÇÃO NA TELA <small>onde o J.A.R.V.I.S. fica fixado</small></summary>'
      +'<div class="jv74-bd"><p class="h">Escolha o ritmo da animação do núcleo e em que canto da tela o botão flutuante fica preso.</p>'
      +'<div class="jv74-grid">'+cards+'</div>'
      +'<p class="h" style="margin:14px 0 8px">Posição fixa do botão flutuante</p>'
      +'<div class="jv75-pos">'+grid+'</div></div>';
    d.querySelectorAll('[data-anim]').forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();aplicarAnim(b.getAttribute('data-anim'),true);
      try{if(typeof toast==='function')toast('Animação: '+b.querySelector('b').textContent)}catch(_){}}});
    d.querySelectorAll('[data-pos]').forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();aplicarPos(b.getAttribute('data-pos'),true);
      try{if(typeof toast==='function')toast('Posição: '+b.textContent)}catch(_){}}});
    return d;
  }
  function blocoEditor(){
    var e=edit();
    var d=document.createElement('details'); d.className='jv74-acc';
    d.innerHTML='<summary>TEMA EDITÁVEL <small>suas cores, cantos e brilho</small></summary>'
      +'<div class="jv74-bd"><p class="h">Monte o seu visual. Ao mudar qualquer item, o visual "Editável" é ativado na hora.</p>'
      +'<div class="jv75-edit">'
      +'<label>Fundo <input type="color" data-ed="bg" value="'+e.bg+'"></label>'
      +'<label>Cor principal <input type="color" data-ed="accent" value="'+e.accent+'"></label>'
      +'<label>Cor secundária <input type="color" data-ed="accent2" value="'+e.accent2+'"></label>'
      +'<label>Texto <input type="color" data-ed="text" value="'+e.text+'"></label>'
      +'<label class="full">Cantos arredondados <input type="range" min="0" max="30" step="1" data-ed="radius" value="'+e.radius+'"></label>'
      +'</div>'
      +'<div class="jv75-row"><button type="button" class="jv75-btn" data-ed-act="usar">Usar este tema</button>'
      +'<button type="button" class="jv75-btn" data-ed-act="reset">Restaurar padrão</button></div></div>';
    d.querySelectorAll('[data-ed]').forEach(function(inp){
      var ev=inp.type==='range'?'input':'change';
      inp.addEventListener(ev,function(){salvarEdit(inp.getAttribute('data-ed'),inp.value)});
      if(inp.type==='color')inp.addEventListener('input',function(){salvarEdit(inp.getAttribute('data-ed'),inp.value)});
    });
    d.querySelector('[data-ed-act="usar"]').onclick=function(ev){ev.preventDefault();ev.stopPropagation();if(window.jvSkin)window.jvSkin.aplicarTema('custom',true)};
    d.querySelector('[data-ed-act="reset"]').onclick=function(ev){ev.preventDefault();ev.stopPropagation();
      grava(LS_EDIT,JSON.stringify(PADRAO_EDIT)); aplicarEdit(false);
      d.querySelectorAll('[data-ed]').forEach(function(i){i.value=PADRAO_EDIT[i.getAttribute('data-ed')]});
      try{if(typeof toast==='function')toast('Tema editável restaurado')}catch(_){}};
    return d;
  }
  function inserirBlocos(){
    /* modal de ajustes */
    var ov=document.getElementById('jv6-cfg');
    if(ov){var bx=ov.querySelector('.bx');
      if(bx&&bx.querySelector('.jv74-acc')&&!bx.querySelector('[data-jv75]')){
        var a=blocoAnimPos(),b=blocoEditor(); a.setAttribute('data-jv75','1'); b.setAttribute('data-jv75','1');
        var accs=bx.querySelectorAll('.jv74-acc'); var ref=accs[1]||accs[0];
        ref.parentNode.insertBefore(a,ref.nextSibling); a.parentNode.insertBefore(b,a.nextSibling);
      }
    }
    /* aba AJUSTES dentro da janela */
    var box=document.querySelector('.jv74-inline');
    if(box&&!box.querySelector('[data-jv75]')){
      var a2=blocoAnimPos(),b2=blocoEditor(); a2.setAttribute('data-jv75','1'); b2.setAttribute('data-jv75','1');
      box.appendChild(a2); box.appendChild(b2);
    }
  }

  function instalar(){
    registrar(); aplicarEdit(false); completarGrades(); inserirBlocos();
    aplicarAnim(anim(),false); aplicarPos(pos(),false); marcar75();
    if(window.jvSkin){try{window.jvSkin.aplicarTema(window.jvSkin.tema(),false)}catch(e){}}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',instalar); else instalar();
  document.addEventListener('click',function(){setTimeout(instalar,90)},true);
  setInterval(instalar,1000);

  window.jvSkin75={temas:NOVOS_TEMAS,nucleos:NOVOS_NUCLEOS,anims:ANIMS,posicoes:POSICOES,
    aplicarAnim:aplicarAnim,aplicarPos:aplicarPos,editar:salvarEdit,edicao:edit};
  console.log('[MODESK v75] +7 visuais (Opera GX, Black Red, Stark, Crimson, Vapor, Cine, Editável) · +6 núcleos · animação, cor e posição fixa');
})();
</script>

<!-- ===================== v76 · VOZES ELEVENLABS (chave API + carregar vozes) ===================== -->
<script>
(function(){
  'use strict';
  var LS='modesk_eleven_v1';
  var cfg={key:'',voice:'',nome:'',modelo:'eleven_multilingual_v2',ativo:false,vozes:[]};
  try{var s=JSON.parse(localStorage.getItem(LS)||'null'); if(s&&typeof s==='object')cfg=Object.assign(cfg,s)}catch(e){}
  function salvar(){try{localStorage.setItem(LS,JSON.stringify(cfg))}catch(e){}}
  function av(m){try{if(window.toast)return toast(m)}catch(e){} try{if(window.aviso)return aviso(m)}catch(e){} console.log('[eleven]',m)}

  /* ---------- API ---------- */
  async function listarVozes(){
    if(!cfg.key)throw new Error('Informe a chave da API da ElevenLabs.');
    var r=await fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':cfg.key}});
    if(!r.ok)throw new Error('ElevenLabs ['+r.status+']: '+(await r.text()).slice(0,180));
    var d=await r.json();
    cfg.vozes=(d.voices||[]).map(function(v){return{id:v.voice_id,nome:v.name,cat:v.category||''}});
    if(!cfg.voice&&cfg.vozes[0]){cfg.voice=cfg.vozes[0].id;cfg.nome=cfg.vozes[0].nome}
    salvar(); return cfg.vozes;
  }
  var audioAtual=null;
  function pararAudio(){try{if(audioAtual){audioAtual.pause();audioAtual.src='';audioAtual=null}}catch(e){}}
  async function falarEleven(texto,cb){
    if(!cfg.key||!cfg.voice)throw new Error('Sem chave ou voz da ElevenLabs.');
    var r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+encodeURIComponent(cfg.voice)+'?output_format=mp3_44100_128',{
      method:'POST',headers:{'xi-api-key':cfg.key,'Content-Type':'application/json'},
      body:JSON.stringify({text:String(texto).slice(0,4800),model_id:cfg.modelo,
        voice_settings:{stability:0.5,similarity_boost:0.75,style:0.35,use_speaker_boost:true}})});
    if(!r.ok)throw new Error('ElevenLabs ['+r.status+']: '+(await r.text()).slice(0,180));
    var url=URL.createObjectURL(await r.blob());
    pararAudio();
    audioAtual=new Audio(url);
    audioAtual.onended=function(){URL.revokeObjectURL(url);audioAtual=null;if(cb)try{cb()}catch(e){}};
    await audioAtual.play();
  }

  /* ---------- intercepta toda a fala do sistema ---------- */
  try{
    var speakOrig=speechSynthesis.speak.bind(speechSynthesis);
    var cancelOrig=speechSynthesis.cancel.bind(speechSynthesis);
    speechSynthesis.speak=function(u){
      if(cfg.ativo&&cfg.key&&cfg.voice&&u&&u.text){
        try{if(u.onstart)u.onstart({})}catch(e){}
        falarEleven(u.text,function(){try{if(u.onend)u.onend({})}catch(e){}})
          .catch(function(e){av(e.message);speakOrig(u)});
        return;
      }
      return speakOrig(u);
    };
    speechSynthesis.cancel=function(){pararAudio();return cancelOrig()};
  }catch(e){}

  /* ---------- interface dentro da aba VOZ do JARVIS ---------- */
  var CSS='#el-box{border:1px solid rgba(120,200,255,.28);border-radius:12px;padding:10px;margin:10px 0;background:rgba(10,22,38,.45)}'
   +'#el-box b{color:#8fd8ff;font-size:12px;letter-spacing:.06em}'
   +'#el-box .el-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}'
   +'#el-box input,#el-box select{background:rgba(0,0,0,.35);color:#dff1ff;border:1px solid rgba(120,200,255,.3);border-radius:8px;padding:6px 8px;font:inherit;font-size:12px}'
   +'#el-box button{background:rgba(30,120,200,.28);color:#dff1ff;border:1px solid rgba(120,200,255,.4);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}'
   +'#el-box button:hover{background:rgba(60,170,255,.4)}'
   +'#el-st{font-size:11px;color:#8fb9d6;margin-top:8px}';
  try{var st=document.createElement('style');st.textContent=CSS;document.head.appendChild(st)}catch(e){}

  function opts(){
    if(!cfg.vozes.length)return '<option value="">— carregue as vozes —</option>';
    return cfg.vozes.map(function(v){return '<option value="'+v.id+'"'+(v.id===cfg.voice?' selected':'')+'>'+v.nome+(v.cat?' ('+v.cat+')':'')+'</option>'}).join('');
  }
  function estado(){
    var e=document.getElementById('el-st'); if(!e)return;
    e.textContent=(cfg.key?'Chave salva. ':'Sem chave. ')+(cfg.vozes.length?cfg.vozes.length+' vozes carregadas. ':'Nenhuma voz carregada. ')
      +(cfg.ativo?('Usando ElevenLabs'+(cfg.nome?' · '+cfg.nome:'')+'.'):'Usando a voz do navegador.');
  }
  function montar(pane){
    if(pane.querySelector('#el-box'))return;
    var box=document.createElement('div'); box.id='el-box';
    box.innerHTML='<b>VOZES ELEVENLABS</b>'
     +'<div class="el-row"><input type="password" id="el-key" placeholder="Chave da API (sk_...)" autocomplete="off" style="flex:1;min-width:200px" value="'+(cfg.key||'')+'">'
     +'<button id="el-save">Salvar chave</button><button id="el-load">Carregar vozes</button></div>'
     +'<div class="el-row">Voz <select id="el-voz" style="flex:1;min-width:180px">'+opts()+'</select>'
     +'<select id="el-mod"><option value="eleven_multilingual_v2">multilingual v2</option><option value="eleven_turbo_v2_5">turbo v2.5</option></select>'
     +'<button id="el-test">Testar</button></div>'
     +'<div class="el-row"><label style="font-size:12px"><input type="checkbox" id="el-on"> usar ElevenLabs em todas as falas do JARVIS</label>'
     +'<a href="https://elevenlabs.io/app/settings/api-keys" target="_blank" rel="noopener" style="font-size:11px;color:#8fd8ff">obter chave</a></div>'
     +'<div id="el-st"></div>';
    pane.appendChild(box);
    var q=function(i){return box.querySelector('#'+i)};
    q('el-mod').value=cfg.modelo; q('el-on').checked=!!cfg.ativo;
    q('el-save').onclick=function(){cfg.key=q('el-key').value.trim();salvar();av('Chave da ElevenLabs salva neste navegador.');estado()};
    q('el-load').onclick=async function(){
      cfg.key=q('el-key').value.trim();salvar();
      var b=q('el-load');b.disabled=true;b.textContent='carregando...';
      try{await listarVozes();q('el-voz').innerHTML=opts();av('Vozes carregadas: '+cfg.vozes.length)}
      catch(e){av(e.message)}
      b.disabled=false;b.textContent='Carregar vozes';estado();
    };
    q('el-voz').onchange=function(){cfg.voice=this.value;var o=cfg.vozes.filter(function(v){return v.id===cfg.voice})[0];cfg.nome=o?o.nome:'';salvar();estado()};
    q('el-mod').onchange=function(){cfg.modelo=this.value;salvar()};
    q('el-on').onchange=function(){cfg.ativo=this.checked;salvar();estado()};
    q('el-test').onclick=async function(){
      var t=(document.getElementById('jn-tts')&&document.getElementById('jn-tts').value)||'Sistema MODESK online. Voz da ElevenLabs funcionando.';
      try{await falarEleven(t)}catch(e){av(e.message)}
    };
    estado();
  }
  function instalar(){
    var p=document.getElementById('jn-p-voz'); if(p)montar(p);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',instalar); else instalar();
  setInterval(instalar,1200);
  document.addEventListener('click',function(){setTimeout(instalar,120)},true);

  window.MODESK_ELEVEN={cfg:cfg,listar:listarVozes,falar:falarEleven,parar:pararAudio};
  console.log('[MODESK v76] Vozes ElevenLabs · chave API + carregar vozes');
})();
</script>


<script>
/* v78 — dá vida a todos os ícones (inclusive os criados depois) */
(function(){
  var TIPOS=['float','beat','swing','bob','float','bob'];
  var n=0;
  function vivo(el){
    if(!el||el.dataset.anim) return;
    var t=TIPOS[n++%TIPOS.length];
    el.dataset.anim=t;
    var sv=el.querySelector('svg');
    if(sv){
      sv.style.animationDuration=(2.4+Math.random()*2.2).toFixed(2)+'s';
      sv.style.animationDelay=(-Math.random()*3).toFixed(2)+'s';
    }
    el.style.animationDelay=(-Math.random()*3).toFixed(2)+'s';
  }
  function varrer(root){
    (root||document).querySelectorAll('.ui-icon').forEach(vivo);
  }
  document.addEventListener('DOMContentLoaded',function(){varrer()});
  varrer();
  new MutationObserver(function(muts){

<script id="v80-js">
(function(){

    if(!r.querySelector('.grip')){var g=document.createElement('span');g.className='grip';g.title='Arraste para mover';g.textContent='⋮⋮';r.insertBefore(g,r.firstChild);}
    function limitar(x,y){var w=r.offsetWidth,h=r.offsetHeight;return [Math.max(4,Math.min(innerWidth-w-4,x)),Math.max(4,Math.min(innerHeight-h-4,y))]}
    function aplicar(x,y){var c=limitar(x,y);r.setAttribute('data-solto','1');r.style.left=c[0]+'px';r.style.top=c[1]+'px';}
    try{var p=JSON.parse(localStorage.getItem(LS)||'null');if(p&&typeof p.x==='number')aplicar(p.x,p.y)}catch(e){}
    var ox=0,oy=0,sx=0,sy=0,mov=false,ativo=false;
    r.addEventListener('pointerdown',function(e){
      if(e.button!==0)return; ativo=true;mov=false;
      var b=r.getBoundingClientRect();ox=b.left;oy=b.top;sx=e.clientX;sy=e.clientY;
      try{r.setPointerCapture(e.pointerId)}catch(_){}
    });
    r.addEventListener('pointermove',function(e){
      if(!ativo)return; var dx=e.clientX-sx,dy=e.clientY-sy;
      if(!mov&&Math.abs(dx)+Math.abs(dy)<6)return;
      if(!mov){mov=true;r.classList.add('dragging');}
      aplicar(ox+dx,oy+dy);
    });
    function soltar(e){
      if(!ativo)return; ativo=false;
      if(mov){var b=r.getBoundingClientRect();try{localStorage.setItem(LS,JSON.stringify({x:b.left,y:b.top}))}catch(_){}
        r.classList.remove('dragging');
        /* bloqueia o clique que fecharia o arraste */
        r.addEventListener('click',function bl(ev){ev.stopPropagation();ev.preventDefault();r.removeEventListener('click',bl,true)},true);
        setTimeout(function(){try{r.removeEventListener('click',null,true)}catch(_){}},0);
      }
    }
    r.addEventListener('pointerup',soltar);r.addEventListener('pointercancel',soltar);
    r.querySelector('.grip').addEventListener('dblclick',function(){r.removeAttribute('data-solto');r.style.left='';r.style.top='';try{localStorage.removeItem(LS)}catch(_){} });
    window.addEventListener('resize',function(){if(r.hasAttribute('data-solto')){var b=r.getBoundingClientRect();aplicar(b.left,b.top)}});
  }

  /* INTERFACE: calcula colunas/linhas para caber tudo na tela */
  function ajustarHub(){
    var h=document.getElementById('ihub'); if(!h||!h.classList.contains('on'))return;

      if(cw<120)break;

      if(!melhor||score>melhor.score)melhor={cols:cols,rows:rows,cw:cw,ch:ch,score:score};
    }

    g.style.setProperty('--ih-av',Math.round(Math.max(44,Math.min(96,melhor.ch*0.34)))+'px');
    g.style.setProperty('--ih-fs',(melhor.cw<150?11:melhor.cw<200?12.5:14)+'px');
    h.setAttribute('data-compact',melhor.ch<170?'1':'0');
  }
  window.addEventListener('resize',ajustarHub);
  new MutationObserver(function(){ajustarHub();setTimeout(ajustarHub,60);setTimeout(ajustarHub,450)}).observe(document.documentElement,{attributes:true,subtree:true,attributeFilter:['class']});
  setInterval(ajustarHub,1500);
  console.log('[MODESK v80] brilho por cor, layout denso, barra arrastável, temas do JARVIS enxutos, config JARVIS = ModeskCore x5 + ElevenLabs');
})();

(function(){

    var r=rail(); if(!r||!p)return;

    r.style.setProperty('right','auto','important');
    r.style.setProperty('bottom','auto','important');
  }
  function resetar(){
    var r=rail(); if(!r)return;
    try{localStorage.removeItem(K)}catch(e){}
    r.classList.remove('mdk-free');
    ['left','top','right','bottom'].forEach(function(k){r.style.removeProperty(k)});
  }
  function instalar(){
    var r=rail(); if(!r||r.dataset.v79)return;
    r.dataset.v79='1';

(function(){

  }

    catch(x){toast(x.message)}
  };

  document.addEventListener('click',function(){setTimeout(pintar,150)},true);

/* v81 · núcleo único que pulsa com a voz do JARVIS + roteamento automático de habilidades */
(function(){
  'use strict';

  /* ============ A) NÚCLEO ÚNICO ============ */
  function unificar(){
    var hero=document.querySelector('#jn-p-chat .jv6-hero');
    if(hero){
      /* mantem UM unico nucleo: o escolhido nos ajustes */
      var ws=hero.querySelectorAll('.jvc-wrap');
      for(var k=1;k<ws.length;k++)ws[k].remove();
      var orbs=hero.querySelectorAll('.jv6-orb');
      for(var i=1;i<orbs.length;i++)orbs[i].remove();

    if(orb){
      var ws2=orb.querySelectorAll('.jvc-wrap');
      for(var m=1;m<ws2.length;m++)ws2[m].remove();
      var o2=orb.querySelectorAll('.jv6-orb');
      for(var j=1;j<o2.length;j++)o2[j].remove();
    }
  }
  setInterval(unificar,700); unificar();
  document.addEventListener('click',function(){setTimeout(unificar,120)},true);

  /* ============ B) O NÚCLEO SE MOVE COM O ÁUDIO QUE SAI ============ */
  var nivel=0, alvo=0, ac=null, analiser=null, buf=null, simTm=0;
  function css(){
    document.documentElement.style.setProperty('--jv-out',nivel.toFixed(3));
  }
  function loop(){
    nivel += (alvo-nivel)*0.25;
    if(analiser){
      analiser.getByteTimeDomainData(buf);
      var s=0; for(var i=0;i<buf.length;i++){var v=(buf[i]-128)/128; s+=v*v}
      alvo=Math.min(1,Math.sqrt(s/buf.length)*3.2);
    }
    css();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  /* áudio real (ElevenLabs / qualquer <audio>) */
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    var playOrig=HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play=function(){
      var m=this;
      try{
        if(AC && !m.__jv81){
          m.__jv81=1;
          ac=ac||new AC();
          var src=ac.createMediaElementSource(m);
          var an=ac.createAnalyser(); an.fftSize=512;
          src.connect(an); an.connect(ac.destination);
          m.addEventListener('playing',function(){
            try{ac.resume()}catch(e){}
            analiser=an; buf=new Uint8Array(an.fftSize); marcarFala(true);
          });
          ['ended','pause','error'].forEach(function(ev){
            m.addEventListener(ev,function(){ if(analiser===an){analiser=null;alvo=0;marcarFala(false)} });
          });
        }
      }catch(e){}
      return playOrig.apply(this,arguments);
    };
  }catch(e){}

  /* voz do navegador: não expõe amplitude — envelope suave sincronizado com a fala */
  function simular(on){
    clearInterval(simTm);
    if(!on){ if(!analiser)alvo=0; return }
    var t=0;
    simTm=setInterval(function(){
      if(analiser)return;
      t+=0.16;
      var v=0.30+0.34*Math.abs(Math.sin(t*2.1))+0.20*Math.abs(Math.sin(t*5.3+1.1))+Math.random()*0.10;
      alvo=Math.min(1,v);
    },55);
  }
  function marcarFala(on){
    var orb=document.getElementById('jn-orb');
    if(orb)orb.classList.toggle('jv81-fala',!!on);
    document.querySelectorAll('[data-core-state]:not(.mini)').forEach(function(e){
      e.setAttribute('data-core-state',on?'speaking':'idle');
    });
    simular(on);
  }
  try{
    var spk=speechSynthesis.speak.bind(speechSynthesis);
    speechSynthesis.speak=function(u){
      try{
        u.addEventListener('start',function(){marcarFala(true)});
        var fim=function(){marcarFala(false)};
        u.addEventListener('end',fim); u.addEventListener('error',fim);
      }catch(e){}
      return spk(u);
    };
    setInterval(function(){
      try{ if(!speechSynthesis.speaking && !analiser && simTm){ marcarFala(false) } }catch(e){}
    },800);
  }catch(e){}

  /* ============ C) MODO FLUIDO — o JARVIS escolhe a habilidade sozinho ============ */
  var HAB=[
    {id:'jn-c-cod',   nome:'código',   re:/\b(c[oó]digo|script|fun[cç][aã]o|classe|html|css|javascript|typescript|python|php|sql|json|regex|bug|depur|programa[r]?|api|endpoint|planilha f[oó]rmula|vba)\b/i},
    {id:'jn-c-busca', nome:'pesquisa web', re:/(pesquis|procur[ae]|busque|no[ti][ií]cia|hoje|agora|atual|[uú]ltim[ao]|pre[çc]o|cota[çc][aã]o|d[oó]lar|clima|tempo em|quem [eé]|quando (foi|sai|come[çc]a)|lan[çc]amento|vers[aã]o mais nova|na internet)/i},
    {id:'jn-c-fer',   nome:'dados do site', re:/(patrim[oô]ni|setor|anydesk|chamado|ticket|usu[aá]rio|colaborador|ramal|invent[aá]rio|estoque|modesk|cadastr|ip d[oa]|impressora|m[aá]quina d[oa])/i},
    {id:'jn-c-pen',   nome:'raciocínio', re:/(analis|compar[ae]|estrat[eé]g|planej|calcul|or[çc]amento|passo a passo|explique|por que|resolva|decid|proj[eé]t[oe]|melhor op[çc][aã]o)/i},
    {id:'jn-c-fal',   nome:'voz', re:/(fale|falando|em voz|me responda falando|leia em voz|responder falando)/i}
  ];
  var ultima=[];
  function setChk(id,val){
    var e=document.getElementById(id); if(!e||e.checked===val)return;
    e.checked=val;
    try{ e.dispatchEvent(new Event('change',{bubbles:true})) }catch(x){ if(e.onchange)e.onchange({target:e}) }
  }
  function chip(lista){
    var f=document.querySelector('#jn-win .jn-foot'); if(!f)return;
    var box=document.getElementById('jv81-modo');
    if(!box){ box=document.createElement('div'); box.id='jv81-modo'; f.insertBefore(box,f.firstChild) }
    box.innerHTML = lista.length
      ? lista.map(function(n){return '<span class="tag">◉ '+n+'</span>'}).join('')
      : '<span class="tag">◉ conversa</span>';
    clearTimeout(box.__t); box.__t=setTimeout(function(){ box.innerHTML='' },6000);
  }
  function rotear(txt){
    txt=String(txt||'');
    var ativos=[];
    HAB.forEach(function(h){
      var on=h.re.test(txt);
      if(h.id==='jn-c-fal'){
        var live=document.getElementById('jn-live');
        if(live&&live.checked)on=true;
      }
      setChk(h.id,on);
      if(on)ativos.push(h.nome);
    });
    ultima=ativos;
    chip(ativos);
  }
  function antesDeEnviar(){
    var i=document.getElementById('jn-in');
    rotear(i?i.value:'');
  }
  document.addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('#jn-go'):null;
    if(b)antesDeEnviar();
  },true);
  document.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey&&e.target&&e.target.id==='jn-in')antesDeEnviar();
  },true);

  /* orientação para o modelo agir sozinho, sem pedir confirmação */
  try{
    var base=window.sistema;
    if(typeof base==='function' && !base.__jv81){
      var novo=function(){
        var s=''; try{ s=base() }catch(e){}
        return s+'\n\nMODO FLUIDO: você decide sozinho, dentro da conversa, o que precisa fazer — '
          +'escrever ou corrigir código, pesquisar informação atual, consultar os dados do MODESK '
          +'(pessoas, setores, patrimônio, IP, AnyDesk) ou raciocinar passo a passo. '
          +'Nunca peça para o usuário ligar modos, marcar opções ou escolher ferramentas: '
          +'entenda o pedido e entregue a resposta pronta. '
          +(ultima.length?('Intenção detectada nesta mensagem: '+ultima.join(', ')+'.'):'');
      };
      novo.__jv81=1; window.sistema=novo;
    }
  }catch(e){}

  /* placeholder mais convidativo */
  setInterval(function(){
    var i=document.getElementById('jn-in');
    if(i && i.placeholder.indexOf('sozinho')<0)
      i.placeholder='Fale com o JARVIS… ele escolhe sozinho código, pesquisa ou dados do site';
  },1500);

  console.log('[MODESK v81] núcleo único reativo à voz · rodapé fluido com roteamento automático');
})();
</script>


<script>
/* ============ v83 · JARVIS FORA DO SITE = JANELA PROPRIA SEM BARRAS DO NAVEGADOR (conectada ao site) ============ */
(function(){
  var BASE=location.href.split('#')[0];
  var MARCA='#jarvis-aba';
  var LSK='modesk.pessoal.v7';
  var aba=null, ultimoSalvo=0;

  function ehAba(){ return (location.hash||'').indexOf('jarvis-aba')>=0 }
  function aviso(m){ try{ toast(m) }catch(_){ console.log('[JARVIS]',m) } }

  /* ---- 1) abre o proprio site numa aba nova, em modo JARVIS ---- */
  function abrirAba(){
    if(ehAba()){ try{ window.jvAbrir&&window.jvAbrir() }catch(_){} return }
    if(aba && !aba.closed){ try{ aba.focus() }catch(_){} return }
    /* v83: janela propria do JARVIS — sem abas, sem barra de endereco, sem menus */
    var w=Math.min(1220,Math.round(screen.availWidth*0.82));
    var h=Math.min(860,Math.round(screen.availHeight*0.88));
    var l=Math.max(0,Math.round((screen.availWidth-w)/2));
    var t=Math.max(0,Math.round((screen.availHeight-h)/2));
    var feat='popup=yes,width='+w+',height='+h+',left='+l+',top='+t
      +',menubar=no,toolbar=no,location=no,status=no,personalbar=no,directories=no,resizable=yes,scrollbars=no';
    try{ aba=window.open(BASE+MARCA,'jarvisAba',feat) }catch(_){ aba=null }
    if(!aba){ aviso('Libere pop-ups deste site para abrir o JARVIS em janela propria.'); return }
    try{ aba.focus() }catch(_){}
    aviso('JARVIS aberto em janela propria (sem barras do navegador)');
  }
  function fecharAba(){ try{ aba&&aba.close() }catch(_){} aba=null }
  window.jvAbrirFora=window.jvPopup=window.jvPiP=window.jvAbrirAbaJarvis=abrirAba;
  window.jvFecharPopup=window.jvVoltarParaSite=fecharAba;

  /* ---- 2) todos os botoes antigos de "fora do site" passam a abrir a aba ---- */
  addEventListener('click',function(e){
    var t=e.target&&e.target.closest?e.target.closest('#jn-pip,[data-a="pip"],[data-a="solto"],[data-a="fora"]'):null;
    if(!t)return;
    e.preventDefault();e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    if(ehAba()){ try{ opener&&opener.focus() }catch(_){} try{ window.close() }catch(_){} return }
    abrirAba();
  },true);
  addEventListener('keydown',function(e){
    var k=(e.key||'').toLowerCase();
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&k==='j'){
      e.preventDefault();e.stopPropagation();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
      abrirAba();
    }
  },true);

  /* ---- 3) modo aba: a pagina inteira vira o JARVIS ---- */
  function modoAba(){
    document.documentElement.classList.add('jv-aba');
    var st=document.createElement('style');
    st.textContent=
      'html.jv-aba,html.jv-aba body{margin:0;height:100%;background:#050b14;overflow:hidden}'
      +'html.jv-aba body>*:not(#jn-win):not(#jvx):not(script):not(style):not(.toast):not(#toast):not(#toasts){display:none!important}'
      +'html.jv-aba #jn-win{display:flex!important;position:fixed!important;left:0!important;top:0!important;right:0!important;bottom:0!important;width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;border-radius:0!important;transform:none!important;z-index:99999!important;opacity:1!important;visibility:visible!important}'
      +'html.jv-aba #jn-win #jn-min{display:none!important}'
      +'html.jv-aba #jn-win #jn-pip::after{content:""}';
    document.head.appendChild(st);
    document.title='J.A.R.V.I.S. \u2014 MODESK';
    var t=setInterval(function(){
      try{ window.jvSync?window.jvSync.abrir():(window.jvAbrir&&window.jvAbrir()) }catch(_){}
      var w=document.getElementById('jn-win');
      if(w){
        w.classList.add('open');
        var b=document.getElementById('jn-pip'); if(b)b.textContent='\u2190 voltar ao site';
        var c=document.getElementById('jn-close'); if(c)c.onclick=function(){try{opener&&opener.focus()}catch(_){}try{window.close()}catch(_){}};
        clearInterval(t);
        setTimeout(function(){try{document.getElementById('jn-in').focus()}catch(_){}},200);
      }
    },200);
    setTimeout(function(){clearInterval(t)},15000);
  }
  if(ehAba()){ if(document.readyState==='loading')addEventListener('DOMContentLoaded',modoAba); else modoAba(); }

  /* ---- 4) conexao viva entre a aba e o site: conversas sincronizadas ---- */
  try{
    var setItem=Storage.prototype.setItem;
    Storage.prototype.setItem=function(k,v){
      if(k===LSK)ultimoSalvo=Date.now();
      return setItem.apply(this,arguments);
    };
  }catch(_){}

  var visto=null;
  function sincronizar(){
    var raw=null; try{ raw=localStorage.getItem(LSK) }catch(_){ return }
    if(visto===null){ visto=raw; return }
    if(raw===visto)return;
    visto=raw;
    if(Date.now()-ultimoSalvo<3000)return;           /* esta aba acabou de escrever */
    var s=window.jvSync; if(!s)return;
    try{ s.carregar(); s.pintarSide(); s.pintar(); }catch(_){}
  }
  addEventListener('storage',function(e){ if(!e.key||e.key===LSK)setTimeout(sincronizar,80) });
  setInterval(sincronizar,1200);
  addEventListener('focus',sincronizar);

  /* aba filha fecha junto com o site apenas se o site for fechado pelo usuario */
  addEventListener('pagehide',function(){ /* mantem a aba viva: ela e independente */ });

  console.log('[MODESK v83] JARVIS fora do site abre em janela propria (sem barras do navegador), sincronizada com o site');
})();

    var n=parseInt(String(h).replace('#',''),16); if(isNaN(n))return '#8ae7ff';
    var r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r+(255-r)*.45); g=Math.round(g+(255-g)*.45); b=Math.round(b+(255-b)*.45);
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);

      +'<div class="orbs">'+lista().map(function(n){
          return '<button type="button" data-core-pick="'+n.id+'" title="'+n.nome+'" class="'+(n.id===atual()?'on':'')+'">'
            +'<span class="mini jvc-wrap" data-core="'+n.id+'" data-core-state="idle" data-core-anim="normal"'+(lerCor()?' data-core-tint="1"':'')+'>'
            +'<span class="jvc"><i class="r1"></i><i class="r2"></i><i class="r3"></i></span></span></button>'}).join('')+'</div>'
      +'<h5>Cor do brilho</h5>'
      +'<div class="cores">'+PALETA.map(function(c){
          return '<button type="button" data-cor="'+c+'" title="'+c+'" style="background:'+c+'" class="'+(c.toLowerCase()===cor.toLowerCase()?'on':'')+'"></button>'}).join('')+'</div>'
      +'<div class="lin"><input type="color" id="jv89-cp" value="'+cor+'"> cor livre</div>'
      +'<button type="button" class="it" data-a="reset">Voltar à cor do tema</button>'
      +'<h5>Ações</h5>'
      +'<button type="button" class="it" data-a="abrir">Abrir o J.A.R.V.I.S.</button>'
      +'<button type="button" class="it" data-a="janela">Abrir em janela separada</button>'
      +'<button type="button" class="it" data-a="fechar">Fechar este menu</button>';
    document.body.appendChild(m);
    var r=m.getBoundingClientRect();
    m.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+'px';
    m.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px';

    m.addEventListener('contextmenu',function(e){e.preventDefault()});
    m.addEventListener('click',function(e){
      var b=e.target.closest('button'); if(!b)return;
      e.preventDefault(); e.stopPropagation();
      var id=b.getAttribute('data-core-pick');
      if(id){ try{ window.jvSkin&&window.jvSkin.aplicarCore(id,true) }catch(_){}
        pintar(); try{ if(typeof toast==='function')toast('Orbe: '+(b.title||id)) }catch(_){}
        m.querySelectorAll('[data-core-pick]').forEach(function(o){o.classList.toggle('on',o===b)}); return }
      var c=b.getAttribute('data-cor');
      if(c){ definirCor(c); m.querySelectorAll('[data-cor]').forEach(function(o){o.classList.toggle('on',o===b)});
        var cp=m.querySelector('#jv89-cp'); if(cp)cp.value=c; return }
      var a=b.getAttribute('data-a');
      if(a==='reset'){ limparCor(); return }
      if(a==='abrir'){ fechar(); try{ window.jvAbrir?window.jvAbrir():document.getElementById('jn-orb').click() }catch(_){} return }
      if(a==='janela'){ fechar(); try{ window.jvAbrirFora&&window.jvAbrirFora() }catch(_){} return }
      if(a==='fechar'){ fechar() }
    });
    var cp=m.querySelector('#jv89-cp');
    if(cp)cp.addEventListener('input',function(){ definirCor(cp.value) });
    setTimeout(function(){
      document.addEventListener('mousedown',function fora(ev){
        if(!m.contains(ev.target)){ fechar(); document.removeEventListener('mousedown',fora,true) }
      },true);
    },0);
  }

  /* intercepta o botão direito ANTES de qualquer código antigo (nada de abrir aba) */
  document.addEventListener('contextmenu',function(e){
    var t=e.target&&e.target.closest?e.target.closest('#jn-orb,#jv-orb'):null;
    if(!t)return;
    e.preventDefault(); e.stopPropagation();
    if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    abrirMenu(e.clientX,e.clientY);
  },true);
  ['mousedown','mouseup','auxclick','pointerdown','pointerup'].forEach(function(ev){
    document.addEventListener(ev,function(e){
      if(e.button!==2)return;
      var t=e.target&&e.target.closest?e.target.closest('#jn-orb,#jv-orb'):null;
      if(!t)return;
      e.preventDefault(); e.stopPropagation();
      if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    },true);
  });
  addEventListener('keydown',function(e){ if(e.key==='Escape')fechar() });

  /* neutraliza handlers antigos que abriam aba com erro */
  function limpar(){
    ['jn-orb','jv-orb'].forEach(function(id){
      var o=document.getElementById(id); if(!o)return;
      if(o.oncontextmenu)o.oncontextmenu=null;
      o.title='J.A.R.V.I.S. — clique abre · botão direito mostra o menu do orbe';
    });
  }

  function ciclo(){ registrar(); limpar(); if(lerCor())pintar(); }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',ciclo); else ciclo();
  setInterval(ciclo,700);

  window.jvOrb89={nucleos:NOVOS,definirCor:definirCor,limparCor:limparCor,cor:lerCor,menu:abrirMenu};
  console.log('[MODESK v89] +2 orbes · menu do botão direito no orbe (sem abrir aba) · cor do brilho escolhida');
})();
